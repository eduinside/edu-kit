  core_idea: "건설 기술은 사람이 살고 이용하는 건물과 시설을 짓는 기술이에요. 지붕과 벽, 바닥을 갖춘 건축 구조물과 다리, 터널 같은 토목 구조물이 있고, 요즘은 에너지와 자원을 아끼는 친환경 구조물도 많이 지어요."
  core_question: "건설 기술은 우리 생활을 어떻게 편리하고 안전하게 하고, 환경까지 생각하는 구조물은 어떻게 지을까?"
  stages:
    - "건설 기술"
    - "건축 구조물"
    - "토목 구조물"
    - "친환경 건설"
  concepts:
    - "건설 기술"
    - "건축 구조물"
    - "토목 구조물"
    - "친환경 건설"
  source_notes: "천재 정리본 u4 건설 부분(5~8차시: 전통 가옥과 오늘날 건물 비교로 건설 기술의 뜻·가치 → 건축·토목 나누기 → 친환경 건물 사례 → 자연 닮은 건축) · 비상 정리본 u1-2(5~6차시 건설 기술의 뜻·특성·건축 토목 차이·친환경 사례, 7~8차시 다리 만들며 건설 기술의 가치) · 오개념: 건축·토목은 벽 바닥 지붕을 모두 갖췄는지로 가름, 친환경 건물은 태양 전지 장치 붙인 것만이 아니라 단열·채광·환기 구조도 포함, 친환경 요소는 대표 몇 가지 · 유의: 재활용 재료는 뾰족하거나 날카롭지 않게, 건설 기술의 가치와 지속가능성 · 출판사 실습(풍력 등대·다리 만들기) 영상은 쓰지 않음"

