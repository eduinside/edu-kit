  title: "5. 통일 한반도의 어느 날"
  grade: 6
  sem: 2학기
  subject: 도덕
  unit: 5단원
  unit_no: 5
  flow: activity
  codes: ["[6도03-03]"]
  core_idea: "통일은 땅과 제도를 합치는 일일 뿐 아니라 남북 사람들의 마음이 하나가 되는 일이에요. 남북이 같은 점과 다른 점을 이해하고 서로 존중하며 교류해 가는 것이 통일을 준비하는 첫걸음이에요."
  core_question: "남북 사람들이 마음을 모아 통일을 준비하려면 우리는 무엇을 이해하고 실천해야 할까?"
  stages:
    - name: 생각열기
      question: "통일이 된 한반도의 하루는 어떤 모습일까?"
    - name: 탐구하기
      question: "남북은 지금 어떤 점이 같고 다르며, 어떻게 이해하고 교류할 수 있을까?"
    - name: 확장하기
      question: "통일을 바라는 따뜻한 마음을 어떻게 실천할까?"
  concepts:
    - "통일"
    - "분단"
    - "이산가족"
    - "남북 교류"
    - "북한이탈주민"
    - "평화"
  source_notes: "정리본 도덕6.국정.u5(1차시 통일에 앞서 풀 과제·통일 뒤 하루 상상 일기 → 2차시 남북 주민이 함께 사는 마을 예화의 갈등과 해결 → 3차시 남북의 지금 진단·처방전과 통일 뒤 안내서 → 4차시 통일을 바라는 낱말·나만의 명언) · 오개념: 통일을 땅과 제도만 합치는 일로 여김(마음이 하나 되는 일도 포함), 남북은 다르기만 하다고 여김(같은 말과 역사도 나눔) · cautions: 통일 뒤 어려움은 솔직히 다루되 비관에 머물지 않기, 해외 동포도 힘을 보탤 수 있음, 학생마다 배경지식 차이가 큼 · 지도서가 가리킨 통일부UNITV·국립평화통일민주교육원 영상 일부를 후보로 확인. 정파적 주장·정상회담 정치 영상·통일 필요성을 한쪽으로 설득하는 영상은 제외하고 남북 이해·교류 공식 영상 위주로 골랐다."

