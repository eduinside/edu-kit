# in1111 후보 기록 — 통합 1학년 1학기 1단원 「학교」 (바른 생활·슬기로운 생활·즐거운 생활)
# 양식: docs/EXPANSION_PLAN_integrated-12.md §5-1 · 검사: npm run import -- in1111 --dry
# 2026-10-17 수집. YouTube Data API로 후보 전부를 확인했다: 재생 가능·임베드 허용·연령 제한 없음·국내 차단 없음·쇼츠 아님·길이·채널(공식 채널 설명으로 확인).
# 영상 본문은 제목·설명·채널 성격·길이를 기준으로 1차 선별한 것이고 전부 시청한 것은 아니다. 1학년 눈높이(글자를 읽어야 이해되는 영상 제외)는 운영자가 미리보기에서 한 번 더 봐 주세요.
# 운영자 지시(10/17): ① 학교 영상은 대구미래교육연구원 재생목록 '1학년이 되었어요'(31편)를 참조 ② 통합 16단원은 주제 중심으로 뽑는다 → 이 파일은 그 시리즈를 앞에 두고, 안전·놀이·그리기 시범 영상은 보류로 내렸다(필요하면 승격).
# 같은 연구원의 '두근두근 학교생활(2024)' 12편은 최신이지만 2022 시리즈와 주제가 겹쳐 확인필요·보류로만 올렸다.
# 지도서(학교)가 직접 가리킨 공공 영상은 '친구의 말을 경청할 수 있어요'(국가기초학력지원센터) 하나다.
