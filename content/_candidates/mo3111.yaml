kit:
  id: mo3111
  title: "1. 나를 찾아 떠나는 여행"
  grade: 3
  sem: 1학기
  subject: 도덕
  unit: 1단원
  unit_no: 1
  flow: activity
  codes: ["[4도01-01]"]
  core_idea: "나를 소중히 여기는 일은 내가 어떤 사람인지, 내 마음에 어떤 감정이 있는지 알아보는 데서 시작돼요. 기쁜 마음도 속상한 마음도 알맞게 표현하고 다스리며, 마음챙김과 긍정의 말로 나를 북돋을 수 있어요."
  core_question: "나는 어떤 사람이고, 내 마음을 어떻게 알아주고 소중하게 가꿀 수 있을까?"
  stages:
    - name: 생각열기
      question: "나는 어떤 사람이고, 내 마음에는 어떤 감정이 있을까?"
    - name: 탐구하기
      question: "내 감정을 어떻게 알맞게 표현하고 다스릴까?"
    - name: 확장하기
      question: "나를 북돋우고 마음을 가다듬는 방법에는 무엇이 있을까?"
  concepts:
    - "감정"
    - "감정 표현"
    - "감정 조절"
    - "자존감"
    - "마음챙김"
  source_notes: "정리본 도덕3.국정.u1(1차시 나를 설명하며 소중함 생각 → 2차시 덕목 중 많고 적은 것 찾아 있는 그대로 소개 → 3차시 여러 감정 알고 표현·조절 → 4차시 명상·긍정의 말로 북돋우기) · 오개념: 기분 좋은 감정만 소중, 한 번에 한 감정만, 좋게 보이는 모습만 소개, 덕목 많으면 좋은 것 · cautions: 감정은 존중하되 알맞게 표현·조절, 덕목은 견주지 않기 · 지도서에 영상 주소 없음(영상 인용 거의 없음)"

