# mo3121 후보 기록 — 도덕 3학년 1학기 2단원 「성실하게 사는 삶」
# 양식: docs/EXPANSION_PLAN_moral-practical.md §5-1 · 검사: npm run import -- mo3121 --dry
# 2026-10-17 야간 수집(위임). 재생·임베드·연령·국내·길이·쇼츠 여부는 ytcheck로 확인. 영상 본문은 제목·설명·채널 성격 기준이고 전부 시청한 것은 아님.
# 수집 한계: 성실 주제의 공공·교육기관 어린이용 영상이 드물다. 지도서가 인용한 EBS 지식채널e 「2등 전문가 이봉주」 등은 공식 채널에서 찾지 못했고(비공식 재게시본만 있음) 제외했다.
# 새 채널(channels.yaml에 없음): KBS HUMAN : 뭉클티비 · 서울시 인성교육 애니메이션 · 국가유산채널 — 등급은 운영자에게 질문.
kit:
  id: mo3121
  title: "2. 성실하게 사는 삶"
  grade: 3
  sem: 1학기
  subject: 도덕
  unit: 2단원
  unit_no: 2
  flow: activity
  codes: ["[4도01-03]"]
  core_idea: "성실은 맡은 일과 나와 한 약속을 정성을 다해 끝까지 해내는 마음과 태도예요. 결과보다 과정의 정성과 노력이 중요하고, 계획을 세워 꾸준히 실천하면 나 자신과 한 약속을 지킬 수 있어요."
  core_question: "나는 어떤 목표와 계획으로 하루를 성실하게 보내고, 그 약속을 끝까지 지킬 수 있을까?"
  stages:
    - name: 생각열기
      question: "성실하다는 것은 무엇이고, 왜 성실하게 살아야 할까?"
    - name: 탐구하기
      question: "성실하게 하루를 보내려면 어떤 계획과 실천이 필요할까?"
    - name: 확장하기
      question: "성실하게 살아간 사람들에게서 무엇을 배울 수 있을까?"
  concepts:
    - "성실"
    - "정성"
    - "인내"
    - "최선"
    - "계획"
  source_notes: "정리본 도덕3.국정.u2(1차시 성실의 뜻·성실해야 할 까닭 → 2차시 하루 목표·실천 계획 일주일 지키기 → 3차시 계획이 어긋난 경험·역할놀이 → 4차시 성실한 삶의 사례·자신과의 약속) · 지도서 인용: 성실 주제 영상 3편(EBS 지식채널e 등, 원 채널 재게시본 확인 못 함 → 같은 주제의 공식 채널 영상으로 대체) · 오개념: 성실하면 늘 좋은 결과, 성실은 참고 버티는 것, 보는 사람 없으면 약속 어겨도 됨 · cautions: 인내·정성·최선을 엮어 다루기, 결과보다 과정"

