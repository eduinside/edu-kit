    - "적성"
    - "성격"
    - "진로 발달 계획"
  source_notes: "정리본 실과6.천재이춘식.u1(4~8차시 일과 직업·적성 흥미 성격·직업 소개 카드·진로 계획) · 실과6.비상송.u5-2(직업의 뜻과 필요·흥미 적성 성격 검사·관심 직업 조사·진로 발달 계획서). 오개념: 일=직업, 직업은 돈 버는 수단뿐, 검사 결과가 길을 정해 줌·좋고 나쁜 유형, 특정 직업은 성별·학력으로 정해짐. 유의: 적성은 노력으로 키울 수 있음, 결과는 바뀔 수 있음. 지도서가 가리킨 공공 누리집 = 주니어 커리어넷·꿈길·고용24·한국고용정보원·한국직업능력연구원·한국잡월드(원문에 유튜브 주소 없음) → 공식 채널 직접 검색."

