  core_idea: "인권은 모든 사람이 사람답게 살 수 있도록 지켜져야 하는 소중한 권리이고, 다른 사람의 처지에 공감하며 차별하지 않는 태도가 인권을 지키는 힘이 돼요."
  core_question: "모두의 인권을 지키려면 나는 어떤 말과 행동부터 바꿀 수 있을까?"
  stages:
    - name: 생각열기
      question: "인권은 왜 소중하고, 어떻게 넓어져 왔을까?"
    - name: 탐구하기
      question: "어린이의 인권은 어떻게 지켜져야 하고, 우리 둘레의 인권 침해는 무엇일까?"
    - name: 확장하기
      question: "다른 사람의 처지에 공감하며 인권을 존중하는 모습은 어떤 걸까?"
  concepts:
    - "인권"
    - "아동 권리"
    - "차별"
    - "인권 침해"
    - "공감"
    - "배리어 프리"
  source_notes: "정리본 도덕5.국정.u5(1차시 인권의 흐름·존중할 까닭 → 2차시 어린이 인권·권리 선언 → 3차시 침해 행동·보호 안내문 → 4차시 공감·인권 존중) · 오개념: 내 인권만 앞세움, 어린이 특별 보호, 제한과 침해 구분 · cautions: 특정 친구 지목 금지, 피해 사진에 머물지 않기 · 지도서 영상 '불편 체험 디자이너'는 원 영상을 못 찾아 유니버설디자인 공공 영상으로 대신 찾음"

