kit:
  id: mo6121
  title: "2. 다름을 존중하는 우리"
  grade: 6
  sem: 1학기
  subject: 도덕
  unit: 2단원
  unit_no: 2
  flow: activity
  codes: ["[6도02-02]"]
  core_idea: "우리 둘레에는 생각, 문화, 모습이 서로 다른 사람들이 함께 살아요. 다름은 틀림이 아니라는 것을 알고 편견 없이 존중하며, 의견이 갈릴 때는 서로 힘써 합의하는 태도가 필요해요."
  core_question: "나와 다른 사람을 존중하며 함께 살아가려면 어떤 마음과 행동이 필요할까?"
  stages:
    - name: 생각열기
      question: "우리 이웃은 어떤 점이 서로 다르고, 함께 살면 무엇이 좋을까?"
    - name: 탐구하기
      question: "같은 것도 다르게 보는 까닭은 무엇이고, 우리 안의 편견은 무엇일까?"
    - name: 확장하기
      question: "다름을 존중하고 의견이 갈릴 때 합의하려면 어떻게 해야 할까?"
  concepts:
    - "다름"
    - "존중"
    - "편견"
    - "고정관념"
    - "문화 다양성"
    - "합의"
  source_notes: "정리본 도덕6.국정.u2(1차시 이웃의 다른 점 찾기와 함께 살아 좋은 점 → 2차시 같은 것도 달리 보는 까닭·다름을 존중할 이유 → 3차시 생활 속 편견 목록·역할놀이 → 4차시 의견이 갈릴 때의 합의 태도) · 오개념: 다른 것을 틀린 것으로 여김, 각자 하고 싶은 대로 하는 것이 존중이라 여김, 다문화 친구는 우리말이 서툴 것이라는 편견 · cautions: 다양성을 외국인 가정 이야기로만 좁히지 말기(언어·종교·세대 등), 특정 처지를 놀림거리로 삼지 않기, 합의에는 모두가 힘써야 함 · 지도서가 가리킨 국가인권위원회·성평등가족부·한국장애인고용공단 영상 4편을 후보로 확인했고 공익광고·인권위 영상은 1분 안팎이라 일부만 채택."

