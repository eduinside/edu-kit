  core_idea: "봉사는 대가를 바라지 않고 이웃과 사회를 돕는 일이에요. 도움이 필요한 사람의 상황에 관심을 가지고 계획을 세워 꾸준히 실천하면 나와 우리 모두에게 좋은 변화가 생겨요."
  core_question: "도움이 필요한 이웃을 위해 나는 어떤 봉사를 계획하고 꾸준히 실천할 수 있을까?"
  stages:
    - name: 생각열기
      question: "봉사란 무엇이고 왜 필요할까?"
    - name: 탐구하기
      question: "도움이 필요한 이웃은 누구이고, 어떻게 봉사를 계획하고 실천할까?"
    - name: 확장하기
      question: "봉사를 꾸준히 이어 가려면 어떤 마음과 방법이 필요할까?"
  concepts:
    - "봉사"
    - "나눔"
    - "이웃"
    - "자원봉사"
    - "실천"
  source_notes: "정리본 도덕5.국정.u3(1차시 봉사의 뜻·가치 → 2차시 가까운 곳부터 다른 나라까지 이웃과 도울 방법 → 3차시 봉사 목표·역할·기간 계획 실천 점검 → 4차시 봉사 고민 조언·꾸준히) · 지도서 인용: KBS뉴스 대구경북 어린이 봉사 보도, 1365 자원봉사포털·한국중앙자원봉사센터 · 오개념: 칭찬·상을 받으려는 것도 봉사, 가진 것이 많아야 봉사, 먼 사람은 남 · cautions: 버거운 부탁은 정중히 거절 가능, 실천 뒤 돌아보기"

