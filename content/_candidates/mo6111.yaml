kit:
  id: mo6111
  title: "1. 나는 꿈 요리사"
  grade: 6
  sem: 1학기
  subject: 도덕
  unit: 1단원
  unit_no: 1
  flow: activity
  codes: ["[6도01-03]"]
  core_idea: "꿈은 내가 좋아하고 잘하는 것에 더해, 내 일이 다른 사람과 사회에 어떤 도움을 주는지 생각하며 세워 가는 거예요. 어떤 직업이든 일하는 사람의 태도가 그 일을 값지게 만들어요."
  core_question: "내 흥미와 재능을 도덕적 가치와 이어서 어떤 꿈을 키울 수 있을까?"
  stages:
    - name: 생각열기
      question: "내가 좋아하고 잘하는 일은 무엇이고, 어떤 직업과 이어질까?"
    - name: 탐구하기
      question: "직업을 고를 때 도덕적인 가치도 함께 생각해야 하는 까닭은 무엇일까?"
    - name: 확장하기
      question: "내 재능을 다른 사람과 어떻게 나누며 꿈을 키워 갈까?"
  concepts:
    - "흥미"
    - "적성"
    - "직업"
    - "진로"
    - "재능 나눔"
    - "직업윤리"
  source_notes: "정리본 도덕6.국정.u1(1차시 네 관점으로 흥미·적성 살피기와 관심 직업의 도덕적 가치 → 2차시 발명가 예화·직업 선택 조건 → 3차시 재능 나눔 사례와 모둠 실천 → 4차시 진로 계획·미래 명함) · 오개념: 직업마다 도덕적인 것과 아닌 것이 정해져 있다고 여김(일하는 사람의 태도가 가름) · cautions: 수입·안정 같은 조건을 그릇된 것으로 보지 않게, 본보기 인물을 비판적으로 받아들이게 · 지도서가 가리킨 영상 4편(경기도교육청TV 온라인 공연·KBS뉴스 경남 미용 봉사·지식채널e·스브스뉴스 마을변호사) 중 미용 봉사와 지식채널e를 후보로 씀. 어린이용 직업 가치·진로 공공 영상이 드물어 뉴스·교육청 영상 중심."

