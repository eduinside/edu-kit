# mo5111 후보 기록 — 도덕 5학년 1학기 1단원 「내 삶의 주인이 되는 나」
# 양식: docs/EXPANSION_PLAN_moral-practical.md §5-1 · 검사: npm run import -- mo5111 --dry
# 2026-10-17 수집. 재생·임베드·연령·국내·길이·쇼츠 여부는 YouTube Data API로 후보 전부 확인(쇼츠 없음). 영상 본문은 제목·설명·채널 성격 기준이고 전부 시청한 것은 아님.
# 이 단원은 공공·교육 기관의 어린이용 '자주' 영상이 거의 없다. 검색에 나온 것은 교사·개인 채널(2015 교육과정 6학년용 등)뿐이라 추천이 적다. personal은 대안이 없을 때만 쓴다는 규칙(§3-1)에 따라 판단은 운영자에게 맡긴다.
kit:
  id: mo5111
  title: "1. 내 삶의 주인이 되는 나"
  grade: 5
  sem: 1학기
  subject: 도덕
  unit: 1단원
  unit_no: 1
  flow: activity
  codes: ["[6도01-01]"]
  core_idea: "자주적인 삶은 내 마음대로 하는 것이 아니라, 스스로 생각해서 결정하고 그 결과에 책임을 지는 삶이에요. 작은 일부터 계획을 세워 실천하며 내 삶의 주인이 될 수 있어요."
  core_question: "나는 내 삶의 주인으로서 오늘 무엇을 스스로 정하고 실천할 수 있을까?"
  stages:
    - name: 생각열기
      question: "자주적으로 산다는 것은 무엇일까?"
    - name: 탐구하기
      question: "자주적인 삶은 왜 필요하고, 어떻게 실천할까?"
    - name: 확장하기
      question: "자주적으로 산 사람에게서 무엇을 본받을 수 있을까?"
  concepts:
    - "자주"
    - "결정"
    - "책임"
    - "계획"
    - "실천"
  source_notes: "정리본 도덕5.국정.u1(1차시 자주의 뜻·결정과 책임 → 2차시 자주적 삶의 힘든 점·좋은 점 → 3차시 자주 실천 계획서 → 4차시 인물에게서 본받을 점) · 오개념: 내 마음대로·고집을 자주로 봄, 남의 말·유행 따르기, 어른이 시킨 일은 모두 비자주 · cautions: 자주는 힘들기만 하다는 결론 금지, 작은 일부터 짧은 기간, 본받을 인물은 가족·친구도 가능 · 어린이용 공공 영상이 거의 없어 추천이 적음(현행 6학년 구판 교사 채널만 다수)."

