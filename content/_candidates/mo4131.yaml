# mo4131 후보 기록 — 도덕 4학년 1학기 3단원 「배려하는 우리」
# 양식: docs/EXPANSION_PLAN_moral-practical.md §5-1 · 검사: npm run import -- mo4131 --dry
# 2026-10-17 야간 위임 수집. 재생·임베드·연령·국내·길이·쇼츠 여부는 YouTube Data API로 후보 전부 확인. 영상 본문은 제목·설명·채널 성격 기준이고 전부 시청한 것은 아님. 이 단원은 지도서가 가리키는 영상 주소가 없어(운동회 배려 뉴스 기사만 언급) 공공·교육 채널과 이웃 사연 뉴스를 주제별로 골랐음.
# 새 채널(channels.yaml에 없음): 서울시 인성교육 애니메이션 · 경남교육미디어센터 · 사통팔달 DTRO TV - 대구교통공사 공식 유튜브 — 등급은 운영자에게 질문.
kit:
  id: mo4131
  title: "3. 배려하는 우리"
  grade: 4
  sem: 1학기
  subject: 도덕
  unit: 3단원
  unit_no: 3
  flow: activity
  codes: ["[4도02-02]"]
  core_idea: "배려는 상대가 필요로 하는 것이 무엇인지 헤아려 따뜻하게 도와주고 살펴 주는 마음과 행동이에요. 가까운 친구뿐 아니라 집, 학교, 동네의 여러 사람에게 배려를 이어 가면 모두가 더 행복해져요."
  core_question: "내 주변 사람들이 필요로 하는 배려를 찾아 어떻게 실천할 수 있을까?"
  stages:
    - name: 생각열기
      question: "친구 사이에 배려는 왜 필요할까?"
    - name: 탐구하기
      question: "집·학교·동네에서 누구에게 어떤 배려를 어떻게 실천할까?"
    - name: 확장하기
      question: "배려하는 마음을 어떻게 가꾸고 앞으로 이어 갈까?"
  concepts:
    - "배려"
    - "양보"
    - "공감"
    - "존중"
    - "교통약자"
  source_notes: "정리본 도덕4.국정.u3(1차시 배려 경험 나누기·친구 사이 배려가 필요한 까닭 → 2차시 비밀 친구 활동·상대가 필요로 하는 배려 → 3차시 집·학교·동네 배려 대상과 방법·순서 → 4차시 선택 활동·운동회 배려 뉴스 기사로 다짐) · 오개념: 내가 좋은 것을 해 주는 것이 배려, 가까운 친구에게만, 무조건 양보하는 것이 늘 배려, 일방적으로 베푸는 것 · cautions: 배려가 필요 없는 경우(상대 거절, 안전 위협)도 있음, 구체적 칭찬"

