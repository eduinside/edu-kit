# mo6261 후보 기록 — 도덕 6학년 2학기 6단원 「사랑, 우리를 넘어 세계로」
# 양식: docs/EXPANSION_PLAN_moral-practical.md §5-1 · 검사: npm run import -- mo6261 --dry
# 2026-10-17 수집(야간 위임). 재생·임베드·연령·국내·길이는 YouTube Data API(ytcheck)로 후보 전부 정상 확인(쇼츠 표시 2편은 제외). 영상 본문은 제목·설명·채널 성격 기준으로 판단했고 전부 시청한 것은 아님.
# 외국 어린이의 어려움을 다룬 영상은 피해·빈곤 장면이 선정적일 수 있어 보수적으로 골랐다. 어린이 눈높이의 공공 영상이 적어 뉴스와 ODA·KOICA 공공 영상 중심.
# 새 채널(channels.yaml에 없음): GCED Online Campus · ODA Korea Official Channel · 코이카 글로벌 서포터스 WeKO(KOICA Supporters) · KOICA 코이카 · WFK KOICA 해외봉사단 · GlobalVillage KOICA · 제주국제개발협력센터 — 채택 시 운영자에게 등급 질문.
kit:
  id: mo6261
  title: "6. 사랑, 우리를 넘어 세계로"
  grade: 6
  sem: 2학기
  subject: 도덕
  unit: 6단원
  unit_no: 6
  flow: activity
  codes: ["[6도03-04]"]
  core_idea: "나라와 나라는 서로 이어져 있어서 멀리 있는 사람의 어려움도 우리와 무관하지 않아요. 인류애는 국경을 넘어 모든 사람을 같은 사람으로 여기고 돕는 마음이며, 작은 관심과 실천도 힘이 돼요."
  core_question: "지구촌 이웃의 어려움을 돕기 위해 나는 어떤 마음과 행동을 할 수 있을까?"
  stages:
    - name: 생각열기
      question: "나라 사이는 어떻게 이어져 있고, 왜 서로 도와야 할까?"
    - name: 탐구하기
      question: "다른 나라 어린이는 어떤 어려움을 겪고, 우리나라는 어떻게 도움을 주고받았을까?"
    - name: 확장하기
      question: "지구촌 이웃을 돕는 실천에는 어떤 것이 있을까?"
  concepts:
    - "인류애"
    - "국제 구호"
    - "공적 개발 원조"
    - "세계시민"
    - "국제 기념일"
    - "연대"
  source_notes: "정리본 도덕6.국정.u6(1차시 나라 사이 연결과 재난 구호 사례로 본 인류애 → 2차시 또래 외국 어린이가 겪는 문제 조사와 공감 → 3차시 외국 어린이를 도울 기념일 정하기·활동 계획 → 4차시 돕기 어려운 까닭을 넘어설 길과 실천 다짐) · 오개념: 외국 사람 돕기는 구호 단체에만 맡길 일, 인류애는 막연히 남을 돕는 일, 가까운 사람만 도우면 됨 · cautions: 특정 인종·국가에 대한 편견 주의, 우리나라도 예전에 도움을 받았다가 이제 돕는 나라가 되었음을 알리기, 사진·영상은 교사가 먼저 살피기 · 지도서가 가리킨 SBS 튀르키예 '아빠' 그림(c02)과 연합뉴스 태국 동굴 구조(c01)를 후보로 썼다. 외국 어린이의 어려움을 보여 주는 영상은 피해 장면이 많아 제외하거나 확인필요로 남기고, 기부 단체(NGO) 홍보 영상은 쓰지 않았다."

