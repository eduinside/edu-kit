kit:
  id: mo4261
  title: "6. 통일로 가는 한 걸음"
  grade: 4
  sem: 2학기
  subject: 도덕
  unit: 6단원
  unit_no: 6
  flow: activity
  codes: ["[4도03-03]"]
  core_idea: "한반도는 하나였다가 나뉘어서 이산가족을 비롯한 많은 사람이 지금도 아픔을 겪고 있어요. 서로 이해하고 화해하며 평화롭게 하나가 되는 길을 찾고, 생활 속에서 작은 실천을 해 나가는 것이 통일로 가는 걸음이에요."
  core_question: "분단의 아픔을 이해하고 평화로운 통일을 위해 나는 무엇을 할 수 있을까?"
  stages:
    - name: 생각열기
      question: "한반도는 어떻게 나뉘었고, 분단은 어떤 아픔을 남겼을까?"
    - name: 탐구하기
      question: "통일은 왜 필요하고, 어떤 방법으로 이루어 가야 할까?"
    - name: 확장하기
      question: "남북이 서로 이해하며 통일을 준비하는 생활 속 실천에는 무엇이 있을까?"
  concepts:
    - "분단"
    - "이산가족"
    - "통일"
    - "평화"
    - "남북 교류"
  source_notes: "정리본 도덕4.국정.u6(1차시 분단 과정 연표·분단의 아픔 → 2차시 통일이 필요한 까닭·독일 통일 사례 → 3차시 친구 화해 이야기에서 바람직한 통일 방법·생활 실천 → 4차시 통일 노래·이산가족 상봉·북한 전통 놀이) · 지도서 인용: 국립평화통일민주교육원 누리집·통일부 UNITV 누리집·통통평화학교(누리집), 통일관 안내 · 오개념: 분단은 오래된 일상일 뿐, 통일은 먼 나라 어른의 일, 남북 관계는 친구 사이처럼 단순 · cautions: 정서적 접근 중심이되 평화와 공존, 인권 같은 가치와 이어서, 연도 외우기가 아님. 통일 노래·뮤직비디오 영상은 수집 제외"

