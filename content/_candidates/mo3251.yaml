kit:
  id: mo3251
  title: "5. 너와 나의 공감"
  grade: 3
  sem: 2학기
  subject: 도덕
  unit: 5단원
  unit_no: 5
  flow: activity
  codes: ["[4도02-03]"]
  core_idea: "공감은 다른 사람의 마음을 헤아리고 함께 느끼려는 마음이에요. 듣기, 반응하기, 마음 말하기로 친구에게 공감을 전할 수 있지만, 사람마다 필요한 방법이 다르니 상대의 마음을 먼저 살펴야 해요."
  core_question: "친구의 마음에 공감하려면 어떻게 듣고 말하고 행동해야 할까?"
  stages:
    - name: 생각열기
      question: "공감이란 무엇이고 왜 필요할까?"
    - name: 탐구하기
      question: "친구의 마음을 어떻게 알아차리고 공감하는 말과 행동을 할까?"
    - name: 확장하기
      question: "공감하며 서로 마음을 나누려면 어떤 태도가 필요할까?"
  concepts:
    - "공감"
    - "감정"
    - "경청"
    - "위로"
    - "배려"
  source_notes: "정리본 도덕3.국정.u5(1차시 속상한 주인공 곁 동물들 반응 견주며 공감의 뜻 → 2차시 한 일에도 마음이 저마다 달라짐·감정 설명서 → 3차시 듣기·반응하기·마음 말하기 세 걸음 → 4차시 공감이 어려운 경우·다짐) · 지도서에 영상 주소 없음 · 오개념: 내 방식대로 도우면 공감, 같은 일엔 같은 감정, 공감은 슬픔·화에만, 모든 일에 공감해야 함 · cautions: 같은 위로도 오해 가능, 공감 세 걸음은 연습용 틀, 지나친 공감은 지치고 그릇된 행동에 동조할 수 있음"

