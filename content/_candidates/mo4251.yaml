  codes: ["[4도03-02]"]
  core_idea: "디지털 사회는 사이버 공간에서도 사람과 사람이 만나는 새로운 공동체라서 현실처럼 서로 지켜야 할 예절이 있어요. 저작권과 개인 정보를 지키고, 사이버 폭력을 하지 않으며 디지털 기기를 알맞게 쓰는 습관이 필요해요."
  core_question: "바람직한 디지털 사회를 만들기 위해 나는 어떤 마음가짐과 습관을 실천할 수 있을까?"
  stages:
    - name: 생각열기
      question: "디지털 사회에서도 사람 사이의 예절이 왜 필요할까?"
    - name: 탐구하기
      question: "새로운 기술에서 생기는 도덕 문제는 무엇이고 어떻게 해결할까?"
    - name: 확장하기
      question: "바람직한 디지털 사회를 위해 나의 디지털 사용 습관을 어떻게 바꿀까?"
  concepts:
    - "디지털 예절"
    - "저작권"
    - "개인 정보"
    - "사이버 폭력"
    - "스마트폰 과의존"
  source_notes: "정리본 도덕4.국정.u5(1차시 디지털 사회 특징·사이버 예절 필요한 까닭 → 2차시 새 기술의 도덕 문제 사례·해결 방법 → 3차시 캠페인 계획·실천 → 4차시 디지털 사용 습관 점검·디지털 거리 두기) · 지도서 인용: 저작권TV 우리에게는 저작권이 있어요, 개인정보배움터·한국인터넷진흥원 초등학생용 3편, 성평등가족부 어린이 누리집 중독 자가 진단(누리집) · 오개념: 디지털 공간은 현실이 아니라 예절이 필요 없다, 복사해도 원본이 없어지지 않으니 괜찮다, 디지털 거리 두기는 기기를 아예 안 쓰는 것 · cautions: 자극적 사례 지양, 점검표로 낙인찍지 말 것, 기술 격차 헤아리기"

