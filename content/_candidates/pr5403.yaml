  core_idea: "디지털 기술은 정보를 저장하고 전달하고 가공하는 기술로, 옛날과 비교해 우리 생활을 많이 바꾸어 놓았어요. 디지털 도구로 발표 자료를 만들 때는 주제와 장면을 계획하고, 사이버 공간에 공유할 때는 개인 정보와 저작권을 지키는 정보 윤리가 필요해요."
  core_question: "디지털 기술은 우리 생활을 어떻게 바꾸었고, 디지털 도구로 만든 발표 자료를 안전하게 공유하려면 무엇을 지켜야 할까?"
  stages:
    - name: 생각열기
      question: "옛날과 비교해 디지털 기술은 우리 생활을 어떻게 바꾸었을까?"
    - name: 탐구하기
      question: "디지털 도구로 발표 자료를 만들려면 주제와 장면을 어떻게 계획할까?"
    - name: 확장하기
      question: "만든 자료를 사이버 공간에 공유할 때는 정보 윤리를 어떻게 지켜야 할까?"
  concepts:
    - "디지털 기술"
    - "저작 도구"
    - "개인 정보"
    - "저작권"
    - "이용 허락 표시"
  source_notes: "천재 정리본 u6 디지털 부분(1~6차시: 옛날과 지금 발표 준비 비교로 디지털 기술의 뜻 → 의료 교육 교통 변화 → 저작 도구·주제·역할 → 믿을 만한 자료로 슬라이드 → 평가 후 온라인 게시 → 개인 정보·저작권 점검) · 비상 정리본 u1-1(1차시 디지털 기술 역할 → 2~3차시 장면 계획·저작 도구로 영상·전자책 → 4차시 정보 윤리·이용 허락 표시로 공유) · 오개념: 디지털 기술은 기기 자체가 아니라 정보를 저장·전달·가공하는 기술, 내가 만든 자료도 만든 이 표시와 이용 허락 조건이 필요, 올린 내용은 쉽게 지워지지 않음 · 유의: 초상권, 저작권 걸린 음악·이미지 금지, 화면 눈 피로 · 특정 상용 앱 광고 영상은 제외"

