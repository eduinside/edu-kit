# mo4111 후보 기록 — 도덕 4학년 1학기 1단원 「바르고 곧은 길」(정직)
# 양식: docs/EXPANSION_PLAN_moral-practical.md §5-1 · 검사: npm run import -- mo4111 --dry
# 2026-10-17 야간 위임 수집. 재생·임베드·연령·국내·길이·쇼츠 여부는 YouTube Data API로 후보 전부 확인. 쇼츠로 확인된 서울시교육청TV 인성톡톡(거짓말) 1편은 후보에서 뺌. 영상 본문은 제목·설명·채널 성격 기준이고 전부 시청한 것은 아님.
# 새 채널(channels.yaml에 없음): 서울시 인성교육 애니메이션 · KBS HUMAN : 뭉클티비 · TBC · 국민권익위원회  권익비전 · 경기도교육청 청렴캐스트 — 채택·후보 채널 등급은 운영자에게 질문.
# 무인점포 양심 어린이 보도(2023)는 같은 사건의 신상 공개 논란이 함께 나오므로 SBS 자막뉴스 1편만 추천하고 나머지는 보류·제외.
kit:
  id: mo4111
  title: "1. 바르고 곧은 길"
  grade: 4
  sem: 1학기
  subject: 도덕
  unit: 1단원
  unit_no: 1
  flow: activity
  codes: ["[4도01-02]"]
  core_idea: "정직은 거짓 없이 바르고 솔직하게 말하고 행동하는 마음가짐이에요. 정직하면 믿음을 얻고 스스로 떳떳할 수 있어서, 곤란한 순간에도 정직을 기준으로 판단하려고 노력하는 것이 중요해요."
  core_question: "거짓말을 하고 싶은 순간에도 정직을 선택하려면 나는 어떻게 생각하고 행동해야 할까?"
  stages:
    - name: 생각열기
      question: "거짓말을 하게 되는 까닭은 무엇이고, 정직은 왜 소중할까?"
    - name: 탐구하기
      question: "정직과 다른 마음이 부딪힐 때 어떻게 판단하고, 학교 생활 속 정직한 행동은 무엇일까?"
    - name: 확장하기
      question: "정직하면 삶에 어떤 좋은 일이 생기고, 나는 어떤 정직을 실천할까?"
  concepts:
    - "정직"
    - "양심"
    - "거짓말"
    - "신뢰"
    - "솔직하게 말하기"
  source_notes: "정리본 도덕4.국정.u1(1차시 거짓말 까닭·정직의 가치 → 2차시 선의의 거짓말과 정직 사이 판단 → 3차시 학교 생활 속 정직 행동·학급 약속 → 4차시 정직이 주는 행복·다짐) · 지도서 인용: KBS HUMAN 뭉클티비 TV동화 양심 판매대, 양심 우산 이야기 · 오개념: 선의의 거짓말은 언제나 허용된다, 정직하면 늘 손해다, 거짓말을 한 번도 안 해야 정직하다 · cautions: 어떤 경우에도 거짓말은 안 된다고 못 박지 말고 판단 기준을 정직으로, 진실을 말할 때 상대가 상처받지 않는 표현도 함께"

