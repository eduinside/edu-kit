# 새 채널(channels.yaml에 없음) 후보: 한국건강가정진흥원 · 성평등가족부(옛 여성가족부) · 소비자안전센터(한국소비자원 어린이안전넷) · KBS대구 · KOBACO공익광고협의회 — 채택·후보 채널 등급은 운영자에게 질문.
# 공공 채널에 가정일 분담 영상이 적어 가족 다양성·가정안전 중심으로 구성. 개인 채널의 아동 출연 가정일 브이로그는 제외.
kit:
  id: pr6101
  title: "가정생활·가정일"
  grade: 6
  sem: 1학기
  subject: 실과
  unit: 인간 발달과 주도적 삶
  unit_no: 1
  flow: activity
  codes: ["[6실01-03]", "[6실01-06]"]
  core_idea: "가족은 저마다 모습과 바라는 것이 달라서, 서로를 배려하고 돌보는 마음이 건강한 가정생활의 바탕이 돼요. 가정일은 한 사람의 몫이 아니라 가족 모두가 나누어 하는 일이고, 내가 할 수 있는 일을 꾸준히 해 보면 그 가치를 알게 돼요."
  core_question: "가족 모두가 행복하려면 서로를 어떻게 배려하고 돌보며, 나는 어떤 가정일을 맡아 실천할 수 있을까?"
  stages:
    - name: 생각열기
      question: "가족의 모습은 어떻게 다르고, 가정생활은 왜 소중할까?"
    - name: 탐구하기1
      question: "가족마다 바라는 것이 다름을 알고 서로를 배려하고 돌보려면 어떻게 해야 할까?"
    - name: 탐구하기2
      question: "가정일에는 어떤 것이 있고, 가정일은 왜 가치 있고 중요한 일일까?"
    - name: 확장하기
      question: "가정일을 안전하게 꾸준히 실천하고 앞으로 가정일은 어떻게 달라질까?"
  concepts:
    - "가족"
    - "가정생활"
    - "배려"
    - "돌봄"
    - "가정일"
  source_notes: "정리본 실과6.천재이춘식.u1(1~3·8차시 가족 요구·배려와 돌봄·가정일 갈래와 일주일 실천) · 실과6.비상송.u5-1(가족의 뜻·건강한 가정생활·가정일 가치). 오개념: 부모와 자녀가 함께 사는 모습만 가족, 집안일은 어머니 몫(성 역할 고정관념), 가정일을 도와주는 일로 봄, 가전이 있으면 가정일이 사라짐. 유의: 가족 형태·형편이 학생마다 다름, 가정일은 안전하게. 지도서 원문에 유튜브 주소 인용 없음(가족센터 누리집만) → 공공기관 공식 채널 직접 검색."

