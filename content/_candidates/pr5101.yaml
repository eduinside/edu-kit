      question: "몸과 마음이 고르게 자라려면 무엇이 필요할까?"
    - name: 확장하기
      question: "나에게 필요한 자기 관리를 어떻게 계획하고 실천할까?"
  concepts:
    - "아동기"
    - "발달"
    - "발달의 개인차"
    - "자기 관리"
    - "생활 습관"
  source_notes: "정리본(천재 u1 · 비상 u2-1) 요지: 아동기 몸·마음·사회성·진로 발달과 개인차 → 고르게 자라는 조건 → 목표·계획·실천·평가로 일주일 자기 관리 · 스마트폰 사용과 뇌 발달 · 오개념: 발달이 빠르거나 늦으면 문제, 건강=몸 성장만, 거창한 계획부터 · 유의: 비교하지 않기, 놀림 금지, 작은 실천부터. 성(性) 발달 영상은 공공·교육 채널의 초등 눈높이 것만, 체중·비만 낙인 우려 영상은 제외"

