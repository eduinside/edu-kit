# 수집 한계: 공공·교육 채널의 손바느질·뜨개질 시범 영상이 거의 없음(대구미래교육연구원 실과 완전 정복 3편이 거의 유일). 뜨개질은 personal(교사 개인) 하늘소리 3편으로 보충 — 아침에 운영자가 채택 여부 판단. 출판사 이름이 제목에 든 영상은 제외.
kit:
  id: pr6202
  title: "의생활 용품 만들기"
  grade: 6
  sem: 1학기
  subject: 실과
  unit: 생활환경과 지속가능한 선택
  unit_no: 2
  flow: flow
  codes: ["[6실02-07]", "[6실02-08]"]
  core_idea: "옷과 생활용품은 섬유로 실을 만들고, 실로 옷감을 만든 뒤, 옷감을 자르고 꿰매어 완성돼요. 바느질과 뜨개질 도구를 알고 쓰고 싶은 용품을 구상해 직접 만들어 쓰면 만드는 즐거움과 창의적인 태도를 키울 수 있어요."
  core_question: "옷과 용품은 어떤 과정을 거쳐 만들어지고, 나는 어떤 도구와 재료로 생활용품을 만들 수 있을까?"
  stages:
    - "섬유와 옷감"
    - "옷이 만들어지는 과정"
    - "손바느질"
    - "뜨개질"
    - "생활용품 만들기"
  concepts:
    - "섬유와 옷감"
    - "옷이 만들어지는 과정"
    - "손바느질"
    - "뜨개질"
    - "생활용품 만들기"
  source_notes: "정리본 실과6.천재이춘식.u3(9~15차시 섬유 실 옷감 옷 흐름·손바늘 대바늘 코바늘 쓰임·손목 받침 박음질·삼베 수세미 대바늘·카드 지갑 코바늘) · 실과6.비상송.u1-3(옷감 종류 직물 편물 압착·바느질 도구 종류·옷이 만들어지는 다섯 단계·주머니·뜨개·룸니팅). 오개념: 바느질 도구는 바늘 하나뿐, 옷감은 모두 같은 방식, 뜨개질은 실을 세게 당겨야 함. 유의: 가위·바늘·시침핀은 끝이 아래로, 장난 금지, 각자 속도, 예시에 머물지 않고 창의적으로. 지도서 원문에 유튜브 주소 인용 없음(옷 제작 과정 영상은 출판사 제공) → 출판사 실습 영상은 쓰지 않고 공공·교육 채널에서 같은 내용을 찾음. 공공 채널의 손바느질·뜨개 시범 영상이 드물어 뜨개질은 교사 개인 채널로 보충."

