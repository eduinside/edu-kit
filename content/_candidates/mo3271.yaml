kit:
  id: mo3271
  title: "7. 생명을 소중히 여기는 우리"
  grade: 3
  sem: 2학기
  subject: 도덕
  unit: 7단원
  unit_no: 7
  flow: activity
  codes: ["[4도04-01]"]
  core_idea: "생명은 하나뿐이고 사람과 동물, 식물 모두 소중해요. 나에서 이웃, 동식물, 자연으로 존중하는 마음을 넓혀 가며, 그 생명에게 실제로 도움이 되는 방법으로 아끼고 돌봐야 해요."
  core_question: "소중한 생명을 존중하려면 대상에 따라 어떤 마음과 방법으로 실천할 수 있을까?"
  stages:
    - name: 생각열기
      question: "생명은 왜 소중할까?"
    - name: 탐구하기
      question: "사람과 동물, 식물을 존중하는 방법에는 무엇이 있을까?"
    - name: 확장하기
      question: "생명 존중을 일상에서 어떻게 실천하고 이어 갈까?"
  concepts:
    - "생명"
    - "생명 존중"
    - "동물 복지"
    - "반려동물"
    - "생물 다양성"
  source_notes: "정리본 도덕3.국정.u7(1차시 시와 영상으로 생명의 값어치 → 2차시 생명 존중·경시 삽화·대상에 맞는 존중 방법 → 3차시 생명 존중 전시회 계획 → 4차시 소감·생명 느끼기·동물 복지 인증 영상) · 지도서 인용: 우체통의 새(KBS HUMAN 뭉클티비), 공익광고협의회 존중과 배려·우리 개는 순한데(KOBACO) · 1분의 배려는 삭제됨, 동물자유연대 입양 영상은 NGO라 보류 · 오개념: 말 못 하는 존재는 함부로 해도 됨, 내가 좋아하는 방식이 존중, 사람 사이의 일만 · cautions: 생명 경시 장면·자극적 내용 피하기, 공신력 있는 곳의 영상, 잔인·극단적 표현 확인"

