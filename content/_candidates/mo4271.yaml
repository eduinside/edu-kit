kit:
  id: mo4271
  title: "7. 자연은 소중해요"
  grade: 4
  sem: 2학기
  subject: 도덕
  unit: 7단원
  unit_no: 7
  flow: activity
  codes: ["[4도04-02]"]
  core_idea: "사람도 자연을 이루는 한 구성원이라서 자연과 서로 도우며 함께 살아가야 해요. 기후 위기와 쓰레기 같은 환경 문제는 나와 이어져 있고, 작은 실천도 모이면 큰 차이를 만들 수 있어요."
  core_question: "사람과 자연이 함께 살아가기 위해 오늘 나는 어떤 실천을 할 수 있을까?"
  stages:
    - name: 생각열기
      question: "사람과 자연은 왜 함께 살아가야 할까?"
    - name: 탐구하기
      question: "기후 위기는 무엇이고, 작은 행동과 분리배출로 어떻게 줄일 수 있을까?"
    - name: 확장하기
      question: "멸종 위기 생물과 공존하려면 어떤 마음과 실천이 필요할까?"
  concepts:
    - "공존"
    - "기후 위기"
    - "탄소 중립"
    - "분리배출"
    - "멸종 위기종"
  source_notes: "정리본 도덕4.국정.u7(1차시 자연을 보는 세 관점·사람과 자연이 함께 살아야 하는 까닭 → 2차시 기후 위기의 뜻과 심각성·지구 지킴이 활동 → 3차시 작은 행동의 힘·분리배출·쓰레기 줄이기 → 4차시 멸종 위기종·생명 존중과 공존) · 지도서 인용: 기후에너지환경부 영상 3편(물 절약·낭비 없는 식생활·전기 절약), 한국환경보전원·환경통계포털·국립생태원 누리집 · 오개념: 환경 문제는 먼 나라 일, 자연은 마음껏 쓰는 도구, 작은 실천은 소용없음 · cautions: 쓰레기 속 아이를 불쌍해하는 데 그치지 말고 까닭을 생각, 실천은 쉬운 일로, 분리배출은 기준과 방법을 정확히"

