  title: "생활 자원·생활 공간 관리"
  grade: 5
  sem: 2학기
  subject: 실과
  unit: 생활환경과 지속가능한 선택
  unit_no: 2
  flow: activity
  sort_order: 1
  codes: ["[6실02-01]", "[6실02-02]", "[6실02-10]"]
  core_idea: "시간과 용돈 같은 생활 자원은 한정되어 있어서 계획을 세워 알맞게 써야 해요. 내가 지내는 공간도 정리 정돈과 청소, 쓰레기 분리배출로 깨끗하게 가꾸면 건강과 환경에 도움이 돼요."
  core_question: "한정된 시간과 용돈을 어떻게 알뜰하게 쓰고, 내가 지내는 공간을 어떻게 쾌적하게 관리할 수 있을까?"
  stages:
    - name: 생각열기
      question: "생활 자원은 무엇이고 왜 관리해야 할까?"
    - name: 탐구하기1
      question: "시간과 용돈을 어떻게 계획하고 쓸까?"
    - name: 탐구하기2
      question: "생활 공간을 어떻게 정리하고 쓰레기를 처리할까?"
    - name: 확장하기
      question: "생활 자원과 공간을 앞으로도 잘 관리하려면 어떻게 해야 할까?"
  concepts:
    - "생활 자원"
    - "시간 관리"
    - "용돈 관리"
    - "정리 정돈"
    - "분리배출"
  source_notes: "정리본(천재 u5 · 비상 u3-1) 요지: 생활 자원은 한정(시간·용돈·지식·건강 같은 보이지 않는 것 포함) → 시간 관리(목표·계획·실천·평가)·용돈 계획과 기입장 → 정리·정돈·청소 순서와 쓰레기 분리배출 · 오개념: 자원은 눈에 보이는 물건뿐, 청소는 지저분할 때만, 용돈 관리=아끼기만, 정리와 정돈은 같은 말 · 유의: 분리배출 규칙은 지역마다 달라 사는 곳 기준 확인, 용돈이 없는 학생 배려, 청소 때 환기·마스크"

