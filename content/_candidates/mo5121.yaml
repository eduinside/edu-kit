      question: "성찰은 어떤 단계로 하고 어떻게 실천할까?"
    - name: 확장하기
      question: "나를 탓하지 않고 성장으로 이어 가려면 어떤 마음이 필요할까?"
  concepts:
    - "반성"
    - "성찰"
    - "성장"
    - "자기 점검"
    - "실천"
  source_notes: "정리본 도덕5.국정.u2(1차시 반성의 뜻·필요 → 2차시 성찰의 뜻·쓸모 → 3차시 성찰 질문 만들어 일주일 실천 → 4차시 자신을 탓하지 않는 바른 태도) · 오개념: 반성은 잘못만 돌아봄, 자기 탓·미움을 반성으로 착각, 남에게 잘 보이려 하는 일 · cautions: 반성이 잘못 따지기가 되지 않게, 바뀔 모습은 긍정적·구체적으로 · 어린이용 공공·교육 영상이 매우 드물어 추천이 적음."

