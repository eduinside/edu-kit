  core_idea: "수송은 사람과 물건을 한 곳에서 다른 곳으로 옮기는 일이고, 땅과 물과 하늘의 수송 수단은 사람들의 불편을 풀려는 발명으로 발달해 왔어요. 수송 수단은 움직이게 하고, 방향을 바꾸고, 멈추게 하는 장치로 이루어져 있고, 오늘날에는 환경을 지키는 친환경 에너지를 쓰는 수송 수단이 늘고 있어요."
  core_question: "수송 수단은 어떻게 발달해 왔고, 어떤 장치로 움직이며, 환경을 지키려면 어떤 수송 수단을 만들어야 할까?"
  stages:
    - "수송 수단"
