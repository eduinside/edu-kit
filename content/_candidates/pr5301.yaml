# 수집 한계: 구동·조향·제동 장치를 초등 눈높이로 설명한 공공·교육 영상이 거의 없어(대부분 자동차 정비 채널·기업 채널) 아꿈선·과학관·행안부 영상으로 3편만 채움. 수송 수단의 역사는 공공 영상이 없어 YTN 사이언스(언론)를 사용.
