    - "조향 장치"
    - "제동 장치"
    - "친환경 수송 수단"
  source_notes: "정리본(천재 u4 수송 · 비상 u4-1·u4-2) 요지: 수송의 뜻과 땅·물·하늘 수송 수단이 옛날부터 미래까지 바뀐 모습 → 자전거·자동차의 구동·조향·제동 장치(구성 요소) → 태양광·풍력 같은 친환경 에너지로 달리는 시제품 만들기 → 수송 기술의 가치 · 오개념: 수송 수단은 하루아침에 생긴 게 아니라 발명과 개선이 쌓임, 수송 수단의 발달 목적은 빠르기만이 아니라 안전·편리·환경, 구성 요소는 서로 맞물려 일함 · 유의: 가위·칼 안전, 태양광은 햇빛 아래 확인. 지도서가 가리킨 한국자동차환경협회 영상은 협회 채널에서 찾지 못해 환경부·YTN·과학관 영상으로 대체. 출판사 실습 동영상은 쓰지 않음"

