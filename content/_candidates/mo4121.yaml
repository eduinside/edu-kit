kit:
  id: mo4121
  title: "2. 도덕적인 나"
  grade: 4
  sem: 1학기
  subject: 도덕
  unit: 2단원
  unit_no: 2
  flow: activity
  codes: ["[4도01-04]"]
  core_idea: "도덕은 사람들이 서로 어울려 살아가며 지켜야 할 바른 생각과 행동이에요. 도덕적으로 행동하려면 다른 사람의 관점을 살펴 헤아리고, 내 생각과 말과 행동을 되돌아보는 노력이 필요해요."
  core_question: "도덕적인 사람이 되려면 나는 어떤 마음으로 어떻게 행동해야 할까?"
  stages:
    - name: 생각열기
      question: "도덕이란 무엇이고, 우리 삶에 왜 필요할까?"
    - name: 탐구하기
      question: "서로 다른 관점이 부딪힐 때 다른 사람의 입장을 어떻게 헤아리고 판단할까?"
    - name: 확장하기
      question: "내 생각·말·행동을 되돌아보며 도덕적인 행동을 어떻게 실천할까?"
  concepts:
    - "도덕"
    - "도덕적 행동"
    - "관점"
    - "약속"
    - "성찰"
  source_notes: "정리본 도덕4.국정.u2(1차시 도덕의 뜻·필요한 까닭 → 2차시 약속과 배려처럼 관점이 부딪힐 때 다른 관점 살피기 → 3차시 귀하게 여기는 도덕적 행동 조사·실천 다짐 → 4차시 생각·말·행동 성찰·표어) · 지도서 인용: 한국버츄프로젝트 가치 카드(누리집, 영상 아님) · 오개념: 도덕은 어른이 정해 준 규칙, 도덕적 행동은 하나의 답, 관점을 받아들이면 내 생각을 버리는 것, 도덕적이면 손해 · cautions: 도덕 뜻을 교사가 못 박지 말 것, 다른 관점은 비판적으로 따져 볼 것, 성찰은 긍정적 성장에 초점"

