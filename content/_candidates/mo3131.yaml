kit:
  id: mo3131
  title: "3. 함께하는 우리 가족"
  grade: 3
  sem: 1학기
  subject: 도덕
  unit: 3단원
  unit_no: 3
  flow: activity
  codes: ["[4도02-01]"]
  core_idea: "가족은 서로 아끼고 돌보며 함께 사는 사람들이고, 가족마다 모습과 행복이 달라요. 부모님께 감사하는 효, 형제자매와 사이좋게 지내는 우애, 가족을 사랑하는 마음을 작은 행동으로 날마다 실천하면 우리 가족 모두가 행복해져요."
  core_question: "우리 가족이 모두 행복하려면 나는 어떤 마음과 행동, 말을 실천할 수 있을까?"
  stages:
    - name: 생각열기
      question: "가족의 모습과 행복은 집마다 어떻게 다를까?"
    - name: 탐구하기
      question: "효와 우애는 어떤 마음과 행동일까?"
    - name: 확장하기
      question: "가족을 사랑하는 마음을 어떻게 전하고 이어 갈까?"
  concepts:
    - "가족"
    - "효"
    - "우애"
    - "가훈"
    - "감사"
  source_notes: "정리본 도덕3.국정.u3(1차시 가족마다 행복이 다름·내가 지닐 마음·행동·말 → 2차시 옛 효행 이야기·효 실천 → 3차시 형제자매 갈등 헤아리기·우애 → 4차시 소중한 순간·가훈·엽서) · 지도서 인용: EBS 지식채널e 「아빠와 함께한 계절」(치매 부모를 다룬 내용이라 3학년에게 무거워 제외) · 오개념: 효는 무조건 순종, 한 사람의 희생이 당연, 내가 행복하면 가족도 행복, 효는 물건으로 충분 · cautions: 다양한 가족 형태 배려, 효·우애를 강요하지 않기"

