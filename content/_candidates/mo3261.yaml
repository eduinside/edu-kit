# mo3261 후보 기록 — 도덕 3학년 2학기 6단원 「함께 가는 공정의 길」
# 양식: docs/EXPANSION_PLAN_moral-practical.md §5-1 · 검사: npm run import -- mo3261 --dry
# 2026-10-17 야간 수집(위임). 재생·임베드·연령·국내·길이·쇼츠 여부는 ytcheck로 확인. 영상 본문은 제목·설명·채널 성격 기준이고 전부 시청한 것은 아님.
# 수집 한계: '공정' 개념을 3학년 눈높이로 풀어 주는 공공·교육 영상이 드물다(개인 채널 도덕 동화만 다수). 공정무역은 공공 영상을 못 찾아 단체 제작 영상을 personal 규칙으로 썼다.
# 새 채널(channels.yaml에 없음): 안전다있소(행정안전부) · 모두잇(DO IT) : 공정무역 — 등급은 운영자에게 질문.
kit:
  id: mo3261
  title: "6. 함께 가는 공정의 길"
  grade: 3
  sem: 2학기
  subject: 도덕
  unit: 6단원
  unit_no: 6
  flow: activity
  codes: ["[4도03-01]"]
  core_idea: "공정은 어느 한쪽으로 치우치지 않고 알맞은 기준으로 모두를 대하는 마음이에요. 생활 속에서 공정한지 까닭과 함께 가려 보고, 모두가 받아들일 수 있는 규칙을 만들어 지키며, 작은 실천에서 공정한 사회가 시작돼요."
  core_question: "생활 속에서 무엇이 공정한지 어떻게 가리고, 모두에게 공정한 규칙은 어떻게 만들까?"
  stages:
    - name: 생각열기
      question: "공정이란 무엇이고 왜 필요할까?"
    - name: 탐구하기
      question: "생활 속 일이 공정한지 어떻게 가리고 공정한 규칙을 어떻게 만들까?"
    - name: 확장하기
      question: "공정한 사회를 위한 제도와 노력에는 무엇이 있을까?"
  concepts:
    - "공정"
    - "규칙"
    - "차별"
    - "공정무역"
    - "재판"
  source_notes: "정리본 도덕3.국정.u6(1차시 차별받은 느낌·공정의 뜻 → 2차시 토끼와 거북이 등 생활 속 일이 공정한지 가리기 → 3차시 한정된 기회를 나눌 모두 동의하는 규칙 → 4차시 전용 주차 구역·배려석·재판·교육 기회·공정 무역 같은 제도와 노력) · 지도서에 영상 주소 없음 · 오개념: 똑같이 나누면 늘 공정, 내게 유리한 쪽이 공정, 다수결이면 무조건 공정, 공정은 어른·나라가 만드는 것 · cautions: 3학년에게 어려운 개념이라 구체적 생활 장면에서 출발, 까닭을 함께 말하기"

