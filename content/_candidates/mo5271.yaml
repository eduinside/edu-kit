kit:
  id: mo5271
  title: 7. 지구의 내일을 심는 우리
  grade: 5
  sem: 2학기
  subject: 도덕
  unit: 7단원
  unit_no: 7
  flow: activity
  codes: ["[6도04-01]"]
  core_idea: "지구 환경 위기의 원인은 사람의 활동에 있고, 여럿이 꾸준히 이어 가는 작은 실천이 위기를 이겨 내는 힘이 돼요."
  core_question: "지구의 위기를 알게 된 우리는 오늘 무엇부터 실천할 수 있을까?"
  stages:
    - name: 생각열기
      question: "지구는 지금 어떤 위기를 겪고 있을까?"
    - name: 탐구하기
      question: "위기의 뿌리는 어디에 있고, 사람들은 어떻게 이겨 내고 있을까?"
    - name: 확장하기
      question: "나의 작은 실천은 어떤 변화를 만들까?"
  concepts:
    - 기후 위기
    - 탄소 중립
    - 새 활용(업사이클링)
    - 지속가능
    - 실천
  source_notes: "정리본 도덕5.국정.u7(4차시: 환경 위기 사례 조사 → 위기의 뿌리·희망 가치 → 위기 극복 모범 사례·실천 달력 → 실천 돌아보기) · 지도서 참고 자료 10편 · 오개념 '나 한 사람의 작은 실천은 소용없다' 주의"

