# mo6271 후보 기록 — 도덕 6학년 2학기 7단원 「우리 모두의 미래를 위한 선택」
# 양식: docs/EXPANSION_PLAN_moral-practical.md §5-1 · 검사: npm run import -- mo6271 --dry
# 2026-10-17 수집(야간 위임). 재생·임베드·연령·국내·길이는 YouTube Data API(ytcheck)로 후보 전부 정상 확인. 영상 본문은 제목·설명·채널 성격 기준으로 판단했고 전부 시청한 것은 아님.
# 지도서가 영상을 직접 인용하지 않은 단원이라 공공기관(기후에너지환경부·국가환경교육센터·기상청) 영상과 대구 지역 환경 실천 뉴스 중심. 소송·시위 등 정치적 색채가 있는 영상은 제외했다.
# 새 채널(channels.yaml에 없음): 세종시교육청 · 대구녹색학습원 공식채널(edu 추정) — 채택 시 운영자에게 등급 질문.
kit:
  id: mo6271
  title: "7. 우리 모두의 미래를 위한 선택"
  grade: 6
  sem: 2학기
  subject: 도덕
  unit: 7단원
  unit_no: 7
  flow: activity
  codes: ["[6도04-02]"]
  core_idea: "지속가능한 삶은 지금의 편리함만 보지 않고 다음 세대도 살아갈 수 있도록 환경·경제·사회가 함께 발전하게 선택하는 거예요. 지금 세대에게는 미래 세대의 권리를 지킬 책임이 있고, 작은 실천이 모여 변화를 만들어요."
  core_question: "지금의 편리함과 미래 세대의 권리 사이에서 우리는 어떤 선택을 해야 할까?"
  stages:
    - name: 생각열기
      question: "지속가능한 삶이란 어떤 삶일까?"
    - name: 탐구하기
      question: "지금 세대는 미래 세대에게 어떤 책임이 있을까?"
    - name: 확장하기
      question: "미래 세대를 위해 오늘 내가 할 수 있는 실천은 무엇일까?"
  concepts:
    - "지속가능한 발전"
    - "미래 세대"
    - "지속가능발전목표"
    - "기후 위기"
    - "탄소 중립"
    - "책임"
  source_notes: "정리본 도덕6.국정.u7(1차시 환경 문제 사진과 블록 무너뜨리기 비유로 보는 지속가능한 삶 → 2차시 지금 세대의 책임과 미래 세대의 권리 → 3차시 미래 세대를 지킬 일 셋을 골라 삼각책에 담고 한 주 실천 → 4차시 지금의 편리함과 다음 세대 권리 견주기·공유 목초지 우화) · 오개념: 기후 위기는 옛사람이 만든 일이라 내 책임이 아님, 미래 세대에게는 권리가 없음, 지속가능발전은 자연 보호만임, 책임은 지금의 희생만 강요 · cautions: 어두운 전망에 머물지 말고 노력으로 이끌기, 실천 항목은 학생이 스스로 정하고 지역 여건에 맞게, 한 주 실제 실천으로 이어지게 · 지도서 원문에 영상 인용이 없어 지속가능발전포털·환경부 등 공공 영상과 대구 학생 환경 실천 지역 뉴스로 모았다. 정부를 상대로 한 기후 소송 보도는 관점이 갈릴 수 있어 채택하지 않았다."

