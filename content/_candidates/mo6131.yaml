kit:
  id: mo6131
  title: "3. 인공지능 로봇 그리고 나"
  grade: 6
  sem: 1학기
  subject: 도덕
  unit: 3단원
  unit_no: 3
  flow: activity
  codes: ["[6도02-03]"]
  core_idea: "인공지능 로봇은 이미 우리 생활 곳곳에서 쓰이고 있어요. 로봇은 스스로 마음을 느끼는 존재가 아니라 사람이 만든 기계이므로, 로봇과의 관계에서 생기는 문제를 막으려면 지켜야 할 원칙과 바르게 쓰는 책임이 필요해요."
  core_question: "인공지능 로봇과 올바른 관계를 맺으려면 어떤 원칙을 지켜야 할까?"
  stages:
    - name: 생각열기
      question: "로봇은 어디에 쓰이고, 우리와 어떤 관계를 맺을까?"
    - name: 탐구하기
      question: "인공지능 로봇이 일으킨 문제는 무엇이고, 어떤 원칙이 필요할까?"
    - name: 확장하기
      question: "미래의 로봇은 어떤 좋은 점과 걱정을 가져올까?"
  concepts:
    - "인공지능"
    - "로봇"
    - "윤리 원칙"
    - "책임"
    - "개인정보"
    - "자율주행차"
  source_notes: "정리본 도덕6.국정.u3(1차시 로봇의 쓰임에 따른 관계·로봇이 친구가 될지 따져 보기 → 2차시 로봇이 일으킨 문제 사례와 지켜야 할 원칙 → 3차시 인형·반려동물과 견주며 로봇 바르게 쓰는 법 → 4차시 미래 로봇의 좋은 점과 걱정·상상 체험) · 오개념: 로봇이 스스로 생각하고 마음을 느낌, 영화 속 로봇을 지금 기술로 착각, 로봇 문제는 기술이 알아서 풀거나 안 만들면 됨 · cautions: 생성형 인공지능은 14세 미만 이용 제한이 많아 깊이 다루지 않기, 로봇을 지나치게 사람처럼 그리지 말고 지금 있는 로봇 중심, 기술의 앞날을 무조건 나쁘게만 보지 않기 · 지도서가 가리킨 KBS 집사 로봇 영상(c02)을 후보로 씀. 윤리 원칙을 어린이용으로 풀어 준 공공 영상은 드물어 해당 단계는 배경지식 위주."

