kit:
  id: pr6203
  title: "환경 고려 관리·생태 지향 삶"
  grade: 6
  sem: 2학기
  subject: 실과
  unit: 생활환경과 지속가능한 선택
  unit_no: 2
  flow: activity
  codes: ["[6실02-03]", "[6실02-11]"]
  core_idea: "물건을 만들고 쓰고 버리는 일은 환경에 영향을 줘요. 생활 자원을 아껴 쓰고 나누고 재사용·재활용하는 관리 방법을 알고, 의식주 생활에서 할 수 있는 행동을 계획해 꾸준히 실천하면 지구를 위한 생태 지향적 삶을 살 수 있어요."
  core_question: "내가 쓰는 물건과 생활 습관이 환경에 어떤 영향을 주고, 환경을 지키기 위해 무엇을 계획해 실천할 수 있을까?"
  stages:
    - name: 생각열기
      question: "물건을 만들고 쓰고 버리는 일은 환경에 어떤 영향을 줄까?"
    - name: 탐구하기
      question: "환경을 고려해 쓰고 나누고 버리는 방법에는 무엇이 있을까?"
    - name: 확장하기
      question: "생태 지향적 삶을 위해 나의 의식주 생활에서 어떤 행동을 계획해 실천할까?"
  concepts:
    - "분리배출"
    - "재사용"
    - "재활용"
    - "탄소발자국"
    - "생태 지향적 삶"
  source_notes: "정리본 실과6.천재이춘식.u5(1~6차시 만들고 쓰고 버리는 일의 영향·살 때 쓸 때 버릴 때 관리법과 나눔 기부·이어 참여하기·환경 문제와 생태 지향 삶·의식주 점검과 일주일 실천) · 실과6.비상송.u1-1(자원도 쓰레기도 되는 처리 방법·쓰레기 줄이기와 분리배출·의식주 습관 점검·교실 가정 실천). 오개념: 버린 물건은 쓸모없음(처리에 따라 자원), 환경 문제는 먼 미래 일, 음식에서 나온 뼈·씨·껍데기를 모두 음식물 쓰레기로 착각. 유의: 환경 문제가 심각함을 알리되 지나친 불안 금지, 실천은 눈에 보이는 행동 목표(주 1회 채식 등), 분리배출 기준은 지역마다 다를 수 있음, 폐품은 다치지 않게. 지도서 원문에 유튜브 주소 인용 없음(자원순환실천플랫폼·기후행동 1.5℃·한국환경산업기술원·환경부 블로그 등 누리집) → 공식 채널 직접 검색."

