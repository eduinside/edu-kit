# 꾸러미 주제 태그 어휘 — content/kits/*.yaml의 intro.topics는 이 목록의 태그만 쓴다(npm run check가 목록 밖 태그를 경고).
#
# 쓰임: 수업나래가 3단계 활동 주제로 꾸러미 영상을 붙일 때(성취기준 코드가 다른 교과·단원이라도 주제가 이어지면)
#       교사가 쓴 탐구 과제 이름·주요 활동·핵심 아이디어의 낱말과 이 태그를 맞춘다. 그래서 태그는
#       - 교사가 계획안에 실제로 쓰는 말(두 글자 이상, 띄어쓰기는 맞출 때 무시한다)
#       - 상위 개념(group)별로 묶어 비슷한 말을 하나로(예: "생태 보전"·"자연 보호" → 환경 보호)
#       꾸러미마다 3~10개, 단원을 가장 잘 나타내는 것부터. 성취기준 원문의 말과 핵심 용어에 있는 말을 우선한다.
# 새 태그가 꼭 필요하면 여기에 먼저 더한다(가까운 태그가 있으면 그것을 쓴다).
