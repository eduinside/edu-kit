id: in1241
title: 4. 상상
grade: 1
sem: 2학기
subject: 통합
unit: 4단원
unit_no: 4
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 상상하면 새로운 생각과 물건을 떠올릴 수 있어요. 상상한 것을 그림, 소리, 몸으로 표현하면 모두와 함께 즐길 수 있어요.
  core_question: 상상한 것을 어떻게 표현할까?
  concepts:
    - term: 상상
      def: 눈앞에 없는 것을 머릿속으로 떠올리는 것이에요.
    - term: 표현
      def: 생각이나 느낌을 그림, 몸짓, 소리로 나타내는 것이에요.
    - term: 발명
      def: 새로운 물건이나 방법을 처음 만들어 내는 것이에요.
    - term: 창의
      def: 새롭고 재미있는 생각이에요.
  standards:
    - code: "[2바04-02]"
      text: 다양한 생각이나 의견에 대해 개방적인 태도를 형성한다.
    - code: "[2슬04-02]"
      text: 상상한 것을 다양한 매체와 재료로 구현한다.
    - code: "[2즐04-02]"
      text: 자유롭게 상상하며 놀이한다.
stages:
  - name: 생각열기
    question: 상상하면 무엇이 달라질까?
  - name: 탐구하기
    question: 상상한 것을 어떻게 표현할까?
  - name: 확장하기
    question: 상상이 우리 생활을 어떻게 바꿀까?
