quiz:
  - statement: 상상은 머릿속으로 떠올려 보는 것이에요.
    answer: O
    explain: 눈에 보이지 않아도 생각으로 그려 볼 수 있어요.
  - statement: 상상한 것을 그림으로 그릴 수 있어요.
    answer: O
    explain: 그림, 몸짓, 소리로 나타낼 수 있어요.
  - statement: 상상한 것은 몸으로 표현할 수 없어요.
    answer: X
    explain: 몸짓으로도 표현할 수 있어요.
  - statement: 상상에는 한 가지 정답만 있어요.
    answer: X
    explain: 상상은 사람마다 달라서 정해진 답이 없어요.
  - statement: 상상한 것을 노래로 나타낼 수 있어요.
    answer: O
    explain: 소리와 노래로도 표현할 수 있어요.
