id: so6223
title: 2-3. 무역과 세계 경제
grade: 6
sem: 2학기
subject: 사회
unit: 2. 시장경제와 국가 간 거래
unit_no: 2
flow: activity
sort_order: 3
published: true
intro:
  core_idea: 무역은 생활 수준의 향상을 가져오며, 그 과정에서 나타나는 사회·경제적 과제를 해결하기 위한 노력이 필요하다.
  core_question: 무역은 삶과 사회를 어떻게 변화시키는가?
  concepts:
    - term: 상호 작용
      def: 둘 이상의 대상이 서로 영향을 주고받는 관계예요.
    - term: 체제
      def: 사회가 일정한 원리와 질서에 따라 운영되는 전체적인 구조예요.
    - term: 교류
      def: 사람이나 지역, 국가가 물건, 정보, 문화 등을 서로 주고받는 활동이에요.
    - term: 무역
      def: 나라와 나라 사이에 상품이나 서비스를 사고파는 경제활동이에요.
    - term: 생활
      def: 사람들이 살아가며 하는 일과 의식주를 포함한 일상 활동이에요.
  standards:
    - code: "[6사11-03]"
      text: 사례를 통해 무역의 의미를 이해하고, 국가 간 무역이 발생하는 이유를 탐구한다.
stages:
  - name: 생각열기
    question: 무역은 어떻게 시작되었을까?
  - name: 탐구하기1
    question: 우리나라 무역의 특징은 무엇일까?
  - name: 탐구하기2
    question: 경제 교류를 하며 생기는 문제는 무엇일까?
  - name: 확장하기
    question: 무역 과정에서 거래는 어떻게 이루어질까?
