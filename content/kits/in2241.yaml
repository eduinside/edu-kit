quiz:
  - statement: 한글은 세종대왕이 만들었어요.
    answer: O
    explain: 세종대왕이 백성이 쉽게 쓰도록 한글을 만들었어요.
  - statement: 한글은 중국에서 만든 글자예요.
    answer: X
    explain: 한글은 우리나라 글자예요.
  - statement: 한글날은 한글을 만든 것을 기념하는 날이에요.
    answer: O
    explain: 해마다 한글의 소중함을 되새겨요.
  - statement: 인물의 좋은 점은 따라 해 볼 수 있어요.
    answer: O
    explain: 본받으면 나도 함께 사는 마음이 자라요.
  - statement: 세종대왕은 조선의 첫 번째 임금이에요.
    answer: X
    explain: 세종대왕은 조선의 네 번째 임금이에요.
  - statement: 세종대왕은 백성을 위해 한글을 만들었어요.
    answer: O
    explain: 글자를 몰라 어려운 백성을 돕고 싶어서예요.
