quiz:
  - statement: 지난 일을 돌아보면 내가 자란 모습을 알 수 있어요.
    answer: O
    explain: 지난 일을 떠올리면 달라진 나를 알 수 있어요.
  - statement: 고마운 친구에게 칭찬을 나누면 서로 기분이 좋아져요.
    answer: O
    explain: 칭찬과 감사는 마음을 따뜻하게 해요.
  - statement: 게임은 오래 할수록 몸에 좋아요.
    answer: X
    explain: 게임은 정해진 시간만큼만 해요.
  - statement: 새 학년이 되면 아무것도 준비하지 않아도 돼요.
    answer: X
    explain: 새 학년을 기대하며 필요한 것을 미리 준비해요.
  - statement: 기억에 남는 일은 사람마다 다를 수 있어요.
    answer: O
    explain: 저마다 소중하게 생각하는 기억이 달라요.
