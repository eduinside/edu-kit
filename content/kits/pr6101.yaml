id: pr6101
title: 가정생활·가정일
grade: 6
sem: 1학기
subject: 실과
unit: 인간 발달과 주도적 삶
unit_no: 1
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 가족은 저마다 모습과 바라는 것이 달라서, 서로를 배려하고 돌보는 마음이 건강한 가정생활의 바탕이 돼요. 가정일은 한 사람의 몫이 아니라 가족 모두가 나누어 하는 일이고, 내가 할 수 있는 일을 꾸준히 해 보면 그 가치를 알게 돼요.
  core_question: 가족 모두가 행복하려면 서로를 어떻게 배려하고 돌보며, 나는 어떤 가정일을 맡아 실천할 수 있을까?
  concepts:
    - term: 가족
      def: 서로 아끼고 돌보며 함께 생활하는 사람들이에요. 함께 사는 사람의 수나 모습은 집마다 달라도 모두 가족이에요.
    - term: 가정생활
      def: 가족이 한집에서 먹고 자고 쉬고 일하며 함께 살아가는 모든 생활이에요. 가족이 서로 돕고 일을 나누면 건강한 가정생활을 만들 수 있어요.
    - term: 배려
      def: 다른 사람의 처지와 마음을 헤아려 도움이 되도록 마음을 쓰는 것이에요. 가족마다 바라는 것이 다르다는 것을 알면 서로 배려할 수 있어요.
    - term: 돌봄
      def: 도움이 필요한 사람을 살피고 보살피는 일이에요. 어린 동생이나 아픈 가족, 연세 드신 가족을 보살피는 것이 돌봄이에요.
    - term: 가정일
      def: 가정생활을 이어 가기 위해 하는 일이에요. 청소, 빨래, 요리, 정리 정돈처럼 가족 모두가 나누어 해요.
  standards:
    - code: "[6실01-03]"
      text: 건강한 가정생활을 위해 가족원 모두에게 다양한 요구가 있음을 이해하여 서로에 대한 배려와 돌봄을 실천한다.
    - code: "[6실01-06]"
      text: 가정일을 수행하는 과정에서 일의 가치와 중요성을 이해하고, 가정생활을 유지하는 데 필요한 가정일의 종류를 탐색한다.
stages:
  - name: 생각열기
    question: 가족의 모습은 어떻게 다르고, 가정생활은 왜 소중할까?
  - name: 탐구하기1
    question: 가족마다 바라는 것이 다름을 알고 서로를 배려하고 돌보려면 어떻게 해야 할까?
  - name: 탐구하기2
    question: 가정일에는 어떤 것이 있고, 가정일은 왜 가치 있고 중요한 일일까?
  - name: 확장하기
    question: 가정일을 안전하게 꾸준히 실천하고 앞으로 가정일은 어떻게 달라질까?
