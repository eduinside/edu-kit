quiz:
  - statement: 가족의 모습은 집마다 달라도 서로 아끼고 돌보며 함께 사는 사람들은 모두 가족이다.
    answer: O
    explain: 함께 사는 사람의 수나 모습이 달라도 서로 아끼고 돌보는 사람들은 가족이에요.
  - statement: 가족은 반드시 부모와 자녀가 함께 사는 모습이어야 한다.
    answer: X
    explain: 한부모, 조손, 다문화 가족처럼 가족의 형태는 다양해요. 서로 존중하며 돌보는 것이 더 중요해요.
  - statement: 가족마다 바라는 것이 다를 수 있으니 서로의 요구를 헤아려 배려하면 가정생활이 건강해진다.
    answer: O
    explain: 서로의 요구를 이해하고 배려와 돌봄을 실천하면 가족 모두가 편안해져요.
  - statement: 가정일은 한 사람이 맡아서 하고 나머지 가족은 도와주기만 하면 된다.
    answer: X
    explain: 가정일은 가족 모두의 일이에요. 각자 형편에 맞게 나누어 함께 해야 해요.
  - statement: 청소, 빨래, 요리, 정리 정돈은 가정생활을 유지하는 데 필요한 가정일이다.
    answer: O
    explain: 이런 일들이 모여 가족이 편안하게 생활할 수 있어요.
  - statement: 집안일에는 남자가 하는 일과 여자가 하는 일이 따로 정해져 있다.
    answer: X
    explain: 가정일은 성별로 정해진 것이 아니에요. 누구나 할 수 있는 일을 나누어 해요.
  - statement: 칼이나 뜨거운 물을 쓰는 가정일을 할 때는 다치지 않게 안전 수칙을 지켜야 한다.
    answer: O
    explain: 불, 칼, 뜨거운 물은 다칠 수 있어서 조심해서 다루고 어른과 함께 해야 해요.
  - statement: 청소 로봇 같은 기계가 있으면 가정일은 완전히 없어진다.
    answer: X
    explain: 기계가 도와도 가정일은 사라지지 않고 모습이 바뀔 뿐이에요. 기계를 관리하는 일이 새로 생겨요.
