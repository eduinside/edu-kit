id: sc3111
title: 1. 힘과 우리 생활
grade: 3
sem: 1학기
subject: 과학
unit: 힘과 우리 생활
unit_no: 1
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 물체를 밀거나 당길 때의 변화를 관찰하고 수평 잡기와 저울을 이용해 무게를 비교하며 일상생활에서 사용하는 도구의 쓰임새를 탐구한다.
  core_question: 힘은 물체에 어떤 변화를 일으키며, 우리는 도구를 이용해 힘을 어떻게 이롭게 활용할까?
  concepts:
    - term: 생활 속 힘
      def: 물체를 밀거나 당겨 움직이거나 멈추게 하는 작용으로, 일상생활 곳곳에서 쓰여요.
    - term: 밀기와 당기기
      def: 물체를 밀거나 당기면 빠르기·방향·모양이 바뀔 수 있어요.
    - term: 수평 잡기
      def: 양쪽 무게가 같아 어느 쪽으로도 기울지 않고 평평해진 상태예요.
    - term: 저울
      def: 눈으로 비교하기 어려운 물체의 무게를 정확하게 재는 도구예요.
    - term: 무게
      def: 지구가 물체를 끌어당기는 힘의 크기로, g·kg으로 나타내요.
    - term: 들어 올리기
      def: 지레 같은 도구를 쓰면 더 적은 힘으로 무거운 물체를 들어 올릴 수 있어요.
    - term: 도구의 이용
      def: 지레·빗면처럼 힘을 이롭게 바꿔 주어 일을 더 쉽게 해 주는 도구를 쓰는 것이에요.
  standards:
    - code: "[4과01-01]"
      text: 일상생활에서 힘과 관련된 현상에 흥미를 갖고, 물체를 밀거나 당길 때 나타나는 현상을 관찰할 수 있다.
    - code: "[4과01-02]"
      text: 수평잡기 활동을 통해 물체의 무게를 비교할 수 있다.
    - code: "[4과01-03]"
      text: 무게를 정확히 비교하기 위해서는 저울이 필요함을 알고, 저울을 사용해 무게를 비교할 수 있다.
    - code: "[4과01-04]"
      text: 지레, 빗면과 같은 도구를 이용하면 물체를 들어 올릴 때 드는 힘의 크기가 달라짐을 알고, 도구가 일상생활에서 어떻게 쓰이는지 조사하여 공유할 수 있다.
stages:
  - 생활 속 힘
  - 밀기와 당기기
  - 수평 잡기
  - 저울
  - 무게
  - 들어 올리기
  - 도구의 이용
