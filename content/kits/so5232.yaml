    question: 8·15 광복의 의미와 광복이 사회와 생활에 끼친 영향은 무엇일까?
  - name: 탐구하기2
    question: 6·25 전쟁은 어떻게 전개되었으며 사회와 생활에 끼친 영향은 무엇일까?
  - name: 확장하기
    question: 정부는 왜 80년이 지난 지금, 웅장한 환영식을 열었을까?
