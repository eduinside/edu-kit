intro:
  core_idea: 각 시대의 생활 모습은 사회 체제의 특징과 그것이 가져온 사회⋅문화적 변화를 반영한다.
  core_question: 서로 다른 체제와 분단의 아픔이 남아있는 장소를 어떻게 평화의 공간으로 변화시킬 수 있으며, 이를 위해 우리는 무엇을 할 수 있을까?
  concepts:
    - term: 공간과 장소
    - term: 변화
    - term: 체제
    - term: 생활 모습
    - term: 문화
    - term: 사건
    - term: 분단
    - term: 평화 통일
  standards:
    - code: "[6사07-01]"
      text: 분단으로 나타난 문제점과 분단과 관련된 장소를 평화의 장소로 만들려는 노력 등을 알아보고, 평화 통일을 위해 우리가 할 수 있는 일을 탐색한다.
stages:
  - name: 생각열기
