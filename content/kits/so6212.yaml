id: so6212
title: 1-2. 세계의 다양한 기후와 생활 모습
grade: 6
sem: 2학기
subject: 사회
unit: 1. 세계의 자연환경
unit_no: 1
flow: activity
sort_order: 2
published: true
intro:
  core_idea: 기후 환경은 인간의 생활 방식에 영향을 미치며, 이는 다양한 삶의 모습으로 나타난다.
  core_question: 세계의 다양한 기후 환경은 사람들의 생활 방식에 어떤 영향을 주는가?
  concepts:
    - term: 공간과 장소
      def: 사람들이 살아가고 활동하며 의미를 만들어 가는 지표면의 일정한 범위예요.
    - term: 상호작용
      def: 둘 이상의 대상이 서로 영향을 주고받는 관계예요.
    - term: 기후
      def: 한 지역에서 오랜 기간 반복되어 나타나는 평균적인 날씨의 특징이에요.
    - term: 환경
      def: 사람과 생물을 둘러싸고 생활에 영향을 주는 자연적·사회적 조건이에요.
    - term: 생활
      def: 사람들이 살아가며 하는 일과 의식주를 포함한 일상 활동이에요.
  standards:
    - code: "[6사10-02]"
      text: 세계의 다양한 기후를 알아보고 기후 환경과 인간생활 간의 관계를 탐구한다.
stages:
  - name: 생각열기
    question: 날씨와 기후는 어떻게 다를까?
  - name: 탐구하기1
    question: 세계의 여러 기후는 각각 어떤 특징을 가질까?
  - name: 탐구하기2
    question: 기후는 사람들의 생활 모습에 어떤 영향을 줄까?
  - name: 확장하기
    question: 사람들은 자연환경에 맞추어 어떤 선택을 할까?
