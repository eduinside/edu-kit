id: sc5141
title: 4. 우리 몸의 구조와 기능
grade: 5
sem: 1학기
subject: 과학
unit: 우리 몸의 구조와 기능
unit_no: 4
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 우리 몸의 움직임을 담당하는 뼈와 근육의 구조와 작동 원리를 학습합니다. 음식물의 소화, 영양소와 산소의 순환, 호흡, 노폐물 배설을 담당하는 소화, 순환, 호흡, 배설 기관의 구조와 기능을 알아보고, 이 기관들이 유기적으로 연결되어 있음을 이해합니다. 더 나아가, 기관 관련 질병을 조사하고 건강한 생활 습관을 실천하는 태도를 기르도록 구성되었습니다.
  core_question: 우리 몸의 여러 기관은 어떤 구조와 기능을 지니며, 서로 어떻게 관련되어 작동할까?
  concepts:
    - term: 뼈
      def: 우리 몸의 단단한 부분으로, 몸의 모양을 만들고 몸을 지탱하며 안쪽의 부드러운 부분을 보호해 줍니다.
    - term: 근육
      def: 뼈에 붙어 있는 부분으로, 줄어들거나 늘어나면서 뼈를 움직여 우리 몸이 움직일 수 있게 해 줍니다.
    - term: 소화기관
      def: 입, 식도, 위, 작은창자, 큰창자처럼 음식물을 잘게 부수고 영양소를 흡수하는 일을 하는 기관입니다.
    - term: 순환기관
      def: 심장과 혈관처럼 혈액을 온몸으로 보내 영양소와 산소를 몸 구석구석까지 전달하는 기관입니다.
    - term: 호흡기관
      def: 코, 기관, 폐처럼 숨을 쉬어 몸에 필요한 산소를 받아들이고 이산화 탄소를 내보내는 기관입니다.
    - term: 배설기관
      def: 콩팥과 방광처럼 몸속에서 생긴 노폐물을 걸러서 오줌으로 몸 밖으로 내보내는 기관입니다.
    - term: 질병예방
      def: 여러 기관과 관련된 병에 걸리지 않도록 손 씻기, 알맞은 운동, 바른 식습관 같은 건강한 생활 습관을 실천하는 것입니다.
  standards:
    - code: "[6과04-01]"
      text: 뼈와 근육의 생김새를 관찰하고 모형을 만들어 몸이 움직이는 원리를 설명할 수 있다.
    - code: "[6과04-02]"
      text: 소화, 순환, 호흡, 배설 기관의 구조와 기능을 알아보고, 우리 몸의 여러 기관이 서로 관련되어 있음을 설명할 수 있다.
    - code: "[6과04-03]"
      text: 우리 몸의 여러 기관과 관련된 질병을 조사하고, 건강을 유지하기 위한 생활 방식을 실천할 수 있다.
stages:
