id: pr5402
title: 친환경 건설 구조물
grade: 5
sem: 2학기
subject: 실과
unit: 지속가능한 기술과 융합
unit_no: 4
flow: flow
sort_order: 2
published: true
intro:
  core_idea: 건설 기술은 사람이 살고 이용하는 건물과 시설을 짓는 기술이에요. 지붕과 벽, 바닥을 갖춘 건축 구조물과 다리, 터널 같은 토목 구조물이 있고, 요즘은 에너지와 자원을 아끼는 친환경 구조물도 많이 지어요.
  core_question: 건설 기술은 우리 생활을 어떻게 편리하고 안전하게 하고, 환경까지 생각하는 구조물은 어떻게 지을까?
  concepts:
    - term: 건설 기술
      def: 사람이 살고 생활하는 데 필요한 건물과 시설을 짓는 기술이에요. 집, 학교, 다리, 도로를 안전하고 튼튼하게 만들 때 쓰여요.
    - term: 건축 구조물
      def: 지붕과 벽, 바닥을 갖추고 사람이 그 안에서 생활하거나 일하는 구조물이에요. 집, 학교, 아파트가 그 예예요.
    - term: 토목 구조물
      def: 다리, 도로, 터널, 댐처럼 사람이 오가거나 물을 다루는 일을 돕는 구조물이에요. 건물처럼 지붕과 벽을 모두 갖추지 않은 경우가 많아요.
    - term: 친환경 건설
      def: 에너지와 자원을 아끼고 환경에 주는 피해를 줄이도록 구조물을 짓는 것이에요. 단열과 채광, 환기를 잘 살리거나 태양 에너지 같은 것을 쓰는 방법이 있어요.
  standards:
    - code: "[6실04-01]"
      text: 친환경 건설 구조물을 이해하고, 생활 속 건설 구조물을 탐색하여 간단한 구조물을 체험하면서 건설기술에 대한 가치를 인식한다.
stages:
