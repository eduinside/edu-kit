quiz:
  - statement: 건축 구조물은 지붕과 벽, 바닥을 갖추고 사람이 그 안에서 생활하거나 일하는 구조물이다.
    answer: O
    explain: 집, 학교, 아파트처럼 사람이 안에서 활동하는 구조물이 건축 구조물이에요.
  - statement: 다리와 터널은 건축 구조물에 속한다.
    answer: X
    explain: 다리와 터널은 사람이 오가는 길을 이어 주는 토목 구조물이에요.
  - statement: 도로, 댐, 다리는 대표적인 토목 구조물이다.
    answer: O
    explain: 토목 구조물은 다리, 도로, 터널, 댐처럼 우리 생활을 돕는 시설이에요.
  - statement: 친환경 건물은 태양 전지 같은 장치를 붙인 건물만을 말한다.
    answer: X
    explain: 단열과 채광, 환기로 에너지 낭비를 줄이는 구조도 친환경 건물에 포함돼요.
  - statement: 한옥의 처마는 여름에는 햇빛을 막고 겨울에는 햇빛이 방 안까지 들어오게 돕는다.
    answer: O
    explain: 처마의 길이와 모양이 계절에 따라 들어오는 햇빛의 양을 조절해 줘요.
  - statement: 옛날 사람들은 건설 기술을 전혀 쓰지 않고 건물을 지었다.
    answer: X
    explain: 옛날 사람들도 집과 다리를 짓는 건설 기술을 썼고, 시간이 지나며 점점 발전했어요.
  - statement: 제로에너지 건축물은 에너지를 아끼고 직접 만들어서 쓰는 에너지를 크게 줄인 건물이다.
    answer: O
    explain: 단열을 높이고 건물이 에너지를 직접 만들어서 외부에서 받는 에너지를 줄여요.
  - statement: 다리는 어디에서나 똑같은 모양과 방법으로 만든다.
    answer: X
    explain: 강과 바다의 깊이와 길이에 따라 여러 종류의 다리와 건설 방법이 쓰여요.
