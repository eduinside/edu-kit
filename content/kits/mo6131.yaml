quiz:
  - statement: 로봇은 사람이 만든 기계라서 스스로 마음을 느끼는 존재가 아니다.
    answer: O
    explain: 인공지능 로봇은 사람이 만든 기술이고, 사람처럼 마음을 느끼는 것은 아니에요.
  - statement: 영화나 만화에 나오는 로봇은 모두 지금 실제로 쓰이는 기술이다.
    answer: X
    explain: 영화나 만화 속 로봇은 상상으로 그린 모습이 많아서 지금의 실제 기술과 달라요.
  - statement: 돌봄 로봇은 어르신과 대화하고 생활을 돕는 일에 쓰일 수 있다.
    answer: O
    explain: 돌봄 인력이 부족한 곳에서 대화를 나누고 일상을 돕는 로봇이 쓰이기 시작했어요.
  - statement: 로봇이 문제를 일으키면 로봇이 알아서 해결하므로 사람이 책임질 필요가 없다.
    answer: X
    explain: 로봇을 만들고 쓰는 사람에게 책임이 있어서 문제를 막을 원칙을 지키고 잘못은 바로잡아야 해요.
  - statement: 인공지능 로봇을 만들고 쓸 때는 사람의 안전과 권리를 지키는 윤리 원칙이 필요하다.
    answer: O
    explain: 로봇이 일으킨 문제 사례를 살펴보고 지켜야 할 원칙을 세우는 일이 중요해요.
  - statement: 로봇 때문에 생기는 문제는 로봇을 아예 만들지 않으면 모두 해결된다.
    answer: X
    explain: 로봇은 이미 생활에 도움을 주고 있어서, 만들지 않는 것보다 바르게 쓰는 원칙을 세우는 것이 필요해요.
  - statement: 자율주행차는 운전하는 사람이 직접 핸들을 잡지 않아도 달리도록 만든 자동차이다.
    answer: O
    explain: 자율주행차가 사고를 냈을 때 누가 책임질지 같은 윤리 문제도 함께 생각해야 해요.
  - statement: 로봇이 집 안에서 보고 들은 개인정보는 아무 데나 써도 된다.
    answer: X
    explain: 개인정보는 함부로 모으거나 쓰면 안 되고 안전하게 지켜져야 해요.
