id: mo6131
title: 3. 인공지능 로봇 그리고 나
grade: 6
sem: 1학기
subject: 도덕
unit: 3단원
unit_no: 3
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 인공지능 로봇은 이미 우리 생활 곳곳에서 쓰이고 있어요. 로봇은 스스로 마음을 느끼는 존재가 아니라 사람이 만든 기계이므로, 로봇과의 관계에서 생기는 문제를 막으려면 지켜야 할 원칙과 바르게 쓰는 책임이 필요해요.
  core_question: 인공지능 로봇과 올바른 관계를 맺으려면 어떤 원칙을 지켜야 할까?
  concepts:
    - term: 인공지능
      def: 사람처럼 배우고 판단하는 것 같은 일을 하도록 컴퓨터로 만든 기술이에요. 스스로 마음을 느끼는 것은 아니에요.
    - term: 로봇
      def: 사람을 대신하거나 도와서 일하도록 만든 기계예요. 청소, 돌봄, 공장 일처럼 여러 곳에서 쓰여요.
    - term: 윤리 원칙
      def: 인공지능과 로봇을 만들고 쓸 때 사람의 안전과 권리를 지키려고 모두가 따르기로 한 약속이에요.
    - term: 책임
      def: 내가 한 결정과 행동의 결과를 피하지 않고 받아들이고, 잘못되었으면 바로잡으려고 애쓰는 것이에요.
    - term: 개인정보
      def: 이름, 얼굴, 목소리처럼 누구인지 알 수 있는 정보예요. 로봇이 이런 정보를 모을 때는 함부로 쓰이지 않게 조심해야 해요.
    - term: 자율주행차
      def: 운전하는 사람이 직접 핸들을 잡지 않아도 스스로 길을 보고 달리도록 만든 자동차예요.
  standards:
    - code: "[6도02-03]"
      text: 인간과 인공지능 로봇 간의 다양한 관계를 파악하고 도덕에 기반을 둔 관계 형성의 필요성을 탐구한다.
stages:
