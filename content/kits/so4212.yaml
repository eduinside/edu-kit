id: so4212
title: 1-2. 주민 자치와 주민 참여
grade: 4
sem: 2학기
subject: 사회
unit: 1단원
unit_no: 1
flow: flow
sort_order: 2
published: true
intro:
  core_idea: 주민 자치와 주민 참여의 중요성을 알아보고, 지역사회의 문제 해결에 참여하는 태도를 기르는 내용으로 구성되어 있습니다.
  core_question: 민주주의는 학교와 지역에서 어떻게 실현되며, 우리는 자치와 참여에 어떻게 함께할 수 있을까?
  concepts:
    - term: 민주주의
      def: 나라나 지역의 일을 사람들이 함께 의논하고 다수의 뜻에 따라 결정하는 제도예요. 모든 사람이 주인으로서 자유롭고 평등하게 참여할 수 있어요.
    - term: 주민자치
      def: 한 지역에 사는 주민들이 그 지역의 일을 스스로 의논하고 결정하며 처리하는 것을 말해요. 우리 동네 일을 우리가 직접 챙기는 것이지요.
    - term: 주민참여
      def: 지역의 문제를 해결하기 위해 주민들이 의견을 내고 함께 활동하는 것을 말해요. 공청회나 주민회의에 나가 자기 생각을 말하는 것이 그 예예요.
  standards:
    - code: "[4사08-02]"
      text: 지역에서 이루어지는 민주주의 사례를 통해 주민 자치와 주민 참여의 중요성을 파악하고, 지역사회의 문제 해결에 참여하는 태도를 기른다.
stages:
  - 민주주의
  - 주민자치
  - 주민참여
