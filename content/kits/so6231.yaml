id: so6231
title: 3-1. 세계의 인구 분포와 여러 국가의 인구 특징
grade: 6
sem: 2학기
subject: 사회
unit: 3. 지구촌 사람들
unit_no: 3
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 세계의 인구 분포는 자연적⋅사회적 요인의 상호 작용에 의해 형성되며, 국가마다 다양한 인구 구조와 특성이 나타난다.
  core_question: 세계 인구 분포와 구조는 어떤 요인의 상호 작용하는가?
  concepts:
    - term: 공간과 장소
      def: 사람들이 살아가고 활동하며 의미를 만들어 가는 지표면의 일정한 범위예요.
    - term: 인구
      def: 일정한 지역에 살고 있는 사람의 수 또는 그 사람들의 집단이에요.
    - term: 분포
      def: 사람이나 사물이 여러 장소에 퍼져 있는 상태예요.
  standards:
    - code: "[6사12-01]"
      text: 세계의 인구 분포를 파악하고 여러 국가의 인구 특징을 탐구한다.
stages:
  - name: 생각열기
    question: 세계 인구는 얼마나 될까?
  - name: 탐구하기1
    question: 세계의 인구는 어떻게 분포되어 있을까?
  - name: 탐구하기2
    question: 지역의 특성은 인구 분포에 어떤 영향을 미칠까?
  - name: 확장하기
    question: 미래의 인구는 어떻게 변할까?
