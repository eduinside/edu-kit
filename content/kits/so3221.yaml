id: so3221
title: 2-1. 옛날과 오늘날의 달라진 풍습
grade: 3
sem: 2학기
subject: 사회
unit: 2단원
unit_no: 2
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 옛날의 풍습을 놀이와 세시 풍속으로 나누어 살펴보며 옛날 사람들의 생활과 생각을 이해하고, 옛날과 오늘날의 풍습을 비교해 그 변화상을 파악할 수 있도록 구성된 단원입니다.
  core_question: 옛날과 오늘날을 비교하면 사람들의 생활 모습은 어떻게 달라졌으며, 그렇게 변화한 까닭은 무엇일까?
  concepts:
    - term: 세시풍속
      def: 설날, 추석, 정월대보름처럼 해마다 일정한 때가 되면 되풀이하는 우리 조상들의 풍습이에요. 떡국 먹기, 송편 빚기, 강강술래 같은 행사가 여기에 속해요.
    - term: 세시풍속의 변화
      def: 옛날부터 이어 온 세시풍속이 오늘날에 와서 모습이 달라진 것을 말해요. 오늘날에는 사라진 풍속도 있고, 명절을 보내는 방법이 옛날과 달라지기도 했어요.
    - term: 놀이
      def: 윷놀이, 쥐불놀이, 고싸움놀이처럼 사람들이 함께 즐기던 활동이에요. 옛날에는 명절이나 특별한 날에 마을 사람들이 모여 민속놀이를 즐겼어요.
  standards:
    - code: "[4사04-01]"
      text: 옛날 풍습에 대해 알아보고, 오늘날과 비교하여 변화상을 파악한다.
stages:
  - 세시풍속
  - 세시풍속의 변화
  - 놀이
