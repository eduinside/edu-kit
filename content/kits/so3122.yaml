id: so3122
title: 2-2. 물건과 자료로 살펴보는 과거
grade: 3
sem: 1학기
subject: 사회
unit: 2단원
unit_no: 2
flow: flow
sort_order: 2
published: true
intro:
  core_idea: 주변의 오래된 물건이나 자료 등이 과거의 모습을 보여 주는 증거 역할을 한다는 것을 이해하도록 한다. 학생의 애장품을 비롯해 생활 주변에서 볼 수 있는 오래된 물건이나 자료(신문 기사, 편지, 일기, 노래 가사, 사진 등)을 활용해 과거의 모습을 살펴본다.
  core_question: 오래된 물건과 자료는 과거에 대해 무엇을 알려 주며, 우리 지역의 생활 모습은 시간에 따라 어떻게 달라졌을까?
  concepts:
    - term: 역사 자료
      def: 오래된 물건이나 신문 기사, 편지, 일기, 사진처럼 과거의 모습을 알려 주는 자료예요. 이런 자료는 옛날 사람들의 생활을 보여 주는 증거가 되어요.
    - term: 추론
      def: 남아 있는 물건이나 자료를 보고 과거에 어떤 일이 있었는지 짐작해 보는 것이에요. 예를 들어 옛날 일기를 읽으면 그때의 생활 모습을 알아낼 수 있어요.
  standards:
    - code: "[4사02-02]"
      text: 오래된 물건이나 자료들을 주변에서 찾아보고, 이를 통해 과거의 모습을 살펴볼 수 있음을 이해한다.
stages:
  - 역사 자료
  - 추론
