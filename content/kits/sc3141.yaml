id: sc3141
title: 4. 생물의 한살이
grade: 3
sem: 1학기
subject: 과학
unit: 생물의 한살이
unit_no: 4
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 동물의 한살이를 관찰하고 실험을 통해 식물의 성장 조건을 탐구하며 생물에 따라 한살이의 유형이 다양함을 이해한다.
  core_question: 동물과 식물은 어떤 한살이 과정을 거치며, 생물에 따라 그 모습은 어떻게 다를까?
  concepts:
    - term: 배추흰나비의 한살이
      def: 배추흰나비는 알에서 깨어나 애벌레, 번데기를 거쳐 어른벌레(나비)가 됩니다. 이렇게 모습이 크게 바뀌며 자라는 과정을 한살이라고 합니다.
    - term: 동물의 한살이
      def: 동물이 태어나서 자라 어른이 되고 새끼나 알을 낳는 과정을 동물의 한살이라고 합니다. 동물마다 자라는 모습과 차례가 조금씩 다릅니다.
    - term: 씨의 싹 틔움
      def: 씨가 알맞은 물과 온도, 공기를 만나면 싹이 트고 뿌리와 잎이 나옵니다. 이렇게 씨에서 싹이 나오는 것을 싹 틔움이라고 합니다.
    - term: 식물의 성장
      def: 싹이 튼 식물은 빛과 물, 알맞은 온도가 있어야 잎과 줄기가 점점 커지며 자랍니다. 자라는 데 필요한 조건이 갖춰지면 더 잘 자랍니다.
    - term: 식물의 한살이
      def: 식물은 씨가 싹이 터서 자라 꽃이 피고 열매를 맺으며 다시 씨를 만듭니다. 이렇게 씨에서 씨로 이어지는 과정을 식물의 한살이라고 합니다.
  standards:
    - code: "[4과04-01]"
      text: 동물의 한살이를 직접 관찰하고, 관찰한 내용을 글과 그림으로 표현할 수 있다.
    - code: "[4과04-02]"
      text: 식물이 자라는 데 필요한 조건을 찾는 실험을 설계하여 수행할 수 있다.
    - code: "[4과04-03]"
      text: 생물의 한살이 과정을 조사하여 생물에 따라 한살이의 유형이 다양함을 소개하는 자료를 만들어 공유할 수 있다.
stages:
  - 배추흰나비의 한살이
