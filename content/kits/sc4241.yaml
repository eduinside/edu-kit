id: sc4241
title: 4. 기후 변화와 우리 생활
grade: 4
sem: 2학기
subject: 과학
unit: 기후 변화와 우리 생활
unit_no: 4
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 기후변화 현상의 예, 최근 지구의 기온 변화, 기후변화와 인간 활동의 관련성, 기후변화가 우리 생활과 환경에 미치는 영향, 기후변화 대응 방법을 조사하여 일상생활 속에서 실천할 수 있도록 구성되어 있습니다.
  core_question: 기후변화는 왜 일어나고 우리 생활에 어떤 영향을 주며, 우리는 어떻게 대응해야 할까?
  concepts:
    - term: 기온
      def: 공기의 따뜻하고 차가운 정도를 숫자로 나타낸 것이에요. 보통 온도계로 재며 '도(°C)'로 표시해요.
    - term: 강수량
      def: 일정한 기간 동안 비나 눈이 내려 땅에 쌓인 물의 양이에요. 비와 눈이 얼마나 많이 왔는지를 알려 줘요.
    - term: 기후변화
      def: 오랜 시간에 걸쳐 지구의 기온이나 강수량 같은 날씨의 평균 모습이 달라지는 것이에요. 요즘은 지구가 점점 더워지는 변화가 나타나고 있어요.
    - term: 기후대응
      def: 기후변화로 생기는 문제를 줄이거나 막기 위해 우리가 하는 노력과 행동이에요. 에너지 아끼기처럼 생활 속에서 실천할 수 있어요.
    - term: 생태계보전
      def: 동물, 식물과 그들이 사는 환경을 잘 지키고 보살피는 것이에요. 기후변화로 위험해진 생물과 자연을 보호하는 일이에요.
  standards:
    - code: "[4과16-01]"
      text: 기후변화 현상의 예를 알고, 기후변화가 인간의 활동과 관련되어 있음을 토의할 수 있다.
    - code: "[4과16-02]"
      text: 기후변화의 심각성에 관심을 가지고, 기후변화가 우리 생활과 환경에 미치는 영향을 설명할 수 있다.
    - code: "[4과16-03]"
      text: 기후변화 대응 방법을 조사하고, 생활 속에서 기후변화 대응 방법을 실천할 수 있다.
stages:
  - 기온
  - 기후변화
  - 기후대응
  - 생태계보전
