id: so5111
title: 1-1. 우리나라의 아름다운 지형
grade: 5
sem: 1학기
subject: 사회
unit: 1단원
unit_no: 1
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 우리나라 산지, 하천, 해안 지형의 위치를 지도에서 확인하고, 지형의 분포 특징을 탐구해 국토의 아름다움과 생태환경의 중요성을 이해하도록 합니다.
  core_question: 우리나라 국토의 지형은 어떤 특징을 지니며, 우리는 우리 땅을 왜 소중히 여기고 지켜야 할까?
  concepts:
    - term: 지형
      def: 산, 하천, 평야, 해안처럼 땅의 생긴 모양을 모두 묶어 부르는 말이에요. 우리나라 국토는 여러 가지 지형으로 이루어져 있어요.
    - term: 산지
      def: 산들이 많이 모여 높고 험하게 솟아 있는 땅이에요. 우리나라는 동쪽과 북쪽에 산지가 많아요.
    - term: 하천
      def: 빗물이나 산에서 흘러내린 물이 모여 흐르는 강과 시내를 말해요. 한강처럼 산에서 시작해 바다로 흘러가요.
    - term: 평야
      def: 넓고 평평하게 펼쳐진 땅으로, 주로 하천 주변에 만들어져요. 땅이 평평해서 농사를 짓기에 좋아요.
    - term: 해안
      def: 바다와 땅이 맞닿아 있는 부분을 말해요. 우리나라는 동해안, 서해안, 남해안의 모습이 서로 달라요.
    - term: 갯벌
      def: 바닷물이 빠져나가면 드러나는 넓고 진흙이 많은 땅이에요. 서해안에 넓게 펼쳐져 있고, 여러 생물이 사는 소중한 곳이에요.
    - term: 섬
      def: 바다로 둘러싸여 사방이 물에 막힌 땅이에요. 우리나라에는 제주도처럼 크고 작은 섬이 많이 있어요.
  standards:
    - code: "[6사01-01]"
      text: 우리나라 산지, 하천, 해안 지형의 위치를 확인하고 지형의 분포 특징을 탐구한다.
