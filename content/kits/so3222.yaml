id: so3222
title: 2-2. 교통의 변화와 달라진 생활 모습
grade: 3
sem: 2학기
subject: 사회
unit: 2단원
unit_no: 2
flow: flow
sort_order: 2
published: true
intro:
  core_idea: 옛날과 오늘날의 교통수단을 살펴보고, 교통의 변화에 따라 사람들의 이동과 생활 모습이 어떻게 달라졌는지 알아보도록 구성된 단원입니다.
  core_question: 옛날과 오늘날을 비교하면 사람들의 생활 모습은 어떻게 달라졌으며, 그렇게 변화한 까닭은 무엇일까?
  concepts:
    - term: 교통수단
      def: 사람이나 물건을 한 곳에서 다른 곳으로 옮길 때 이용하는 것을 말해요. 걸어서 가지 않고 자동차, 배, 비행기 같은 것을 타고 이동해요.
    - term: 과거의 교통수단
      def: 옛날 사람들이 이동할 때 이용하던 교통수단이에요. 가마, 지게, 인력거, 소달구지처럼 주로 사람이나 동물의 힘으로 움직였어요.
    - term: 교통수단의 발달
      def: 교통수단이 점점 더 빠르고 편리하게 바뀌어 온 것을 말해요. 사람의 힘으로 가던 것에서 자동차, 기차, 비행기처럼 빠른 것으로 발전했어요.
    - term: 미래의 교통수단
      def: 앞으로 우리가 이용하게 될 새로운 교통수단이에요. 드론이나 하늘을 나는 자동차처럼 더 빠르고 편리한 모습으로 바뀔 거예요.
  standards:
    - code: "[4사04-02]"
      text: 옛날부터 오늘날까지 교통의 변화에 따른 이동과 생활 모습의 변화를 이해한다.
stages:
  - 교통수단
  - 과거의 교통수단
  - 교통수단의 발달
  - 미래의 교통수단
