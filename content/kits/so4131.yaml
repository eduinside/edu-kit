id: so4131
title: 3-1. 경제활동과 합리적 선택
grade: 4
sem: 1학기
subject: 사회
unit: 3단원
unit_no: 3
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 경제활동에서 선택의 문제가 왜 발생하는지 이해하고, 합리적인 선택이 중요한 이유를 배우는 것을 목표로 합니다. 이를 위해 생산과 소비 활동에서 선택이 필요한 이유를 희소성 개념과 연결하여 살펴봅니다. 또한, 일상생활에서 경제활동을 할 때 합리적으로 선택하는 방법을 탐색하며, 실생활에서 적용할 수 있는 능력을 기를 수 있도록 합니다.
  core_question: 자원이 한정된 상황에서 우리는 어떻게 합리적으로 선택하며, 지역들은 왜 서로 교류하고 의존할까?
  concepts:
    - term: 경제활동
      def: 사람들이 살아가는 데 필요한 물건을 만들고, 사고팔고, 쓰는 모든 활동을 말해요. 생산, 소비처럼 우리 생활 곳곳에서 일어나요.
    - term: 자원
      def: 물건을 만들거나 무언가를 하는 데 쓰이는 재료와 힘을 말해요. 돈, 시간, 물, 나무처럼 우리가 가진 것이 모두 자원이에요.
    - term: 희소성
      def: 사람들이 원하는 것은 많은데 그것을 채워 줄 자원은 부족한 상태를 말해요. 그래서 무엇을 가질지 골라야 하는 선택의 문제가 생겨요.
    - term: 경제활동
      def: 원하는 것은 많지만 자원은 한정되어 있어서, 경제활동을 할 때는 무엇을 사거나 만들지 골라야 해요. 그래서 선택이 꼭 필요해요.
    - term: 합리적 선택
      def: 적은 돈과 자원을 들이고도 가장 큰 만족을 얻도록 똑똑하게 고르는 것을 말해요. 가격, 품질, 필요한 정도를 잘 따져서 정해요.
  standards:
    - code: "[4사07-01]"
      text: 자원의 희소성으로 인해 경제활동에서 선택의 문제가 발생함을 이해하고, 경제활동에서 합리적 선택의 방법을 탐색한다.
stages:
  - 경제활동
  - 희소성
  - 합리적 선택
