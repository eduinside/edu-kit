quiz:
  - statement: 쓰던 물건이 필요 없어졌을 때 나누거나 재사용하면 다시 쓸 수 있다.
    answer: O
    explain: 물려주기, 나눔, 바꿔 쓰기를 하면 버리는 물건이 줄어들어요.
  - statement: 한 번 버린 물건은 처리 방법과 관계없이 모두 쓸모없는 쓰레기이다.
    answer: X
    explain: 버린 물건도 어떻게 처리하느냐에 따라 다시 자원이 될 수 있어요.
  - statement: 종류별로 나누어 분리배출을 하면 재활용할 수 있는 물건이 자원으로 다시 쓰인다.
    answer: O
    explain: 분리배출을 잘해야 재활용 공장에서 새로운 물건의 재료로 쓸 수 있어요.
  - statement: 분리배출 기준은 전국 어디서나 똑같아서 우리 지역 안내는 확인하지 않아도 된다.
    answer: X
    explain: 분리배출 기준은 지역마다 조금 다를 수 있어서 우리 지역의 안내를 확인해야 해요.
  - statement: 탄소발자국은 우리가 생활하면서 배출하는 온실가스의 양을 나타내는 말이다.
    answer: O
    explain: 물건을 만들고 쓰고 버리는 과정에서 나오는 온실가스의 양을 이산화탄소의 양으로 나타내요.
  - statement: 환경 문제는 아주 먼 미래의 일이라서 지금 내 생활과는 관계가 없다.
    answer: X
    explain: 환경 문제는 지금 우리 삶에도 영향을 줘요. 그래서 지금부터 실천이 필요해요.
  - statement: 생태 지향적 삶을 위해 내 의식주 습관을 돌아보고 실천할 행동을 정해 꾸준히 해 보는 것이 좋다.
    answer: O
    explain: 실천할 수 있는 행동을 구체적으로 정하고 일주일 동안 이어 가면 습관이 돼요.
  - statement: 환경을 위한 실천은 한 번만 하면 충분하다.
    answer: X
    explain: 작은 실천도 꾸준히 이어 갈 때 효과가 커져요.
