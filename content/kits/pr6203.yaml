id: pr6203
title: 환경 고려 관리·생태 지향 삶
grade: 6
sem: 2학기
subject: 실과
unit: 생활환경과 지속가능한 선택
unit_no: 2
flow: activity
sort_order: 3
published: true
intro:
  core_idea: 물건을 만들고 쓰고 버리는 일은 환경에 영향을 줘요. 생활 자원을 아껴 쓰고 나누고 재사용·재활용하는 관리 방법을 알고, 의식주 생활에서 할 수 있는 행동을 계획해 꾸준히 실천하면 지구를 위한 생태 지향적 삶을 살 수 있어요.
  core_question: 내가 쓰는 물건과 생활 습관이 환경에 어떤 영향을 주고, 환경을 지키기 위해 무엇을 계획해 실천할 수 있을까?
  concepts:
    - term: 분리배출
      def: 쓰레기를 종류별로 나누어 정해진 방법으로 버리는 일이에요. 잘 나누어 버리면 재활용할 수 있어요.
    - term: 재사용
      def: 쓰던 물건을 버리지 않고 그대로 다시 쓰는 것이에요. 물려주거나 나누거나 바꿔 쓰는 것도 재사용이에요.
    - term: 재활용
      def: 쓰고 난 물건을 새로운 물건을 만드는 재료로 다시 쓰는 것이에요. 분리배출을 잘해야 재활용이 잘돼요.
    - term: 탄소발자국
      def: 물건을 만들고 쓰고 버리는 과정에서 나오는 온실가스의 양을 이산화탄소의 양으로 나타낸 거예요. 탄소발자국을 줄이면 지구를 지키는 데 도움이 돼요.
    - term: 생태 지향적 삶
      def: 자연과 환경을 생각하며 먹고 입고 사는 습관을 가꾸어 가는 삶이에요. 내가 할 수 있는 작은 행동을 정해 꾸준히 실천해요.
  standards:
    - code: "[6실02-03]"
      text: 생활자원의 올바른 사용이 가정과 환경에 도움이 됨을 이해하고 재활용, 재사용 등 환경을 고려한 관리 방법을 실천한다.
    - code: "[6실02-11]"
      text: 생태 지향적 삶을 위해 자신의 의식주 생활에서 할 수 있는 구체적인 행동을 계획하여 실천한다.
stages:
  - name: 생각열기
    question: 물건을 만들고 쓰고 버리는 일은 환경에 어떤 영향을 줄까?
  - name: 탐구하기
    question: 환경을 고려해 쓰고 나누고 버리는 방법에는 무엇이 있을까?
  - name: 확장하기
    question: 생태 지향적 삶을 위해 나의 의식주 생활에서 어떤 행동을 계획해 실천할까?
