id: so4132
title: 3-2. 지역 간 교류와 상호 의존
grade: 4
sem: 1학기
subject: 사회
unit: 3단원
unit_no: 3
flow: flow
sort_order: 2
published: true
intro:
  core_idea: 시장에서 사람들의 모습을 통해 생산과 소비의 개념을 이해하는 것을 목표로 합니다. 우리 주변에서 이루어지는 다양한 생산 활동과 소비 활동을 찾아보며, 이 두 활동이 서로 밀접하게 연결되어 있음을 인식하도록 합니다. 또한, 지역 간의 다양한 인적·물적 교류 사례를 살펴보며, 각 지역과 사람들이 서로 의존하며 살아간다는 것을 배우고, 지역 간 교류의 중요성을 깨닫도록 합니다.
  core_question: 자원이 한정된 상황에서 우리는 어떻게 합리적으로 선택하며, 지역들은 왜 서로 교류하고 의존할까?
  concepts:
    - term: 생산
      def: 사람들이 생활에 필요한 물건을 만들거나 도움이 되는 서비스를 제공하는 활동이에요. 농부가 곡식을 기르거나 공장에서 과자를 만드는 일이 모두 생산이에요.
    - term: 소비
      def: 사람들이 생활에 필요한 물건을 사거나 서비스를 이용하는 활동이에요. 시장에서 과일을 사거나 식당에서 음식을 사 먹는 일이 소비예요.
    - term: 교류
      def: 지역과 지역, 사람과 사람이 물건이나 기술, 문화 등을 서로 주고받는 것을 말해요. 한 지역의 생산물이 다른 지역으로 오가는 것이 교류의 한 예예요.
    - term: 상호의존
      def: 서로 도움을 주고받으며 함께 살아가는 것을 말해요. 지역마다 잘 만드는 것이 달라서 서로 필요한 것을 주고받으며 의지해 살아가요.
  standards:
    - code: "[4사07-02]"
      text: 생산과 소비 활동을 파악하고, 인적⋅물적 교류의 사례를 통해 각 지역 및 사람들이 상호의존 관계를 맺고 있음을 탐색한다.
