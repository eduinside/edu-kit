quiz:
  - statement: 공감은 다른 사람의 마음을 헤아리고 함께 느끼려는 마음이다.
    answer: O
    explain: 친구의 처지에서 생각해 보며 그 마음을 함께 느껴 보려는 것이 공감이에요.
  - statement: 같은 일을 겪으면 사람은 모두 같은 감정을 느낀다.
    answer: X
    explain: 같은 일도 사람마다 느끼는 마음이 달라요. 그래서 상대의 마음을 살펴야 해요.
  - statement: 공감은 듣기, 반응하기, 마음 말하기의 순서로 연습해 볼 수 있다.
    answer: O
    explain: 먼저 귀 기울여 듣고, 알맞게 반응하고, 내 마음을 말하면 공감을 전하기 쉬워요.
  - statement: 공감은 슬프거나 화나는 일에만 필요하다.
    answer: X
    explain: 친구의 기쁜 일을 함께 기뻐하는 것도 공감이에요.
  - statement: 친구가 필요로 하는 방법으로 도와야 참된 공감이 된다.
    answer: O
    explain: 내 방식이 아니라 친구가 바라는 도움을 살펴야 마음이 잘 전해져요.
  - statement: 내가 좋아하는 방식으로 도와주기만 하면 언제나 상대에게 공감한 것이다.
    answer: X
    explain: 상대가 어떤 도움을 바라는지 먼저 살펴야 해요.
  - statement: 친구의 말을 끝까지 귀 기울여 듣는 것은 공감하는 방법 중 하나이다.
    answer: O
    explain: 끝까지 들어 주면 친구는 자기 마음을 이해받는다고 느껴요.
  - statement: 친구가 잘못된 행동을 해도 그대로 따라 하며 모두 공감해 주어야 한다.
    answer: X
    explain: 잘못된 행동까지 따라 하는 것은 공감이 아니에요. 마음은 헤아리되 바른 길을 함께 찾아요.
