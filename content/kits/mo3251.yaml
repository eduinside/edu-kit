id: mo3251
title: 5. 너와 나의 공감
grade: 3
sem: 2학기
subject: 도덕
unit: 5단원
unit_no: 5
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 공감은 다른 사람의 마음을 헤아리고 함께 느끼려는 마음이에요. 듣기, 반응하기, 마음 말하기로 친구에게 공감을 전할 수 있지만, 사람마다 필요한 방법이 다르니 상대의 마음을 먼저 살펴야 해요.
  core_question: 친구의 마음에 공감하려면 어떻게 듣고 말하고 행동해야 할까?
  concepts:
    - term: 공감
      def: 다른 사람의 처지와 마음을 헤아리고, 그 사람이 느끼는 것을 함께 느껴 보려는 마음이에요.
    - term: 감정
      def: 기쁨, 슬픔, 화남, 두려움처럼 어떤 일을 겪을 때 마음속에서 느끼는 기분이에요.
    - term: 경청
      def: 다른 사람의 말을 끝까지 귀 기울여 주의 깊게 듣는 것이에요.
    - term: 위로
      def: 슬프거나 힘든 사람의 마음을 따뜻한 말과 행동으로 달래 주는 것이에요.
    - term: 배려
      def: 다른 사람의 처지와 마음을 헤아려 도움이 되도록 마음을 쓰는 것이에요. 상대가 어떤 도움을 바라는지 살펴보는 것에서 시작해요.
  standards:
    - code: "[4도02-03]"
      text: 공감의 태도가 필요한 이유를 이해하고 도덕적 상상력을 바탕으로 대상과 상황에 따라 감정을 나누는 방법을 탐구하여 실천한다.
stages:
  - name: 생각열기
    question: 공감이란 무엇이고 왜 필요할까?
  - name: 탐구하기
    question: 친구의 마음을 어떻게 알아차리고 공감하는 말과 행동을 할까?
  - name: 확장하기
    question: 공감하며 서로 마음을 나누려면 어떤 태도가 필요할까?
