id: so6232
title: 3-2. 지구촌의 문제와 해결
grade: 6
sem: 2학기
subject: 사회
unit: 3. 지구촌 사람들
unit_no: 3
flow: activity
sort_order: 2
published: true
intro:
  core_idea: 지구촌의 지속가능한 미래는 공동의 문제 인식과 협력을 통해 이루어진다.
  core_question: 지구촌을 위협하는 문제를 어떻게 해결할까?
  concepts:
    - term: 상호 작용
      def: 둘 이상의 대상이 서로 영향을 주고받는 관계이다.
    - term: 공동체
      def: 공통의 생활 터전이나 목적을 바탕으로 서로 관계를 맺고 살아가는 집단이다.
    - term: 협력
      def: 공동의 목표를 이루기 위해 힘과 지혜를 모아 함께 행동하는 것이다.
    - term: 평화
      def: 전쟁이나 폭력이 없고 서로의 권리와 안전이 존중되는 상태이다.
  standards:
    - code: "[6사12-02]"
      text: 지구촌을 위협하는 다양한 문제들을 파악하고, 지속가능한 미래를 위한 해결 방안을 탐색한다.
stages:
  - name: 생각열기
    question: 지구촌 사람들은 어떻게 살아가고 있을까?
  - name: 탐구하기1
    question: 기후변화로 인한 문제는 무엇일까?
  - name: 탐구하기2
    question: 지구촌 문제를 해결하기 위해 어떤 노력이 이루어지고 있을까?
  - name: 확장하기
    question: 인류는 지구의 환경에 어떤 영향을 미치고 있을까?
