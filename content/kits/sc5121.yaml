id: sc5121
title: 2. 빛의 성질
grade: 5
sem: 1학기
subject: 과학
unit: 빛의 성질
unit_no: 2
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 우리가 물체를 볼 수 있는 이유와 관련하여 빛의 다양한 성질에 대해 알아보는 단원입니다. 빛의 직진, 반사, 굴절 현상을 관찰하고, 이러한 빛의 성질을 이용한 거울과 렌즈의 쓰임새를 조사하며, 이를 활용한 장치를 창의적으로 설계하고 만들어보는 활동을 통해 빛에 대한 흥미와 이해를 높입니다.
  core_question: 빛은 어떤 성질로 나아가며, 우리는 그 성질을 거울과 렌즈에 어떻게 이용할까?
  concepts:
    - term: 빛
      def: 스스로 빛을 내는 물체나 태양에서 나와 우리 눈에 들어와 물체를 볼 수 있게 해 주는 것입니다. 물체에서 반사된 빛이 눈에 들어와야 우리는 그 물체를 볼 수 있습니다.
    - term: 빛의 굴절
      def: 빛이 공기에서 물이나 유리처럼 다른 물질로 비스듬히 들어갈 때, 두 물질의 경계에서 나아가던 방향이 꺾이는 현상입니다. 물속의 물체가 실제와 다른 위치에 있는 것처럼 보이는 것도 빛의 굴절 때문입니다.
    - term: 빛의 반사
      def: 곧게 나아가던 빛이 거울이나 물체에 부딪혀 방향을 바꾸어 되돌아 나오는 현상입니다. 거울에 내 모습이 보이는 것은 빛이 반사되기 때문입니다.
    - term: 빛의 직진
      def: 빛이 곧고 똑바른 방향으로 나아가는 성질입니다. 빛이 직진하기 때문에 물체 뒤에 그림자가 생깁니다.
    - term: 볼록 렌즈
      def: 가운데 부분이 가장자리보다 두꺼운 렌즈로, 통과하는 빛을 굴절시켜 한곳으로 모읍니다. 작은 물체를 크게 보이게 하여 돋보기나 현미경 등에 쓰입니다.
  standards:
    - code: "[6과02-01]"
      text: 물체를 보기 위해서 빛이 있어야 함을 알고, 빛의 성질에 대해 흥미를 느낄 수 있다.
    - code: "[6과02-02]"
      text: 빛이 나아가는 현상을 관찰하여 빛이 직진, 반사, 굴절하는 성질이 있음을 말할 수 있다.
    - code: "[6과02-03]"
      text: 거울과 렌즈의 쓰임새를 조사하고 거울이나 렌즈를 이용한 장치를 창의적으로 만들 수 있다.
stages:
  - 빛
  - 빛의 반사
  - 빛의 굴절
  - 볼록 렌즈
  - 빛의 성질
