quiz:
  - statement: 마을에는 학교, 가게, 병원 같은 여러 곳이 있어요.
    answer: O
    explain: 마을에는 사람들이 쓰는 여러 곳이 있어요.
  - statement: 우체국은 편지와 소포를 전해 줘요.
    answer: O
    explain: 집배원이 편지와 소포를 집까지 가져다줘요.
  - statement: 소방서는 불이 났을 때 도와줘요.
    answer: O
    explain: 소방관이 불을 끄고 사람을 구해 줘요.
  - statement: 마을 사람들은 서로 도우며 살아요.
    answer: O
    explain: 서로 도우면 마을이 더 좋아져요.
  - statement: 마을은 나와 아무 상관이 없어요.
    answer: X
    explain: 마을은 나도 함께 사는 곳이에요.
  - statement: 길을 건널 때는 신호를 보지 않아도 돼요.
    answer: X
    explain: 신호를 보고 좌우를 살펴요.
