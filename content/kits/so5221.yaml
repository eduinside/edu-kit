id: so5221
title: 2-1. 조선 시대의 유교 문화
grade: 5
sem: 2학기
subject: 사회
unit: 2. 달라지는 시대, 변화하는 생활 모습
unit_no: 2
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 각 시대의 생활 모습은 사회 체제의 특징과 그것이 가져온 사회⋅문화적 변화를 반영한다.
  core_question: 유교 문화는 사람들이 살아가던 공간과 일상생활의 모습을 어떻게 변화시켰을까?
  concepts:
    - term: 공간과 장소
      def: 사람들이 살아가고 활동하며 의미를 만들어 가는 지표면의 일정한 범위이다.
    - term: 변화
      def: 시간이 흐르면서 모습이나 성질, 생활 방식 등이 달라지는 것이다.
    - term: 체제
      def: 사회가 일정한 원리와 질서에 따라 운영되는 전체적인 구조이다.
    - term: 생활 모습
      def: 사람들이 먹고 입고 사는 방법과 일하고 어울리는 방식 등 일상생활에서 드러나는 모습이다.
    - term: 유교 문화
      def: 유교의 가르침과 예절이 정치, 가족생활, 교육 등에 영향을 준 문화이다.
    - term: 조선 시대
      def: 조선이 세워진 1392년부터 대한 제국이 선포된 1897년까지 이어진 시대이다.
  standards:
    - code: "[6사05-01]"
      text: 조선 시대 사람들의 생각과 생활에 유교 문화가 미친 영향을 파악한다.
stages:
  - name: 생각열기
    question: 어떤 의식이 시간이 지나도 보존되거나 이어지는 이유는 무엇일까?
  - name: 탐구하기1
    question: 조선은 어떻게 성립하고 발전해 왔을까?
  - name: 탐구하기2
    question: 유교 문화로 인해 조선 사람들의 생활모습은 어떻게 변화했을까?
  - name: 확장하기
    question: 시대에 따라 가치관은 왜 바뀔까?
