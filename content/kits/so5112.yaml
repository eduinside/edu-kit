id: so5112
title: 1-2. 우리 땅 독도
grade: 5
sem: 1학기
subject: 사회
unit: 1단원
unit_no: 1
flow: flow
sort_order: 2
published: true
intro:
  core_idea: 독도의 지리적 특성을 파악하고 독도에 대한 주요 역사 기록을 분석 및 해석하여 독도가 우리나라 영토임을 확인하고 영토 주권 의식을 기르도록 합니다.
  core_question: 우리나라 국토의 지형은 어떤 특징을 지니며, 우리는 우리 땅을 왜 소중히 여기고 지켜야 할까?
  concepts:
    - term: 독도
      def: 우리나라 동쪽 끝에 있는 작은 섬으로, 옛날부터 우리나라 영토인 우리 땅이에요.
    - term: 독도의 자연환경
      def: 독도는 바닷속 화산이 굳어서 생긴 화산섬이에요. 가파른 바위섬이지만 철새가 쉬어 가고 여러 식물과 바다 생물이 사는 자연의 보금자리예요.
    - term: 독도의 가치
      def: 독도 둘레의 바다에는 다양한 물고기와 해저자원이 있고, 천연보호구역으로 지정될 만큼 자연이 소중해서 우리에게 큰 가치가 있어요.
    - term: 독도의 역사
      def: 안용복, 독도의용수비대처럼 옛날부터 독도를 지킨 사람들과 여러 역사 기록을 통해 독도가 우리나라 땅임을 알 수 있어요.
  standards:
    - code: "[6사01-02]"
      text: 독도의 지리적 특성과 독도에 대한 역사 기록을 바탕으로 영토로서 독도의 중요성을 이해한다.
stages:
  - 독도
  - 독도의 가치
  - 독도의 자연환경
  - 독도의 역사
