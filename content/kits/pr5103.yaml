id: pr5103
title: 옷 입기·옷 수선
grade: 5
sem: 1학기
subject: 실과
unit: 인간 발달과 주도적 삶
unit_no: 1
flow: flow
sort_order: 3
published: true
intro:
  core_idea: 옷은 몸을 지키고 나를 드러내는 일을 해서, 때와 장소와 상황에 맞게 건강하고 안전하게 입어야 해요. 옷을 잘 관리하고 손바느질로 고쳐 입으면 오래 입을 수 있고 환경에도 도움이 돼요.
  core_question: 때와 장소에 맞는 건강한 옷차림을 고르고, 옷을 스스로 관리하고 고쳐 입으려면 어떻게 해야 할까?
  concepts:
    - term: 옷의 기능
      def: 옷이 하는 일이에요. 추위와 더위, 다치는 것에서 몸을 지키고, 나를 드러내고 예의를 갖추는 일도 해요.
    - term: 옷차림
      def: 때와 장소와 상황에 맞게 옷을 골라 입은 모습이에요. 자라는 몸, 안전, 위생, 예절을 함께 따져 봐요.
    - term: 옷 관리
      def: 입은 옷을 깨끗이 하고 종류와 계절별로 개거나 걸어서 정리해 두는 일이에요. 옷 관리를 잘하면 옷을 오래 입을 수 있어요.
    - term: 손바느질
      def: 바늘과 실로 직접 꿰매는 방법이에요. 매듭을 짓고 홈질, 박음질 같은 바느질로 옷을 만들거나 고쳐요.
    - term: 수선
      def: 해지거나 뜯어지거나 단추가 떨어진 옷을 고치는 일이에요. 바느질뿐 아니라 수선 테이프나 와펜을 붙이는 방법도 있어요.
  standards:
    - code: "[6실01-05]"
      text: 옷의 기능을 이해하여 평소 자신의 옷차림을 살펴보고 건강하고 적절한 옷 입기를 실천한다.
    - code: "[6실02-09]"
      text: 간단한 옷의 수선 등 의생활과 관련된 문제를 스스로 해결하려는 태도를 가진다.
