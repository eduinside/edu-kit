quiz:
  - statement: 옷은 추위와 더위, 다칠 위험에서 몸을 지켜 주는 기능이 있다.
    answer: O
    explain: 옷은 몸을 지키는 일과 나를 드러내는 일을 해요.
  - statement: 유행하는 옷이면 때와 장소에 상관없이 알맞은 옷차림이다.
    answer: X
    explain: 때와 장소와 상황을 함께 따져 활동하기 편하고 안전한 옷을 골라야 해요.
  - statement: 여름에는 땀을 잘 흡수하고 바람이 잘 통하는 옷이, 겨울에는 따뜻하게 지켜 주는 옷이 알맞다.
    answer: O
    explain: 계절에 따라 옷감의 성질도 함께 살펴 고르면 좋아요.
  - statement: 새 옷이면 몸에 잘 맞지 않아도 건강한 옷차림이다.
    answer: X
    explain: 자라는 몸에 맞고 활동하기 편한 옷이 건강한 옷차림이에요.
  - statement: 옷을 종류와 계절별로 나누어 개어 두면 찾기 쉽고 오래 입을 수 있다.
    answer: O
    explain: 옷 관리를 잘하면 옷이 상하는 것을 줄일 수 있어요.
  - statement: 옷이 뜯어지거나 단추가 떨어지면 버리는 것밖에 방법이 없다.
    answer: X
    explain: 바느질이나 수선 테이프 같은 방법으로 고쳐 입을 수 있어요.
  - statement: 바늘과 시침핀은 쓰기 전과 뒤에 개수를 확인한다.
    answer: O
    explain: 찔리거나 잃어버리는 일이 없도록 개수를 세어 두어야 해요.
  - statement: 바느질을 시작할 때와 끝낼 때는 매듭을 짓지 않아도 된다.
    answer: X
    explain: 매듭을 지어야 실이 빠지지 않고 튼튼하게 꿰맬 수 있어요.
