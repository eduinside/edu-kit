quiz:
  - statement: 인권은 나이와 상관없이 사람이라면 누구나 가지는 소중한 권리이다.
    answer: O
    explain: 인권은 나이, 성별, 피부색에 상관없이 모든 사람이 똑같이 가지는 소중한 권리예요.
  - statement: 어린이는 아직 어리기 때문에 어른이 가지는 인권을 가지지 못한다.
    answer: X
    explain: 어린이도 어른과 똑같은 사람이라서 인권이 있어요. 게다가 어린이는 특별히 보호받을 권리도 가져요.
  - statement: 유엔 아동권리협약은 어린이의 권리를 지키기 위해 만들어졌다.
    answer: O
    explain: 유엔 아동권리협약은 어린이가 건강하게 자라고 보호받을 수 있도록 어린이의 권리를 정해 둔 약속이에요.
  - statement: 내 인권을 지키는 일이 중요하니 다른 사람의 인권은 생각하지 않아도 된다.
    answer: X
    explain: 내 인권만큼 다른 사람의 인권도 소중해서, 서로의 권리를 함께 지켜야 해요.
  - statement: 나와 다른 점을 '틀렸다'고 말하는 것은 상대를 존중하지 않는 말이 될 수 있다.
    answer: O
    explain: 다른 것은 틀린 것이 아니라 서로 다르다는 뜻이에요. '틀렸다'고 말하면 상대의 마음을 다치게 할 수 있어요.
  - statement: 성별이나 나이, 장애 때문에 정당한 까닭 없이 사람을 다르게 대하는 것을 차별이라고 한다.
    answer: O
    explain: 정당한 까닭 없이 사람을 다르게 대하고 불리하게 하는 것이 차별이에요.
  - statement: 배리어 프리는 몸이 불편한 사람이 쓰는 특별한 물건을 말한다.
    answer: X
    explain: 배리어 프리는 물건이 아니라, 계단 같은 장벽을 없애서 누구나 불편 없이 지내게 하는 것을 말해요.
  - statement: 휠체어를 탄 사람의 입장을 체험해 보면 그 사람의 불편함을 더 잘 이해할 수 있다.
    answer: O
    explain: 직접 체험하면 불편함을 더 잘 알게 되고, 공감하는 마음도 커져요.
