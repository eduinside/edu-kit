id: mo5251
title: 5. 모두에게 인권을
grade: 5
sem: 2학기
subject: 도덕
unit: 5단원
unit_no: 5
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 인권은 모든 사람이 사람답게 살 수 있도록 지켜져야 하는 소중한 권리이고, 다른 사람의 처지에 공감하며 차별하지 않는 태도가 인권을 지키는 힘이 돼요.
  core_question: 모두의 인권을 지키려면 나는 어떤 말과 행동부터 바꿀 수 있을까?
  concepts:
    - term: 인권
      def: 인권은 사람이라면 누구나 태어날 때부터 똑같이 가지는 소중한 권리예요. 나이, 성별, 피부색에 상관없이 모든 사람이 마땅히 누려야 해요.
    - term: 아동 권리
      def: 어린이가 건강하게 자라고, 보호받고, 자기 생각을 말하며 놀 수 있도록 정해 둔 어린이의 권리예요. 유엔 아동권리협약에 담겨 있어요.
    - term: 차별
      def: 성별, 나이, 장애, 나라 같은 이유로 어떤 사람을 정당한 까닭 없이 다르게 대하고 불리하게 하는 일이에요.
    - term: 인권 침해
      def: 인권 침해는 누군가의 소중한 권리를 함부로 무시하거나 빼앗는 것을 말해요. 차별을 받거나 부당하게 따돌림을 당하는 일이 여기에 해당해요.
    - term: 공감
      def: 다른 사람의 처지와 마음을 헤아리고, 그 사람이 느끼는 것을 함께 느껴 보려는 마음이에요.
    - term: 배리어 프리
      def: 장애가 있거나 몸이 불편한 사람도 어려움 없이 지낼 수 있도록 계단 같은 장벽을 없애는 것이에요.
  standards:
    - code: "[6도03-01]"
      text: 인권과 관련된 다양한 사례를 살펴보고 인권에 관한 감수성을 길러 이를 실천하려는 의지를 함양한다.
stages:
  - name: 생각열기
    question: 인권은 왜 소중하고, 어떻게 넓어져 왔을까?
  - name: 탐구하기
    question: 어린이의 인권은 어떻게 지켜져야 하고, 우리 둘레의 인권 침해는 무엇일까?
  - name: 확장하기
    question: 다른 사람의 처지에 공감하며 인권을 존중하는 모습은 어떤 걸까?
