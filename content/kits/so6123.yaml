id: so6123
title: 2-3. 민주주의와 미디어
grade: 6
sem: 1학기
subject: 사회
unit: 2단원
unit_no: 2
flow: flow
sort_order: 3
published: true
intro:
  core_idea: 민주주의 사회에서 미디어가 어떤 기능을 하고, 왜 중요한지 이해하도록 구성된 단원입니다. 다양한 미디어를 분석하면서 정보의 진위 여부를 판단하고, 허위 조작 정보에 속지 않는 비판적인 태도를 기르며, 서로 다른 관점을 존중하며 올바르게 미디어를 활용하는 방법을 탐구합니다.
  core_question: 민주주의는 선거와 국가기관, 미디어를 통해 어떻게 실현되며, 시민은 어떻게 참여해야 할까?
  concepts:
    - term: 미디어
      def: 신문, 텔레비전, 인터넷처럼 사람들에게 소식과 정보를 전해 주는 수단을 말합니다. 우리는 미디어를 통해 세상에서 일어나는 일을 알 수 있습니다.
    - term: 허위조작정보
      def: 사실이 아닌 내용을 일부러 사실인 것처럼 꾸며서 퍼뜨리는 정보입니다. 가짜뉴스가 대표적인 예이며, 사람들을 속일 수 있어 조심해야 합니다.
    - term: 비판적 사고
      def: 주어진 정보를 그냥 믿지 않고, 정말 사실인지 따져 보며 스스로 생각하는 것입니다. 정보의 근거가 무엇인지 살펴보는 태도입니다.
    - term: 비판적 태도
      def: 미디어가 전하는 내용을 무조건 받아들이지 않고, 옳고 그름을 스스로 판단하려는 마음가짐입니다. 이런 태도가 있으면 잘못된 정보에 속지 않을 수 있습니다.
    - term: 저작권
      def: 글, 그림, 음악, 영상처럼 누군가가 만든 창작물을 만든 사람이 가지는 권리입니다. 다른 사람의 창작물을 함부로 가져다 쓰면 안 됩니다.
    - term: 다양한 관점
      def: 하나의 일을 보고도 사람마다 생각이나 입장이 서로 다를 수 있다는 것입니다. 여러 관점을 함께 살펴보면 더 균형 있게 판단할 수 있습니다.
  standards:
    - code: "[6사08-03]"
      text: 민주주의에서 미디어의 의미와 역할을 이해하고, 여러 가지 미디어의 내용을 비판적으로 분석하여 올바르게 이용하는 태도를 기른다.
stages:
