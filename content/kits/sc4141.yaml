id: sc4141
title: 4. 다양한 생물과 우리 생활
grade: 4
sem: 1학기
subject: 과학
unit: 다양한 생물과 우리 생활
unit_no: 4
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 동물과 식물 이외의 다양한 생물을 학습한다. 균류, 원생생물, 세균 등과 같이 주변에서 쉽게 관찰하기 어려운 다양한 생물들이 있음을 알고, 이들이 우리 생활에 영향을 주고 있음을 이해함으로써 학생들이 생명과학에 관심을 갖도록 한다. 이를 위하여 균류, 원생생물, 세균의 모습을 다양한 방법으로 관찰하고 특징과 사는 곳 우리 생활에 미치는 영향을 조사하며, 생물의 특징을 이용한 생명과학에 관심을 가짐으로써 다양한 생물은 생태계의 구성 요소이고, 생태계에서 물질 순환과 에너지 흐름, 생태계 안정과 유지에 기여하고 있음을 이해하도록 한다.
  core_question: 우리 주변의 다양한 생물은 어떤 특징을 지니며, 우리 생활에 어떤 영향을 줄까?
  concepts:
    - term: 균류
      def: 곰팡이나 버섯처럼 스스로 양분을 만들지 못하고 죽은 생물이나 다른 생물에서 양분을 얻는 생물이에요. 보통 따뜻하고 축축한 곳에서 잘 자라요.
    - term: 생명과학
      def: 생물의 특징과 생명 현상을 연구하는 학문이에요. 균류와 세균 같은 생물의 특징을 이용해 우리 생활을 이롭게 하는 데 도움을 줘요.
    - term: 세균
      def: 크기가 매우 작아 맨눈으로는 볼 수 없고 현미경으로만 볼 수 있는 생물이에요. 우리 주변 어디에나 살며 좋은 영향과 나쁜 영향을 모두 줄 수 있어요.
    - term: 원생생물
      def: 동물도 식물도 균류도 아닌 생물로, 해캄이나 짚신벌레처럼 주로 물에 살아요. 대부분 크기가 작아 현미경으로 관찰해요.
  standards:
    - code: "[4과12-01]"
      text: 균류⋅원생생물⋅세균을 관찰하여 특징과 사는 곳을 설명할 수 있다.
    - code: "[4과12-02]"
      text: 균류⋅원생생물⋅세균이 우리 생활에 미치는 영향을 조사하여 발표할 수 있다.
    - code: "[4과12-03]"
      text: 우리 생활에 생명과학이 이용되는 사례를 소개하는 자료를 만들어 공유할 수 있다.
stages:
  - 균류
  - 생명과학
  - 세균
  - 원생생물
