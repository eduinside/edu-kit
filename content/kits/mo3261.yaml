id: mo3261
title: 6. 함께 가는 공정의 길
grade: 3
sem: 2학기
subject: 도덕
unit: 6단원
unit_no: 6
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 공정은 어느 한쪽으로 치우치지 않고 알맞은 기준으로 모두를 대하는 마음이에요. 생활 속에서 공정한지 까닭과 함께 가려 보고, 모두가 받아들일 수 있는 규칙을 만들어 지키며, 작은 실천에서 공정한 사회가 시작돼요.
  core_question: 생활 속에서 무엇이 공정한지 어떻게 가리고, 모두에게 공정한 규칙은 어떻게 만들까?
  concepts:
    - term: 공정
      def: 어느 한쪽으로 치우치지 않고 모든 사람을 똑같은 기준으로 대하는 것이에요. 규칙을 만들고 지킬 때 꼭 필요한 마음가짐이에요.
    - term: 규칙
      def: 여럿이 함께 살아갈 때 서로 지키기로 약속한 것이에요. 규칙이 있으면 다툼을 줄이고 모두가 편하게 지낼 수 있어요.
    - term: 차별
      def: 성별, 나이, 장애, 나라 같은 이유로 어떤 사람을 정당한 까닭 없이 다르게 대하고 불리하게 하는 일이에요.
    - term: 공정무역
      def: 농부와 노동자가 일한 만큼 정당한 값을 받을 수 있도록 공정한 가격으로 사고파는 무역이에요.
    - term: 재판
      def: 다툼이나 잘못을 법원에서 법에 따라 따져 판단하는 일이에요.
  standards:
    - code: "[4도03-01]"
      text: 불공정의 사례를 탐구하고, 일상생활에서 공정의 가치를 추구하는 활동을 통해 실천 의지를 함양한다.
stages:
  - name: 생각열기
    question: 공정이란 무엇이고 왜 필요할까?
  - name: 탐구하기
    question: 생활 속 일이 공정한지 어떻게 가리고 공정한 규칙을 어떻게 만들까?
  - name: 확장하기
    question: 공정한 사회를 위한 제도와 노력에는 무엇이 있을까?
