quiz:
  - statement: 공정은 어느 한쪽으로 치우치지 않고 같은 기준으로 대하는 것이다.
    answer: O
    explain: 공정은 치우침 없이 알맞은 기준으로 모두를 대하는 마음이에요.
  - statement: 모두에게 똑같은 양을 나누어 주면 어떤 경우에도 공정하다.
    answer: X
    explain: 하는 일이나 처지가 다르면 다르게 대하는 것이 공정할 때도 있어요.
  - statement: 공정한 규칙을 만들 때는 힘이 약한 사람의 처지도 헤아려야 한다.
    answer: O
    explain: 약한 사람이 손해를 보지 않는지 살펴야 모두에게 공정한 규칙이 돼요.
  - statement: 내게 유리한 쪽으로 정하는 것이 공정이다.
    answer: X
    explain: 공정하려면 상대의 처지도 함께 헤아려야 해요.
  - statement: 규칙을 만들 때 모두가 동의하고 손해 보는 사람이 없는지 살피면 공정한 규칙에 가까워진다.
    answer: O
    explain: 한정된 기회를 나눌 때는 모두가 받아들일 수 있는 규칙이 필요해요.
  - statement: 다수가 원하면 일부 친구의 기회를 빼앗는 규칙도 공정하다.
    answer: X
    explain: 일부의 기회를 빼앗는 규칙은 다수가 원하더라도 공정하지 않아요.
  - statement: 공정무역은 일한 사람이 정당한 값을 받도록 돕는 무역이다.
    answer: O
    explain: 공정무역 상품을 고르면 생산자가 일한 만큼 값을 받는 데 도움이 돼요.
  - statement: 공정한 사회는 어른이나 나라가 알아서 만드는 것이라 나의 작은 실천과는 상관이 없다.
    answer: X
    explain: 공정한 사회는 우리 생활 속 작은 실천에서부터 시작돼요.
