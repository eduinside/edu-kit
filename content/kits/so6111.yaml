id: so6111
title: 1-1. 분단의 문제점과 평화 통일을 위한 노력
grade: 6
sem: 1학기
subject: 사회
unit: 1단원
unit_no: 1
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 분단으로 인한 문제점을 알아보고, 분단의 아픔을 간직한 장소를 평화의 장소로 만들기 위한 노력을 살핀 뒤, 평화 통일을 위해 학생들이 할 수 있는 일을 찾아 실천하려는 태도를 기릅니다.
  core_question: 광복 이후 우리나라는 민주화와 산업화를 거치며 어떻게 변화했으며, 평화 통일을 위해 우리는 무엇을 할 수 있을까?
  concepts:
    - term: 분단
      def: 하나였던 나라가 둘로 나뉘어 서로 자유롭게 오가지 못하는 상태를 말해요. 우리나라는 6.25 전쟁을 거치며 남과 북으로 갈라졌어요.
    - term: 남북통일
      def: 남한과 북한이 다시 하나의 나라로 합쳐지는 것을 말해요. 헤어진 가족이 다시 만나고 사이좋게 지낼 수 있게 돼요.
    - term: 비무장지대
      def: 남한과 북한 사이에 무기를 두지 않기로 약속한 띠 모양의 지역이에요. 영어 약자로 DMZ라고도 부르며, 사람의 손길이 적어 자연이 잘 보존되어 있어요.
    - term: 평화통일
      def: 전쟁이나 다툼이 아니라 대화와 협력으로 남과 북이 평화롭게 하나가 되는 것을 말해요. 우리가 바라는 통일의 모습이에요.
  standards:
    - code: "[6사07-01]"
      text: 분단으로 나타난 문제점과 분단과 관련된 장소를 평화의 장소로 만들려는 노력 등을 알아보고, 평화 통일을 위해 우리가 할 수 있는 일을 탐색한다.
stages:
  - 분단
  - 남북통일
  - 비무장지대
  - 평화통일
