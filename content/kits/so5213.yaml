id: so5213
title: 1-3. 고려 시대의 사회 모습
grade: 5
sem: 2학기
subject: 사회
unit: 1. 유적과 유물로 살펴본 옛 사람들의 생활
unit_no: 1
flow: activity
sort_order: 3
published: true
intro:
  core_idea: 사람들은 유물, 유적, 기록 등 과거의 모습을 보여주는 자료를 통해 시간에 따른 역사의 변화를 이해한다.
  core_question: 우리는 다양한 역사 자료를 통해 고려 시대 사회의 모습과 사람들의 삶의 변화를 어떻게 추론할 수 있을까?
  concepts:
    - term: 공간과 장소
      def: 사람들이 살아가고 활동하며 의미를 만들어 가는 지표면의 일정한 범위이다.
    - term: 변화
      def: 시간이 흐르면서 모습이나 성질, 생활 방식 등이 달라지는 것이다.
    - term: 역사 자료
      def: 과거의 사실과 생활 모습을 알아보는 데 도움이 되는 기록, 유물, 유적 등의 자료이다.
    - term: 생활 모습
      def: 사람들이 먹고 입고 사는 방법과 일하고 어울리는 방식 등 일상생활에서 드러나는 모습이다.
    - term: 고려 시대
      def: 고려가 건국된 918년부터 조선이 세워진 1392년까지의 시대이다.
  standards:
    - code: "[6사04-03]"
      text: 다양한 역사 자료를 활용하여 고려 시대 사회 모습과 사람들의 생활을 추론한다.
stages:
  - name: 생각열기
    question: 고려를 건국한 왕건은 어떤 인물이었을까?
  - name: 탐구하기1
    question: 고려는 어떻게 성립하고 발전해 왔을까?
  - name: 탐구하기2
    question: 고려 사회의 모습과 사람들의 생활모습은 어떠했을까?
  - name: 확장하기
    question: 고려의 기록유산은 인류의 역사와 삶을 어떻게 변화시켰는가?
