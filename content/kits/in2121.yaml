id: in2121
title: 2. 자연
grade: 2
sem: 1학기
subject: 통합
unit: 2단원
unit_no: 2
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 자연에는 사람, 동물, 식물이 함께 살아요. 서로 영향을 주고받으며 어울려 사는 자연을 아끼고 즐겨요.
  core_question: 자연과 어떻게 어울려 살까?
  concepts:
    - term: 자연
      def: 사람이 만들지 않은 산, 강, 바다, 동물, 식물 같은 모든 것이에요.
    - term: 생태
      def: 생물과 둘레 환경이 서로 영향을 주고받는 모습이에요.
    - term: 어울림
      def: 서로 잘 어울려 지내는 것이에요.
    - term: 텃밭
      def: 채소나 꽃을 키우는 작은 밭이에요.
    - term: 반려동물
      def: 가족처럼 함께 사는 동물이에요.
  standards:
    - code: "[2바01-04]"
      text: 생태환경에서 더불어 살기 위해 노력한다.
    - code: "[2슬01-04]"
      text: 사람과 자연, 동식물이 어우러져 사는 생태를 탐구한다.
    - code: "[2즐01-04]"
      text: 우리를 둘러싼 자연의 아름다움을 감상한다.
  topics:
    - 생태계
    - 동물
    - 식물
    - 자연환경
    - 환경 보호
    - 반려동물
stages:
  - name: 생각열기
    question: 자연에는 무엇이 살고 있을까?
  - name: 탐구하기
    question: 자연과 어떻게 어울려 살까?
  - name: 확장하기
    question: 자연을 어떻게 지키고 느낄까?
