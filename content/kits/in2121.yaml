quiz:
  - statement: 식물은 햇빛과 물이 있어야 잘 자라요.
    answer: O
    explain: 식물에게는 햇빛과 물이 필요해요.
  - statement: 반려동물도 소중한 생명이에요.
    answer: O
    explain: 끝까지 책임지고 돌봐 줘요.
  - statement: 자연의 꽃은 마음대로 꺾어도 괜찮아요.
    answer: X
    explain: 꽃은 그 자리에서 눈으로 감상해요.
  - statement: 숲속은 한여름에도 시원한 편이에요.
    answer: O
    explain: 나무가 그늘을 만들어 줘요.
  - statement: 쓰레기를 자연에 버려도 돼요.
    answer: X
    explain: 쓰레기는 쓰레기통에 버려 자연을 지켜요.
  - statement: 동물과 식물은 서로 영향을 주고받으며 살아요.
    answer: O
    explain: 자연에서는 모두 서로 이어져 있어요.
