quiz:
  - statement: 디지털 기술은 컴퓨터나 스마트폰 같은 기기 그 자체를 말한다.
    answer: X
    explain: 디지털 기술은 기기로 정보를 저장하고 전달하고 가공하는 기술을 말해요.
  - statement: 저작 도구를 쓰면 발표 슬라이드나 영상, 전자책 같은 디지털 자료를 만들 수 있다.
    answer: O
    explain: 저작 도구는 디지털 자료를 만들고 고치는 프로그램이에요.
  - statement: 발표 자료는 한 번 만들면 다시 살펴보고 고칠 필요가 없다.
    answer: X
    explain: 완성한 자료를 다시 검토해 고치면 더 정확하고 보기 좋은 발표 자료가 돼요.
  - statement: 이름, 주소, 전화번호는 개인 정보이므로 함부로 사이버 공간에 올리지 않아야 한다.
    answer: O
    explain: 개인 정보가 드러나면 원하지 않는 곳에 쓰일 수 있어서 조심해야 해요.
  - statement: 인터넷에 있는 사진은 누가 만들었는지 상관없이 마음대로 내 발표 자료에 써도 된다.
    answer: X
    explain: 사진에도 만든 사람의 저작권이 있어서 허락을 받거나 이용 조건을 지켜서 써야 해요.
  - statement: 친구 얼굴이 나온 사진을 올릴 때는 친구의 허락을 받아야 한다.
    answer: O
    explain: 얼굴이 나온 사진은 초상권과 관련되므로 올리기 전에 허락을 받아야 해요.
  - statement: 내가 만든 자료에는 이용 허락 조건을 따로 표시하지 않아도 안전하다.
    answer: X
    explain: 이용 허락 표시를 해 두면 다른 사람이 내 자료를 어디까지 쓸 수 있는지 알 수 있어요.
  - statement: 사이버 공간에 한번 올린 글이나 사진은 쉽게 완전히 지워지지 않을 수 있다.
    answer: O
    explain: 누군가 저장하거나 퍼 나를 수 있어서 올리기 전에 한 번 더 생각해야 해요.
