id: pr5403
title: 디지털 기술·발표 자료·공유
grade: 5
sem: 2학기
subject: 실과
unit: 지속가능한 기술과 융합
unit_no: 4
flow: activity
sort_order: 3
published: true
intro:
  core_idea: 디지털 기술은 정보를 저장하고 전달하고 가공하는 기술로, 옛날과 비교해 우리 생활을 많이 바꾸어 놓았어요. 디지털 도구로 발표 자료를 만들 때는 주제와 장면을 계획하고, 사이버 공간에 공유할 때는 개인 정보와 저작권을 지키는 정보 윤리가 필요해요.
  core_question: 디지털 기술은 우리 생활을 어떻게 바꾸었고, 디지털 도구로 만든 발표 자료를 안전하게 공유하려면 무엇을 지켜야 할까?
  concepts:
    - term: 디지털 기술
      def: 컴퓨터, 스마트폰 같은 기기로 정보를 저장하고 전달하고 가공하는 기술이에요. 기기 자체가 아니라 기기로 정보를 다루는 방법을 말해요.
    - term: 저작 도구
      def: 글, 사진, 소리, 영상 같은 디지털 자료를 만들고 고치는 데 쓰는 프로그램이에요. 발표 슬라이드나 전자책, 영상을 만들 때 써요.
    - term: 개인 정보
      def: 이름, 주소, 전화번호, 얼굴 사진처럼 한 사람을 알아볼 수 있는 정보예요. 함부로 알려 주거나 올리면 안 돼요.
    - term: 저작권
      def: 글, 그림, 음악, 사진 같은 창작물을 만든 사람이 가지는 권리예요. 남이 만든 것을 쓰려면 허락을 받거나 쓰는 조건을 지켜야 해요.
    - term: 이용 허락 표시
      def: 내가 만든 자료를 다른 사람이 어디까지 써도 되는지 조건을 알려 주는 표시예요. 자유이용허락 표시(CCL)가 대표적이에요.
  standards:
    - code: "[6실04-02]"
      text: 생활 속 디지털 기술의 중요성을 이해하고, 디지털 기기와 디지털 콘텐츠 저작 도구를 사용하여 발표 자료를 만들어 보면서 디지털 기기의 활용 능력을 기른다.
    - code: "[6실04-03]"
      text: 제작한 발표 자료를 사이버 공간에 공유하고, 건전한 정보기기의 활용을 실천한다.
stages:
  - name: 생각열기
    question: 옛날과 비교해 디지털 기술은 우리 생활을 어떻게 바꾸었을까?
  - name: 탐구하기
    question: 디지털 도구로 발표 자료를 만들려면 주제와 장면을 어떻게 계획할까?
  - name: 확장하기
    question: 만든 자료를 사이버 공간에 공유할 때는 정보 윤리를 어떻게 지켜야 할까?
