id: so4122
title: 2-2. 우리 지역의 역사
grade: 4
sem: 1학기
subject: 사회
unit: 2단원
unit_no: 2
flow: flow
sort_order: 2
published: true
intro:
  core_idea: 지역에 있는 박물관, 기념관, 유적지를 방문하며 조상들의 생활 모습과 지혜가 담긴 국가유산을 비롯한 지역의 역사를 이해하는 것을 목표로 합니다. 학생들이 직접 온·오프라인으로 박물관, 기념관, 유적지를 탐방하며 지역의 역사에 대한 지식을 습득하고 해석할 수 있도록 합니다. 또한, 지역의 역사를 소중히 여기고 보존하기 위해 실천하는 태도를 기를 수 있도록 합니다.
  core_question: 우리 지역의 국가유산과 역사는 어떤 의미와 가치를 지니며, 우리는 그것을 어떻게 지켜 가야 할까?
  concepts:
    - term: 박물관
      def: 옛날 사람들이 쓰던 물건이나 유물을 모아서 보여 주는 곳이에요. 박물관에 가면 조상들의 생활 모습을 살펴볼 수 있어요.
    - term: 유적지
      def: 옛날 사람들이 살았던 흔적이나 건물 같은 것이 남아 있는 곳이에요. 그 자리에 가면 오래전 우리 지역의 역사를 알 수 있어요.
    - term: 기념관
      def: 중요한 사람이나 사건을 오래 기억하기 위해 세운 곳이에요. 그곳에서 우리 지역에서 일어난 일과 훌륭한 인물을 배울 수 있어요.
    - term: 지역의 역사
      def: 우리가 사는 고장에서 옛날부터 지금까지 일어난 일과 살아온 이야기예요. 박물관, 기념관, 유적지를 통해 알아볼 수 있어요.
  standards:
    - code: "[4사06-02]"
      text: 지역의 박물관, 기념관, 유적지 등을 체험하고 지역의 역사를 이해한다.
stages:
  - 박물관
  - 유적지
  - 기념관
  - 지역의 역사
