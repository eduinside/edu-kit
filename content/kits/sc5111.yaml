id: sc5111
title: 1. 지층과 화석
grade: 5
sem: 1학기
subject: 과학
unit: 지층과 화석
unit_no: 1
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 흙, 모래, 자갈 등이 쌓여 만들어진 지층의 특징과 형성 과정을 알아보고, 지층을 이루는 퇴적암의 종류를 탐구하는 단원입니다. 또한, 화석의 생성 원리를 모형으로 설명하고, 화석을 통해 과거 지구의 환경과 생물을 추리해보며 화석의 가치를 인식하도록 합니다.
  core_question: 지층과 화석은 어떻게 만들어지며, 우리는 그것으로 과거의 지구를 어떻게 알 수 있을까?
  concepts:
    - term: 지층
      def: 자갈, 모래, 진흙 같은 알갱이가 오랜 시간 차곡차곡 쌓여 만들어진 줄무늬 모양의 층입니다. 보통 아래에 있는 층이 위에 있는 층보다 먼저 쌓인 것입니다.
    - term: 퇴적암
      def: 물에 운반된 자갈, 모래, 진흙 같은 알갱이가 쌓이고 단단하게 굳어져 만들어진 암석입니다. 지층은 대부분 이러한 퇴적암으로 이루어져 있습니다.
    - term: 이암
      def: 진흙처럼 매우 작은 알갱이가 굳어져 만들어진 퇴적암입니다. 알갱이가 작아서 만져 보면 부드럽고 매끈한 느낌이 납니다.
    - term: 역암
      def: 자갈처럼 큰 알갱이가 모래, 진흙과 함께 굳어져 만들어진 퇴적암입니다. 알갱이가 커서 울퉁불퉁한 모습이 잘 보입니다.
    - term: 화석
      def: 옛날에 살았던 생물의 몸체나 생활 흔적이 암석이나 지층 속에 남아 있는 것입니다. 화석을 보면 과거에 어떤 생물이 살았고 그곳 환경이 어땠는지 짐작할 수 있습니다.
  standards:
    - code: "[6과01-01]"
      text: 지층의 특징을 알고, 지층의 형성 과정을 모형으로 표현할 수 있다.
    - code: "[6과01-02]"
      text: 지층이 퇴적암으로 이루어짐을 알고, 퇴적암을 알갱이의 크기에 따라 분류할 수 있다.
    - code: "[6과01-03]"
      text: 화석의 생성 과정을 모형으로 설명하고, 지구의 과거 생물과 환경을 추리하는 활동을 통해 화석의 가치를 인식할 수 있다.
