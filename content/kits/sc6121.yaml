id: sc6121
title: 2. 물체의 운동
grade: 6
sem: 1학기
subject: 과학
unit: 물체의 운동
unit_no: 2
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 물체의 운동을 좌표와 평면으로 표현하며 빠르기 비교를 통해 속력의 의미를 이해합니다. 이동 거리와 시간을 측정해 속력을 구하고, 속력과 관련된 안전 수칙을 조사하여 생활 속 적용 능력을 기릅니다.
  core_question: 물체의 운동은 어떻게 나타내며, 속력을 알면 우리는 생활을 어떻게 더 안전하게 할 수 있을까?
  concepts:
    - term: 물체의 운동
      def: 시간이 지남에 따라 물체의 위치가 변하는 것을 물체의 운동이라고 합니다. 물체가 움직인 방향과 위치를 좌표나 그림으로 나타낼 수 있습니다.
    - term: 속력
      def: 물체가 일정한 시간 동안 이동한 거리로 빠르기를 나타낸 값입니다. 이동 거리를 걸린 시간으로 나누어 구하며, 속력이 클수록 더 빠른 것입니다.
    - term: 교통안전
      def: 길에서 차와 사람이 다치지 않도록 안전 수칙을 지키는 것입니다. 횡단보도 건너기, 신호 지키기처럼 생활 속에서 실천해야 합니다.
    - term: 안전장치
      def: 사고가 났을 때 사람이 다치는 것을 줄여 주는 장치입니다. 자동차의 안전벨트와 에어백, 횡단보도 차단기 등이 있습니다.
  standards:
    - code: "[6과10-01]"
      text: 운동하는 물체는 시간에 따라 위치가 변화함을 알고 그 변화를 표현할 수 있다.
    - code: "[6과10-02]"
      text: 물체의 이동 거리와 걸린 시간을 측정하여 속력을 구하고 빠르기를 비교할 수 있다.
    - code: "[6과10-03]"
      text: 속력과 관련된 안전 수칙과 안전장치를 조사한 결과를 공유하고 일상생활에서 교통안전을 실천할 수 있다.
stages:
  - 물체의 운동
  - 속력
  - 교통안전
  - 안전장치
