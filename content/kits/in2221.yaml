unit_no: 2
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 우리 둘레와 옛날에는 고마운 인물이 많아요. 세종대왕처럼 사람들을 위해 일한 인물을 알고 본받으면 함께 사는 마음이 자라요.
  core_question: 인물에게서 무엇을 배워 실천할까?
  concepts:
    - term: 인물
      def: 훌륭한 일을 해서 사람들이 기억하는 사람이에요.
    - term: 세종대왕
      def: 한글을 만들어 백성을 사랑한 조선의 임금이에요.
    - term: 한글
      def: 세종대왕이 만든 우리나라 글자예요.
    - term: 본받기
      def: 다른 사람의 좋은 점을 보고 따라 하는 것이에요.
  standards:
    - code: "[2바03-03]"
      text: 여러 인물의 삶을 통해 공동체성을 기른다.
    - code: "[2슬03-03]"
      text: 관심 있는 대상의 과거와 현재를 살펴보고 미래를 상상한다.
    - code: "[2즐03-03]"
      text: 전통문화를 새롭게 표현한다.
stages:
  - name: 생각열기
    question: 우리 둘레에는 어떤 인물이 있을까?
  - name: 탐구하기
    question: 인물은 무엇을 남겼을까?
  - name: 확장하기
    question: 인물에게서 무엇을 배워 실천할까?
