id: in2221
title: 2. 물건
grade: 2
sem: 2학기
subject: 통합
unit: 2단원
unit_no: 2
flow: activity
sort_order: 1
published: false
intro:
  core_idea: 생활 속 물건은 사람들이 불편함을 해결하려고 만든 것이에요. 쓰던 물건을 바꾸고 새로 만들어 보면 더 편리하고 안전한 물건이 돼요.
  core_question: 불편한 것을 해결하는 물건을 어떻게 만들까?
  concepts:
    - term: 물건
      def: 우리가 쓰려고 만든 것이에요.
    - term: 도구
      def: 일을 쉽게 하려고 쓰는 물건이에요.
    - term: 발명
      def: 새로운 물건이나 방법을 처음 만들어 내는 것이에요.
    - term: 재활용
      def: 쓰고 난 물건을 다시 쓰거나 새 물건으로 만드는 것이에요.
    - term: 아이디어
      def: 새로운 생각이에요.
  standards:
    - code: "[2바04-01]"
      text: 모두를 위한 생활환경을 만드는 데 참여한다.
    - code: "[2슬04-01]"
      text: 생활도구의 모양이나 기능을 탐색하고 바꾸어본다.
    - code: "[2즐04-01]"
      text: 주변의 물건을 활용하여 놀잇감을 만든다.
stages:
  - name: 생각열기
    question: 우리 둘레에는 어떤 물건이 있을까?
  - name: 탐구하기
    question: 물건은 어떻게 쓰고 바꾸어 만들 수 있을까?
  - name: 확장하기
    question: 더 편리하고 안전한 물건은 어떻게 만들까?
