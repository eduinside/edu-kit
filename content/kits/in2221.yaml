quiz:
  - statement: 불편한 것을 해결하려고 발명품이 만들어져요.
    answer: O
    explain: 필요에서 발명이 시작돼요.
  - statement: 호미는 농사에 쓰는 도구예요.
    answer: O
    explain: 호미는 땅을 파고 김을 매는 도구예요.
  - statement: 쓰던 물건은 바꾸어 만들 수 없어요.
    answer: X
    explain: 다른 모양으로 바꾸어 다시 쓸 수 있어요.
  - statement: 전기가 없으면 하루 생활이 불편해져요.
    answer: O
    explain: 전기로 쓰는 물건이 많기 때문이에요.
  - statement: 병뚜껑으로 새 작품을 만들 수 있어요.
    answer: O
    explain: 버리는 물건도 새로운 작품이 돼요.
  - statement: 물건은 무엇이든 한 번 쓰고 버려야 해요.
    answer: X
    explain: 오래 쓰고 다시 쓰면 쓰레기가 줄어요.
