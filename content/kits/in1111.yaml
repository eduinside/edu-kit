id: in1111
title: 1. 학교
grade: 1
sem: 1학기
subject: 통합
unit: 1단원
unit_no: 1
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 학교는 친구와 선생님과 함께 배우고 노는 곳이에요. 학교에서 지킬 약속과 안전한 방법을 알면 즐겁고 건강하게 지낼 수 있어요.
  core_question: 학교에서 안전하고 즐겁게 지내려면 어떻게 해야 할까?
  concepts:
    - term: 학교
      def: 친구와 선생님과 함께 배우고 노는 곳이에요.
    - term: 안전
      def: 다치지 않게 조심하는 것이에요.
    - term: 약속
      def: 서로 지키기로 한 말이에요.
    - term: 친구
      def: 함께 놀고 서로 도와주는 사람이에요.
    - term: 신호등
      def: 길을 건널 때 빨간불과 초록불로 알려 주는 것이에요.
  standards:
    - code: "[2바01-01]"
      text: 학교 생활 습관과 학습 습관을 형성하여 안전하고 건강하게 생활한다.
    - code: "[2슬01-01]"
      text: 학교 안팎의 모습과 생활을 탐색하며 안전한 학교 생활을 한다.
    - code: "[2즐01-01]"
      text: 즐겁게 놀이하며, 건강하고 안전하게 생활한다.
stages:
  - name: 생각열기
    question: 학교는 어떤 곳일까?
  - name: 탐구하기
    question: 학교에서 안전하고 즐겁게 지내려면 어떻게 할까?
  - name: 확장하기
    question: 친구와 함께 지내려면 어떻게 할까?
