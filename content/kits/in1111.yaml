quiz:
  - statement: 학교에서는 친구, 선생님과 함께 배워요.
    answer: O
    explain: 학교는 친구와 선생님과 함께 배우고 노는 곳이에요.
  - statement: 복도와 계단에서는 뛰어다녀도 괜찮아요.
    answer: X
    explain: 복도와 계단에서는 천천히 걸어야 다치지 않아요.
  - statement: 화장실을 쓰고 나면 손을 씻어요.
    answer: O
    explain: 손을 씻으면 깨끗하고 건강해져요.
  - statement: 친구가 말할 때는 귀를 기울여 들어요.
    answer: O
    explain: 끝까지 들으면 친구의 마음을 알 수 있어요.
  - statement: 횡단보도에서는 빨간불일 때 건너가요.
    answer: X
    explain: 초록불일 때 좌우를 살피고 건너요.
  - statement: 급식을 받을 때는 차례를 지켜요.
    answer: O
    explain: 차례를 지키면 서로 편안해요.
  - statement: 교실에서 친구가 싫어하는 말을 해도 돼요.
    answer: X
    explain: 친구가 기분 좋은 고운 말을 써요.
