id: so3111
title: 1-1. 우리 주변의 여러 장소
grade: 3
sem: 1학기
subject: 사회
unit: 1단원
unit_no: 1
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 학생들이 학교, 집, 공원 등 생활이 이루어지는 주변 여러 장소에서 경험하며 느낀 점을 바탕으로 자신의 장소감을 표현하고 공유한다.
  core_question: 우리가 살아가는 장소들은 어떤 의미가 있으며, 더 살기 좋은 곳으로 만들려면 무엇이 필요할까?
  concepts:
    - term: 장소감
      def: 학교, 집, 공원처럼 내가 자주 가는 장소에서 겪은 경험을 통해 느끼게 되는 마음이나 느낌이에요. 같은 장소라도 사람마다 떠오르는 느낌이 다를 수 있어요.
    - term: 존중
      def: 나와 생각이나 느낌이 다른 친구의 마음도 소중하게 여기고 함부로 대하지 않는 태도예요. 같은 장소를 보고 다르게 느껴도 그 마음을 인정해 주는 거예요.
    - term: 이해
      def: 친구가 어떤 장소에서 왜 그렇게 느꼈는지 그 마음을 헤아려 알아주는 것이에요. 서로의 이야기를 잘 들으면 더 잘 이해할 수 있어요.
  standards:
    - code: "[4사01-01]"
      text: 주변 여러 장소에서의 경험과 느낌을 다양한 방식으로 표현하고, 장소감을 나누며 서로 존중하는 태도를 지닌다.
stages:
  - 장소감
  - 존중
