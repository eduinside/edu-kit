id: so3112
title: 1-2. 살기 좋은 우리 지역
grade: 3
sem: 1학기
subject: 사회
unit: 1단원
unit_no: 1
flow: flow
sort_order: 2
published: true
intro:
  core_idea: 사람들이 편리한 생활을 하는 데 도움을 주는 주요 장소 및 시설이나 기관을 살펴본다. 학생들의 관점에서 살기 좋은 곳의 조건을 생각하면서 우리가 사는 곳에 관심을 가지도록 하는 데 중점을 둔다.
  core_question: 우리가 살아가는 장소들은 어떤 의미가 있으며, 더 살기 좋은 곳으로 만들려면 무엇이 필요할까?
  concepts:
    - term: 시설
      def: 사람들이 편리하고 안전하게 생활할 수 있도록 마련해 놓은 장소나 건물, 기구를 말해요. 도서관, 공원, 병원처럼 우리 생활에 도움을 주는 곳이에요.
    - term: 기관
      def: 여러 사람을 위해 정해진 일을 맡아서 하는 곳이에요. 행정복지센터, 소방서, 경찰서, 보건소처럼 우리 지역을 돕는 일을 해요.
    - term: 디지털 영상 지도
      def: 인공위성이나 비행기에서 찍은 사진을 컴퓨터로 모아 만든 지도예요. 화면을 확대하거나 줄이면서 우리 지역의 실제 모습을 자세히 살펴볼 수 있어요.
  standards:
    - code: "[4사01-02]"
      text: 주변의 여러 장소를 살펴보고, 우리가 사는 곳을 더 살기 좋은 곳으로 만드는 방안을 탐색한다.
stages:
  - 시설
  - 기관
  - 디지털 영상 지도
