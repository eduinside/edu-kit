quiz:
  - statement: 자주는 다른 사람에게 기대지 않고 스스로 생각해서 결정하고 행동하는 것이다.
    answer: O
    explain: 자주적인 사람은 스스로 판단해서 정하고 행동해요.
  - statement: 내 마음대로 하거나 고집을 부리는 것도 자주적인 삶이다.
    answer: X
    explain: 자주는 마음대로 하는 것이 아니라, 스스로 판단하고 그 결과에 책임지는 것이에요.
  - statement: 자주적인 사람은 자기가 한 결정에 책임을 진다.
    answer: O
    explain: 결정과 책임은 함께여야 자주적인 삶이 돼요.
  - statement: 친구들이 모두 하는 유행을 따르면 언제나 자주적인 선택이다.
    answer: X
    explain: 스스로 생각해서 고른 것이 아니라 남을 따라가기만 하면 자주적인 선택이 아니에요.
  - statement: 실천 계획은 작은 일부터 짧은 기간으로 세우면 지켜 가기 쉽다.
    answer: O
    explain: 작고 짧은 계획부터 시작하면 꾸준히 실천하기 좋아요.
  - statement: 어른이 시킨 일을 하면 모두 자주적이지 않은 행동이다.
    answer: X
    explain: 시킨 일이라도 까닭을 이해하고 스스로 판단해서 하면 자주적일 수 있어요.
  - statement: 가족이나 친구 가운데에서도 자주적으로 사는 모습을 본받을 사람을 찾을 수 있다.
    answer: O
    explain: 본받을 사람은 위인뿐 아니라 가까운 가족이나 친구에게서도 찾을 수 있어요.
  - statement: 자주적인 삶은 힘들기만 할 뿐 좋은 점은 없다.
    answer: X
    explain: 어려움도 있지만 내 삶을 스스로 이끌어 가는 보람과 성장이 있어요.
