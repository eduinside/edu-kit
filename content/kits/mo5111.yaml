id: mo5111
title: 1. 내 삶의 주인이 되는 나
grade: 5
sem: 1학기
subject: 도덕
unit: 1단원
unit_no: 1
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 자주적인 삶은 내 마음대로 하는 것이 아니라, 스스로 생각해서 결정하고 그 결과에 책임을 지는 삶이에요. 작은 일부터 계획을 세워 실천하며 내 삶의 주인이 될 수 있어요.
  core_question: 나는 내 삶의 주인으로서 오늘 무엇을 스스로 정하고 실천할 수 있을까?
  concepts:
    - term: 자주
      def: 자주는 다른 사람에게 기대지 않고 스스로 생각해서 결정하고 행동하는 것이에요. 마음대로 하는 것과는 달라요.
    - term: 결정
      def: 여러 가지 가운데 무엇을 할지 스스로 생각해서 정하는 것이에요.
    - term: 책임
      def: 내가 한 결정과 행동의 결과를 피하지 않고 받아들이고, 잘못되었으면 바로잡으려고 애쓰는 것이에요.
    - term: 계획
      def: 무엇을, 언제, 어떻게 할지 미리 생각해서 정해 두는 것이에요. 작은 일부터 짧은 기간으로 세우면 지키기 쉬워요.
    - term: 실천
      def: 실천은 알게 된 것을 생각으로만 그치지 않고 직접 행동으로 옮기는 것이에요. 내가 세운 계획을 하루하루 지켜 가는 것도 실천이에요.
  standards:
    - code: "[6도01-01]"
      text: 자주적인 삶에 대한 이해를 바탕으로 자신의 생활계획을 세우고 실천하여 주체적인 삶의 태도를 기른다.
stages:
  - name: 탐구하기
    question: 자주적인 삶은 왜 필요하고, 어떻게 실천할까?
  - name: 확장하기
    question: 자주적으로 산 사람에게서 무엇을 본받을 수 있을까?
