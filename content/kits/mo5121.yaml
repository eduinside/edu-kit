quiz:
  - statement: 반성은 지난 일을 되돌아보고 아쉬웠던 점을 고치려는 마음을 갖는 것이다.
    answer: O
    explain: 반성은 지난 일을 돌아보며 더 나은 모습으로 바꾸려는 마음이에요.
  - statement: 반성은 잘못한 일만 돌아보는 것이다.
    answer: X
    explain: 잘못한 일뿐 아니라 내 생활 전체를 돌아보고 더 나아질 방법을 찾는 것이 반성과 성찰이에요.
  - statement: 성찰은 내 생각과 행동을 깊이 살펴 더 나은 모습으로 바꾸어 가는 일이다.
    answer: O
    explain: 성찰은 나를 깊이 들여다보고 바꿀 점을 찾는 일이에요.
  - statement: 자신을 탓하고 미워하는 것이 바른 반성이다.
    answer: X
    explain: 자신을 탓하기보다 내가 바꿀 점을 찾아 성장으로 이어 가는 것이 바른 반성이에요.
  - statement: 성찰 질문을 만들어 일주일 동안 실천해 보면 나를 점검하는 데 도움이 된다.
    answer: O
    explain: 질문을 정하고 실천 여부를 확인하면 내 생활을 스스로 돌아보기 쉬워요.
  - statement: 반성과 성찰은 남에게 잘 보이려고 하는 일이다.
    answer: X
    explain: 반성과 성찰은 나를 위해 스스로 돌아보고 바꾸어 가는 일이에요.
  - statement: 바꾸고 싶은 모습은 긍정적이고 구체적으로 정하면 실천하기 좋다.
    answer: O
    explain: 하지 말아야 할 일보다 해야 할 일을 구체적으로 정하면 실천하기 쉬워요.
  - statement: 반성은 한 번 하면 끝나므로 실천한 뒤에 다시 점검할 필요가 없다.
    answer: X
    explain: 실천한 뒤에 다시 돌아보며 점검해야 변화가 이어져요.
