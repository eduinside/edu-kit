id: mo5121
title: 2. 반성과 성찰로 성장하는 나
grade: 5
sem: 1학기
subject: 도덕
unit: 2단원
unit_no: 2
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 반성과 성찰은 잘못만 따지는 일이 아니라 내 생활을 돌아보고 더 나은 모습으로 바꾸어 가는 일이에요. 나를 탓하지 않고 성장으로 이어 가는 마음가짐이 중요해요.
  core_question: 나는 내 생활을 어떻게 돌아보고 더 나은 나로 바꾸어 갈 수 있을까?
  concepts:
    - term: 반성
      def: 지나간 일과 내 행동을 되돌아보고, 아쉬웠던 점을 고쳐 가려는 마음을 갖는 것이에요.
    - term: 성찰
      def: 내 생각과 행동, 생활을 깊이 살펴보고 어떻게 더 나아질지 생각하는 것이에요.
    - term: 성장
      def: 몸뿐 아니라 생각과 마음, 행동이 더 나은 모습으로 자라 가는 것이에요.
    - term: 자기 점검
      def: 내가 계획한 대로 하고 있는지, 잘 지켜지고 있는지 스스로 확인해 보는 것이에요.
    - term: 실천
      def: 실천은 알게 된 것을 생각으로만 그치지 않고 직접 행동으로 옮기는 것이에요. 내가 세운 계획을 하루하루 지켜 가는 것도 실천이에요.
  standards:
    - code: "[6도01-02]"
      text: 생활 습관에 대한 성찰을 통해 자기 생활을 점검하고 올바른 계획을 세워 이를 실천한다.
stages:
  - name: 생각열기
    question: 반성은 무엇이고 왜 필요할까?
  - name: 확장하기
    question: 나를 탓하지 않고 성장으로 이어 가려면 어떤 마음이 필요할까?
