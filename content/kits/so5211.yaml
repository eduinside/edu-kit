id: so5211
title: 1-1. 선사 시대와 고조선 사람들의 생활 모습
grade: 5
sem: 2학기
subject: 사회
unit: 1. 유적과 유물로 살펴본 옛 사람들의 생활
unit_no: 1
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 사람들은 유물, 유적, 기록 등 과거의 모습을 보여주는 자료를 통해 시간에 따른 역사의 변화를 이해한다.
  core_question: 우리는 유적·유물을 통해 선사 시대와 고조선의 사는 공간과 생활 모습의 변화를 어떻게 추론할 수 있을까?
  concepts:
    - term: 공간과 장소
    - term: 변화
    - term: 유적과 유물
    - term: 생활 모습
    - term: 선사 시대
    - term: 고조선
  standards:
    - code: "[6사04-01]"
      text: 선사 시대와 고조선의 유적과 유물을 활용하여 당시 사람들의 생활을 추론한다.
stages:
  - name: 생각열기
    question: 옛날 사람들이 바위에 그림을 그린 이유는 무엇일까요?
  - name: 탐구하기1
    question: 구석기, 신석기, 청동기 시대 사람들은 어떻게 생활하였을까?
  - name: 탐구하기2
    question: 고조선 사람들은 어떻게 생활하였을까?
  - name: 확장하기
    question: 과거와 현재의 '살기 좋은 땅'의 공통점과 차이점은 무엇일까?
