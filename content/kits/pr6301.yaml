id: pr6301
title: 발명·지식 재산
grade: 6
sem: 1학기
subject: 실과
unit: 기술적 문제해결과 혁신
unit_no: 3
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 발명은 필요한 물건이나 방법을 새로 만들거나 고쳐서 생활을 편리하게 바꾸는 일이에요. 생활 속 불편을 찾아 발명 기법으로 아이디어를 내어 만들어 보고, 특허 같은 지식 재산권이 발명을 지켜 주는 까닭을 알아 올바르게 활용해요.
  core_question: 생활 속 불편을 해결하는 발명은 어떻게 하고, 내 발명과 남의 발명을 지키려면 무엇을 알아야 할까?
  concepts:
    - term: 발명
      def: 필요한 물건이나 방법을 새로 만들어 내거나 고쳐서 더 쓸모 있게 만드는 일이에요. 이미 있던 것을 찾아내는 발견과는 달라요.
    - term: 적정 기술
      def: 그 지역의 환경과 형편에 맞게 적은 비용으로 쉽게 만들고 쓸 수 있는 기술이에요. 어려운 이웃을 돕는 데도, 환경 문제를 푸는 데도 쓰여요.
    - term: 발명 기법
      def: 새로운 아이디어를 쉽게 떠올리도록 도와주는 생각 방법이에요. 더하기, 빼기, 크기 바꾸기, 모양 바꾸기 같은 것이 있어요.
    - term: 특허
      def: 새롭고 쓸모 있는 발명을 한 사람이 정해진 기간 동안 그 발명을 혼자 쓸 수 있도록 나라가 주는 권리예요. 신청해서 등록해야 얻을 수 있어요.
    - term: 지식 재산권
      def: 사람의 생각과 노력으로 만든 발명, 글, 그림, 음악 같은 결과물에 대해 만든 사람이 가지는 권리예요. 특허권, 상표권, 저작권 같은 것이 있어요.
  standards:
    - code: "[6실03-01]"
      text: 발명의 의미를 이해하고, 일상생활을 바꾼 발명품을 탐색하여 발명과 기술에 대한 중요성과 가치를 인식한다.
    - code: "[6실03-02]"
      text: 발명사고기법과 기술적 문제 해결 과정을 이해하고, 다양한 재료를 활용하여 생활 속 문제를 해결할 수 있는 창의적인 제품을 구상하고 만들어 봄으로써 실천적 태도를 갖는다.
    - code: "[6실03-03]"
      text: 발명과 특허의 관계를 이해하고, 특허 침해 사례를 통하여 지식재산권의 중요성을 인식하여 올바른 방법으로 활용한다.
stages:
  - 발명
  - 적정 기술
  - 발명 기법
  - 특허
  - 지식 재산권
