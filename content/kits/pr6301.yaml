quiz:
  - statement: 발명은 필요한 물건이나 방법을 새로 만들거나 고쳐서 쓰는 일이다.
    answer: O
    explain: 발명은 생활에 필요한 것을 새롭게 만들거나 고치는 일이에요.
  - statement: 땅속에 묻혀 있던 화석을 찾아낸 일은 발명에 속한다.
    answer: X
    explain: 이미 있던 것을 찾아낸 일은 발견이에요. 발명은 새로 만들거나 고치는 일이에요.
  - statement: 적정 기술은 그 지역의 환경과 형편에 맞게 쓸 수 있도록 만든 기술이다.
    answer: O
    explain: 적정 기술은 사는 곳의 사정에 맞춰 적은 비용으로 쉽게 쓸 수 있는 기술이에요.
  - statement: 가난한 지역 사람들만 쓸 수 있는 기술을 적정 기술이라고 한다.
    answer: X
    explain: 적정 기술은 환경 문제를 푸는 대안 기술로도 쓰여요. 어느 지역이든 형편에 맞으면 적정 기술이에요.
  - statement: 더하기와 빼기, 크기 바꾸기는 아이디어를 떠올리는 발명 기법이다.
    answer: O
    explain: 물건에 무엇을 더하거나 빼고 크기를 바꿔 보면 새 아이디어가 나와요.
  - statement: 특허는 발명을 하는 순간 신청하지 않아도 저절로 생긴다.
    answer: X
    explain: 특허권은 신청해서 심사를 거쳐 등록해야 얻을 수 있어요.
  - statement: 특허를 받으면 정해진 기간 동안 다른 사람이 허락 없이 그 발명을 쓰지 못하게 할 수 있다.
    answer: O
    explain: 특허는 발명한 사람의 권리를 지켜 주고 허락 없이 따라 쓰는 침해를 막아 줘요.
  - statement: 지식 재산권은 발명에만 해당하고 글이나 음악 같은 창작물은 해당하지 않는다.
    answer: X
    explain: 저작권처럼 글, 그림, 음악 같은 창작물을 지키는 권리도 지식 재산권에 들어가요.
