id: so6131
title: 3-1. 세계를 표현한 공간 자료
grade: 6
sem: 1학기
subject: 사회
unit: 3단원
unit_no: 3
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 세계 여러 지역을 나타내는 다양한 공간 자료의 특징을 이해하고, 지구본과 세계지도를 활용해 위치를 표현하는 방법을 익히도록 구성된 단원입니다. 위도와 경도, 디지털 영상 자료를 활용해 세계를 정확하고 체계적으로 살펴보는 기초적인 공간 감각을 기릅니다.
  core_question: 지구본과 세계지도 같은 공간 자료를 이용해 세계의 대륙과 대양, 여러 나라의 위치를 어떻게 파악할 수 있을까?
  concepts:
    - term: 세계
      def: 지구 위에 있는 여러 대륙과 대양, 수많은 나라를 모두 아우르는 넓은 공간을 말합니다. 우리가 사는 곳을 넘어 지구 전체를 살펴보는 대상이에요.
    - term: 지도
      def: 땅의 모습을 위에서 내려다본 것처럼 작게 줄여서 평평한 종이나 화면에 나타낸 그림입니다. 약속된 기호와 색으로 위치와 길, 산과 강 등을 보여 줍니다.
    - term: 세계지도
      def: 둥근 지구 전체를 한눈에 볼 수 있도록 평면에 펼쳐 나타낸 지도입니다. 여러 대륙과 대양, 나라들의 위치를 한 화면에서 비교할 수 있어요.
    - term: 위치
      def: 어떤 장소가 지구 위에서 어디에 자리하는지를 나타내는 것입니다. 위도와 경도를 이용하면 위치를 정확하게 말할 수 있어요.
    - term: 디지털 공간 영상정보
      def: 인공위성이나 항공기로 찍은 사진을 컴퓨터와 스마트폰에서 볼 수 있게 만든 공간 자료입니다. 지도를 확대하거나 실제 모습을 영상으로 살펴볼 수 있어요.
    - term: 공간자료
      def: 지구본, 세계지도, 디지털 영상정보처럼 세계 여러 지역의 위치와 모습을 나타내는 다양한 자료를 가리킵니다. 자료마다 특징이 달라 쓰임새도 서로 달라요.
  standards:
    - code: "[6사09-01]"
      text: 세계를 표현하는 다양한 공간 자료의 특징을 이해하고, 지구본과 세계지도에서 위치를 표현하는 방법을 익힌다.
stages:
  - 세계
  - 지도
  - 세계지도
  - 위치
  - 디지털 공간 영상정보
  - 공간자료
