id: pr6401
title: 로봇
grade: 6
sem: 2학기
subject: 실과
unit: 지속가능한 기술과 융합
unit_no: 4
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 로봇은 센서로 주변을 알아차리고, 제어 장치가 판단하고, 구동 장치로 움직여 일을 하는 기계예요. 로봇의 종류와 쓰임을 살펴보고 인공지능 같은 다른 기술이 합쳐진 융합 기술의 가치를 알아봐요.
  core_question: 로봇은 어떤 장치로 이루어져 어떻게 일하고, 다른 기술과 합쳐지면 무엇이 달라질까?
  concepts:
    - term: 로봇
      def: 사람을 대신하거나 도와서 일하도록 만든 기계예요. 센서로 주변을 알아차리고 판단해서 움직이면 사람처럼 생기지 않아도 로봇이에요.
    - term: 센서
      def: 빛, 소리, 거리, 온도 같은 주변 정보를 알아내서 로봇에 알려 주는 장치예요. 사람의 눈이나 귀 같은 감각 기관과 비슷해요.
    - term: 제어 장치
      def: 센서가 알려 준 정보를 받아 판단하고 로봇이 어떻게 움직일지 명령을 내리는 장치예요. 사람의 두뇌와 비슷해요.
    - term: 구동 장치
      def: 로봇을 움직이게 하는 장치예요. 제어 장치의 명령에 따라 바퀴나 팔다리를 움직이는 모터 같은 것이 여기에 들어가고, 사람의 근육과 비슷해요.
    - term: 융합 기술
      def: 서로 다른 기술을 하나로 합쳐서 더 큰 가치를 만드는 기술이에요. 로봇에 인공지능과 정보 통신 기술을 더하는 것이 그 예예요.
  standards:
    - code: "[6실04-04]"
      text: 로봇의 개념과 구조를 이해하고, 생활 속 로봇 기능을 체험하여 로봇의 중요성을 인식한다.
    - code: "[6실04-05]"
      text: 로봇의 종류와 활용 사례를 통해 작동 원리를 이해하고, 로봇에 대한 관심과 흥미를 가진다.
    - code: "[6실04-06]"
      text: 로봇의 융합 기술을 이해하고, 간단한 로봇을 만들어 코딩과 프로그램을 적용하여 동작시키는 체험을 통해 융합 기술의 가치를 인식하다.
stages:
  - 로봇
  - 센서
  - 제어 장치
  - 구동 장치
  - 융합 기술
