quiz:
  - statement: 로봇은 센서가 알아낸 정보를 제어 장치가 판단하고 구동 장치가 움직이는 순서로 일한다.
    answer: O
    explain: 로봇은 감지하고 판단하고 움직이는 세 단계로 일해요.
  - statement: 사람처럼 생긴 기계만 로봇이라고 부른다.
    answer: X
    explain: 청소기나 배달차처럼 생겨도 감지하고 판단하고 움직이면 로봇이에요.
  - statement: 센서는 로봇이 주변의 빛이나 소리, 거리를 알아내는 눈과 귀 같은 장치다.
    answer: O
    explain: 센서는 주변 정보를 알아내서 제어 장치에 전해 줘요.
  - statement: 구동 장치는 로봇에서 사람의 두뇌처럼 판단을 맡는 장치다.
    answer: X
    explain: 판단은 제어 장치가 맡고, 구동 장치는 근육처럼 로봇을 움직이게 해요.
  - statement: 로봇 청소기는 센서로 장애물을 알아채고 방향을 바꾸며 청소한다.
    answer: O
    explain: 센서가 장애물을 알려 주면 제어 장치가 판단해 바퀴를 움직여 피해 가요.
  - statement: 로봇은 튼튼한 몸체만 만들면 프로그램 없이도 목적에 맞게 일할 수 있다.
    answer: X
    explain: 어떻게 움직일지 정해 주는 프로그램이 있어야 목적에 맞게 일할 수 있어요.
  - statement: 로봇에 인공지능을 더해 쓰는 것은 융합 기술의 한 예이다.
    answer: O
    explain: 원래 따로 있던 기술을 합치면 로봇이 더 많은 일을 할 수 있어요.
  - statement: 융합 기술은 이전에 없던 기술을 처음부터 따로 새로 만든 것이다.
    answer: X
    explain: 융합 기술은 이미 있던 여러 기술을 합쳐 더 큰 가치를 만드는 기술이에요.
