id: in1231
title: 3. 이야기
grade: 1
sem: 2학기
subject: 통합
unit: 3단원
unit_no: 3
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 이야기는 소원과 마음을 나누게 해 줘요. 이야기를 듣고 만들고 공연하면 서로의 생각을 더 잘 알 수 있어요.
  core_question: 이야기로 우리 마음을 어떻게 나눌까?
  concepts:
    - term: 이야기
      def: 사람이나 동물이 겪은 일을 말이나 글로 들려주는 것이에요.
    - term: 소원
      def: 이루고 싶은 바람이에요.
    - term: 전래동화
      def: 옛날부터 전해 내려오는 이야기예요.
    - term: 인형극
      def: 인형이 나와서 이야기를 보여 주는 공연이에요.
    - term: 공연
      def: 여러 사람 앞에서 노래나 연극 같은 것을 보여 주는 것이에요.
  standards:
    - code: "[2바04-03]"
      text: 여럿이 하는 활동에 관심을 갖고 자발적으로 협력한다.
    - code: "[2슬04-03]"
      text: 경험한 것 중에서 관심 있는 주제를 정하고 조사한다.
    - code: "[2즐04-03]"
      text: 생각이나 느낌을 살려 전시나 공연 활동을 한다.
stages:
  - name: 생각열기
    question: 이야기에는 어떤 힘이 있을까?
  - name: 탐구하기
    question: 이야기를 어떻게 듣고 만들까?
  - name: 확장하기
    question: 내가 만든 이야기를 어떻게 나눌까?
