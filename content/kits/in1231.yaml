quiz:
  - statement: 전래동화는 옛날부터 전해 내려오는 이야기예요.
    answer: O
    explain: 여러 사람이 입으로 전해 온 이야기예요.
  - statement: 이야기를 들을 때는 끝까지 귀 기울여 들어요.
    answer: O
    explain: 끝까지 들어야 이야기의 마음을 알 수 있어요.
  - statement: 공연을 볼 때는 큰 소리로 떠들어도 돼요.
    answer: X
    explain: 다른 사람이 볼 수 있게 조용히 봐요.
  - statement: 인형극은 인형으로 이야기를 보여 줘요.
    answer: O
    explain: 인형이 말하고 움직이며 이야기를 들려줘요.
  - statement: 소원은 이루고 싶은 마음이에요.
    answer: O
    explain: 소원을 말로 표현해 볼 수 있어요.
  - statement: 이야기는 책으로만 들을 수 있어요.
    answer: X
    explain: 말, 노래, 인형극 같은 여러 방법이 있어요.
