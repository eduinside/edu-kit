id: so3121
title: 2-1. 시간의 흐름 속에서 만나는 역사
grade: 3
sem: 1학기
subject: 사회
unit: 2단원
unit_no: 2
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 일상 속의 주변 사례를 활용해 과거와 현재의 거리감 등 시간의 흐름을 경험하며 역사의 시간 개념을 이해한다.
  core_question: 오래된 물건과 자료는 과거에 대해 무엇을 알려 주며, 우리 지역의 생활 모습은 시간에 따라 어떻게 달라졌을까?
  concepts:
    - term: 시간의 흐름
      def: 지나간 일과 지금 일어나는 일 사이에 시간이 차례대로 흘러가는 것을 말해요. 식물이 자라거나 사람이 나이를 먹는 것처럼 과거에서 현재로 시간이 흐르면서 모습이 조금씩 달라져요.
    - term: 역사
      def: 옛날부터 지금까지 사람들이 살아온 이야기와 일어난 일들을 말해요. 오래된 물건이나 사진, 기록을 살펴보면 과거에 어떤 일이 있었는지 알 수 있어요.
  standards:
    - code: "[4사02-01]"
      text: 일상 속에서 시간의 흐름을 경험할 수 있는 사례를 살펴보고, 이를 바탕으로 역사의 시간 개념을 이해한다.
stages:
  - 시간의 흐름
  - 역사
