unit: 생물과 환경
unit_no: 2
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 다양한 생태계의 생물 요소와 비생물 요소를 관찰·조사 하고 분류하며 생물 요소를 생태계 내의 역할에 따라 생산자, 소비자, 분해자로 분류하고, 생물 요소 사이의 먹고 먹히는 관계를 이해하는 단원입니다. 또한 인간 활동이 생태계에 미치는 영향을 조사하고, 생태계 보전을 위한 생태계 구성원으로서 인간의 실천 방안을 토의하는 내용으로 구성되어 있습니다.
  core_question: 생태계의 생물 요소와 비생물 요소는 서로 어떻게 영향을 주고받으며, 우리는 생태계를 어떻게 지킬 수 있을까?
  concepts:
    - term: 생태계
      def: 어떤 장소에서 살아가는 생물들과, 그 생물을 둘러싼 햇빛·물·흙 같은 환경이 서로 영향을 주고받는 전체를 말해요. 숲, 연못, 바다처럼 다양한 생태계가 있어요.
    - term: 생물요소
      def: 생태계에서 살아 숨 쉬는 것들을 말해요. 식물, 동물, 곰팡이, 세균처럼 스스로 자라고 번식하는 모든 생명이 생물 요소예요.
    - term: 비생물요소
      def: 생태계에서 살아 있지 않지만 생물에게 영향을 주는 것들을 말해요. 햇빛, 공기, 물, 흙, 온도 등이 비생물 요소예요.
    - term: 먹이관계
      def: 생물들이 서로 먹고 먹히며 이어지는 관계예요. 이 관계가 그물처럼 여러 갈래로 얽히면 먹이그물이라고 불러요.
    - term: 생태계보전
      def: 망가진 생태계를 되살리고 건강한 생태계를 잘 지키는 것을 말해요. 쓰레기 줄이기처럼 우리가 실천할 수 있는 일로 생태계를 보호할 수 있어요.
    - term: 생산자
      def: 햇빛을 받아 스스로 양분을 만들어 살아가는 생물이에요. 벼나 나무 같은 식물이 대표적인 생산자예요.
    - term: 소비자
      def: 스스로 양분을 만들지 못해 다른 생물을 먹어서 양분을 얻는 생물이에요. 토끼, 참새, 호랑이 같은 동물이 소비자예요.
    - term: 분해자
      def: 죽은 생물이나 동물의 배설물을 분해해서 양분을 얻는 생물이에요. 곰팡이와 세균이 분해자이며 생태계의 청소부 역할을 해요.
  standards:
    - code: "[4과14-01]"
      text: 생태계의 구성 요소를 조사하여 생물 요소와 비생물 요소로 분류할 수 있다.
    - code: "[4과14-02]"
      text: 생물 요소들의 먹고 먹히는 관계를 조사하여 먹이그물로 표현할 수 있다.
    - code: "[4과14-03]"
      text: 인간 활동이 생태계에 미치는 영향을 조사하고, 생태계 보전을 위해 우리가 할 수 있는 일을 토의하여 실천할 수 있다.
stages:
  - 생태계
  - 생물요소
  - 비생물요소
  - 먹이관계
  - 생태계보전
  - 생산자
  - 소비자
  - 분해자
