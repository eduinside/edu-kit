id: so5121
title: 2-1. 우리나라의 계절별 기후와 기후변화
grade: 5
sem: 1학기
subject: 사회
unit: 2단원
unit_no: 2
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 다양한 자료를 통해 우리나라의 계절별 기후 특징을 탐구하며, 계절별 기후로 발생하는 자연재해와 기후변화로 심화되는 자연재해의 심각성을 살펴보고 기후 행동에 참여하는 태도를 가집니다.
  core_question: 우리나라의 기후와 인구 분포는 어떤 특징을 지니며, 그로 인해 나타나는 문제는 어떻게 해결할 수 있을까?
  concepts:
    - term: 기후
      def: 한 지역에서 여러 해 동안 되풀이되어 나타나는 기온, 비, 바람 같은 날씨의 평균적인 특징을 말합니다.
    - term: 계절별 기후 특징
      def: 봄, 여름, 가을, 겨울 네 계절마다 기온과 비, 바람이 서로 다르게 나타나는 우리나라 기후의 모습입니다. 여름은 덥고 비가 많이 오고, 겨울은 춥고 건조합니다.
    - term: 자연재해
      def: 홍수, 가뭄, 폭염, 태풍, 한파처럼 자연현상 때문에 사람과 생활에 큰 피해를 주는 일을 말합니다.
    - term: 기후변화
      def: 오랜 시간에 걸쳐 지구의 기온이 높아지는 등 기후가 점점 달라지는 것으로, 자연재해를 더 심하게 만들 수 있습니다.
    - term: 기후행동
      def: 기후변화를 늦추고 환경을 지키기 위해 에너지 절약, 분리배출처럼 우리가 생활 속에서 실천하는 활동입니다.
  standards:
    - code: "[6사02-01]"
      text: 우리나라의 계절별 기후 특징을 자료에서 탐구하고, 기후변화로 인한 자연재해의 심각성을 이해한다.
