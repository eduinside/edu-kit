id: so3123
title: 2-3. 역사 자료로 본 지역의 달라진 생활 모습
grade: 3
sem: 1학기
subject: 사회
unit: 2단원
unit_no: 2
flow: flow
sort_order: 3
published: true
intro:
  core_idea: 대구의 유래와 관련된 이야기, 대구의 변화를 알려 주는 사진이나 영상 등의 역사 자료를 활용해 우리 대구 지역 사람들의 생활이 어떻게 달라졌는지 살펴본다. 이를 통해 역사의 변화와 지속을 이해한다.
  core_question: 오래된 물건과 자료는 과거에 대해 무엇을 알려 주며, 우리 지역의 생활 모습은 시간에 따라 어떻게 달라졌을까?
  concepts:
    - term: 생활 모습
      def: 사람들이 살아가는 모습으로, 입는 옷, 먹는 음식, 사는 집, 일하는 방법, 거리의 풍경 등을 말해요.
    - term: 변화
      def: 시간이 지나면서 모습이 예전과 달라지는 것이에요. 옛날과 지금의 대구 거리나 건물이 달라진 것이 변화예요.
    - term: 지속
      def: 시간이 지나도 변하지 않고 그대로 이어지는 것이에요. 오랜 시간이 지나도 남아 있는 옛 장소나 풍습이 지속이에요.
  standards:
    - code: "[4사02-03]"
      text: 지역의 변화상을 보여주는 역사 자료를 분석하여 지역 사람들의 달라진 생활 모습을 파악한다.
stages:
  - 생활 모습
  - 변화
