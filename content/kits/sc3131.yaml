id: sc3131
title: 3. 식물의 생활
grade: 3
sem: 1학기
subject: 과학
unit: 식물의 생활
unit_no: 3
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 식물을 관찰하여 특징에 따라 식물을 분류하고 환경에 따른 식물의 생김새와 생활 방식을 탐구하며 식물의 특징을 활용한 생활용품을 설계해본다.
  core_question: 식물의 생김새와 생활 방식은 사는 환경과 어떻게 관련되며, 우리는 그 특징을 어떻게 활용할까?
  concepts:
    - term: 우리 주변의 식물
      def: 우리가 사는 곳 가까이에서 흔히 볼 수 있는 나무와 풀 같은 여러 식물을 말해요. 길가, 화단, 공원 등에서 자라며 종류마다 생김새가 달라요.
    - term: 식물 분류
      def: 여러 식물을 잎, 줄기, 사는 곳 같은 특징에 따라 비슷한 것끼리 나누어 묶는 것이에요. 분류를 하면 많은 식물을 쉽게 정리하고 알아볼 수 있어요.
    - term: 들이나 산에 사는 식물
      def: 들판이나 산처럼 땅 위에서 자라는 식물이에요. 민들레나 소나무처럼 뿌리로 흙에서 물을 빨아들이며 살아가요.
    - term: 강이나 연못에 사는 식물
      def: 물속이나 물 위에서 자라는 식물이에요. 연꽃이나 부레옥잠처럼 물에 떠 있거나 잠겨서 살 수 있는 특징을 가지고 있어요.
    - term: 사막에 사는 식물
      def: 비가 거의 오지 않는 메마른 사막에서 자라는 식물이에요. 선인장처럼 굵은 줄기에 물을 저장해 두고 오래 견디며 살아가요.
    - term: 환경에 따른 식물의 모습
      def: 식물이 사는 곳의 환경에 따라 잎, 줄기, 뿌리의 생김새가 달라지는 것이에요. 물이 많은 곳과 물이 적은 곳에 사는 식물의 모습이 서로 달라요.
    - term: 식물의 특징
      def: 식물마다 가지고 있는 잎 모양, 줄기, 향기, 사는 방식 같은 저마다의 성질이에요. 이런 특징을 살펴보면 식물을 더 잘 이해할 수 있어요.
    - term: 식물 모방
      def: 식물의 특징을 본떠서 우리 생활에 쓸모 있는 물건을 만드는 것이에요. 도꼬마리 열매를 본떠 만든 찍찍이(벨크로)가 대표적인 예예요.
  standards:
    - code: "[4과03-01]"
      text: 여러 가지 식물을 관찰하여 특징에 따라 식물을 분류할 수 있다.
    - code: "[4과03-02]"
      text: 다양한 환경에 서식하는 식물을 조사하여 식물의 생김새와 생활 방식이 환경과 관련되어 있음을 설명할 수 있다.
    - code: "[4과03-03]"
      text: 식물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하여 협력적으로 소통할 수 있다.
stages:
  - 우리 주변의 식물
