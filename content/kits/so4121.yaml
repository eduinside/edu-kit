id: so4121
title: 2-1. 국가유산의 의미와 가치
grade: 4
sem: 1학기
subject: 사회
unit: 2단원
unit_no: 2
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 지역의 국가유산을 조사하며, 국가유산이 가진 특징과 가치를 이해하고 그 소중함을 깨닫는 것을 목표로 합니다. 먼저, 국가유산이 무엇인지 알아보고, 문화유산과 무형유산으로 나누어 살펴봅니다. 또한, 국가유산에 담긴 가치를 찾으며, 우리 지역의 국가유산을 조사하여 그 의미를 탐색합니다. 마지막으로, 국가유산 속 조상들의 생활 모습을 다양한 방법으로 표현하면서, 지역의 국가유산을 소중히 여기는 태도를 기르도록 합니다.
  core_question: 우리 지역의 국가유산과 역사는 어떤 의미와 가치를 지니며, 우리는 그것을 어떻게 지켜 가야 할까?
  concepts:
    - term: 국가유산
      def: 조상들이 남긴 것 가운데 보호하고 잘 지켜 가야 할 소중한 것을 말해요. 눈에 보이는 건물이나 그림 같은 문화유산과, 춤이나 노래처럼 모양이 없는 무형유산으로 나눌 수 있어요.
    - term: 옛날 사람들의 생활 모습
      def: 오래전 우리 조상들이 어떻게 입고 먹고 살았는지를 보여 주는 모습이에요. 옛 건물이나 물건 같은 국가유산을 살펴보면 그때 사람들의 생활을 알 수 있어요.
  standards:
    - code: "[4사06-01]"
      text: 지역의 문화유산을 통해 문화유산의 의미와 유형을 알아보고, 문화유산의 가치를 탐색한다.
