id: sc5231
title: 3. 열과 우리 생활
grade: 5
sem: 2학기
subject: 과학
unit: 열과 우리 생활
unit_no: 3
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 에너지는 끊임없이 이동하며 물질의 상태와 환경을 변화시키고, 사람들은 이를 이해하여 생활을 이롭게 만든다.
  core_question: 열의 이동을 이해하면 우리는 생활을 어떻게 더 이롭게 바꿀 수 있을까?
  concepts:
    - term: 성질
      def: 물질이나 대상이 가진 고유한 특징이에요.
    - term: 변화
      def: 시간이 흐르면서 모습이나 성질, 생활 방식 등이 달라지는 것이에요.
    - term: 온도
      def: 물체의 따뜻하거나 차가운 정도를 수치로 나타낸 것이에요.
    - term: 열의 이동
      def: 열이 온도가 높은 곳에서 낮은 곳으로 옮겨 가는 현상이에요.
    - term: 단열
      def: 열이 이동하는 것을 줄이거나 막는 것이에요.
    - term: 보존
      def: 물질이나 에너지, 자원 등을 잃지 않도록 지키거나 유지하는 것이에요.
  standards:
    - code: "[6과07-01]"
      text: 물체의 따뜻하고 차가운 정도를 온도로 표현함을 알고, 온도계를 이용하여 온도를 측정할 수 있다.
    - code: "[6과07-02]"
      text: 온도가 다른 두 물체가 접촉했을 때 두 물체의 온도 변화를 관찰하고 그 원인을 추리할 수 있다.
    - code: "[6과07-03]"
      text: 주위에서 열의 이동으로 나타나는 현상을 관찰하여 열의 이동 방식이 다양함을 설명할 수 있다.
    - code: "[6과07-04]"
      text: 일상생활에서 단열을 이용하는 사례를 조사하고, 온도를 오랫동안 일정하게 유지할 수 있는 장치를 창의적으로 만들 수 있다.
stages:
  - name: 생각열기
    question: 차갑거나 따뜻한 정도를 어떻게 표현할까?
  - name: 탐구하기1
    question: 고체에서 열은 어떻게 이동할까?
  - name: 탐구하기2
    question: 열의 이동을 막으면 온도를 어떻게 오래 유지할 수 있을까?
  - name: 확장하기
    question: 색과 온도는 서로 어떤 관계가 있을까?
