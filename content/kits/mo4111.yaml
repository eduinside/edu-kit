quiz:
  - statement: 정직은 거짓 없이 바르고 솔직하게 말하고 행동하는 마음가짐이다.
    answer: O
    explain: 정직은 말과 행동에 거짓이 없고 바르고 솔직한 마음가짐이에요.
  - statement: 아무도 보지 않을 때는 약속이나 규칙을 지키지 않아도 정직한 행동이다.
    answer: X
    explain: 보는 사람이 없을 때에도 약속과 규칙을 지키는 것이 정직한 행동이에요.
  - statement: 정직하게 말하고 행동하면 다른 사람에게 믿음을 얻을 수 있다.
    answer: O
    explain: 정직한 말과 행동이 쌓이면 다른 사람의 믿음을 얻어요.
  - statement: 한 번이라도 거짓말을 한 사람은 정직한 사람이 될 수 없다.
    answer: X
    explain: 잘못을 알았을 때 솔직하게 인정하고 바로잡으려 노력하는 것도 정직한 모습이에요.
  - statement: 양심은 무엇이 옳은지 스스로 느끼게 해 주는 내 마음속의 목소리이다.
    answer: O
    explain: 양심은 옳은 일을 하도록 이끄는 내 마음속의 목소리예요.
  - statement: 정직하면 늘 손해를 보기 때문에 거짓말을 하는 편이 더 낫다.
    answer: X
    explain: 정직하면 손해를 볼 때도 있지만 믿음과 떳떳한 마음이라는 더 큰 이로움이 생겨요.
  - statement: 양심우산은 빌려 쓴 사람이 다시 돌려놓을 것이라고 믿고 운영하는 우산이다.
    answer: O
    explain: 양심우산은 쓰는 사람의 양심에 맡겨 운영하기 때문에 돌려놓는 마음이 중요해요.
  - statement: 진실을 말할 때는 상대가 상처받는지 신경 쓰지 않아도 된다.
    answer: X
    explain: 진실을 말할 때에도 상대가 상처받지 않도록 말하는 방법을 함께 찾는 것이 좋아요.
