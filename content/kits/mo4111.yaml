id: mo4111
title: 1. 바르고 곧은 길
grade: 4
sem: 1학기
subject: 도덕
unit: 1단원
unit_no: 1
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 정직은 거짓 없이 바르고 솔직하게 말하고 행동하는 마음가짐이에요. 정직하면 믿음을 얻고 스스로 떳떳할 수 있어서, 곤란한 순간에도 정직을 기준으로 판단하려고 노력하는 것이 중요해요.
  core_question: 거짓말을 하고 싶은 순간에도 정직을 선택하려면 나는 어떻게 생각하고 행동해야 할까?
  concepts:
    - term: 정직
      def: 거짓 없이 바르고 솔직하게 말하고 행동하는 마음가짐이에요. 다른 사람뿐 아니라 나 자신에게도 떳떳한 것이에요.
    - term: 양심
      def: 무엇이 옳고 그른지 스스로 느끼고, 옳은 일을 하도록 이끄는 내 마음속의 목소리예요.
    - term: 거짓말
      def: 사실이 아닌 것을 사실인 것처럼 꾸며서 말하는 것이에요. 거짓말을 하면 다른 사람의 믿음을 잃을 수 있어요.
    - term: 신뢰
      def: 다른 사람의 말과 행동을 믿고 맡길 수 있다고 여기는 마음이에요. 정직한 말과 행동이 쌓이면 신뢰가 생겨요.
    - term: 솔직하게 말하기
      def: 내 생각과 마음, 있었던 일을 꾸미거나 숨기지 않고 그대로 말하는 것이에요. 상대가 상처받지 않도록 말하는 방법을 함께 생각하면 더 좋아요.
  standards:
    - code: "[4도01-02]"
      text: 정직의 의미를 알고 모범적인 사례를 탐색하여 바르게 행동하려는 태도를 기른다.
stages:
  - name: 생각열기
    question: 거짓말을 하게 되는 까닭은 무엇이고, 정직은 왜 소중할까?
  - name: 탐구하기
    question: 정직과 다른 마음이 부딪힐 때 어떻게 판단하고, 학교 생활 속 정직한 행동은 무엇일까?
  - name: 확장하기
    question: 정직하면 삶에 어떤 좋은 일이 생기고, 나는 어떤 정직을 실천할까?
