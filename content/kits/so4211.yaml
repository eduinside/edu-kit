id: so4211
title: 1-1. 학교 자치와 민주주의
grade: 4
sem: 2학기
subject: 사회
unit: 1단원
unit_no: 1
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 학교 자치 사례를 통해 민주주의의 의미를 알아보고, 학교생활에서 민주주의를 실천하는 능력을 기를 수 있도록 구성되어 있습니다.
  core_question: 민주주의는 학교와 지역에서 어떻게 실현되며, 우리는 자치와 참여에 어떻게 함께할 수 있을까?
  concepts:
    - term: 정치
      def: 사람들이 함께 살아가면서 생기는 여러 문제를 의논하고 함께 결정하여 풀어 가는 활동이에요. 학급에서 규칙을 정하는 일도 작은 정치랍니다.
    - term: 민주주의
      def: 나라나 모임의 일을 한 사람이 마음대로 정하지 않고, 모두가 함께 의논하고 결정하는 방식이에요. 모든 사람을 똑같이 소중하게 여기는 생각이 바탕이 됩니다.
    - term: 학교자치
      def: 학교의 일을 학생, 선생님이 스스로 의논하고 함께 정해 나가는 것이에요. 학급회의나 학생자치회 활동이 대표적인 예랍니다.
    - term: 학교생활
      def: 학교에서 공부하고 친구들과 지내며 여러 활동에 참여하는 모든 생활이에요. 이 안에서 회의와 선거로 민주주의를 직접 실천할 수 있어요.
  standards:
    - code: "[4사08-01]"
      text: 학교 자치 사례를 통하여 민주주의의 의미를 이해하고, 학교생활에서 민주주의를 실천하는 능력을 기른다.
stages:
  - 정치
  - 민주주의
  - 학교자치
  - 학교생활
