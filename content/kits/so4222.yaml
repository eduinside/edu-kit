id: so4222
title: 2-2. 지역을 알리려는 노력
grade: 4
sem: 2학기
subject: 사회
unit: 2단원
unit_no: 2
flow: flow
sort_order: 2
published: true
intro:
  core_idea: 지역의 자연환경, 역사, 문화, 생산물 등을 알리려는 지역사회의 노력을 알고 관심을 가질 수 있도록 구성되었습니다.
  core_question: 우리 지역의 문제는 어떻게 해결할 수 있으며, 지역의 가치는 어떻게 알릴 수 있을까?
  concepts:
    - term: 자연환경
      def: 산, 강, 바다, 들처럼 사람이 만들지 않고 자연이 만들어 낸 우리 주변의 환경이에요. 통영 한려해상국립공원이나 제주 새별오름처럼 지역을 대표하는 멋진 자연환경이 있어요.
    - term: 역사
      def: 옛날부터 지금까지 우리 지역에서 일어난 일들의 이야기예요. 화성시 정조대왕 능행차처럼 오랜 역사를 지닌 곳은 그 지역을 대표하기도 해요.
    - term: 문화
      def: 지역 사람들이 함께 즐기고 이어 온 축제, 공연, 풍습 같은 생활 모습이에요. 춘천 연극제처럼 그 지역만의 특색 있는 문화가 있어요.
    - term: 생산물
      def: 그 지역에서 자라거나 만들어지는 물건이나 먹을거리예요. 이천 도자기, 이천 쌀, 횡성 한우처럼 지역을 대표하는 특별한 생산물이 있어요.
    - term: 홍보
      def: 우리 지역의 좋은 점을 여러 사람에게 널리 알리는 일이에요. 마스코트, 캐릭터, 홍보 영상, 공모전 같은 다양한 방법으로 지역을 알릴 수 있어요.
    - term: 참여
      def: 지역을 위해 내가 직접 나서서 함께하는 것이에요. 우리도 지역 축제나 홍보 활동에 참여해 지역을 알리는 데 힘을 보탤 수 있어요.
  standards:
    - code: "[4사09-02]"
      text: 지역의 자연환경, 역사, 문화, 생산물 등을 알리려는 지역사회의 노력을 알고 관심을 갖는다.
stages:
  - 자연환경
  - 역사
  - 문화
  - 생산물
  - 홍보
  - 참여
