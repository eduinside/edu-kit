id: mo3271
title: 7. 생명을 소중히 여기는 우리
grade: 3
sem: 2학기
subject: 도덕
unit: 7단원
unit_no: 7
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 생명은 하나뿐이고 사람과 동물, 식물 모두 소중해요. 나에서 이웃, 동식물, 자연으로 존중하는 마음을 넓혀 가며, 그 생명에게 실제로 도움이 되는 방법으로 아끼고 돌봐야 해요.
  core_question: 소중한 생명을 존중하려면 대상에 따라 어떤 마음과 방법으로 실천할 수 있을까?
  concepts:
    - term: 생명
      def: 살아 있게 하는 힘이에요. 사람뿐 아니라 동물과 식물도 모두 하나뿐인 소중한 생명을 가지고 있어요.
    - term: 생명 존중
      def: 나와 다른 사람, 동물과 식물의 생명을 소중하게 여기고 함부로 대하지 않는 것이에요.
    - term: 동물 복지
      def: 동물이 본래의 습성대로 편안하고 건강하게 살 수 있도록 보살피는 것이에요.
    - term: 반려동물
      def: 사람과 함께 살며 가족처럼 마음을 나누는 동물이에요. 끝까지 책임지고 돌봐야 해요.
    - term: 생물 다양성
      def: 지구에 사는 동물, 식물, 곤충 같은 여러 생물이 다양하게 어우러져 있는 것이에요.
  standards:
    - code: "[4도04-01]"
      text: 생명 경시 사례를 조사하고 문제 해결 방법을 탐구함으로써 생명의 소중함을 이해한다.
stages:
  - name: 생각열기
    question: 생명은 왜 소중할까?
  - name: 탐구하기
    question: 사람과 동물, 식물을 존중하는 방법에는 무엇이 있을까?
  - name: 확장하기
    question: 생명 존중을 일상에서 어떻게 실천하고 이어 갈까?
