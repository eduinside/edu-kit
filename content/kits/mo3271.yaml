quiz:
  - statement: 사람뿐 아니라 동물과 식물도 소중한 생명이다.
    answer: O
    explain: 모든 생명은 하나뿐이라서 사람이든 동식물이든 함부로 대하지 않아야 해요.
  - statement: 움직이지 않거나 말을 못 하는 식물은 함부로 대해도 된다.
    answer: X
    explain: 식물도 살아 있는 소중한 생명이라서 아끼고 돌봐야 해요.
  - statement: 생명을 존중하는 마음은 나에서 이웃, 동식물, 자연으로 넓혀 갈 수 있다.
    answer: O
    explain: 나를 아끼는 마음이 이웃과 동식물, 자연으로 점점 넓어져요.
  - statement: 내가 좋아하는 방식으로 돌보면 그 생명에게도 언제나 좋은 돌봄이다.
    answer: X
    explain: 그 생명에게 실제로 도움이 되는 방식인지 살펴야 해요.
  - statement: 반려동물을 키우기로 했다면 끝까지 책임지고 돌봐야 한다.
    answer: O
    explain: 반려동물은 가족이에요. 끝까지 함께하며 필요한 것을 챙겨 주어야 해요.
  - statement: 생명 존중은 사람 사이의 일일 뿐 동식물과는 관계가 없다.
    answer: X
    explain: 생명 존중은 사람뿐 아니라 동물, 식물, 자연으로 넓어지는 마음이에요.
  - statement: 동물 복지는 동물이 본래의 습성대로 편안하게 살 수 있도록 보살피는 것이다.
    answer: O
    explain: 동물의 습성에 맞는 환경을 마련해 주는 것이 동물 복지예요.
  - statement: 반려견과 산책할 때 목줄을 하지 않아도 다른 사람에게 피해가 없다.
    answer: X
    explain: 목줄을 하면 반려견과 다른 사람의 안전을 모두 지킬 수 있어요.
