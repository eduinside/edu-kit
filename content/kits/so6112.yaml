id: so6112
title: 1-2. 민주화와 산업화로 달라진 생활 문화
grade: 6
sem: 1학기
subject: 사회
unit: 1단원
unit_no: 1
flow: flow
sort_order: 2
published: true
intro:
  core_idea: 민주화와 산업화 과정에서 나타난 사람들의 노력과 달라진 생활 모습을 이해하고 우리 사회가 안고 있는 문제점을 해결하기 위해 노력하는 태도를 기릅니다.
  core_question: 광복 이후 우리나라는 민주화와 산업화를 거치며 어떻게 변화했으며, 평화 통일을 위해 우리는 무엇을 할 수 있을까?
  concepts:
    - term: 4.19혁명
      def: 1960년에 부정 선거에 맞서 학생과 시민들이 들고일어나 잘못된 정권을 물러나게 한 민주주의 운동이에요. 초등학생까지 거리로 나와 함께 외칠 만큼 온 국민이 참여했어요.
    - term: 5.18민주화운동
      def: 1980년에 광주에서 시민들이 군인들의 무력에 맞서 민주주의를 지키려고 일어선 운동이에요. 당시의 참상은 외국 언론을 통해 세계에 알려지기도 했어요.
    - term: 6월 민주항쟁
      def: 1987년 6월에 시민들이 대통령을 내 손으로 직접 뽑게 해 달라고 외치며 일어난 민주주의 운동이에요. 이 항쟁으로 대통령 직선제를 받아내는 큰 변화가 있었어요.
    - term: 산업화
      def: 공장을 세우고 여러 가지 물건을 만들어 팔며 나라 경제를 빠르게 키운 과정이에요. 우리나라는 이 과정을 거치며 농사 중심에서 공업 중심의 나라로 바뀌었어요.
    - term: 산업화 문제
      def: 산업화로 살림은 나아졌지만 환경 오염, 빈부 격차처럼 새롭게 생긴 어려움을 말해요. 이런 문제를 해결하려고 함께 노력하는 태도가 필요해요.
  standards:
    - code: "[6사07-02]"
      text: 민주화와 산업화로 인해 달라진 생활 문화를 사례를 들어 이해한다.
