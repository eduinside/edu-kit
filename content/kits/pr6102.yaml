id: pr6102
title: 진로 발달 계획
grade: 6
sem: 1학기
subject: 실과
unit: 인간 발달과 주도적 삶
unit_no: 1
flow: activity
sort_order: 2
published: true
intro:
  core_idea: 직업은 일 가운데 대가를 받고 꾸준히 하는 일로, 생계뿐 아니라 보람과 사회에 기여한다는 뜻도 있어요. 나의 흥미·적성·성격을 살펴 관심 직업을 조사하고, 단계별 진로 발달 계획을 세워 보면 앞날을 스스로 준비할 수 있어요.
  core_question: 나의 흥미·적성·성격에 맞는 직업을 찾아 어떻게 진로 발달 계획을 세울 수 있을까?
  concepts:
    - term: 직업
      def: 일 가운데 대가를 받고 일정 기간 이어서 하는 일이에요. 직업은 생활에 필요한 돈을 벌게 해 주고 보람과 사회에 보탬이 된다는 뜻도 있어요.
    - term: 진로
      def: 자신의 흥미와 능력, 가치에 따라 앞으로 선택하고 발전시켜 갈 삶과 일의 방향이에요.
    - term: 흥미
      def: 어떤 일이나 활동에 마음이 끌리고 재미를 느끼는 것이에요. 좋아하는 활동을 살펴보면 나에게 맞는 직업의 힌트를 얻을 수 있어요.
    - term: 적성
      def: 어떤 일을 잘해 낼 수 있는 소질이나 능력이에요. 적성은 노력하면 키울 수도 있어요.
    - term: 성격
      def: 생각하고 행동하는 나만의 방식이에요. 성격에는 좋고 나쁜 유형이 없고 직업마다 필요한 성격도 여러 가지예요.
    - term: 진로 발달 계획
      def: 내가 되고 싶은 직업을 얻기 위해 단계별로 무엇을 준비할지 정리한 계획이에요. 진로 발달 계획은 언제든 고칠 수 있어요.
  standards:
    - code: "[6실01-07]"
      text: 직업의 필요성을 이해하고 적성, 흥미, 성격에 따라 진로 발달 계획을 세우고 주도적으로 탐색한다.
stages:
  - name: 생각열기
    question: 직업은 무엇이고 왜 필요할까?
  - name: 탐구하기
    question: 내 흥미·적성·성격은 어떠하고 어떤 직업 정보를 찾을 수 있을까?
  - name: 확장하기
    question: 직업을 얻기 위한 단계별 진로 발달 계획은 어떻게 세울까?
