quiz:
  - statement: 직업은 일 가운데 대가를 받고 일정 기간 이어서 하는 일이다.
    answer: O
    explain: 직업은 일 가운데 대가를 받으며 꾸준히 이어서 하는 일을 말해요.
  - statement: 일과 직업은 같은 것이라서 모든 일이 직업이다.
    answer: X
    explain: 일 가운데 대가를 받고 이어서 하는 일이 직업이에요. 대가 없이 하는 가정일도 소중한 일이에요.
  - statement: 직업은 돈을 버는 일뿐 아니라 보람과 사회에 보탬이 된다는 뜻도 있다.
    answer: O
    explain: 직업을 통해 보람을 느끼고 사회에 기여할 수도 있어요.
  - statement: 어떤 직업은 귀하고 어떤 직업은 천하다.
    answer: X
    explain: 모든 직업은 사회에 꼭 필요하고 소중해요. 직업에는 귀하고 천함이 없어요.
  - statement: 흥미, 적성, 성격을 살펴보면 나에게 어울리는 직업을 찾는 데 도움이 된다.
    answer: O
    explain: 나를 알아야 나에게 맞는 직업과 진로를 생각해 볼 수 있어요.
  - statement: 검사에서 나온 나의 유형은 평생 바뀌지 않고 나의 길을 정해 준다.
    answer: X
    explain: 검사 결과는 지금의 선호 경향이에요. 앞으로 달라질 수 있고 나의 길을 정해 주지 않아요.
  - statement: 진로 발달 계획서에는 직업을 얻기 위해 단계별로 할 일을 구체적으로 쓴다.
    answer: O
    explain: 목표를 이루기 위해 단계마다 해야 할 일을 정리하면 실천하기 쉬워요.
  - statement: 여자만 할 수 있는 직업과 남자만 할 수 있는 직업이 따로 있다.
    answer: X
    explain: 직업은 성별로 정해지지 않아요. 흥미와 적성, 노력에 따라 누구나 선택할 수 있어요.
