id: mo4271
title: 7. 자연은 소중해요
grade: 4
sem: 2학기
subject: 도덕
unit: 7단원
unit_no: 7
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 사람도 자연을 이루는 한 구성원이라서 자연과 서로 도우며 함께 살아가야 해요. 기후 위기와 쓰레기 같은 환경 문제는 나와 이어져 있고, 작은 실천도 모이면 큰 차이를 만들 수 있어요.
  core_question: 사람과 자연이 함께 살아가기 위해 오늘 나는 어떤 실천을 할 수 있을까?
  concepts:
    - term: 공존
      def: 서로 해치지 않고 함께 어울려 살아가는 것이에요. 사람과 자연도 서로 돕고 공존해야 해요.
    - term: 기후 위기
      def: 사람의 활동 때문에 지구의 기온과 날씨가 크게 달라져서 우리 삶과 자연이 위험해지는 일이에요. 요즘 더 자주 겪는 폭염과 큰 홍수가 그 모습이에요.
    - term: 탄소 중립
      def: 우리가 내보내는 이산화탄소의 양을, 숲이 흡수하거나 사람이 없애는 양과 똑같이 맞추어 실제로 늘어나는 양을 0으로 만드는 것이에요.
    - term: 분리배출
      def: 쓰고 난 물건을 종이, 플라스틱, 유리처럼 종류별로 나누어 버리는 것이에요. 바르게 나누어 버리면 다시 쓰기 쉬워져요.
    - term: 멸종 위기종
      def: 지구에서 완전히 사라질 위험에 놓인 생물이에요. 사는 곳이 사라지거나 환경이 변하면 그 수가 크게 줄 수 있어요.
  standards:
    - code: "[4도04-02]"
      text: 인간과 자연이 함께 살아야 하는 이유를 이해하고 공생을 위한 구체적인 실천 계획을 세우며 생태 감수성을 기른다.
stages:
  - name: 생각열기
    question: 사람과 자연은 왜 함께 살아가야 할까?
  - name: 탐구하기
    question: 기후 위기는 무엇이고, 작은 행동과 분리배출로 어떻게 줄일 수 있을까?
  - name: 확장하기
    question: 멸종 위기 생물과 공존하려면 어떤 마음과 실천이 필요할까?
