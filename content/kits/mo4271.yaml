quiz:
  - statement: 사람도 자연을 이루는 한 구성원이다.
    answer: O
    explain: 사람도 자연의 한 구성원이라서 자연과 함께 어울려 살아가야 해요.
  - statement: 자연은 사람이 마음껏 쓰고 바꿔도 되는 도구일 뿐이다.
    answer: X
    explain: 사람도 자연의 구성원이므로 서로 해치지 않고 함께 살아가야 해요.
  - statement: 사람의 활동으로 늘어난 온실가스는 지구의 기온을 높이는 원인이 된다.
    answer: O
    explain: 온실가스가 많아지면 지구가 더워지고 기후 위기로 이어져요.
  - statement: 환경 문제는 먼 나라의 일이라서 우리 생활과 관계가 없다.
    answer: X
    explain: 자연이 망가지면 우리의 삶도 힘들어지기 때문에 환경 문제는 나와 이어져 있어요.
  - statement: 물과 전기를 아끼고 음식물 쓰레기를 줄이는 작은 행동도 지구를 지키는 데 도움이 된다.
    answer: O
    explain: 작은 실천이 모이면 환경에 큰 도움이 돼요.
  - statement: 분리배출은 종류와 상관없이 한 봉투에 담아 버려도 된다.
    answer: X
    explain: 종이, 플라스틱, 유리처럼 종류별로 나누어 버려야 다시 쓸 수 있어요.
  - statement: 서식지가 사라지거나 환경이 변하면 멸종 위기에 놓이는 생물이 생길 수 있다.
    answer: O
    explain: 사는 곳이 사라지거나 환경이 변하면 생물의 수가 크게 줄어들 수 있어요.
  - statement: 한 사람의 작은 실천은 너무 작아서 아무 소용이 없다.
    answer: X
    explain: 작은 행동이 모이면 큰 차이를 만들 수 있어요.
