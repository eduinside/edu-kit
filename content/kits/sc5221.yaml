intro:
  core_idea: 자연 현상은 여러 요소가 서로 영향을 주고받는 시스템 속에서 나타나며, 인간의 생활과 끊임없이 상호작용한다.
  core_question: 서로 영향을 주고받는 자연의 요소들은 우리의 삶과 어떻게 연결될까?
  concepts:
    - term: 시스템
    - term: 상호 작용
    - term: 날씨
    - term: 이슬
    - term: 안개
    - term: 구름
    - term: 고기압
    - term: 저기압
    - term: 순환
  standards:
    - code: "[6과06-01]"
      text: 기상 요소를 조사하고, 날씨가 우리 생활에 주는 영향을 인식할 수 있다.
    - code: "[6과06-02]"
      text: 이슬, 안개, 구름을 관찰하고, 공통점과 차이점을 찾을 수 있다.
    - code: "[6과06-03]"
      text: 고기압과 저기압의 분포에 따른 날씨의 특징을 기상 요소로 표현할 수 있다.
