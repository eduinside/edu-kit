intro:
  core_idea: 산성 용액과 염기성 용액의 성질을 비교하고, 두 용액을 섞었을 때의 변화를 실험으로 탐구합니다. 일상 속 산·염기 사례와 환경 문제를 조사하며 산·염기의 특징을 생활과 연결해 이해하도록 합니다.
  core_question: 산성 용액과 염기성 용액은 어떤 성질을 지니며, 우리 생활과 환경에 어떻게 이용되고 영향을 줄까?
  concepts:
    - term: 용액
      def: 소금이나 설탕처럼 어떤 물질이 물에 골고루 녹아 섞여 있는 액체를 용액이라고 해요. 식초, 비눗물, 소금물처럼 우리 주변에 다양한 용액이 있어요.
    - term: 지시약
      def: 용액이 산성인지 염기성인지 색깔 변화로 알려 주는 물질을 지시약이라고 해요. 리트머스 종이나 양배추 지시약이 대표적이에요.
    - term: 산성
      def: 식초나 레몬즙처럼 시큼한 성질을 가진 용액의 성질이에요. 푸른색 리트머스 종이를 붉게 변하게 해요.
    - term: 염기성
      def: 비눗물이나 석회수처럼 미끈미끈하고 쓴맛이 나는 용액의 성질이에요. 붉은색 리트머스 종이를 푸르게 변하게 해요.
    - term: 산과 염기 활용
      def: 산성과 염기성의 성질을 일상생활에 이용하는 것을 말해요. 생선 비린내를 레몬으로 없애거나, 변기 청소에 산성 세제를 쓰는 것이 그 예예요.
    - term: 산과 염기
      def: 용액을 성질에 따라 크게 산과 염기로 나눈 것이에요. 산성 용액과 염기성 용액을 섞으면 서로의 성질이 약해지는 변화가 일어나요.
    - term: 산성화
      def: 바닷물이나 빗물처럼 원래 그렇지 않던 것이 점점 산성으로 변하는 것을 산성화라고 해요. 바다 산성화는 바다 생물에게 나쁜 영향을 줄 수 있어요.
  standards:
    - code: "[6과09-01]"
      text: 여러 가지 용액에 지시약을 넣었을 때의 변화를 관찰하여 용액을 산성 용액과 염기성 용액으로 분류할 수 있다.
    - code: "[6과09-02]"
      text: 산성 용액과 염기성 용액의 성질을 관찰하고, 산성 용액과 염기성 용액을 섞을 때 용액의 성질 변화를 실험을 통해 추론할 수 있다.
    - code: "[6과09-03]"
      text: 우리 주변에서 산성 용액과 염기성 용액을 이용하는 예를 찾아서 설명할 수 있다.
    - code: "[6과09-04]"
      text: 산성화로 인한 환경의 피해 사례를 소개하는 자료를 만들고 공유할 수 있다.
