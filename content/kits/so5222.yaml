id: so5222
title: 2-2. 조선 후기의 달라진 생활 모습
grade: 5
sem: 2학기
subject: 사회
unit: 2. 달라지는 시대, 변화하는 생활 모습
unit_no: 2
flow: activity
sort_order: 2
published: true
intro:
  core_idea: 각 시대의 생활 모습은 사회 체제의 특징과 그것이 가져온 사회⋅문화적 변화를 반영한다.
  core_question: 신분제와 사상의 변화, 그리고 근대 문물의 수용은 우리가 살아가는 공간과 일상생활을 어떻게 바꾸어 놓았을까?
  concepts:
    - term: 공간과 장소
      def: 사람들이 살아가고 활동하며 의미를 만들어 가는 지표면의 일정한 범위예요.
    - term: 변화
      def: 시간이 흐르면서 모습이나 성질, 생활 방식 등이 달라지는 것이에요.
    - term: 체제
      def: 사회가 일정한 원리와 질서에 따라 운영되는 전체적인 구조예요.
    - term: 생활 모습
      def: 사람들이 먹고 입고 사는 방법과 일하고 어울리는 방식 등 일상생활에서 드러나는 모습이에요.
    - term: 문화
      def: 한 사회의 구성원이 함께 만들어 누리는 생활 방식, 지식, 예술, 가치 등을 말해요.
    - term: 근대 문물
      def: 개항 이후 서양과 일본 등을 통해 들어온 새로운 기술, 제도, 시설과 생활용품이에요.
    - term: 신분제
      def: 태어난 신분에 따라 권리와 의무, 생활 범위가 달라지던 사회 제도예요.
    - term: 조선 시대
      def: 조선이 세워진 1392년부터 대한 제국이 선포된 1897년까지 이어진 시대예요.
  standards:
    - code: "[6사05-02]"
      text: 조선 후기 사회·문화적 변화와 개항기 근대 문물 수용 과정에서 달라진 사람들의 생활을 이해한다.
stages:
  - name: 생각열기
    question: 옛 사람들은 어떤 방법으로 소통하였을까?
  - name: 탐구하기1
    question: 조선 후기 경제의 변화는 백성들의 생활 모습을 어떻게 바꾸어 놓았을까?
  - name: 탐구하기2
    question: 근대 국가를 수립하기 위해 어떤 노력을 하였을까?
  - name: 확장하기
    question: 조선 후기 상업 발달로 변화된 문화와 오늘날의 모습은 어떻게 연결될까?
