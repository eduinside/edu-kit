intro:
  core_idea: 경제 성장은 생활 수준의 향상을 가져오며, 그 과정에서 나타나는 사회·경제적 과제를 해결하기 위한 노력이 필요하다.
  core_question: 경제 성장은 삶과 사회를 어떻게 변화시키는가?
  concepts:
    - term: 상호 작용
    - term: 체제
    - term: 경제성장
    - term: 생활
  standards:
    - code: "[6사11-02]"
      text: 경제성장이 우리 생활에 미치는 영향을 파악하고, 빠른 경제성장으로 발생한 문제의 해결방안을 탐색한다.
stages:
  - name: 생각열기
    question: 가격은 어떤 요인에 의해 결정되고 변화할까?
  - name: 탐구하기1
    question: 우리나라 경제는 어떻게 성장해 왔을까?
  - name: 탐구하기2
    question: 경제 성장으로 인해 새롭게 나타난 문제는 무엇일까?
  - name: 확장하기
    question: 미래의 경제는 어떻게 바뀌어갈까?
