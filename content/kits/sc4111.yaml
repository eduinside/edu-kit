id: sc4111
title: 1. 자석의 이용
grade: 4
sem: 1학기
subject: 과학
unit: 자석의 이용
unit_no: 1
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 자석과 물체를 가까이 했을 때 나타나는 현상을 관찰하여 자석과 자석에 붙는 물체 사이에 작용하는 힘의 특징에 대해 알아보고, 자석과 자석을 가까이 했을 때 나타나는 현상을 관찰하여 그 특징을 자석의 극과 관련지어 알아본다. 또한 생활 속에서 자석을 이용한 장치를 찾아보고 자석을 이용하여 일상생활을 편리하게 하는 장치를 설계하는 활동을 하도록 구성되었다.
  core_question: 자석은 어떤 힘의 특징을 지니며, 우리는 그것을 생활에서 어떻게 이용할까?
  concepts:
    - term: 자석
      def: 철로 된 물체를 끌어당기는 성질을 가진 물체예요. 막대자석, 말굽자석, 동전자석처럼 여러 가지 모양이 있어요.
    - term: 자석에 붙는 물체
      def: 자석에 가까이 가져가면 끌려와 붙는 물체로, 철과 같은 금속으로 만들어진 것들이에요. 클립, 못, 철로 만든 가위 같은 것이 여기에 속해요.
    - term: 자력
      def: 자석이 물체를 끌어당기거나 밀어내는 힘이에요. 자석과 물체가 직접 닿지 않아도 작용해요.
    - term: 자석의 극
      def: 자석에서 끌어당기는 힘이 가장 센 양쪽 끝부분이에요. N극과 S극 두 가지가 있어요.
    - term: 같은 극
      def: N극과 N극, 또는 S극과 S극처럼 종류가 같은 극끼리를 말해요. 같은 극끼리 가까이 하면 서로 밀어내요.
    - term: 다른 극
      def: N극과 S극처럼 종류가 다른 극끼리를 말해요. 다른 극끼리 가까이 하면 서로 끌어당겨요.
  standards:
    - code: "[4과09-01]"
      text: 자석과 여러 가지 물체를 가까이했을 때 나타나는 현상을 관찰하고, 자석과 자석에 붙는 물체 사이에 작용하는 힘의 특징을 말할 수 있다.
    - code: "[4과09-02]"
      text: 자석과 자석을 가까이했을 때 나타나는 현상을 관찰하여 그 특징을 자석의 극과 관련지어 설명할 수 있다.
    - code: "[4과09-03]"
      text: 자석을 이용하여 일상생활을 편리하게 하는 장치를 설계할 수 있다.
stages:
  - 자석
  - 자석에 붙는 물체
  - 자력
  - 자석의 극
