id: so4112
title: 1-2. 지도로 살펴보는 우리 지역의 정보
grade: 4
sem: 1학기
subject: 사회
unit: 1단원
unit_no: 1
flow: flow
sort_order: 2
published: true
intro:
  core_idea: 위치, 지형, 면적, 인구, 기온, 강수량과 같은 지리 정보의 종류와 의미를 이해하는 것을 목표로 합니다. 또한, 우리 지역의 지리 정보를 다른 지역과 비교하면서 지역의 특징을 탐색하도록 합니다. 이를 위해 위치, 지형, 면적, 인구, 기온, 강수량의 개념을 배우고, 학생들이 직접 지역의 지리 정보를 찾아볼 수 있도록 합니다. 이렇게 얻은 정보를 바탕으로 우리 지역과 다른 지역을 비교하며, 우리 지역만의 특징을 이해하는 데 중점이 있습니다.
  core_question: 지도를 이용하면 우리 지역의 모습과 정보를 어떻게 파악할 수 있을까?
  concepts:
    - term: 위치
      def: 어떤 곳이 지구나 지도 위에서 자리 잡고 있는 자리를 말해요. 우리 지역이 우리나라 안에서 어디에 있는지 알려 줍니다.
    - term: 면적
      def: 어떤 지역이 차지하는 땅의 넓이를 말해요. 면적이 넓으면 그만큼 차지하는 땅이 큰 지역이에요.
    - term: 인구
      def: 어떤 지역에 사는 사람들의 수를 말해요. 인구가 많으면 사람이 많이 사는 지역이에요.
    - term: 지형
      def: 산, 들, 강, 바다처럼 땅의 생긴 모습을 말해요. 지역마다 지형이 서로 달라요.
    - term: 기온
      def: 공기의 따뜻하고 차가운 정도를 숫자로 나타낸 것이에요. 기온이 높으면 덥고, 낮으면 추워요.
    - term: 강수량
      def: 비나 눈이 일정한 기간 동안 내린 양을 말해요. 강수량이 많으면 비나 눈이 많이 내린 지역이에요.
    - term: 지리정보
      def: 위치, 지형, 면적, 인구, 기온, 강수량처럼 어떤 지역에 대해 알 수 있는 여러 가지 정보를 말해요. 지도를 이용하면 지리 정보를 쉽게 찾아볼 수 있어요.
    - term: 행정구역
      def: 나라를 잘 다스리기 위해 나누어 놓은 지역의 구역이에요. 시, 도, 군, 구처럼 정해진 이름과 경계가 있어요.
    - term: 시도
      def: 우리나라를 크게 나눈 행정구역으로, 특별시·광역시·도 등을 말해요. 대구광역시도 시도 중 하나예요.
    - term: 시군구
      def: 시도를 다시 더 작게 나눈 행정구역으로, 시·군·구를 말해요. 우리가 사는 동네는 이 시군구 안에 속해 있어요.
  standards:
    - code: "[4사05-02]"
      text: 지도에서 우리 지역의 위치를 파악하고, 우리 지역의 지리 정보를 탐색한다.
