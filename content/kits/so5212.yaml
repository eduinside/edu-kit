id: so5212
title: 1-2. 고대 사람들의 생각과 생활 모습
grade: 5
sem: 2학기
subject: 사회
unit: 1. 유적과 유물로 살펴본 옛 사람들의 생활
unit_no: 1
flow: activity
sort_order: 2
published: true
intro:
  core_idea: 사람들은 유물, 유적, 기록 등 과거의 모습을 보여주는 자료를 통해 시간에 따른 역사의 변화를 이해한다.
  core_question: 우리는  유적·유물을 통해 고대 사람들의 생각과 생활 모습의 변화를 어떻게 추론할 수 있을까?
  concepts:
    - term: 공간과 장소
    - term: 변화
    - term: 유적과 유물
    - term: 생활 모습
    - term: 고대
  standards:
    - code: "[6사04-02]"
      text: 역사 기록이나 유적과 유물에 나타난 고대 사람들의 생각과 생활을 추론한다.
stages:
  - name: 생각열기
    question: 신라의 청동호우에 왜 광개토대왕의 이름이 새겨져있을까?
  - name: 탐구하기1
    question: 삼국과 가야, 통일신라, 발해는 어떻게 성립하고 발전해 왔을까?
  - name: 탐구하기2
    question: 삼국과 가야, 통일신라, 발해 사람들은 어떻게 생활하였을까?
  - name: 확장하기
    question: 고구려는 어떻게 국제적인 소통망을 넓혔을까?
