id: sc6141
title: 4. 지구의 운동
grade: 6
sem: 1학기
subject: 과학
unit: 지구의 운동
unit_no: 4
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 하루 동안의 태양과 별의 위치 변화를 지구의 자전과 관련지어 설명하고, 계절에 따라 보이는 별자리가 달라지는 까닭을 지구의 공전과 관련지어 설명하도록 구성되었습니다.
  core_question: 지구의 자전과 공전은 낮과 밤, 계절에 따른 별자리 변화와 어떻게 관련될까?
  concepts:
    - term: 자전
      def: 지구가 자전축을 중심으로 하루에 한 바퀴씩 스스로 도는 것을 말합니다. 이 때문에 하루 동안 태양과 별의 위치가 동쪽에서 서쪽으로 움직이는 것처럼 보입니다.
    - term: 낮과 밤
      def: 지구가 자전하면서 태양 빛을 받는 쪽은 낮, 받지 못하는 쪽은 밤이 됩니다. 그래서 낮과 밤이 하루를 두고 번갈아 나타납니다.
    - term: 공전
      def: 지구가 태양을 중심으로 일 년에 한 바퀴씩 도는 것을 말합니다. 지구가 공전하기 때문에 계절에 따라 밤하늘에 보이는 별자리가 달라집니다.
    - term: 별자리
      def: 밤하늘의 별들을 이어서 사람·동물·물건의 모양으로 나타낸 것입니다. 계절에 따라 잘 보이는 별자리가 달라져서 봄·여름·가을·겨울 별자리로 나눌 수 있습니다.
  standards:
    - code: "[6과12-01]"
      text: 하루 동안 태양과 별을 관찰하여 위치 변화의 규칙성을 찾을 수 있다.
    - code: "[6과12-02]"
      text: 지구의 자전을 알고, 낮과 밤이 생기는 이유를 설명할 수 있다.
    - code: "[6과12-03]"
      text: 지구의 공전을 알고, 계절에 따라 달라지는 별자리를 관찰할 수 있다.
stages:
  - 자전
  - 낮과 밤
  - 공전
  - 별자리
