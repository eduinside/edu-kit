id: sc4211
title: 1. 밤하늘 관찰
grade: 4
sem: 2학기
subject: 과학
unit: 밤하늘 관찰
unit_no: 1
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 달의 모양과 표면, 달의 위상 변화 관찰, 태양계를 구성하고 있는 천체들, 별의 정의와 북극성 주변의 별자리를 관찰하는 방법을 알아보고 직접 밤하늘을 관찰하는 내용으로 구성되어 있습니다.
  core_question: 밤하늘의 달과 별, 태양계는 어떤 모습이며, 우리는 그것을 어떻게 관찰할 수 있을까?
  concepts:
    - term: 태양계
      def: 태양과 그 둘레를 도는 행성, 달, 별똥별 등 여러 천체가 모여 이루는 무리예요. 우리가 사는 지구도 태양계 안에 있어요.
    - term: 태양
      def: 태양계의 중심에서 스스로 빛과 열을 내는 큰 별이에요. 태양 덕분에 지구가 따뜻하고 밝아져요.
    - term: 행성
      def: 태양 둘레를 일정한 길을 따라 도는 천체예요. 스스로 빛을 내지 못하고 태양 빛을 받아 보여요. 지구도 행성 가운데 하나예요.
    - term: 별
      def: 태양처럼 스스로 빛을 내는 천체예요. 밤하늘에서 반짝이는 별빛은 아주 멀리 있는 별이 스스로 내는 빛이에요.
    - term: 별자리
      def: 밤하늘의 별들을 이어서 동물이나 사물 모양으로 이름 붙인 것이에요. 별의 위치를 찾고 기억하는 데 도움을 줘요.
    - term: 북극성
      def: 밤하늘에서 거의 한자리에 멈춰 있는 것처럼 보이는 별이에요. 북쪽 방향을 알려 주어 길을 찾을 때 쓸 수 있어요.
    - term: 달
      def: 지구 둘레를 도는 천체로, 밤하늘에서 가장 밝고 크게 보여요. 스스로 빛을 내지 못하고 태양 빛을 받아 빛나요.
    - term: 달의 위상변화
      def: 날마다 달의 모양이 초승달, 반달, 보름달처럼 조금씩 달라져 보이는 것이에요. 달과 지구, 태양의 위치 관계 때문에 생겨요.
  standards:
    - code: "[4과13-01]"
      text: 달의 모양과 표면, 달의 위상변화를 관찰하여 밤하늘 관찰에 흥미를 가질 수 있다.
    - code: "[4과13-02]"
      text: 태양계 구성원을 알고, 태양과 행성을 조사할 수 있다.
    - code: "[4과13-03]"
      text: 별의 정의를 알고, 북극성 주변의 별자리를 관찰할 수 있다.
stages:
  - 태양계
  - 태양
  - 행성
  - 별
  - 별자리
  - 북극성
  - 달
  - 달의 위상변화
