id: sc6211
title: 1. 계절의 변화
grade: 6
sem: 2학기
subject: 과학
unit: 1. 계절의 변화
unit_no: 1
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 지구의 공전 시스템에 따른 태양 고도의 변화는 지구상의 계절을 만들며, 모든 생명의 지속가능한 삶을 규정한다.
  core_question: 태양의 움직임과 지구의 규칙적인 변화는 우리의 생활에 어떤 영향을 줄까?
  concepts:
    - term: 변화
      def: 시간이 흐르면서 모습이나 성질, 생활 방식 등이 달라지는 것이에요.
    - term: 시스템
      def: 여러 요소가 서로 관련을 맺고 함께 작용하는 하나의 전체예요.
    - term: 태양
      def: 지구에 빛과 열을 보내 생명과 날씨, 계절 변화에 영향을 주는 별이에요.
    - term: 고도
      def: 지평선을 기준으로 천체가 얼마나 높이 떠 있는지를 각도로 나타낸 값이에요.
    - term: 계절
      def: 한 해 동안 기온과 낮의 길이 등이 비슷하게 되풀이되는 시기예요.
    - term: 그림자
      def: 빛이 물체에 막혀 빛이 닿지 않는 곳에 생기는 어두운 부분이에요.
    - term: 기온
      def: 공기의 차고 따뜻한 정도를 온도로 나타낸 것이에요.
    - term: 낮
      def: 태양이 떠 있어 지표면이 밝은 시간이에요.
    - term: 밤
      def: 태양이 지평선 아래에 있어 어두운 시간이에요.
    - term: 공전
      def: 지구가 태양 주위를 일정한 궤도로 도는 운동이에요.
  standards:
    - code: "[6과13-01]"
      text: 태양 고도 측정기로 하루 동안 태양 고도, 그림자 길이, 기온을 측정하여 이들의 관계를 찾을 수 있다.
    - code: "[6과13-02]"
      text: 계절에 따른 태양의 남중 고도와 낮의 길이 사이의 관계를 자료에 근거하여 추론할 수 있다.
    - code: "[6과13-03]"
      text: 계절 변화의 원인을 지구의 자전축이 기울어진 채 공전하는 것으로 설명할 수 있다.
