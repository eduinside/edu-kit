id: sc3211
title: 1. 물체와 물질
grade: 3
sem: 2학기
subject: 과학
unit: 물체와 물질
unit_no: 1
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 학생들이 일상에서 자주 접하는 다양한 물체와 그 구성 재료인 물질, 물질의 여러 성질, 그리고 고체·액체·기체와 같은 상태에 대해 자연스럽게 이해할 수 있도록 하는 단원입니다. 교실, 가정 등의 주변에서 흔히 볼 수 있는 물체를 중심으로 학생들이 물체와 물질의 개념을 보다 친근하고 흥미롭게 받아들일 수 있도록 합니다.
  core_question: 물체를 이루는 물질은 저마다 어떤 성질을 지니며, 우리는 그 성질을 이용해 물체를 어떻게 만들까?
  concepts:
    - term: 고체
      def: 나무나 돌처럼 일정한 모양과 부피를 가지고 있어서, 손에 쥐거나 다른 그릇에 옮겨 담아도 모양이 잘 변하지 않는 물질의 상태입니다.
    - term: 액체
      def: 물이나 우유처럼 담는 그릇에 따라 모양은 바뀌지만, 양(부피)은 변하지 않고 흘러내릴 수 있는 물질의 상태입니다.
    - term: 기체
      def: 공기처럼 눈에 잘 보이지 않으며, 담는 그릇 전체를 가득 채우고 모양과 부피가 자유롭게 변하는 물질의 상태입니다.
    - term: 물질의 성질
      def: 단단한 정도, 매끄러움, 색깔, 휘어지는 정도처럼 물질마다 저마다 다르게 가지고 있는 특징을 말합니다. 우리는 이 성질을 보고 물체를 어떤 물질로 만들지 정합니다.
    - term: 물질의 상태
      def: 물질이 고체, 액체, 기체 중 어떤 모습으로 있는지를 나타내는 말입니다. 같은 물질도 조건에 따라 상태가 달라질 수 있습니다.
  standards:
    - code: "[4과05-01]"
      text: 물체를 이루는 여러 가지 물질의 성질을 비교하고, 물질의 종류에 따라 물체를 분류할 수 있다.
    - code: "[4과05-02]"
      text: 물질의 세 가지 상태인 고체, 액체, 기체의 성질을 관찰하여 비교할 수 있다.
    - code: "[4과05-03]"
      text: 다양한 물질의 성질을 이용하여 쓰임새 있는 물체를 설계할 수 있다.
stages:
  - 고체
  - 액체
  - 기체
  - 물질의 성질
  - 물질의 상태
