id: sc3241
title: 4. 감염병과 건강한 생활
grade: 3
sem: 2학기
subject: 과학
unit: 감염병과 건강한 생활
unit_no: 4
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 감염병에 대한 이해를 바탕으로 건강한 생활 습관을 기를 수 있도록 하는 단원입니다. 생활 속에서 발생할 수 있는 감염병의 사례를 조사하고 감염이 이루어지는 과정을 살펴보며 감염병 예방을 위한 개인의 실천 방안뿐 아니라 사회적 노력과 역할에 대해 살펴봅니다. 이를 통해 감염병 예방을 실천할 수 있는 태도를 기릅니다.
  core_question: 감염병은 어떻게 퍼지며, 건강한 생활을 위해 우리는 무엇을 실천해야 할까?
  concepts:
    - term: 감염
      def: 병을 일으키는 세균이나 바이러스 같은 작은 생물이 우리 몸속에 들어와 자리를 잡고 늘어나는 것을 감염이라고 해요.
    - term: 감염병
      def: 감염 때문에 생기는 병으로, 한 사람에게서 다른 사람에게 옮을 수 있는 병을 말해요. 감기나 코로나19가 대표적인 감염병이에요.
    - term: 감염병의 위험성
      def: 감염병은 여러 사람에게 빠르게 퍼져 많은 사람을 아프게 할 수 있고, 심하면 목숨을 잃게 할 수도 있어서 위험해요.
    - term: 예방수칙
      def: 감염병에 걸리지 않도록 평소에 지켜야 할 약속이에요. 손 씻기, 마스크 쓰기, 예방주사 맞기 같은 것이 있어요.
  standards:
    - code: "[4과08-01]"
      text: 생활 속 감염병의 사례를 알고, 다양한 질병과 그 위험성에 대해 토의할 수 있다.
    - code: "[4과08-02]"
      text: 감염병으로부터 안전한 사회에 관심을 가지고, 여러 감염 과정을 통해 생활 습관과 감염병 유행과의 연관성을 설명할 수 있다.
    - code: "[4과08-03]"
      text: 건강한 생활을 위해 필요한 감염병 예방 수칙을 공유하고, 생활 속에서 실천할 수 있다.
stages:
  - 감염
  - 감염병
  - 감염병의 위험성
  - 예방수칙
