intro:
  core_idea: 흐르는 물의 작용과 화산 활동 및 지진을 알아봄으로써 땅의 변화에 대해 호기심과 탐구하려는 태도를 갖도록 한다. 흐르는 물의 작용과 강 주변 지형의 특징을 관련지어 설명할 수 있게 하고, 화산의 의미와 화산 활동으로 나오는 물질을 이해하도록 한다. 화산 활동을 모형으로 표현하도록 하고, 화성암을 관찰한 다음 분류 기준을 정하여 분류하도록 한다. 또 화산 활동과 지진이 우리 생활에 미치는 영향을 조사하여 대처 방법을 실천할 수 있도록 한다.
  core_question: 땅은 흐르는 물과 화산·지진으로 어떻게 변하며, 우리는 그 변화에 어떻게 대처해야 할까?
  concepts:
    - term: 지형
      def: 산, 강, 바닷가처럼 우리가 사는 땅의 생김새를 말해요. 흐르는 물이나 화산, 지진 같은 작용으로 오랜 시간에 걸쳐 모습이 바뀌어요.
    - term: 지진
      def: 땅속의 큰 힘 때문에 땅이 흔들리는 현상이에요. 건물이 무너지거나 갈라짐이 생길 수 있어서 흔들리면 몸을 보호하고 안전한 곳으로 피해야 해요.
    - term: 화산
      def: 땅속의 뜨거운 마그마가 약한 틈을 뚫고 땅 위로 나오는 곳이에요. 화산이 활동하면 용암, 화산재, 화산 가스 같은 물질이 나와요.
    - term: 화강암
      def: 마그마가 땅속 깊은 곳에서 천천히 식어 만들어진 화성암이에요. 알갱이가 크고 색이 밝은 편이며, 우리나라에서 흔히 볼 수 있어요.
    - term: 현무암
      def: 마그마가 땅 위나 가까운 곳에서 빠르게 식어 만들어진 화성암이에요. 알갱이가 작고 색이 어두우며, 표면에 작은 구멍이 많은 것도 있어요.
    - term: 흐르는 물의 작용
      def: 강이나 빗물처럼 흐르는 물이 땅을 깎고, 깎인 돌과 흙을 옮기고, 다른 곳에 쌓는 일을 해요. 이 작용이 오랜 시간 쌓이면 땅의 모습이 바뀌어요.
    - term: 침식
      def: 흐르는 물이나 파도, 바람이 땅이나 바위를 조금씩 깎아 내는 것을 말해요. 강가의 절벽이나 바닷가의 깎인 바위는 침식으로 만들어져요.
    - term: 강 주변 지형
      def: 강이 흐르면서 깎고 쌓는 작용으로 만들어진 땅의 모습이에요. 물살이 빠른 강 상류에는 깎인 곳이 많고, 물살이 느린 하류에는 흙과 모래가 쌓여 넓은 땅이 생겨요.
    - term: 바닷가 주변 지형
      def: 바닷물과 파도가 깎거나 쌓는 작용으로 만들어진 바닷가의 땅 모습이에요. 파도에 깎인 절벽이나 동굴, 모래가 쌓인 모래사장 등을 볼 수 있어요.
  standards:
    - code: "[4과11-01]"
      text: 흐르는 물의 작용과 강 주변 지형의 특징을 관련지을 수 있다.
    - code: "[4과11-02]"
      text: 화산의 의미와 화산 활동으로 나오는 물질을 알고, 화산 활동을 모형으로 표현할 수 있다.
    - code: "[4과11-03]"
      text: 화성암을 관찰하고 분류할 수 있다.
    - code: "[4과11-04]"
      text: 화산 활동과 지진이 우리 생활에 미치는 영향을 조사하여, 대처 방법을 실천할 수 있다.
