quiz:
  - statement: 기쁨뿐 아니라 슬픔이나 화 같은 감정도 모두 나의 소중한 마음이다.
    answer: O
    explain: 어떤 감정이든 내 마음이에요. 없애려 하기보다 알아차리고 알맞게 다루는 것이 중요해요.
  - statement: 우리는 한 번에 한 가지 감정만 느낄 수 있다.
    answer: X
    explain: 한 가지 일에도 기쁘면서 걱정되는 것처럼 여러 감정이 함께 생길 수 있어요.
  - statement: 화가 날 때 잠시 멈추고 숨을 고르면 마음을 가라앉히는 데 도움이 된다.
    answer: O
    explain: 화가 날 때 멈추고 생각하는 시간을 가지면 마음을 알맞게 다스리기 쉬워요.
  - statement: 남에게 좋게 보이는 모습만 골라서 소개하는 것이 나를 소개하는 올바른 방법이다.
    answer: X
    explain: 잘하는 점과 부족한 점을 있는 그대로 말하는 것이 진짜 나를 소개하는 방법이에요.
  - statement: 감정 일기를 쓰면 하루 동안 느낀 내 감정을 알아차리는 데 도움이 된다.
    answer: O
    explain: 그날 느낀 감정과 그 까닭을 글로 적어 보면 내 마음을 더 잘 알게 돼요.
  - statement: 도덕 덕목이 적은 친구는 덕목이 많은 친구보다 나쁜 사람이다.
    answer: X
    explain: 덕목은 사람마다 많고 적음이 달라요. 친구와 견주지 않고 나만의 모습으로 받아들여요.
  - statement: 마음챙김 호흡은 숨 쉬는 느낌에 집중하며 마음을 편안하게 하는 방법이다.
    answer: O
    explain: 호흡에 집중하면 어지러운 마음이 가라앉고 지금의 내 상태를 알아차리기 쉬워요.
  - statement: 속상한 마음이 들면 아무에게도 말하지 않고 참기만 하는 것이 가장 좋은 방법이다.
    answer: X
    explain: 말이나 글로 알맞게 표현하면 마음이 풀려요. 다른 사람을 해치지 않는 방법으로 표현해요.
