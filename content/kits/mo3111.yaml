id: mo3111
title: 1. 나를 찾아 떠나는 여행
grade: 3
sem: 1학기
subject: 도덕
unit: 1단원
unit_no: 1
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 나를 소중히 여기는 일은 내가 어떤 사람인지, 내 마음에 어떤 감정이 있는지 알아보는 데서 시작돼요. 기쁜 마음도 속상한 마음도 알맞게 표현하고 다스리며, 마음챙김과 긍정의 말로 나를 북돋을 수 있어요.
  core_question: 나는 어떤 사람이고, 내 마음을 어떻게 알아주고 소중하게 가꿀 수 있을까?
  concepts:
    - term: 감정
      def: 기쁨, 슬픔, 화남, 두려움처럼 어떤 일을 겪을 때 마음속에서 느끼는 기분이에요.
    - term: 감정 표현
      def: 내 마음을 말이나 표정, 행동으로 다른 사람에게 알맞게 나타내는 것이에요.
    - term: 감정 조절
      def: 화나거나 속상한 마음이 들 때 잠시 멈추고 숨을 고르며 마음을 알맞게 가라앉히는 것이에요.
    - term: 자존감
      def: 나를 소중하고 가치 있는 사람으로 여기는 마음이에요.
    - term: 마음챙김
      def: 지금 내 몸과 마음에서 일어나는 일을 가만히 알아차리는 것이에요. 숨 쉬는 느낌에 집중하는 호흡 명상이 그 방법 중 하나예요.
  standards:
    - code: "[4도01-01]"
      text: 자신의 감정을 소중히 여기며 존중하는 태도를 바탕으로 내가 누구인가를 탐구한다.
stages:
  - name: 생각열기
    question: 나는 어떤 사람이고, 내 마음에는 어떤 감정이 있을까?
  - name: 탐구하기
    question: 내 감정을 어떻게 알맞게 표현하고 다스릴까?
  - name: 확장하기
    question: 나를 북돋우고 마음을 가다듬는 방법에는 무엇이 있을까?
