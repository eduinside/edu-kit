id: in1221
title: 2. 약속
grade: 1
sem: 2학기
subject: 통합
unit: 2단원
unit_no: 2
flow: activity
sort_order: 1
published: false
intro:
  core_idea: 지구와 모든 생명이 오래 살아가려면 물, 쓰레기, 동물을 아끼는 약속이 필요해요. 작은 실천을 함께하면 지구를 지킬 수 있어요.
  core_question: 지구를 위해 우리가 지킬 약속은 무엇일까?
  concepts:
    - term: 약속
      def: 서로 지키기로 한 말이에요.
    - term: 지구
      def: 우리가 살고 있는 둥근 별이에요.
    - term: 분리배출
      def: 쓰레기를 종류별로 나누어 버리는 것이에요.
    - term: 아껴 쓰기
      def: 물이나 물건을 낭비하지 않고 알맞게 쓰는 것이에요.
    - term: 일회용품
      def: 한 번 쓰고 버리는 물건이에요.
  standards:
    - code: "[2바03-04]"
      text: 공동체 속에서 지속가능성을 위한 삶의 방식을 찾아 실천한다.
    - code: "[2슬03-04]"
      text: 우리의 생활과 관련된 지속가능성의 다양한 사례를 찾고 탐색한다.
    - code: "[2즐03-04]"
      text: 안전과 안녕을 위한 아동의 권리가 있음을 알고 누린다.
stages:
  - name: 생각열기
    question: 지구와 우리를 위한 약속에는 무엇이 있을까?
  - name: 탐구하기
    question: 물·쓰레기·동물을 지키려면 어떻게 할까?
  - name: 확장하기
    question: 우리가 함께 지킬 약속은 무엇일까?
