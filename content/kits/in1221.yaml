quiz:
  - statement: 양치할 때 물을 틀어 놓으면 물이 낭비돼요.
    answer: O
    explain: 컵에 물을 받아 쓰면 물을 아낄 수 있어요.
  - statement: 플라스틱은 분리배출해야 해요.
    answer: O
    explain: 나누어 버리면 다시 쓸 수 있어요.
  - statement: 일회용품은 많이 쓸수록 지구에 좋아요.
    answer: X
    explain: 일회용품을 줄이면 쓰레기가 줄어요.
  - statement: 쓰레기는 아무 데나 버려도 돼요.
    answer: X
    explain: 쓰레기는 쓰레기통에 버려요.
  - statement: 빗물을 모아 쓰면 물을 아낄 수 있어요.
    answer: O
    explain: 모은 빗물로 화단에 물을 줄 수 있어요.
  - statement: 쓰던 물건을 다시 쓰면 쓰레기를 줄일 수 있어요.
    answer: O
    explain: 다시 쓰면 새로 만들 필요가 줄어요.
  - statement: 안 쓰는 방의 불을 켜 두는 것이 지구에 좋아요.
    answer: X
    explain: 안 쓰는 불은 꺼서 에너지를 아껴요.
