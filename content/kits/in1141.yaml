id: in1141
title: 4. 탐험
grade: 1
sem: 1학기
subject: 통합
unit: 4단원
unit_no: 4
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 우주, 바닷속, 남극처럼 가 보기 어려운 곳도 알아보고 상상하며 탐험할 수 있어요. 궁금한 것을 찾아보면 새로운 세상을 알게 돼요.
  core_question: 내가 가 보고 싶은 곳은 어떤 모습일까?
  concepts:
    - term: 탐험
      def: 잘 모르는 곳에 가서 살펴보고 알아내는 일이에요.
    - term: 우주
      def: 지구 밖에 있는 아주 넓은 공간이에요.
    - term: 극지
      def: 남극과 북극처럼 지구에서 가장 추운 곳이에요.
    - term: 누리호
      def: 우리나라가 만든 우주 로켓이에요.
    - term: 궁금증
      def: 알고 싶은 마음이에요.
  standards:
    - code: "[2바02-04]"
      text: 새로운 활동에 호기심을 갖고 도전한다.
    - code: "[2슬02-04]"
      text: 궁금한 세계를 다양한 매체로 탐색한다.
    - code: "[2즐02-04]"
      text: 다양한 세상을 상상하고 표현한다.
  topics:
    - 우주
    - 바다
    - 달
    - 지구
    - 과학기술
    - 안전
stages:
  - name: 생각열기
    question: 어디로 탐험을 떠나 볼까?
  - name: 탐구하기
    question: 궁금한 세계를 어떻게 알아볼까?
  - name: 확장하기
    question: 알게 된 새로운 세상을 어떻게 상상하고 전할까?
