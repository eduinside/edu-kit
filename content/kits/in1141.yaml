quiz:
  - statement: 남극은 아주 추운 곳이에요.
    answer: O
    explain: 남극과 북극은 지구에서 가장 추운 곳이에요.
  - statement: 누리호는 우리나라가 만든 우주 로켓이에요.
    answer: O
    explain: 누리호는 우리나라 기술로 만들었어요.
  - statement: 궁금한 것은 책이나 영상으로도 알아볼 수 있어요.
    answer: O
    explain: 여러 방법으로 찾아보면 새로운 것을 알게 돼요.
  - statement: 바닷속에는 아무 생물도 살지 않아요.
    answer: X
    explain: 바닷속에는 여러 생물이 살아요.
  - statement: 탐험을 떠날 때는 아무것도 준비하지 않아도 돼요.
    answer: X
    explain: 필요한 물건과 안전을 미리 준비해요.
  - statement: 남극에는 사람이 한 번도 간 적이 없어요.
    answer: X
    explain: 남극에는 연구소가 있어서 사람들이 연구를 해요.
