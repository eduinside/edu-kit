id: pr6501
title: 데이터·인공지능
grade: 6
sem: 2학기
subject: 실과
unit: 디지털 사회와 인공지능
unit_no: 5
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 우리 생활 곳곳에는 숫자, 글자, 소리, 이미지 같은 데이터가 있고, 컴퓨터가 처리할 수 있게 바꾼 것이 디지털 데이터예요. 인공지능은 기계 학습으로 데이터에서 규칙을 스스로 찾아 새 자료를 판단하며, 우리 생활과 직업에 좋은 점과 걱정되는 점을 함께 줘요.
  core_question: 인공지능은 데이터를 어떻게 배우고, 우리 삶을 어떻게 바꿀까?
  concepts:
    - term: 데이터
      def: 관찰하거나 측정해서 모은 숫자, 글자, 소리, 사진 같은 자료예요. 컴퓨터는 데이터를 처리해서 필요한 정보를 얻어요.
    - term: 디지털 데이터
      def: 숫자뿐 아니라 글자, 소리, 이미지도 컴퓨터가 처리할 수 있게 0과 1로 바꾼 데이터예요. 이어서 변하는 값을 그대로 나타내는 아날로그 데이터와는 특징이 달라요.
    - term: 인공지능
      def: 사람처럼 배우고 판단하는 것 같은 일을 하도록 컴퓨터로 만든 기술이에요. 사진을 알아보거나 말을 알아듣는 일에 쓰여요.
    - term: 기계 학습
      def: 컴퓨터가 많은 데이터를 보고 스스로 규칙을 찾아내는 방법이에요. 이렇게 배운 규칙으로 처음 보는 데이터도 알아맞혀요.
    - term: 인공지능의 영향
      def: 인공지능이 우리 생활과 직업, 사회에 주는 좋은 점과 걱정되는 점을 함께 말해요. 편리해지는 만큼 사생활 보호, 책임, 저작권 같은 문제도 생각해야 해요.
  standards:
    - code: "[6실05-04]"
      text: 디지털 데이터와 아날로그 데이터의 특징을 이해하고, 인공지능에 활용할 수 있는 데이터의 유형이나 형태를 탐색한다.
    - code: "[6실05-05]"
      text: 인공지능이 만들어지는 과정을 체험하고, 인공지능이 사회에 미치는 영향을 탐색한다.
stages:
