quiz:
  - statement: 데이터에는 숫자뿐 아니라 글자와 소리, 이미지도 있다.
    answer: O
    explain: 데이터는 숫자, 글자, 소리, 이미지처럼 여러 모습으로 있어요.
  - statement: 바늘이 이어서 움직이는 시계는 디지털 방식이고 숫자로 보여 주는 시계는 아날로그 방식이다.
    answer: X
    explain: 바늘 시계는 이어서 변하는 아날로그 방식이고, 숫자 시계는 끊어진 값으로 보여 주는 디지털 방식이에요.
  - statement: 컴퓨터가 처리하는 데이터는 디지털 데이터이다.
    answer: O
    explain: 컴퓨터는 0과 1로 바꾼 디지털 데이터를 처리해요.
  - statement: 디지털 데이터는 숫자만 뜻하기 때문에 소리나 사진은 디지털 데이터가 될 수 없다.
    answer: X
    explain: 소리나 사진도 컴퓨터가 처리할 수 있게 바꾸면 디지털 데이터가 돼요.
  - statement: 기계 학습에서는 컴퓨터가 많은 데이터를 보고 스스로 규칙을 찾아낸다.
    answer: O
    explain: 사람이 규칙을 일일이 알려 주지 않아도 컴퓨터가 데이터에서 규칙을 찾아요.
  - statement: 인공지능은 사람이 모든 지식을 하나하나 입력해야만 만들 수 있다.
    answer: X
    explain: 기계 학습에서는 컴퓨터가 데이터를 학습해서 스스로 규칙을 만들어요.
  - statement: 인공지능을 학습시킬 때는 데이터의 질과 양이 모두 결과에 영향을 준다.
    answer: O
    explain: 데이터가 정확하고 알맞게 충분히 있어야 결과도 믿을 만해져요.
  - statement: 인공지능이 발달하면 모든 직업이 똑같이 사라진다.
    answer: X
    explain: 새로운 직업이 생기고 일하는 방식이 바뀌며 일부는 줄어들 수 있어요.
