id: in2211
title: 1. 계절
grade: 2
sem: 2학기
subject: 통합
unit: 1단원
unit_no: 1
flow: activity
sort_order: 1
published: false
intro:
  core_idea: 봄, 여름, 가을, 겨울마다 날씨와 자연, 우리 생활이 달라져요. 계절의 변화를 알고 건강하게 지내며 계절을 즐길 수 있어요.
  core_question: 계절이 바뀌면 우리 생활은 어떻게 달라질까?
  concepts:
    - term: 계절
      def: 봄, 여름, 가을, 겨울처럼 날씨가 비슷하게 이어지는 한 해의 때예요.
    - term: 날씨
      def: 맑음, 비, 눈처럼 그날그날의 하늘과 공기의 모습이에요.
    - term: 단풍
      def: 가을에 나뭇잎이 빨갛고 노랗게 변한 것이에요.
    - term: 입김
      def: 추운 날 입에서 나온 따뜻한 숨이 하얗게 보이는 것이에요.
  standards:
    - code: "[2바03-02]"
      text: 계절의 변화에 대응하며 생활한다.
    - code: "[2슬03-02]"
      text: 계절과 생활의 관계를 탐구한다.
    - code: "[2즐03-02]"
      text: 자연의 변화를 느끼며 놀이한다.
stages:
  - name: 생각열기
    question: 계절마다 무엇이 달라질까?
  - name: 탐구하기
    question: 계절에 따라 생활은 어떻게 달라질까?
  - name: 확장하기
    question: 계절을 건강하고 안전하게 즐기려면?
