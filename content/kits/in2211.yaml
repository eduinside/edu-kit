quiz:
  - statement: 한 해에는 봄, 여름, 가을, 겨울 네 계절이 있어요.
    answer: O
    explain: 계절마다 날씨와 자연이 달라요.
  - statement: 가을에는 나뭇잎 색이 변하는 나무가 많아요.
    answer: O
    explain: 가을에는 단풍이 들어요.
  - statement: 겨울에는 일 년 중 날씨가 가장 더워요.
    answer: X
    explain: 겨울은 일 년 중 가장 추운 계절이에요.
  - statement: 계절에 따라 입는 옷이 달라요.
    answer: O
    explain: 추울 때는 두꺼운 옷, 더울 때는 얇은 옷을 입어요.
  - statement: 여름에는 두꺼운 패딩을 입어요.
    answer: X
    explain: 여름에는 시원한 옷을 입어요.
