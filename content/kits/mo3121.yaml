quiz:
  - statement: 성실하게 사는 일의 값어치는 결과보다 과정의 정성과 노력에 있다.
    answer: O
    explain: 결과가 어떻든 정성을 다해 노력한 과정이 소중해요.
  - statement: 성실하게 노력하면 언제나 바라는 결과가 그대로 따라온다.
    answer: X
    explain: 결과는 바라는 대로 되지 않을 수도 있어요. 성실의 값어치는 과정의 정성과 노력에 있어요.
  - statement: 하루 목표를 세우고 구체적인 실천 계획을 짜면 성실하게 지내는 데 도움이 된다.
    answer: O
    explain: 무엇을 언제 할지 분명히 정하면 꾸준히 실천하기 쉬워요.
  - statement: 보는 사람이 없을 때는 나와 한 약속을 지키지 않아도 괜찮다.
    answer: X
    explain: 나와 한 약속도 소중해요. 누가 보지 않아도 스스로 지키는 것이 성실이에요.
  - statement: 인내와 정성, 최선은 서로 어울려 성실한 삶을 만든다.
    answer: O
    explain: 참고 견디는 마음에 정성과 최선이 더해질 때 성실하게 해낼 수 있어요.
  - statement: 성실은 힘든 일을 그저 참고 버티기만 하는 것이다.
    answer: X
    explain: 성실은 참는 데 그치지 않고 정성을 다해 최선으로 해내는 마음이에요.
  - statement: 맡은 일을 대충 하면 나중에 다시 해야 하거나 다른 사람이 어려워질 수 있다.
    answer: O
    explain: 맡은 일을 정성껏 해야 나도 다른 사람도 편해져요.
  - statement: 계획은 무리가 되더라도 최대한 빽빽하게 짜야 가장 좋다.
    answer: X
    explain: 계획은 내가 해낼 수 있도록 구체적이고 무리 없게 세워야 꾸준히 지킬 수 있어요.
