id: mo3121
title: 2. 성실하게 사는 삶
grade: 3
sem: 1학기
subject: 도덕
unit: 2단원
unit_no: 2
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 성실은 맡은 일과 나와 한 약속을 정성을 다해 끝까지 해내는 마음과 태도예요. 결과보다 과정의 정성과 노력이 중요하고, 계획을 세워 꾸준히 실천하면 나 자신과 한 약속을 지킬 수 있어요.
  core_question: 나는 어떤 목표와 계획으로 하루를 성실하게 보내고, 그 약속을 끝까지 지킬 수 있을까?
  concepts:
    - term: 성실
      def: 맡은 일이나 나와 한 약속을 정성을 다해 끝까지 해내려는 마음과 태도예요.
    - term: 정성
      def: 어떤 일을 할 때 온 마음을 기울여 꼼꼼하게 하려는 마음이에요.
    - term: 인내
      def: 힘들고 지루해도 참고 견디는 것이에요.
    - term: 최선
      def: 내가 할 수 있는 힘을 모두 다하는 것이에요.
    - term: 계획
      def: 해야 할 일을 언제 어떻게 할지 미리 정해 두는 것이에요.
  standards:
    - code: "[4도01-03]"
      text: 성실한 생활의 모범 사례를 탐색하고 시간 관리를 위한 생활을 계획하여 지속적인 자기 성장을 모색한다.
stages:
  - name: 생각열기
    question: 성실하다는 것은 무엇이고, 왜 성실하게 살아야 할까?
  - name: 탐구하기
    question: 성실하게 하루를 보내려면 어떤 계획과 실천이 필요할까?
  - name: 확장하기
    question: 성실하게 살아간 사람들에게서 무엇을 배울 수 있을까?
