id: so3211
title: 1-1. 사회 변화로 달라진 생활 모습
grade: 3
sem: 2학기
subject: 사회
unit: 1단원
unit_no: 1
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 최근의 사회 변화의 현상과 특징을 파악하고, 그로 인해 달라진 우리 생활 모습의 변화를 탐색하는 단원입니다.
  core_question: 사회 변화는 우리의 생활 모습과 문화를 어떻게 바꾸며, 우리는 서로 다른 문화를 어떻게 대해야 할까?
  concepts:
    - term: 사회변화
      def: 시간이 지나면서 사람들의 생활 모습과 사회의 모습이 달라지는 것이에요.
    - term: 저출산
      def: 태어나는 아이의 수가 예전보다 점점 줄어드는 현상이에요.
    - term: 고령화
      def: 전체 인구 가운데 노인이 차지하는 비율이 높아지는 현상이에요.
    - term: 지능정보화
      def: 인공지능과 정보통신 기술이 발달해 생활이 더 똑똑하고 편리해지는 변화예요.
  standards:
    - code: "[4사03-01]"
      text: 최근 사회 변화의 양상과 특징을 파악하고, 그로 인해 나타난 생활모습의 변화를 탐색한다.
stages:
  - 사회변화
  - 저출산
  - 고령화
  - 지능정보화
