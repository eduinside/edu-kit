id: mo5261
title: 6. 공동체를 정의롭게!
grade: 5
sem: 2학기
subject: 도덕
unit: 6단원
unit_no: 6
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 공동체의 규칙은 구성원이 공정한 절차로 함께 만들고 써 보며 고쳐 가는 약속이고, 공정한 규칙과 이를 지키려는 마음이 정의로운 공동체의 바탕이 돼요.
  core_question: 우리가 함께 지킬 규칙은 어떻게 만들어야 공정할까?
  concepts:
    - term: 규칙
      def: 여럿이 함께 살아갈 때 서로 지키기로 약속한 것이에요. 규칙이 있으면 다툼을 줄이고 모두가 편하게 지낼 수 있어요.
    - term: 공정
      def: 어느 한쪽으로 치우치지 않고 모든 사람을 똑같은 기준으로 대하는 것이에요. 규칙을 만들고 지킬 때 꼭 필요한 마음가짐이에요.
    - term: 합의
      def: 서로 다른 생각을 가진 사람들이 이야기를 나누어 모두가 받아들일 수 있는 결론에 이르는 것이에요.
    - term: 다수결
      def: 여러 사람의 의견이 갈릴 때 더 많은 사람이 고른 쪽으로 정하는 방법이에요. 적은 수의 의견도 충분히 들어 본 뒤에 써야 해요.
    - term: 정의
      def: 모든 사람이 공정하게 대우받고 마땅한 권리를 누리는 것을 말해요. 정의로운 공동체에서는 규칙과 법이 모두에게 똑같이 적용돼요.
    - term: 법
      def: 나라가 정해 모든 국민이 지키도록 한 규칙이에요. 사람들의 권리를 지키고 사회의 질서를 유지하게 해 줘요.
  standards:
    - code: "[6도03-02]"
      text: 정의에 관한 관심을 토대로 공동체 규칙의 중요성을 살펴보고 직접 공정한 규칙을 고안하며 기초적인 시민의식을 기른다.
stages:
  - name: 생각열기
    question: 공동체에는 규칙이 왜 필요할까?
  - name: 탐구하기
    question: 공정한 규칙은 어떤 절차로 함께 만들고 고쳐 갈까?
  - name: 확장하기
    question: 정의로운 공동체는 어떤 모습일까?
