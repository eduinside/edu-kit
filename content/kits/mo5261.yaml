quiz:
  - statement: 공동체의 규칙은 어른이 정해 주는 것이라서 구성원이 함께 만들 수 없다.
    answer: X
    explain: 규칙은 구성원이 함께 이야기하고 합의해서 만들 수 있고, 써 보다가 고치기도 해요.
  - statement: 규칙이 있으면 구성원 사이의 다툼을 줄이고 모두가 편하게 지낼 수 있다.
    answer: O
    explain: 규칙은 서로 지키기로 한 약속이라서 갈등을 줄이는 데 도움이 돼요.
  - statement: 한 번 정한 규칙은 완벽하므로 고치면 안 된다.
    answer: X
    explain: 규칙을 써 보면서 허점이 보이면 더 공정하게 고칠 수 있어요.
  - statement: 규칙을 만들 때는 그 규칙을 적용받는 사람의 처지에서 불이익이 없는지 살펴보아야 한다.
    answer: O
    explain: 공정한 규칙은 적용받는 모든 사람의 입장을 생각해서 만들어야 해요.
  - statement: 다수결로 정하면 소수의 의견은 들어 보지 않아도 된다.
    answer: X
    explain: 다수결을 하더라도 적은 수의 의견을 충분히 듣고 존중한 뒤에 정해야 해요.
  - statement: 합의는 서로 다른 생각을 가진 사람들이 이야기를 나누어 함께 받아들일 결론에 이르는 것이다.
    answer: O
    explain: 합의는 의견을 나누어 모두가 받아들일 수 있는 결론을 찾는 과정이에요.
  - statement: 공정한 규칙은 모든 사람을 똑같은 기준으로 대하는 규칙이다.
    answer: O
    explain: 공정은 한쪽으로 치우치지 않고 모두에게 같은 기준을 적용하는 거예요.
  - statement: 법은 나라가 정한 규칙이라서 사람들의 권리를 지키는 일과는 관계가 없다.
    answer: X
    explain: 법은 사람들의 권리를 지키고 사회의 질서를 유지하기 위해 만든 규칙이에요.
