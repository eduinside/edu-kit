id: so4221
title: 2-1. 지역의 문제와 해결
grade: 4
sem: 2학기
subject: 사회
unit: 2단원
unit_no: 2
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 생활 주변에서 찾을 수 있는 여러 가지 문제를 파악하고, 그 문제를 합리적으로 해결하는 능력을 기를 수 있는 단원입니다.
  core_question: 우리 지역의 문제는 어떻게 해결할 수 있으며, 지역의 가치는 어떻게 알릴 수 있을까?
  concepts:
    - term: 지역문제
      def: 우리 동네나 지역에서 사람들이 함께 겪으며 불편을 주는 어려움이에요. 주차난, 쓰레기 처리, 교통 혼잡처럼 여러 사람에게 영향을 주는 문제를 말해요.
    - term: 문제해결
      def: 지역의 문제를 찾아내고 그 까닭을 살펴본 뒤, 여러 의견을 모아 가장 알맞은 방법을 골라 실천하는 과정이에요. 주민들이 함께 참여할 때 더 잘 해결할 수 있어요.
  standards:
    - code: "[4사09-01]"
      text: 생활 주변에서 찾을 수 있는 여러 가지 문제를 파악하고, 그 문제를 합리적으로 해결하는 능력을 기른다.
stages:
  - 지역문제
  - 문제해결
