quiz:
  - statement: 디지털 공간에서도 화면 너머에 사람이 있으므로 서로 지켜야 할 예절이 있다.
    answer: O
    explain: 디지털 공간도 사람과 사람이 만나는 곳이라 예절이 필요해요.
  - statement: 인터넷은 현실이 아니므로 말을 함부로 해도 예절을 어기는 것이 아니다.
    answer: X
    explain: 인터넷에서도 사람과 사람이 만나기 때문에 예절을 지켜야 해요.
  - statement: 다른 사람이 만든 그림이나 영상을 허락 없이 가져다 쓰면 저작권을 해칠 수 있다.
    answer: O
    explain: 창작물을 만든 사람의 권리를 지키려면 허락을 받거나 쓸 수 있는 자료인지 확인해야 해요.
  - statement: 내려받거나 복사해도 원본이 그대로이니 만든 사람의 권리를 해치지 않는다.
    answer: X
    explain: 원본이 그대로여도 허락 없이 쓰면 만든 사람의 권리를 해쳐요.
  - statement: 이름, 전화번호, 주소는 개인 정보라서 함부로 알려 주지 않는 것이 좋다.
    answer: O
    explain: 개인 정보가 알려지면 나쁜 일에 쓰일 수 있어서 소중히 지켜야 해요.
  - statement: 화면으로 친구에게 한 험담은 직접 말하지 않았으니 사이버 폭력이 아니다.
    answer: X
    explain: 화면으로 한 말도 상대에게 상처를 주면 사이버 폭력이에요.
  - statement: 디지털 거리 두기는 디지털 기기를 알맞게 쓰고 지나친 의존을 줄이는 일이다.
    answer: O
    explain: 디지털 거리 두기는 필요한 만큼 알맞게 쓰며 지나친 의존을 줄이는 노력이에요.
  - statement: 디지털 거리 두기는 디지털 기기를 아예 쓰지 않는 것을 말한다.
    answer: X
    explain: 기기를 아예 쓰지 않는 것이 아니라 알맞게 쓰고 지나친 의존을 줄이는 일이에요.
