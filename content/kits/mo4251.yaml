id: mo4251
title: 5. 바람직한 디지털 사회
grade: 4
sem: 2학기
subject: 도덕
unit: 5단원
unit_no: 5
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 디지털 사회는 사이버 공간에서도 사람과 사람이 만나는 새로운 공동체라서 현실처럼 서로 지켜야 할 예절이 있어요. 저작권과 개인 정보를 지키고, 사이버 폭력을 하지 않으며 디지털 기기를 알맞게 쓰는 습관이 필요해요.
  core_question: 바람직한 디지털 사회를 만들기 위해 나는 어떤 마음가짐과 습관을 실천할 수 있을까?
  concepts:
    - term: 디지털 예절
      def: 인터넷과 스마트폰 같은 디지털 공간에서 다른 사람을 존중하며 지켜야 할 바른 태도예요. 화면 너머에도 사람이 있다는 것을 기억하는 것이에요.
    - term: 저작권
      def: 글, 그림, 음악, 영상처럼 누군가가 만든 창작물을 만든 사람이 가지는 권리예요. 다른 사람의 창작물을 함부로 가져다 쓰면 안 돼요.
    - term: 개인 정보
      def: 이름, 전화번호, 주소처럼 나를 알아볼 수 있게 하는 정보예요. 함부로 알려 주면 나쁜 일에 쓰일 수 있어서 소중히 지켜야 해요.
    - term: 사이버 폭력
      def: 인터넷이나 스마트폰에서 말, 글, 사진 등으로 다른 사람에게 상처를 주고 괴롭히는 일이에요. 화면 속에서도 마음은 아플 수 있어요.
    - term: 스마트폰 과의존
      def: 스마트폰 없이는 불안하거나 사용을 스스로 조절하기 어려워서 생활에 문제가 생기는 상태예요. 알맞게 쓰는 습관으로 줄일 수 있어요.
  standards:
    - code: "[4도03-02]"
      text: 디지털 사회에서 발생하는 다양한 문제를 살펴보고, 해결 방안을 탐구하여 정보통신 윤리에 대한 민감성을 기른다.
stages:
  - name: 생각열기
    question: 디지털 사회에서도 사람 사이의 예절이 왜 필요할까?
  - name: 탐구하기
    question: 새로운 기술에서 생기는 도덕 문제는 무엇이고 어떻게 해결할까?
  - name: 확장하기
    question: 바람직한 디지털 사회를 위해 나의 디지털 사용 습관을 어떻게 바꿀까?
