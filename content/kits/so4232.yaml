id: so4232
title: 3-2. 도시에서의 삶의 모습
grade: 4
sem: 2학기
subject: 사회
unit: 3단원
unit_no: 3
flow: flow
sort_order: 2
published: true
intro:
  core_idea: 여러 도시의 특징과 그곳에서 나타나는 생활 방식을 살펴보고, 도시에서의 다양한 삶의 모습을 알아보는 단원입니다.
  core_question: 지역마다 다른 환경은 사람들의 삶에 어떤 영향을 주며, 도시에서의 생활 모습은 어떻게 나타날까?
  concepts:
    - term: 도시
      def: 많은 사람이 모여 살며 회사, 가게, 공장 등이 발달한 곳이에요. 교통과 산업이 발달해서 일자리와 편의 시설이 많은 지역을 말해요.
    - term: 도시문제
      def: 많은 사람이 도시에 모여 살면서 생기는 어려움이에요. 쓰레기 증가, 집 부족, 교통 체증 같은 문제가 대표적이에요.
  standards:
    - code: "[4사10-02]"
      text: 사례에서 도시의 인구, 교통, 산업 등의 특징을 탐구하고, 도시에서의 삶의 모습을 이해한다.
stages:
  - 도시
  - 도시문제
