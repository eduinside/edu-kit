id: so6121
title: 2-1. 민주주의와 선거
grade: 6
sem: 1학기
subject: 사회
unit: 2단원
unit_no: 2
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 민주주의에서 시민의 주권 행사의 한 방법으로써 선거의 역할과 중요성을 파악하고, 이를 바탕으로 선거에 주체적으로 참여하는 태도를 기릅니다.
  core_question: 민주주의는 선거와 국가기관, 미디어를 통해 어떻게 실현되며, 시민은 어떻게 참여해야 할까?
  concepts:
    - term: 민주주의
      def: 나라의 주인이 국민이고, 국민이 나라의 중요한 일을 스스로 결정하는 정치 방식이에요. 우리가 뽑은 대표들이 국민의 뜻을 받들어 나라를 운영해요.
    - term: 선거
      def: 국민이 자신을 대신해 일할 대표를 투표로 뽑는 일이에요. 선거는 국민이 주권을 행사하는 중요한 방법이에요.
    - term: 공정선거
      def: 누구에게도 치우치지 않고 규칙을 똑같이 지켜서 깨끗하게 치르는 선거예요. 모든 후보와 유권자가 공평하게 대접받아요.
    - term: 공명선거
      def: 부정이나 속임수 없이 밝고 떳떳하게 치르는 선거예요. 돈이나 거짓말로 표를 얻지 않고 바르게 진행해요.
  standards:
    - code: "[6사08-01]"
      text: 민주주의에서 선거의 의미와 역할을 파악하고, 시민의 주권 행사를 위해 선거에 참여하는 태도를 기른다.
stages:
  - 민주주의
  - 선거
  - 공정선거
  - 공명선거
  - 기타
