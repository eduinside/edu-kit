id: sc6241
title: 4. 과학과 나의 진로
grade: 6
sem: 2학기
subject: 과학
unit: 4. 과학과 나의 진로
unit_no: 4
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 과학기술의 발달은 미래 사회의 모습과 직업에 영향을 미치며, 개인은 이러한 미래 사회의 모습과 새로운 진로를 탐색하며 자신의 삶을 준비한다.
  core_question: 과학기술의 발달로 변화하는 미래 사회에서 나는 어떤 진로를 설계하고 준비할 수 있는가?
  concepts:
    - term: 기능
      def: 어떤 대상이나 부분이 맡아 하는 역할이나 작용이에요.
    - term: 상호작용
      def: 둘 이상의 대상이 서로 영향을 주고받는 관계예요.
    - term: 미래사회
      def: 과학기술과 환경, 인구 등의 변화로 앞으로 나타날 사회의 모습이에요.
    - term: 문제
      def: 해결하거나 개선하기 위해 원인과 방법을 찾아야 하는 상황이에요.
    - term: 과학
      def: 관찰과 실험, 논리적인 추론으로 자연 현상을 이해하는 활동과 지식이에요.
    - term: 진로
      def: 자신의 흥미와 능력, 가치에 따라 앞으로 선택하고 발전시켜 갈 삶과 일의 방향이에요.
  standards:
    - code: "[6과16-01]"
      text: 미래 사회에 일어날 수 있는 문제를 조사하고, 문제를 해결하는 데 과학이 기여할 수 있는 방법을 토의할 수 있다.
    - code: "[6과16-02]"
      text: 다양한 진로가 과학과 관련됨을 알고, 자신의 진로를 과학과 관련지어 설명할 수 있다.
