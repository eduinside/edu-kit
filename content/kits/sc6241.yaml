    question: 미래의 우리 사회는 어떻게 변할까요?
  - name: 탐구하기1
    question: 미래엔 어떤 사회 문제가 발생할까요?
  - name: 탐구하기2
    question: 미래 사회의 문제를 어떻게 과학으로 해결할 수 있을까요?
  - name: 확장하기
    question: 미래엔 과학의 발달로 직업에 어떤 변화가 생길까요?
