id: so6211
title: 1-1. 세계 여러 지역의 지형과 생활 모습
grade: 6
sem: 2학기
subject: 사회
unit: 1. 세계의 자연환경
unit_no: 1
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 지형은 인간의 생활 방식에 영향을 미치며, 이는 다양한 삶의 모습으로 나타난다.
  core_question: 세계의 다양한 지형은 사람들의 생활 방식에 어떤 영향을 주는가?
  concepts:
    - term: 공간과 장소
      def: 사람들이 살아가고 활동하며 의미를 만들어 가는 지표면의 일정한 범위예요.
    - term: 상호작용
      def: 둘 이상의 대상이 서로 영향을 주고받는 관계예요.
    - term: 지형
      def: 산지, 평야, 해안처럼 땅 표면에 나타나는 여러 가지 모양이에요.
    - term: 환경
      def: 사람과 생물을 둘러싸고 생활에 영향을 주는 자연적·사회적 조건이에요.
    - term: 생활
      def: 사람들이 살아가며 하는 일과 의식주를 포함한 일상 활동이에요.
  standards:
    - code: "[6사10-01]"
      text: 세계의 여러 지역의 지형 경관을 살펴보고, 이를 통해 다양한 삶의 모습을 이해한다.
stages:
