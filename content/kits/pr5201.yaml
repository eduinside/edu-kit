id: pr5201
title: 생활 자원·생활 공간 관리
grade: 5
sem: 2학기
subject: 실과
unit: 생활환경과 지속가능한 선택
unit_no: 2
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 시간과 용돈 같은 생활 자원은 한정되어 있어서 계획을 세워 알맞게 써야 해요. 내가 지내는 공간도 정리 정돈과 청소, 쓰레기 분리배출로 깨끗하게 가꾸면 건강과 환경에 도움이 돼요.
  core_question: 한정된 시간과 용돈을 어떻게 알뜰하게 쓰고, 내가 지내는 공간을 어떻게 쾌적하게 관리할 수 있을까?
  concepts:
    - term: 생활 자원
      def: 생활에 쓰이는 시간, 용돈, 물건, 지식, 건강, 협동심 같은 것들을 말해요. 눈에 보이지 않는 것도 있고, 양이 한정되어 있어요.
    - term: 시간 관리
      def: 하루나 일주일의 시간을 목표를 정하고 계획을 세워 알맞게 쓰는 일이에요. 중요한 일을 먼저 하면 도움이 돼요.
    - term: 용돈 관리
      def: 한정된 용돈을 계획을 세워 쓰고 기입장에 적어 점검하는 일이에요. 꼭 필요한 것을 먼저 고르는 것이 중요해요.
    - term: 정리 정돈
      def: 정리는 필요 없는 것을 줄이는 일이고, 정돈은 쓰기 쉽게 제자리에 놓는 일이에요. 둘을 함께 하면 공간이 깨끗해져요.
    - term: 분리배출
      def: 쓰레기를 종류별로 나누어 정해진 방법으로 버리는 일이에요. 잘 나누어 버리면 재활용할 수 있어요.
  standards:
    - code: "[6실02-01]"
      text: 시간이나 용돈과 같은 생활자원이 제한되어 있음을 이해하고, 생활자원의 사용가치를 높이는 방법을 탐색한다.
    - code: "[6실02-02]"
      text: 생활자원 관리의 필요성을 인식하고, 생활자원의 합리적인 보관과 활용방법을 익힌다.
    - code: "[6실02-10]"
      text: 자신의 생활공간을 쾌적하고 위생적으로 관리하는 것의 중요성을 알고, 정리정돈과 청소 및 쓰레기 처리의 방법을 익혀 실천한다.
stages:
  - name: 생각열기
    question: 생활 자원은 무엇이고 왜 관리해야 할까?
  - name: 탐구하기1
    question: 시간과 용돈을 어떻게 계획하고 쓸까?
  - name: 탐구하기2
    question: 생활 공간을 어떻게 정리하고 쓰레기를 처리할까?
  - name: 확장하기
    question: 생활 자원과 공간을 앞으로도 잘 관리하려면 어떻게 해야 할까?
