quiz:
  - statement: 시간과 용돈은 한정되어 있어서 계획을 세워 쓰는 것이 좋다.
    answer: O
    explain: 한정된 자원은 어떻게 쓰느냐에 따라 쓸모가 크게 달라져요.
  - statement: 생활 자원은 돈과 물건처럼 눈에 보이는 것만 해당한다.
    answer: X
    explain: 시간, 지식, 건강, 협동심처럼 눈에 보이지 않는 것도 생활 자원이에요.
  - statement: 시간 관리는 목표를 정하고 계획과 실천, 평가의 순서로 해 볼 수 있다.
    answer: O
    explain: 평가까지 하면 다음 계획을 더 잘 세울 수 있어요.
  - statement: 용돈 관리는 무조건 쓰지 않고 아끼는 것을 뜻한다.
    answer: X
    explain: 꼭 필요한 것과 갖고 싶은 것을 가려 우선순위에 따라 쓰는 것이 용돈 관리예요.
  - statement: 용돈 기입장을 쓰면 용돈을 어디에 썼는지 알고 다음 계획에 쓸 수 있다.
    answer: O
    explain: 쓴 돈을 적어 두면 쓰임새를 돌아보고 고칠 수 있어요.
  - statement: 정리와 정돈은 똑같은 뜻이다.
    answer: X
    explain: 정리는 필요 없는 것을 줄이는 일이고, 정돈은 쓰기 쉽게 제자리에 놓는 일이에요.
  - statement: 청소할 때는 창문을 열어 환기하는 것이 좋다.
    answer: O
    explain: 먼지를 줄이고 공기를 맑게 하려고 환기를 해요.
  - statement: 쓰레기는 종류와 상관없이 한 봉투에 담아 버려도 재활용된다.
    answer: X
    explain: 재활용하려면 종류별로 나누어 정해진 방법으로 버려야 해요.
