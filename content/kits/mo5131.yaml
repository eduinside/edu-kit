id: mo5131
title: 3. 함께 사는 세상, 봉사하는 우리
grade: 5
sem: 1학기
subject: 도덕
unit: 3단원
unit_no: 3
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 봉사는 대가를 바라지 않고 이웃과 사회를 돕는 일이에요. 도움이 필요한 사람의 상황에 관심을 가지고 계획을 세워 꾸준히 실천하면 나와 우리 모두에게 좋은 변화가 생겨요.
  core_question: 도움이 필요한 이웃을 위해 나는 어떤 봉사를 계획하고 꾸준히 실천할 수 있을까?
  concepts:
    - term: 봉사
      def: 대가를 바라지 않고 이웃이나 사회를 위해 힘과 시간, 재능을 내어 돕는 일이에요.
    - term: 나눔
      def: 내가 가진 물건, 시간, 재능, 마음을 다른 사람과 함께 나누는 것이에요.
    - term: 이웃
      def: 가까이 사는 사람뿐 아니라 우리와 함께 살아가는 사람들을 말해요. 멀리 사는 사람도 도움이 필요하면 이웃이 될 수 있어요.
    - term: 자원봉사
      def: 자기가 스스로 원해서 아무 대가 없이 다른 사람과 사회를 위해 하는 봉사 활동이에요.
    - term: 실천
      def: 실천은 알게 된 것을 생각으로만 그치지 않고 직접 행동으로 옮기는 것이에요. 계획한 봉사를 직접 해 보는 것도 실천이에요.
  standards:
    - code: "[6도02-01]"
      text: 봉사의 의미와 중요성을 이해하고, 타인이 처한 상황과 환경에 대한 주의 깊은 관심을 바탕으로 봉사를 실천한다.
stages:
  - name: 생각열기
    question: 봉사란 무엇이고 왜 필요할까?
  - name: 탐구하기
    question: 도움이 필요한 이웃은 누구이고, 어떻게 봉사를 계획하고 실천할까?
  - name: 확장하기
    question: 봉사를 꾸준히 이어 가려면 어떤 마음과 방법이 필요할까?
