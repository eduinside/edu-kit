quiz:
  - statement: 봉사는 대가를 바라지 않고 이웃이나 사회를 돕는 일이다.
    answer: O
    explain: 봉사는 보상이나 칭찬을 바라지 않고 마음에서 우러나 돕는 일이에요.
  - statement: 칭찬이나 상을 받으려고 하는 일도 참된 봉사이다.
    answer: X
    explain: 참된 봉사는 칭찬이나 상 같은 대가를 바라지 않고 하는 일이에요.
  - statement: 도움이 필요한 이웃은 가까운 곳뿐 아니라 다른 나라에도 있다.
    answer: O
    explain: 도움이 필요한 사람은 우리 동네뿐 아니라 먼 나라에도 있어요.
  - statement: 물건이나 돈이 많아야만 봉사나 나눔을 할 수 있다.
    answer: X
    explain: 시간과 재능, 따뜻한 마음으로도 봉사와 나눔을 할 수 있어요.
  - statement: 봉사를 할 때는 목표와 역할, 기간을 정해 계획을 세우면 도움이 된다.
    answer: O
    explain: 계획을 세우면 누구와 무엇을 언제까지 할지 분명해져서 꾸준히 실천하기 쉬워요.
  - statement: 멀리 사는 사람은 나와 상관없는 남이라서 도울 필요가 없다.
    answer: X
    explain: 멀리 사는 사람도 함께 살아가는 이웃이에요. 도움이 필요하면 관심을 가질 수 있어요.
  - statement: 자원봉사센터는 봉사할 곳을 알아보고 봉사 활동을 연결해 주는 곳이다.
    answer: O
    explain: 자원봉사를 하고 싶을 때 자원봉사센터에서 정보를 얻고 도움을 받을 수 있어요.
  - statement: 봉사는 한 번 하면 충분해서 돌아보거나 고칠 점을 찾을 필요가 없다.
    answer: X
    explain: 봉사를 한 뒤에는 돌아보고 고칠 점을 찾아 다음 봉사에 이어 가야 해요.
