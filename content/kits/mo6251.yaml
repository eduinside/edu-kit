quiz:
  - statement: 통일은 땅과 제도를 합치는 일만이 아니라 남북 사람들의 마음이 하나가 되는 일도 포함한다.
    answer: O
    explain: 통일을 준비할 때는 제도뿐 아니라 서로를 이해하고 존중하는 마음도 함께 키워야 해요.
  - statement: 남한과 북한은 같은 점이 전혀 없고 다른 점만 있다.
    answer: X
    explain: 남북은 같은 말과 오랜 역사를 나누어 온 점이 있어서 같은 점과 다른 점을 함께 살펴봐야 해요.
  - statement: 분단 때문에 서로 헤어져 만나지 못하는 가족을 이산가족이라고 한다.
    answer: O
    explain: 이산가족은 분단과 전쟁 때문에 소식도 모른 채 가족을 만나지 못하는 사람들이에요.
  - statement: 남북은 분단된 뒤 오랜 시간이 지나도 낱말과 말투가 달라지지 않았다.
    answer: X
    explain: 오랫동안 떨어져 지내면서 낱말과 쓰임이 달라진 경우가 있어서 서로 이해하려는 노력이 필요해요.
  - statement: 남북 교류는 체육, 문화, 경제 같은 여러 분야에서 서로 만나고 협력하는 일이다.
    answer: O
    explain: 남북 어린이 축구 교류처럼 서로 만나는 경험이 마음의 벽을 낮추는 데 도움이 돼요.
  - statement: 북한이탈주민 친구는 우리와 다른 사람이므로 함께 어울리지 않는 것이 좋다.
    answer: X
    explain: 북한이탈주민도 같은 말을 쓰는 이웃이라서 서로 존중하고 배려하며 지내야 해요.
  - statement: 우리나라는 6.25 전쟁을 거치며 남과 북으로 나뉘어 서로 자유롭게 오가지 못하게 되었다.
    answer: O
    explain: 6.25 전쟁 뒤로 남북이 나뉘어 지금까지 이어지고 있어요.
  - statement: 통일 뒤에 생길 어려움은 말하지 않고 좋은 점만 이야기하는 것이 바람직한 통일 준비이다.
    answer: X
    explain: 통일 뒤 어려움도 솔직히 살펴보고 풀 방법을 함께 찾는 것이 바람직한 준비예요.
