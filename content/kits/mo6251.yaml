id: mo6251
title: 5. 통일 한반도의 어느 날
grade: 6
sem: 2학기
subject: 도덕
unit: 5단원
unit_no: 5
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 통일은 땅과 제도를 합치는 일일 뿐 아니라 남북 사람들의 마음이 하나가 되는 일이에요. 남북이 같은 점과 다른 점을 이해하고 서로 존중하며 교류해 가는 것이 통일을 준비하는 첫걸음이에요.
  core_question: 남북 사람들이 마음을 모아 통일을 준비하려면 우리는 무엇을 이해하고 실천해야 할까?
  concepts:
    - term: 통일
      def: 남북으로 나뉜 한반도가 하나의 나라가 되는 것이에요. 땅과 제도뿐 아니라 사람들의 마음도 하나가 되어야 해요.
    - term: 분단
      def: 하나였던 나라가 둘로 나뉘어 서로 자유롭게 오가지 못하는 상태를 말해요. 우리나라는 6.25 전쟁을 거치며 남과 북으로 갈라졌어요.
    - term: 이산가족
      def: 분단이나 전쟁 때문에 서로 헤어져 소식도 모르고 만나지 못하는 가족이에요.
    - term: 남북 교류
      def: 남한과 북한이 사람, 문화, 경제, 체육 같은 여러 분야에서 서로 오가며 만나고 협력하는 일이에요.
    - term: 북한이탈주민
      def: 북한을 떠나 우리나라에 와서 사는 사람들이에요. 같은 말을 쓰는 이웃으로 서로 존중하며 지내야 해요.
    - term: 평화
      def: 전쟁이나 폭력이 없고 서로의 권리와 안전이 존중되는 상태예요.
  standards:
    - code: "[6도03-03]"
      text: 통일과정과 통일 이후 사회의 여러 가지 상황을 예상하고 바람직한 통일과정과 통일 국가의 사회상을 제시한다.
