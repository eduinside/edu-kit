quiz:
  - statement: 아동기에는 몸뿐 아니라 마음과 친구 관계도 함께 자란다.
    answer: O
    explain: 몸이 자라는 것과 함께 생각과 감정, 사람들과 어울리는 힘도 자라요.
  - statement: 친구보다 몸이 일찍 자라거나 늦게 자라면 어딘가 문제가 있는 것이다.
    answer: X
    explain: 발달 속도는 사람마다 달라서 빠르거나 늦어도 자연스러운 과정이에요.
  - statement: 키가 자라는 데는 잠, 영양, 운동 같은 생활 습관이 영향을 준다.
    answer: O
    explain: 잘 자고 골고루 먹고 몸을 움직이는 습관이 성장에 도움이 돼요.
  - statement: 건강하게 자란다는 것은 키와 몸무게가 늘어나는 것만을 뜻한다.
    answer: X
    explain: 몸뿐 아니라 마음과 사람들과의 관계도 고르게 자라는 것이 건강한 발달이에요.
  - statement: 자기 관리 계획은 바로 해 볼 수 있는 작은 일부터 세우는 것이 좋다.
    answer: O
    explain: 작은 일부터 시작해야 꾸준히 실천하기 쉬워요.
  - statement: 자기 관리는 목표만 세우면 실천하거나 점검하지 않아도 된다.
    answer: X
    explain: 목표를 세우고 계획해서 실천한 뒤 평가까지 해야 자기 관리가 이어져요.
  - statement: 스마트폰을 오래 쓰는 습관은 자세와 눈, 생활 리듬에 영향을 줄 수 있다.
    answer: O
    explain: 그래서 사용 시간을 정하고 바른 자세로 쓰는 습관이 필요해요.
  - statement: 사춘기의 몸 변화는 놀림거리로 삼아도 된다.
    answer: X
    explain: 몸의 변화는 누구나 겪는 자연스러운 일이라 서로 존중해야 해요.
