id: pr5101
title: 아동기 발달·자기 관리
grade: 5
sem: 1학기
subject: 실과
unit: 인간 발달과 주도적 삶
unit_no: 1
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 아동기에는 몸과 마음, 사람들과의 관계가 함께 자라요. 자라는 속도는 사람마다 달라서, 나에게 맞는 자기 관리 방법을 찾아 작은 것부터 꾸준히 실천하는 것이 중요해요.
  core_question: 몸과 마음이 건강하게 자라기 위해 나는 어떤 자기 관리를 계획하고 실천할 수 있을까?
  concepts:
    - term: 아동기
      def: 어린이로 자라는 시기로, 초등학교에 다니는 때가 여기에 들어가요. 이 시기에는 몸과 마음이 빠르게 자라요.
    - term: 발달
      def: 몸이 자라고, 생각과 마음, 다른 사람과 어울리는 힘이 점점 나아지는 것이에요.
    - term: 발달의 개인차
      def: 자라는 속도와 모습이 사람마다 다른 것이에요. 친구보다 빠르거나 늦어도 잘못된 것이 아니에요.
    - term: 자기 관리
      def: 건강하게 자라도록 내 생활을 스스로 돌보고 조절하는 것이에요. 목표를 세워 계획하고 실천하는 일이 들어가요.
    - term: 생활 습관
      def: 날마다 되풀이해서 몸에 밴 행동이에요. 잠자기, 먹기, 몸 움직이기, 스마트폰 쓰기가 모두 생활 습관이에요.
  standards:
    - code: "[6실01-01]"
      text: 아동기의 발달 특징을 이해하고 성장발달에 필요한 조건과 방법을 탐색한다.
    - code: "[6실01-02]"
      text: 건강한 발달을 위한 자기 관리 방법을 탐색하고, 일상생활 속에서 올바른 생활습관과 태도를 갖도록 계획하여 실천한다.
stages:
  - name: 생각열기
    question: 나는 지금 어떻게 자라고 있을까?
  - name: 탐구하기
    question: 몸과 마음이 고르게 자라려면 무엇이 필요할까?
  - name: 확장하기
    question: 나에게 필요한 자기 관리를 어떻게 계획하고 실천할까?
