quiz:
  - statement: 탄소 중립은 우리가 내보내는 이산화탄소의 양을 숲이 흡수하거나 사람이 없애는 양과 맞추어 실제로 늘어나는 양을 0으로 만드는 것이다.
    answer: O
    explain: 내보낸 만큼 흡수하거나 없애서, 더하고 뺀 결과가 0이 되게 하는 것이 탄소 중립이에요.
  - statement: 기후 위기는 자연이 저절로 바뀐 탓이라서 사람의 활동과는 관계가 없다.
    answer: X
    explain: 기후 위기의 큰 원인은 에너지를 많이 쓰고 쓰레기를 많이 내놓는 사람의 활동이에요.
  - statement: 헌 양말의 양말목으로 새로운 물건을 만드는 것처럼, 버려질 물건에 새로운 쓸모를 더하는 것을 새 활용이라고 한다.
    answer: O
    explain: 새 활용(업사이클링)은 버려질 물건에 새로운 쓸모와 가치를 더하는 일이에요.
  - statement: 한 사람이 일회용품을 조금 줄이는 것은 전체로 보면 아무 차이도 만들지 못한다.
    answer: X
    explain: 한 사람의 실천은 작아 보여도 여럿이 꾸준히 이어 가면 큰 변화가 돼요.
  - statement: 빈 교실의 불을 끄는 것처럼 학교에서도 탄소를 줄이는 일을 할 수 있다.
    answer: O
    explain: 빈 교실 불 끄기는 전기를 아껴 탄소를 줄이는 작은 실천이에요.
  - statement: 물건이 만들어지고 버려지는 과정에서는 탄소가 생기지 않는다.
    answer: X
    explain: 물건을 만들고, 옮기고, 쓰고, 버리는 단계마다 탄소가 생겨요.
  - statement: 플로깅은 달리거나 걸으면서 쓰레기를 줍는 활동이다.
    answer: O
    explain: 운동하면서 쓰레기를 주워 우리 둘레를 깨끗하게 만드는 실천이에요.
  - statement: 지속가능한 발전은 지금 사람들이 자원을 마음껏 쓰고, 뒤에 올 사람들은 생각하지 않는 것이다.
    answer: X
    explain: 지속가능한 발전은 지금 사람도 앞으로 올 사람도 환경과 자원을 누릴 수 있게 이어 가는 것이에요.
