id: mo5271
title: 7. 지구의 내일을 심는 우리
grade: 5
sem: 2학기
subject: 도덕
unit: 7단원
unit_no: 7
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 지구 환경 위기의 원인은 사람의 활동에 있고, 여럿이 꾸준히 이어 가는 작은 실천이 위기를 이겨 내는 힘이 돼요.
  core_question: 지구의 위기를 알게 된 우리는 오늘 무엇부터 실천할 수 있을까?
  concepts:
    - term: 기후 위기
      def: 사람의 활동 때문에 지구의 기온과 날씨가 크게 달라져서 우리 삶과 자연이 위험해지는 일이에요. 요즘 더 자주 겪는 폭염과 큰 홍수가 그 모습이에요.
    - term: 탄소 중립
      def: 우리가 내보내는 이산화탄소의 양을, 숲이 흡수하거나 사람이 없애는 양과 똑같이 맞추어 실제로 늘어나는 양을 0으로 만드는 것이에요.
    - term: 새 활용(업사이클링)
      def: 버려질 물건을 그대로 다시 쓰는 데서 나아가 새로운 쓸모와 가치를 더해 다른 물건으로 만드는 일이에요. 헌 양말목으로 공예품을 만드는 것이 그 예예요.
    - term: 지속가능
      def: 지금 우리가 자원과 환경을 쓰면서도, 앞으로 올 사람들이 쓸 몫이 줄어들지 않게 이어 가는 것이에요.
    - term: 실천
      def: 실천은 알게 된 것을 생각으로만 그치지 않고 직접 행동으로 옮기는 것이에요. 지구를 위해 빈 교실 불을 끄거나 일회용품을 줄이는 일이 환경을 위한 실천이에요.
  standards:
    - code: "[6도04-01]"
      text: 지구의 환경 위기 상황을 이해하고, 이를 극복하기 위한 다양한 방안을 찾아 자신의 일상에서 실천하고자 노력한다.
stages:
  - name: 생각열기
    question: 지구는 지금 어떤 위기를 겪고 있을까?
  - name: 탐구하기
    question: 위기의 뿌리는 어디에 있고, 사람들은 어떻게 이겨 내고 있을까?
  - name: 확장하기
    question: 나의 작은 실천은 어떤 변화를 만들까?
