quiz:
  - statement: 옷감은 섬유로 만든 실을 짜거나 엮어서 만든다.
    answer: O
    explain: 섬유로 실을 만들고 그 실을 짜거나 엮으면 옷감이 돼요.
  - statement: 목화솜은 석유로 만든 합성 섬유이다.
    answer: X
    explain: 목화솜은 식물에서 얻는 천연 섬유예요. 나일론처럼 사람이 만든 섬유가 합성 섬유예요.
  - statement: 바느질을 시작하고 끝낼 때는 실이 풀리지 않도록 매듭을 짓는다.
    answer: O
    explain: 시작 매듭과 끝 매듭이 있어야 바느질한 부분이 풀리지 않아요.
  - statement: 바느질에 쓰는 바늘은 손바늘 한 가지뿐이다.
    answer: X
    explain: 손바늘뿐 아니라 대바늘, 코바늘처럼 여러 가지가 있고 도구마다 만들 수 있는 용품이 달라요.
  - statement: 바늘과 시침핀은 끝이 아래를 향하게 조심해서 다루고 장난치지 않는다.
    answer: O
    explain: 날카로운 도구는 찔리거나 다칠 수 있어서 조심해서 다뤄야 해요.
  - statement: 모든 옷감은 똑같은 방식으로 만들어진다.
    answer: X
    explain: 청바지 원단은 실을 엇갈려 짜고 양말은 고리를 엮어 만드는 것처럼 옷감마다 만드는 방식이 달라요.
  - statement: 뜨개질을 할 때는 실을 일정한 힘으로 당겨야 고르게 뜰 수 있다.
    answer: O
    explain: 실을 너무 세게 당기면 뜨기 어려워져요. 일정한 힘으로 당기도록 연습해요.
  - statement: 직접 만드는 생활용품은 책에 나온 예시와 똑같이 만들어야 한다.
    answer: X
    explain: 쓰고 싶은 용품을 스스로 구상해서 만들 수 있어요. 나만의 창의적인 작품도 소중해요.
