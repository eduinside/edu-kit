id: pr6202
title: 의생활 용품 만들기
grade: 6
sem: 1학기
subject: 실과
unit: 생활환경과 지속가능한 선택
unit_no: 2
flow: flow
sort_order: 2
published: true
intro:
  core_idea: 옷과 생활용품은 섬유로 실을 만들고, 실로 옷감을 만든 뒤, 옷감을 자르고 꿰매어 완성돼요. 바느질과 뜨개질 도구를 알고 쓰고 싶은 용품을 구상해 직접 만들어 쓰면 만드는 즐거움과 창의적인 태도를 키울 수 있어요.
  core_question: 옷과 용품은 어떤 과정을 거쳐 만들어지고, 나는 어떤 도구와 재료로 생활용품을 만들 수 있을까?
  concepts:
    - term: 섬유와 옷감
      def: 섬유는 옷감의 원료가 되는 가늘고 긴 재료예요. 목화솜 같은 천연 섬유와 나일론 같은 합성 섬유가 있고, 섬유로 실을 만든 뒤 그 실을 짜거나 엮어서 옷감을 만들어요.
    - term: 옷이 만들어지는 과정
      def: 섬유로 실을 만들고, 실로 옷감을 만들고, 옷감을 자르고 꿰매어 옷으로 완성하는 순서예요. 옷감은 실을 엇갈려 짜는 방법이나 고리를 엮는 방법 등으로 만들어요.
    - term: 손바느질
      def: 바늘과 실로 직접 꿰매는 방법이에요. 매듭을 짓고 홈질, 박음질 같은 바느질로 옷을 만들거나 고쳐요.
    - term: 뜨개질
      def: 뜨개바늘로 실을 엮어 옷감이나 용품을 만드는 일이에요. 대바늘이나 코바늘로 처음 코를 만들고 실을 일정한 힘으로 당기며 떠요.
    - term: 생활용품 만들기
      def: 쓰고 싶은 물건을 스스로 구상해 알맞은 도구와 재료를 골라 직접 만드는 일이에요. 주머니나 카드 지갑처럼 바느질로 쓸모 있는 물건을 만들 수 있어요.
  standards:
    - code: "[6실02-07]"
      text: 의생활 용품이 만들어지는 과정을 탐색하여 옷이나 생활용품이 어떻게 구성되는지를 설명한다.
    - code: "[6실02-08]"
      text: 다양한 도구와 재료를 활용하여 간단한 생활용품을 만들어 보면서 직접 만들어 쓰는 즐거움과 창의적 태도를 가진다.
