published: true
intro:
  core_idea: 지역별 인구 분포 탐구를 통해 우리나라 인구 분포의 특징을 이해하고, 인구 분포 불균형의 원인, 문제, 그리고 이를 해결하려는 노력을 알아보며 국토 균형 발전의 중요성을 인식하도록 합니다.
  core_question: 우리나라의 기후와 인구 분포는 어떤 특징을 지니며, 그로 인해 나타나는 문제는 어떻게 해결할 수 있을까?
  concepts:
    - term: 인구
      def: 한 나라나 지역에 살고 있는 사람의 수를 말해요.
    - term: 인구 분포
      def: 사람들이 여러 지역에 어떻게 흩어져 살고 있는지를 나타낸 모습이에요. 어떤 곳은 사람이 많고 어떤 곳은 적어요.
    - term: 인구 집중
      def: 사람들이 한 지역에 많이 모여서 사는 것을 말해요. 우리나라는 서울 같은 도시에 사람이 많이 모여 있어요.
    - term: 국토 균형 발전
      def: 어느 한 지역에만 사람과 시설이 몰리지 않도록, 나라의 여러 지역이 고르게 잘 발전하도록 하는 것이에요.
  standards:
    - code: "[6사02-02]"
      text: 우리나라의 지역별 인구 분포의 특징을 알아보고, 이에 따른 문제점과 해결 방안을 탐색한다.
