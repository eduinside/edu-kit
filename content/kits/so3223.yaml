id: so3223
title: 2-3. 통신 수단의 변화와 달라진 생활 모습
grade: 3
sem: 2학기
subject: 사회
unit: 2단원
unit_no: 2
flow: flow
sort_order: 3
published: true
intro:
  core_idea: 옛날과 오늘날의 통신수단을 살펴보고, 통신수단의 변화에 따라 사람들의 정보 교류와 의사소통 방식이 어떻게 달라졌는지 알아보는 단원입니다.
  core_question: 옛날과 오늘날을 비교하면 사람들의 생활 모습은 어떻게 달라졌으며, 그렇게 변화한 까닭은 무엇일까?
  concepts:
    - term: 통신수단
      def: 멀리 떨어진 사람에게 소식이나 정보를 주고받기 위해 사용하는 방법이나 도구예요. 편지, 전화, 스마트폰 등이 통신수단이에요.
    - term: 통신수단의 발달
      def: 옛날에서 오늘날로 오면서 통신수단이 점점 더 빠르고 편리하게 바뀌어 온 것을 말해요. 발달할수록 더 멀리, 더 빨리 소식을 전할 수 있어요.
    - term: 과거의 통신수단
      def: 옛날 사람들이 소식을 전하던 방법으로, 봉수, 파발, 신호연, 편지 같은 것이 있어요. 오늘날보다 시간이 오래 걸리고 전하기 어려웠어요.
    - term: 미래의 통신수단
      def: 앞으로 더 발전할 통신수단으로, 인공지능 로봇이나 모든 기기가 연결되는 스마트 기술 같은 것이 있어요. 지금보다 더 편리하게 정보를 주고받게 될 거예요.
  standards:
    - code: "[4사04-03]"
      text: 옛날부터 오늘날까지 통신수단의 변화에 따른 정보 교류와 의사소통 방식의 변화를 설명한다.
