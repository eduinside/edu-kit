quiz:
  - statement: 태극기는 우리나라를 나타내는 깃발이에요.
    answer: O
    explain: 태극기에는 우리나라의 뜻이 담겨 있어요.
  - statement: 무궁화는 우리나라를 대표하는 꽃이에요.
    answer: O
    explain: 무궁화는 우리나라 꽃이에요.
  - statement: 한글은 외국에서 들어온 글자예요.
    answer: X
    explain: 한글은 세종대왕이 만든 우리나라 글자예요.
  - statement: 추석은 우리나라의 명절이에요.
    answer: O
    explain: 추석에는 가족이 모여 함께 지내요.
  - statement: 아리랑은 다른 나라의 노래예요.
    answer: X
    explain: 아리랑은 우리나라 대표 민요예요.
  - statement: 태극기는 마음대로 다른 모양과 색으로 그려도 돼요.
    answer: X
    explain: 태극기는 정해진 모양과 색으로 그려야 해요.
  - statement: 한복은 우리나라 고유의 옷이에요.
    answer: O
    explain: 한복은 우리나라 사람들이 오래전부터 입어 온 옷이에요.
