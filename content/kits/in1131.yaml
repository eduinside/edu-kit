id: in1131
title: 3. 우리나라
grade: 1
sem: 1학기
subject: 통합
unit: 3단원
unit_no: 3
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 우리나라에는 태극기, 무궁화, 한글처럼 소중한 것이 많아요. 우리나라의 놀이와 노래, 명절을 알고 즐기면 우리나라를 더 사랑하게 돼요.
  core_question: 우리나라의 소중한 것은 무엇일까?
  concepts:
    - term: 태극기
      def: 우리나라를 나타내는 깃발이에요.
    - term: 무궁화
      def: 우리나라를 대표하는 꽃이에요.
    - term: 한글
      def: 세종대왕이 만든 우리나라 글자예요.
    - term: 명절
      def: 설날, 추석처럼 해마다 가족이 함께 즐기는 특별한 날이에요.
    - term: 민요
      def: 옛날부터 사람들이 불러 온 노래예요.
  standards:
    - code: "[2바02-02]"
      text: 우리나라의 소중함을 알고 사랑하는 마음을 기른다.
    - code: "[2슬02-02]"
      text: 우리나라의 모습이나 문화를 조사한다.
    - code: "[2즐02-02]"
      text: 우리나라의 문화 예술을 즐긴다.
stages:
  - name: 생각열기
    question: 우리나라는 어떤 모습일까?
  - name: 탐구하기
    question: 우리나라의 소중한 것들은 무엇일까?
  - name: 확장하기
    question: 우리나라를 어떻게 느끼고 즐길까?
