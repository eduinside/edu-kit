id: sc5241
title: 4. 자원과 에너지
grade: 5
sem: 2학기
subject: 과학
unit: 자원과 에너지
unit_no: 4
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 자원은 유한하며, 이를 책임 있게 이용하려는 노력이 지속가능한 미래로 이어진다.
  core_question: 유한한 자원에 대한 우리의 선택은 미래와 어떻게 연결될까?
  concepts:
    - term: 관계
      def: 둘 이상의 대상이 서로 연결되어 영향을 주고받는 상태이다.
    - term: 상호작용
      def: 둘 이상의 대상이 서로 영향을 주고받는 관계이다.
    - term: 자원
      def: 사람의 생활과 생산 활동에 쓸모 있게 이용되는 자연물이나 기술, 지식 등이다.
    - term: 에너지
      def: 물체를 움직이거나 상태를 변화시키는 능력이다.
    - term: 재생에너지
      def: 햇빛, 바람, 물처럼 자연에서 계속 얻어 다시 사용할 수 있는 에너지이다.
    - term: 지속 가능성
      def: 현재의 필요를 채우면서도 미래 세대가 살아갈 환경과 자원을 지킬 수 있는 성질이다.
    - term: 유한성
      def: 자원의 양이 한정되어 있어 끝없이 사용할 수 없는 성질이다.
  standards:
    - code: "[6과08-01]"
      text: 우리가 생활에서 이용하는 다양한 자원을 조사하고, 자원의 유한함을 설명할 수 있다.
    - code: "[6과08-02]"
      text: 재생에너지의 종류를 조사하고, 에너지를 지속가능하게 이용하는 방법에 관심을 갖는다.
    - code: "[6과08-03]"
      text: 자원과 에너지의 효율적인 이용 방법에 대해 탐색하고, 생활 속에서 실천할 수 있는 다양한 사례를 공유할 수 있다.
stages:
