id: sc3121
title: 2. 동물의 생활
grade: 3
sem: 1학기
subject: 과학
unit: 동물의 생활
unit_no: 2
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 동물을 관찰하여 특징에 따라 동물을 분류하고 환경에 따른 동물의 생김새와 생활 방식을 탐구하며 동물의 특징을 활용한 생활용품을 설계해본다.
  core_question: 동물의 생김새와 생활 방식은 사는 환경과 어떻게 관련되며, 우리는 그 특징을 어떻게 활용할까?
  concepts:
    - term: 우리 주변의 동물
      def: 우리가 사는 곳 가까이에서 만날 수 있는 여러 동물을 말해요. 공원, 학교, 집 주변에서도 곤충, 새, 강아지 같은 다양한 동물을 볼 수 있어요.
    - term: 동물 분류
      def: 동물을 비슷한 특징끼리 묶어 무리로 나누는 것을 말해요. 다리 수, 날개 유무, 사는 곳 같은 기준을 정해 나눌 수 있어요.
    - term: 땅에 사는 동물
      def: 땅 위나 땅속에서 살아가는 동물을 말해요. 다람쥐나 지렁이처럼 기어 다니거나 땅을 파며 살아요.
    - term: 물에 사는 동물
      def: 강, 바다, 연못 같은 물속이나 물가에서 사는 동물을 말해요. 붕어나 문어처럼 헤엄을 치며 살아요.
    - term: 사막에 사는 동물
      def: 덥고 물이 적은 사막에서 살아가는 동물을 말해요. 낙타나 사막여우처럼 더위와 부족한 물을 견디는 몸을 가지고 있어요.
    - term: 극지방에 사는 동물
      def: 매우 춥고 눈과 얼음이 많은 북극이나 남극에서 사는 동물을 말해요. 북극곰이나 펭귄처럼 추위를 견디는 몸을 가지고 있어요.
    - term: 환경에 따른 동물의 모습
      def: 동물이 사는 곳의 환경에 알맞게 생김새가 달라지는 것을 말해요. 추운 곳 동물은 털이 두껍고, 사막 동물은 더위를 잘 견디는 모습이에요.
    - term: 동물의 특징
      def: 동물마다 가지고 있는 생김새나 생활 방식의 남다른 점을 말해요. 발바닥의 흡착판이나 두꺼운 털처럼 살아가는 데 도움이 되는 점이에요.
    - term: 동물 모방
      def: 동물의 특징을 흉내 내어 우리 생활에 쓸모 있는 물건을 만드는 것을 말해요. 식물 씨앗이나 동물 발의 특징에서 벨크로 같은 물건의 아이디어를 얻기도 해요.
  standards:
    - code: "[4과02-01]"
      text: 여러 가지 동물을 관찰하여 특징에 따라 동물을 분류할 수 있다.
    - code: "[4과02-02]"
      text: 다양한 환경에 서식하는 동물을 조사하여 동물의 생김새와 생활 방식이 환경과 관련되어 있음을 설명할 수 있다.
    - code: "[4과02-03]"
      text: 동물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하여 협력적으로 소통할 수 있다.
stages:
  - 우리 주변의 동물
