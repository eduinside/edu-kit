id: so5131
title: 3-1. 함께 지키는 인권
grade: 5
sem: 1학기
subject: 사회
unit: 3단원
unit_no: 3
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 일상생활에서 발생하는 인권 침해 문제를 조사해 보고, 토론 및 조사를 통해 그 해결 방안을 탐색해 보며, 직접 인권을 존중하고 보호하는 활동에 참여하는 기회를 제공함으로써 인권 친화적인 태도를 기릅니다.
  core_question: 인권은 왜 소중하며, 법은 우리의 인권과 생활을 어떻게 보호할까?
  concepts:
    - term: 인권
      def: 인권은 사람이라면 누구나 태어날 때부터 똑같이 가지는 소중한 권리예요. 나이, 성별, 피부색에 상관없이 모든 사람이 마땅히 누려야 해요.
    - term: 인권 침해
      def: 인권 침해는 누군가의 소중한 권리를 함부로 무시하거나 빼앗는 것을 말해요. 차별을 받거나 부당하게 따돌림을 당하는 일이 여기에 해당해요.
    - term: 인권 보장
      def: 인권 보장은 모든 사람의 권리를 지켜 주고 보호해 주는 것을 뜻해요. 우리나라는 헌법과 법을 통해 국민의 인권을 보장해요.
    - term: 실천
      def: 실천은 알게 된 것을 생각으로만 그치지 않고 직접 행동으로 옮기는 것이에요. 친구의 권리를 존중하고 인권을 지키는 활동에 참여하는 것이 인권을 위한 실천이에요.
  standards:
    - code: "[6사03-02]"
      text: 일상생활에서 인권이 침해되는 사례를 찾아 그 해결 방안을 탐색하고, 인권을 보호하는 활동에 참여한다.
