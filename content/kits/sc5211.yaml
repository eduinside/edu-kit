id: sc5211
title: 1. 혼합물의 분리
grade: 5
sem: 2학기
subject: 과학
unit: 혼합물의 분리
unit_no: 1
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 모든 물질은 저마다 고유한 성질을 지니며, 사람들은 그 성질의 차이를 활용하여 원하는 것을 얻는다.
  core_question: 물질의 고유한 성질은 우리가 원하는 것을 얻는 데 어떻게 활용될까?
  concepts:
    - term: 성질
    - term: 변화
    - term: 분리
    - term: 입자
    - term: 용해
    - term: 혼합물
  standards:
    - code: "[6과05-01]"
      text: 알갱이의 크기가 다른 고체 혼합물과 골고루 섞이지 않는 액체 혼합물을 분리할 수 있다.
    - code: "[6과05-02]"
      text: 물에 용해되는 성질을 이용하여 고체 혼합물을 분리하고, 물을 증발시켜 물에 용해된 고체 물질을 분리할 수 있다.
    - code: "[6과05-03]"
      text: 지속가능한 삶을 위한 과학기술 사례 중 혼합물의 분리를 이용한 장치를 조사하여 공유할 수 있다.
stages:
  - name: 생각열기
    question: 우리 주변의 혼합물은 어떻게 알아볼 수 있고, 왜 분리할까?
  - name: 탐구하기1
    question: 혼합물은 물질의 어떤 성질을 이용해 분리할까?
  - name: 탐구하기2
    question: 혼합물 분리는 우리 일상 생활 속에 어떻게 활용될까?
  - name: 확장하기
    question: 물질의 성질을 이용한 분리 과정은 환경 문제 해결에 어떻게 기여할 수 있을까?
