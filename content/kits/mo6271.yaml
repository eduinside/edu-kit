id: mo6271
title: 7. 우리 모두의 미래를 위한 선택
grade: 6
sem: 2학기
subject: 도덕
unit: 7단원
unit_no: 7
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 지속가능한 삶은 지금의 편리함만 보지 않고 다음 세대도 살아갈 수 있도록 환경·경제·사회가 함께 발전하게 선택하는 거예요. 지금 세대에게는 미래 세대의 권리를 지킬 책임이 있고, 작은 실천이 모여 변화를 만들어요.
  core_question: 지금의 편리함과 미래 세대의 권리 사이에서 우리는 어떤 선택을 해야 할까?
  concepts:
    - term: 지속가능한 발전
      def: 지금 세대의 필요를 채우면서도 다음 세대가 쓸 자연과 자원을 해치지 않도록 환경, 경제, 사회가 함께 발전하는 것이에요.
    - term: 미래 세대
      def: 지금은 어리거나 아직 태어나지 않았지만 앞으로 이 지구에서 살아갈 다음 세대 사람들이에요.
    - term: 지속가능발전목표
      def: 지구촌 모두가 함께 잘 살 수 있도록 유엔이 2030년까지 이루기로 한 17가지 목표예요. 줄여서 SDGs라고 해요.
    - term: 기후 위기
      def: 사람의 활동 때문에 지구의 기온과 날씨가 크게 달라져서 우리 삶과 자연이 위험해지는 일이에요. 요즘 더 자주 겪는 폭염과 큰 홍수가 그 모습이에요.
    - term: 탄소 중립
      def: 우리가 내보내는 이산화탄소의 양을, 숲이 흡수하거나 사람이 없애는 양과 똑같이 맞추어 실제로 늘어나는 양을 0으로 만드는 것이에요.
    - term: 책임
      def: 내가 한 결정과 행동의 결과를 피하지 않고 받아들이고, 잘못되었으면 바로잡으려고 애쓰는 것이에요.
  standards:
    - code: "[6도04-02]"
      text: 지속가능한 삶의 의미를 탐구하고 미래 세대에 대한 책임을 강화하여 자연의 다양성을 존중하고 생산성을 유지할 수 있는 미래를 위한 실천 방안을 찾는다.
