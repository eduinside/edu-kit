quiz:
  - statement: 지속가능한 발전은 지금 세대의 필요를 채우면서 다음 세대가 쓸 자연과 자원도 지키는 발전이다.
    answer: O
    explain: 지금의 편리함만 보지 않고 다음 세대도 살아갈 수 있게 선택하는 거예요.
  - statement: 지속가능한 발전은 자연을 보호하는 것만 뜻하고 경제와 사회의 발전은 포함하지 않는다.
    answer: X
    explain: 환경뿐 아니라 경제와 사회도 함께 발전해야 지속가능한 발전이에요.
  - statement: 아직 태어나지 않은 미래 세대에게도 살기 좋은 환경에서 살아갈 권리가 있다.
    answer: O
    explain: 지금 세대가 쓰는 자원과 환경은 미래 세대가 이어서 살아갈 터전이에요.
  - statement: 기후 위기는 옛날 사람들이 만든 일이라서 지금 우리와는 상관이 없다.
    answer: X
    explain: 지금 우리의 생활도 이산화탄소를 내보내 기후 위기에 영향을 주기 때문에 우리에게도 책임이 있어요.
  - statement: 지속가능발전목표(SDGs)는 유엔이 2030년까지 이루기로 한 17가지 목표이다.
    answer: O
    explain: 빈곤, 교육, 기후 행동, 평화 같은 지구촌의 여러 목표를 담고 있어요.
  - statement: 탄소 중립은 내보내는 이산화탄소의 양과 흡수하거나 없애는 양을 같게 맞추는 것이다.
    answer: O
    explain: 그렇게 하면 실제로 늘어나는 이산화탄소의 양이 0이 돼요.
  - statement: 일회용품을 쓰지 않는 작은 실천은 한 사람이 해도 아무 변화를 만들지 못한다.
    answer: X
    explain: 작은 실천이 모이면 쓰레기를 줄이고 환경을 지키는 큰 변화를 만들 수 있어요.
  - statement: 함께 쓰는 자원을 각자 마음껏 쓰면 자원이 바닥나도 모두에게 아무 문제가 없다.
    answer: X
    explain: 함께 쓰는 자원을 각자 마음껏 쓰면 자원이 바닥나 모두가 어려워질 수 있어요.
