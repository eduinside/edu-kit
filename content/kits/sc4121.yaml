id: sc4121
title: 2. 물의 상태 변화
grade: 4
sem: 1학기
subject: 과학
unit: 물의 상태 변화
unit_no: 2
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 물이 세 가지 상태로 변할 수 있음을 알고 우리 주변에서 물의 상태 변화의 예를 찾고, 물이 얼 때, 얼음이 녹을 때, 물이 증발할 때와 끓을 때, 수증기가 응결할 때의 변화를 관찰하도록 한다. 또한 물의 중요성을 알고 물의 상태 변화를 이용하여 물을 얻을 수 있는 장치를 창의적으로 설계하고 만들도록 구성되었다.
  core_question: 물은 상태에 따라 어떻게 변하며, 우리는 그 변화를 생활에서 어떻게 이용할 수 있을까?
  concepts:
    - term: 물
      def: 우리가 마시고 씻을 때 쓰는 투명한 액체예요. 온도에 따라 얼음, 물, 수증기로 모습이 바뀔 수 있어요.
    - term: 물의 상태 변화
      def: 물이 고체(얼음), 액체(물), 기체(수증기)로 모습이 바뀌는 것을 말해요. 온도가 높아지거나 낮아지면 상태가 변해요.
    - term: 얼음
      def: 물이 차가워져서 단단하게 굳은 고체 상태예요. 일정한 모양과 크기를 가지고 있어요.
    - term: 증발
      def: 물의 표면에서 물이 천천히 수증기로 변해 공기 중으로 날아가는 것이에요. 빨래가 마르는 것이 증발의 예예요.
    - term: 끓음
      def: 물을 계속 가열하면 물 속에서 기포가 생기면서 빠르게 수증기로 변하는 것이에요. 물 표면뿐 아니라 물 안쪽에서도 일어나요.
    - term: 응결
      def: 공기 중의 수증기가 차가워져서 다시 물방울로 변하는 것이에요. 차가운 컵 표면에 물방울이 맺히는 것이 응결의 예예요.
    - term: 수증기
      def: 물이 기체로 변한 상태예요. 눈에 보이지 않으며 공기 중에 섞여 있어요.
  standards:
    - code: "[4과10-01]"
      text: 물이 세 가지 상태로 변할 수 있음을 알고, 우리 주변에서 예를 찾을 수 있다.
    - code: "[4과10-02]"
      text: 물이 얼 때, 얼음이 녹을 때, 물이 증발할 때와 끓을 때, 수증기가 응결할 때의 변화를 관찰할 수 있다.
    - code: "[4과10-03]"
      text: 물의 상태 변화를 이용하여 물을 얻을 수 있는 장치를 설계하고 만들 수 있다.
stages:
  - 상태 변화
  - 물의 상태 변화
  - 응결
  - 증발
  - 끓음
