id: sc6231
title: 3. 전기의 이용
grade: 6
sem: 2학기
subject: 과학
unit: 3. 전기의 이용
unit_no: 3
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 전하와 전류는 다양한 전기와 자기 현상을 일으키고, 전기와 자기에 대한 성질은 여러 가지 전기 기구의 작동 원리로 활용된다.
  core_question: 전기는 어떻게 흐르고, 우리는 그것을 어떻게 활용해야 할까?
  concepts:
    - term: 시스템
      def: 여러 요소가 서로 관련을 맺고 함께 작용하는 하나의 전체이다.
    - term: 기능
      def: 어떤 대상이나 부분이 맡아 하는 역할이나 작용이다.
    - term: 전지
      def: 화학 에너지를 전기 에너지로 바꾸어 전류가 흐르게 하는 장치이다.
    - term: 전구
      def: 전류가 흐를 때 빛을 내도록 만든 전기 기구이다.
    - term: 전선
      def: 전류가 흐를 수 있도록 금속 도선과 겉을 감싼 물질로 만든 선이다.
    - term: 전기회로
      def: 전지, 전구, 전선 등을 연결해 전류가 흐를 수 있게 만든 길이다.
    - term: 전자석
      def: 전류가 흐를 때 자석의 성질을 나타내도록 만든 장치이다.
    - term: 전기
      def: 전하의 움직임과 관련하여 빛, 열, 운동 등을 만들어 내는 에너지이다.
  standards:
    - code: "[6과15-01]"
      text: 전지와 전구, 전선을 연결하여 전구에 불을 켜보고, 불이 켜지는 전기 회로의 특징을 말할 수 있다.
    - code: "[6과15-02]"
      text: 전지 한 개를 연결한 전기 회로와 전지 두 개를 직렬연결한 전기 회로의 특징을 비교할 수 있다.
    - code: "[6과15-03]"
      text: 전자석을 만들어 전자석의 성질을 탐색하고 전자석이 사용되는 예를 조사할 수 있다.
    - code: "[6과15-04]"
      text: 전기를 효율적이고 안전하게 사용하는 방법을 조사하여 실천 계획을 세우고 일상생활에서 실천할 수 있다.
stages:
  - name: 생각열기
    question: 전기란 무엇일까?
  - name: 탐구하기1
    question: 어떻게 하면 전구의 불을 밝게 켤 수 있을까?
  - name: 탐구하기2
    question: 전류로 만드는 전자석은 우리 생활에 어떻게 활용될 수 있을까?
  - name: 확장하기
    question: 우리 생활에서 전기를 안전하고 효율적으로 사용할 수 있는 방법은 무엇일까?
