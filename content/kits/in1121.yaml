quiz:
  - statement: 가족의 모습은 집마다 다를 수 있어요.
    answer: O
    explain: 함께 사는 사람들이 모두 소중한 가족의 모습이에요.
  - statement: 이웃은 가까이에 사는 사람들이에요.
    answer: O
    explain: 이웃과 인사하고 도우면 서로 즐거워요.
  - statement: 어른을 만나면 반갑게 인사해요.
    answer: O
    explain: 인사는 마음을 전하는 좋은 방법이에요.
  - statement: 고마운 사람은 특별한 일을 한 사람뿐이에요.
    answer: X
    explain: 농부처럼 우리를 도와주는 사람은 모두 고마운 사람이에요.
  - statement: 친구가 힘들어 보여도 모른 척해야 해요.
    answer: X
    explain: 내가 도울 수 있는 일을 찾아 도와줘요.
  - statement: 고운 말을 쓰면 서로 기분이 좋아져요.
    answer: O
    explain: 고운 말은 마음을 따뜻하게 해 줘요.
