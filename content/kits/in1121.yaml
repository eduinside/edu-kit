id: in1121
title: 2. 사람들
grade: 1
sem: 1학기
subject: 통합
unit: 2단원
unit_no: 2
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 내 둘레에는 가족, 이웃, 친구처럼 여러 사람이 있어요. 서로 고마운 마음을 나누고 돕고 배려하며 사이좋게 지낼 수 있어요.
  core_question: 내 둘레 사람들과 어떻게 사이좋게 지낼까?
  concepts:
    - term: 가족
      def: 나와 함께 살면서 서로 사랑하고 돌봐 주는 사람들이에요.
    - term: 이웃
      def: 가까이에 사는 사람들이에요.
    - term: 고마움
      def: 도움을 받아 기쁘고 감사한 마음이에요.
    - term: 배려
      def: 다른 사람의 마음을 생각해서 도와주는 것이에요.
    - term: 인사
      def: 사람을 만났을 때 반갑게 나누는 말과 몸짓이에요.
  standards:
    - code: "[2바01-03]"
      text: 가족이나 주변 사람을 배려하며 관계를 맺는다.
    - code: "[2슬01-03]"
      text: 가족이나 주변 사람에게 관심을 갖고 함께 살아가는 모습을 탐구한다.
    - code: "[2즐01-03]"
      text: 가족이나 주변 사람과 소통하며 어울린다.
stages:
  - name: 생각열기
    question: 내 둘레에는 어떤 사람들이 있을까?
  - name: 탐구하기
    question: 가족·이웃·고마운 사람과 어떻게 지낼까?
  - name: 확장하기
    question: 사람들과 서로 돕고 사이좋게 지내려면?
