id: so6122
title: 2-2. 민주주의를 실현하는 국가기관
grade: 6
sem: 1학기
subject: 사회
unit: 2단원
unit_no: 2
flow: flow
sort_order: 2
published: true
intro:
  core_idea: 우리나라의 국가기관인 국회, 행정부, 법원이 하는 일을 이해하고, 이를 바탕으로 국민의 자유와 권리 보장을 위해 각 국가기관의 권력을 분립하는 이유를 파악합니다.
  core_question: 민주주의는 선거와 국가기관, 미디어를 통해 어떻게 실현되며, 시민은 어떻게 참여해야 할까?
  concepts:
    - term: 권력분립
      def: 나라의 힘을 한 곳에 몰아주지 않고 국회, 행정부, 법원으로 나누어 맡기는 것입니다. 서로 잘못을 견제하여 국민의 자유와 권리를 지키기 위해서입니다.
    - term: 국회
      def: 국민이 뽑은 국회의원들이 모여 법을 만들고 고치는 국가기관입니다. 나라의 살림에 쓸 예산을 정하고 정부가 일을 잘하는지 살펴보기도 합니다.
    - term: 행정부
      def: 국회에서 만든 법에 따라 나라의 살림을 맡아 실제로 일을 하는 국가기관입니다. 대통령을 중심으로 여러 부서가 국민을 위한 다양한 일을 합니다.
    - term: 법원
      def: 법에 따라 다툼을 해결하고 옳고 그름을 가려 재판하는 국가기관입니다. 공정한 재판을 위해 한 사건을 여러 번 재판받을 수 있게 하고 있습니다.
  standards:
    - code: "[6사08-02]"
      text: 민주 국가에서 국회, 행정부, 법원이 하는 일에 대해 이해하고, 각 국가기관의 권력을 분립하는 이유를 탐색한다.
stages:
  - 권력분립
  - 국회
  - 행정부
  - 법원
