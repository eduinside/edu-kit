id: mo4261
title: 6. 통일로 가는 한 걸음
grade: 4
sem: 2학기
subject: 도덕
unit: 6단원
unit_no: 6
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 한반도는 하나였다가 나뉘어서 이산가족을 비롯한 많은 사람이 지금도 아픔을 겪고 있어요. 서로 이해하고 화해하며 평화롭게 하나가 되는 길을 찾고, 생활 속에서 작은 실천을 해 나가는 것이 통일로 가는 걸음이에요.
  core_question: 분단의 아픔을 이해하고 평화로운 통일을 위해 나는 무엇을 할 수 있을까?
  concepts:
    - term: 분단
      def: 하나였던 나라가 둘로 나뉘어 서로 자유롭게 오가지 못하는 상태를 말해요. 우리나라는 6.25 전쟁을 거치며 남과 북으로 갈라졌어요.
    - term: 이산가족
      def: 분단이나 전쟁 때문에 남쪽과 북쪽으로 헤어져 서로 만나지 못하는 가족이에요.
    - term: 통일
      def: 남과 북으로 나뉜 한반도가 다시 하나의 나라가 되는 것이에요. 서로 이해하고 평화로운 방법으로 이루어 가야 해요.
    - term: 평화
      def: 전쟁이나 폭력이 없고 서로의 권리와 안전이 존중되는 상태예요.
    - term: 남북 교류
      def: 남한과 북한이 서로 오가며 만나고 문화, 체육, 경제 같은 여러 분야에서 함께하는 일이에요.
  standards:
    - code: "[4도03-03]"
      text: 통일의 필요성을 이해하고, 통일 감수성을 길러 바람직한 통일의 방향을 모색한다.
stages:
  - name: 생각열기
    question: 한반도는 어떻게 나뉘었고, 분단은 어떤 아픔을 남겼을까?
  - name: 탐구하기
    question: 통일은 왜 필요하고, 어떤 방법으로 이루어 가야 할까?
  - name: 확장하기
    question: 남북이 서로 이해하며 통일을 준비하는 생활 속 실천에는 무엇이 있을까?
