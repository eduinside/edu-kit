quiz:
  - statement: 6.25 전쟁을 거치며 우리나라는 남과 북으로 나뉜 상태가 이어지고 있다.
    answer: O
    explain: 한반도는 6.25 전쟁을 거치며 남과 북으로 나뉘었고 분단이 이어지고 있어요.
  - statement: 분단은 오래전에 끝난 일이라 지금은 그 아픔이 남아 있지 않다.
    answer: X
    explain: 이산가족을 비롯해 분단의 아픔은 지금도 이어지는 현실이에요.
  - statement: 이산가족은 분단 때문에 남쪽과 북쪽으로 헤어져 만나지 못하는 가족이다.
    answer: O
    explain: 분단과 전쟁으로 가족이 헤어져 서로 만나지 못하는 아픔이 있어요.
  - statement: 통일은 먼 나라 어른들의 일이어서 어린이의 삶과는 관계가 없다.
    answer: X
    explain: 통일은 나의 자유로운 이동과 안전, 꿈을 펼칠 무대와도 이어지는 일이에요.
  - statement: 통일은 남과 북이 서로 이해하며 평화로운 방법으로 이루어 가야 한다.
    answer: O
    explain: 평화롭게 서로를 이해하며 이루는 통일이 바람직해요.
  - statement: 남북 관계는 친구 사이 다툼처럼 단순해서 사과 한마디면 풀린다.
    answer: X
    explain: 남북 관계는 훨씬 복잡하고 민감해서 오랜 시간 서로 이해하려는 노력이 필요해요.
  - statement: 독일은 동독과 서독으로 나뉘어 있다가 통일을 이룬 나라이다.
    answer: O
    explain: 독일은 나뉘었다가 통일을 이룬 사례로 통일을 이해하는 데 도움이 돼요.
  - statement: 남한과 북한은 전통 놀이에서 닮은 점이 전혀 없다.
    answer: X
    explain: 제기차기나 팽이치기처럼 남과 북이 함께 즐기는 놀이가 있어서 닮은 점을 찾을 수 있어요.
