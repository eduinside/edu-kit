id: so6132
title: 3-2. 세계의 대륙과 대양, 국가들
grade: 6
sem: 1학기
subject: 사회
unit: 3단원
unit_no: 3
flow: flow
sort_order: 2
published: true
intro:
  core_idea: 세계의 주요 대륙과 대양을 파악하고, 우리나라와 여러 국가의 위치와 영토의 특징을 이해하도록 구성된 단원입니다. 지구상의 위치 관계를 정확히 파악하고, 국가별 영토의 기본적 특성을 비교하며 세계에 대한 기초적인 공간 이해를 넓혀 갑니다.
  core_question: 지구본과 세계지도 같은 공간 자료를 이용해 세계의 대륙과 대양, 여러 나라의 위치를 어떻게 파악할 수 있을까?
  concepts:
    - term: 대륙과 대양
      def: 대륙은 아시아, 아프리카처럼 바다로 둘러싸인 아주 넓은 땅덩어리이고, 대양은 태평양, 대서양처럼 매우 넓고 큰 바다를 말해요. 지구에는 보통 6개의 대륙과 5개의 대양이 있어요.
    - term: 국가
      def: 국가는 일정한 영토와 그곳에 사는 국민, 그리고 나라를 다스리는 정부가 있는 하나의 나라를 말해요. 세계에는 우리나라처럼 수많은 국가가 저마다 다른 위치에 자리 잡고 있어요.
    - term: 영토
      def: 영토는 한 나라가 다스리는 땅의 범위를 말해요. 나라마다 영토의 넓이와 모양이 서로 달라서, 영토가 아주 넓은 나라도 있고 좁은 나라도 있어요.
  standards:
    - code: "[6사09-02]"
      text: 세계 주요 대륙과 대양을 파악하고, 우리나라 및 세계 여러 국가의 위치와 영토의 특징을 이해한다.
stages:
  - 대륙과 대양
  - 국가
  - 영토
