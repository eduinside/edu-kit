quiz:
  - statement: 인류애는 국경을 넘어 모든 사람을 같은 사람으로 여기고 돕는 마음이다.
    answer: O
    explain: 인류애는 사람이라면 누구나 가지는 공통점에서 출발해 서로를 돕는 마음이에요.
  - statement: 멀리 있는 나라의 어려움은 우리와 아무 관계가 없어서 돕지 않아도 된다.
    answer: X
    explain: 나라 사이는 서로 이어져 있어서 멀리 있는 사람의 어려움도 우리와 이어져 있어요.
  - statement: 우리나라도 6.25 전쟁 뒤에는 다른 나라의 도움을 받았다.
    answer: O
    explain: 원조를 받던 우리나라는 이제 개발도상국을 돕는 나라가 되었어요.
  - statement: 지구촌 이웃을 돕는 일은 구호 단체만 할 수 있고 어린이의 작은 관심은 소용없다.
    answer: X
    explain: 관심을 갖고 나눔이나 기부를 실천하는 작은 행동도 큰 힘이 돼요.
  - statement: 공적 개발 원조는 정부나 공공기관이 어려운 나라를 돈, 기술, 교육으로 돕는 일이다.
    answer: O
    explain: 공적 개발 원조는 줄여서 ODA라고 불러요.
  - statement: 우리나라는 지금도 다른 나라의 도움을 받기만 하는 나라이다.
    answer: X
    explain: 원조를 받던 우리나라는 지금 개발도상국을 돕는 나라가 되었어요.
  - statement: 세계 어린이의 날은 유엔 아동권리협약이 채택된 것을 기념해 정한 날이다.
    answer: O
    explain: 1989년 11월 20일에 채택된 유엔 아동권리협약을 기념해 정했어요.
  - statement: 긴급구호대는 다른 나라에 큰 재난이 났을 때에도 우리나라 안에서만 활동한다.
    answer: X
    explain: 긴급구호대는 지진 같은 큰 재난이 난 다른 나라에 가서 구조 활동을 도와요.
