id: mo6261
title: 6. 사랑, 우리를 넘어 세계로
grade: 6
sem: 2학기
subject: 도덕
unit: 6단원
unit_no: 6
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 나라와 나라는 서로 이어져 있어서 멀리 있는 사람의 어려움도 우리와 무관하지 않아요. 인류애는 국경을 넘어 모든 사람을 같은 사람으로 여기고 돕는 마음이며, 작은 관심과 실천도 힘이 돼요.
  core_question: 지구촌 이웃의 어려움을 돕기 위해 나는 어떤 마음과 행동을 할 수 있을까?
  concepts:
    - term: 인류애
      def: 국경을 넘어 모든 사람을 같은 사람으로 여기고 아끼며 돕는 마음이에요.
    - term: 국제 구호
      def: 전쟁이나 지진 같은 큰 어려움을 겪는 다른 나라 사람들을 돕기 위해 구조대원, 물품, 성금을 보내는 일이에요.
    - term: 공적 개발 원조
      def: 정부나 공공기관이 어려운 나라가 잘살 수 있도록 돈, 기술, 교육을 도와주는 일이에요. 줄여서 ODA라고 해요.
    - term: 세계시민
      def: 내가 사는 나라뿐 아니라 지구촌 전체의 이웃과 문제를 함께 생각하고 책임을 나누는 사람이에요.
    - term: 국제 기념일
      def: 유엔 같은 국제기구가 중요한 문제를 알리려고 정한 날이에요. 세계 어린이의 날이 그 예예요.
    - term: 연대
      def: 다른 사람의 어려움을 남의 일로 여기지 않고 뜻을 모아 함께 돕고 나서는 것이에요.
  standards:
    - code: "[6도03-04]"
      text: 다른 나라 사람들이 처한 여러 가지 상황을 종합적으로 이해하고 해결 방안을 탐구하며 인류애를 기른다.
stages:
  - name: 생각열기
    question: 나라 사이는 어떻게 이어져 있고, 왜 서로 도와야 할까?
  - name: 탐구하기
    question: 다른 나라 어린이는 어떤 어려움을 겪고, 우리나라는 어떻게 도움을 주고받았을까?
  - name: 확장하기
    question: 지구촌 이웃을 돕는 실천에는 어떤 것이 있을까?
