title: 4. 세계
grade: 2
sem: 1학기
subject: 통합
unit: 4단원
unit_no: 4
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 세계에는 여러 나라가 있고 저마다 옷, 음식, 집, 놀이, 명절이 달라요. 다른 나라의 문화를 알고 존중하면 함께 살아가는 세계시민이 될 수 있어요.
  core_question: 다른 나라의 문화를 어떻게 알아보고 존중할까?
  concepts:
    - term: 세계
      def: 여러 나라가 있는 지구 전체예요.
    - term: 문화
      def: 한 나라나 사람들이 함께 만들어 온 생활 모습이에요. 옷, 음식, 놀이 같은 것이 있어요.
    - term: 다양성
      def: 서로 다르고 여러 가지가 있는 것이에요.
    - term: 존중
      def: 다른 사람이나 문화를 소중하게 여기는 것이에요.
  standards:
    - code: "[2바02-03]"
      text: 차이나 다양성을 서로 존중하면서 생활한다.
    - code: "[2슬02-03]"
      text: 알고 싶은 나라를 탐구하며 다른 나라에 관심을 갖는다.
    - code: "[2즐02-03]"
      text: 다른 나라의 문화 예술을 체험한다.
  topics:
    - 세계
    - 여러 나라
    - 다문화
    - 문화 다양성
    - 존중
    - 지구촌
    - 감염병
stages:
  - name: 생각열기
    question: 세계에는 어떤 나라가 있을까?
  - name: 탐구하기
    question: 다른 나라는 어떻게 살아갈까?
  - name: 확장하기
    question: 서로 다른 세계를 어떻게 존중할까?
