intro:
  core_idea: 각 시대의 생활 모습은 사회 체제의 특징과 그것이 가져온 사회⋅문화적 변화를 반영한다.
  core_question: 식민지 체제는 우리가 살아가는 공간과 삶의 모습을 어떻게 변화시켰으며, 이에 맞선 저항은 사회에 어떤 영향을 주었을까?
  concepts:
    - term: 공간과 장소
    - term: 변화
    - term: 체제
    - term: 생활 모습
    - term: 문화
    - term: 사건
    - term: 식민 통치
  standards:
    - code: "[6사06-01]"
      text: 일제의 식민 통치와 이에 대한 저항이 사회와 생활에 미친 영향을 이해한다.
stages:
  - name: 생각열기
    question: 조선에 놓인 '철도'는 편리한 길이었을까, 빼앗아 가는 길이었을까?
  - name: 탐구하기1
    question: 일제의 침략에 맞선 우리 민족의 저항은 어떤 모습이었을까?
  - name: 탐구하기2
    question: 나라를 되찾으려는 노력에는 어떤 것들이 있었을까?
  - name: 확장하기
    question: 세종대왕의 애민정신은 일제 강점기에도 어떤 모습으로 남아 있을까?
