id: so5132
title: 3-2. 법으로 보호하는 우리 생활
grade: 5
sem: 1학기
subject: 사회
unit: 3단원
unit_no: 3
flow: flow
sort_order: 2
published: true
intro:
  core_idea: 법이 우리의 행동과 삶에 미치는 영향력을 이해하고, 헌법에 규정된 인권이 일상생활에 적용된 사례를 조사하는 과정을 통해 준법 태도와 인권 의식을 함양합니다.
  core_question: 인권은 왜 소중하며, 법은 우리의 인권과 생활을 어떻게 보호할까?
  concepts:
    - term: 법
      def: 여러 사람이 함께 안전하고 평화롭게 살아가도록 나라에서 정한, 모두가 꼭 지켜야 하는 규칙이에요. 법을 지키면 다툼을 줄이고 서로의 권리를 보호할 수 있어요.
    - term: 헌법
      def: 우리나라의 법 가운데 가장 기본이 되는 최고의 법이에요. 국민의 권리와 나라를 운영하는 기본 원칙을 담고 있어서, 다른 모든 법은 헌법에 어긋나면 안 돼요.
    - term: 기본권
      def: 헌법이 모든 국민에게 보장해 주는 기본적인 권리예요. 자유롭게 생각하고 행동할 권리, 평등하게 대우받을 권리처럼 사람답게 살기 위해 꼭 필요한 권리들이에요.
    - term: 인권
      def: 사람이라면 누구나 태어날 때부터 가지는, 마땅히 존중받아야 할 소중한 권리예요. 나이나 성별, 생김새와 상관없이 모든 사람이 똑같이 가지고 있어요.
  standards:
    - code: "[6사03-01]"
      text: 일상 사례에서 법의 의미와 역할을 이해하고, 헌법에 규정된 인권이 일상생활에서 구현되는 사례를 조사하여 인권 친화적 태도를 기른다.
stages:
  - 법
  - 직업
  - 역할
  - 태도
  - 헌법
  - 기본권
  - 의무
