id: mo4121
title: 2. 도덕적인 나
grade: 4
sem: 1학기
subject: 도덕
unit: 2단원
unit_no: 2
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 도덕은 사람들이 서로 어울려 살아가며 지켜야 할 바른 생각과 행동이에요. 도덕적으로 행동하려면 다른 사람의 관점을 살펴 헤아리고, 내 생각과 말과 행동을 되돌아보는 노력이 필요해요.
  core_question: 도덕적인 사람이 되려면 나는 어떤 마음으로 어떻게 행동해야 할까?
  concepts:
    - term: 도덕
      def: 사람들이 서로 어울려 살아가며 지켜야 할 바른 생각과 행동이에요. 나와 다른 사람 모두가 편안하게 지내도록 도와줘요.
    - term: 도덕적 행동
      def: 옳고 바르다고 생각하는 것에 따라 다른 사람을 생각하며 하는 행동이에요. 칭찬이나 상을 바라지 않고 마음에서 우러나와 하는 것이 중요해요.
    - term: 관점
      def: 어떤 일을 바라보는 위치나 생각의 방향이에요. 같은 일도 사람마다 관점이 달라 다르게 느낄 수 있어요.
    - term: 약속
      def: 다른 사람과 앞으로 어떻게 하자고 미리 정해 두는 것이에요. 약속을 지키면 서로 믿음이 쌓여요.
    - term: 성찰
      def: 내 생각과 행동, 생활을 깊이 살펴보고 어떻게 더 나아질지 생각하는 것이에요.
  standards:
    - code: "[4도01-04]"
      text: 다른 사람의 관점을 수용할 수 있는지를 도덕적으로 검토하고 도덕규범을 내면화하여 도덕적으로 행동할 수 있는 자세를 기른다.
stages:
  - name: 생각열기
    question: 도덕이란 무엇이고, 우리 삶에 왜 필요할까?
  - name: 탐구하기
    question: 서로 다른 관점이 부딪힐 때 다른 사람의 입장을 어떻게 헤아리고 판단할까?
  - name: 확장하기
    question: 내 생각·말·행동을 되돌아보며 도덕적인 행동을 어떻게 실천할까?
