quiz:
  - statement: 도덕은 사람들이 함께 살아가며 지켜야 할 바른 생각과 행동이다.
    answer: O
    explain: 도덕은 서로 어울려 살아가는 데 필요한 바른 생각과 행동이에요.
  - statement: 도덕은 어른이 정해 준 규칙이라서 시키는 대로 따르기만 하면 된다.
    answer: X
    explain: 도덕은 함께 살아가기 위해 까닭을 스스로 생각하며 실천하는 것이에요.
  - statement: 같은 일이라도 사람마다 관점이 달라서 다르게 생각할 수 있다.
    answer: O
    explain: 사람마다 바라보는 위치와 생각이 달라서 같은 일도 다르게 느낄 수 있어요.
  - statement: 다른 사람의 관점을 받아들이려면 내 생각을 모두 버려야 한다.
    answer: X
    explain: 다른 사람의 관점을 이해하면서도 내 생각과 비교하며 따져 볼 수 있어요.
  - statement: 도덕적인 행동은 칭찬을 받으려는 마음보다 마음에서 우러나와 하는 것이 중요하다.
    answer: O
    explain: 도덕적인 행동은 보상을 바라기보다 옳다고 생각해서 스스로 하는 것이 중요해요.
  - statement: 도덕적으로 행동하면 나에게는 언제나 손해만 생긴다.
    answer: X
    explain: 도덕적인 행동은 다른 사람과 나 모두에게 믿음과 기쁨을 줄 수 있어요.
  - statement: 성찰은 내 생각과 말과 행동을 되돌아보고 더 나은 방법을 찾는 일이다.
    answer: O
    explain: 성찰은 지나간 나를 살펴보고 앞으로 나아질 방법을 찾는 것이에요.
  - statement: 어떤 상황에서든 도덕적인 행동의 정답은 하나뿐이다.
    answer: X
    explain: 상황과 관점에 따라 도덕적인 행동이 다르게 보일 수 있어서 까닭을 따져 보며 판단해요.
