quiz:
  - statement: 다름은 틀림이 아니라 서로 같지 않은 것을 뜻한다.
    answer: O
    explain: 나와 다른 생각이나 문화를 틀렸다고 하지 않고 다르다고 받아들여야 해요.
  - statement: 나와 문화가 다른 친구의 생각은 틀린 것이므로 고쳐 주어야 한다.
    answer: X
    explain: 문화와 생각이 다른 것은 틀린 것이 아니라서, 고치려 하기보다 서로 이해하려고 해야 해요.
  - statement: 어떤 사람을 잘 알지 못한 채 미리 정해 두고 보는 생각을 편견이라고 한다.
    answer: O
    explain: 다문화 가정 친구는 우리말이 서툴 것이라고 짐작하는 것도 편견이 될 수 있어요. 친구마다 다르니 직접 알아 가야 해요.
  - statement: 성별에 따라 할 일이 정해져 있다고 굳게 믿는 것은 고정관념이다.
    answer: O
    explain: 고정관념은 편견으로 이어지기 쉽고 나다움을 가로막을 수 있어요.
  - statement: 각자 하고 싶은 대로만 하는 것이 다름을 존중하는 것이다.
    answer: X
    explain: 다름을 존중하는 것은 서로의 생각을 인정하면서도 함께 지낼 방법을 찾는 거예요.
  - statement: 한 사회 안에 여러 나라의 언어와 음식, 생활 방식이 함께 있는 것을 문화 다양성이라고 한다.
    answer: O
    explain: 여러 문화가 함께 있으면 서로 배우고 생활이 더 풍성해질 수 있어요.
  - statement: 의견이 갈릴 때 한 사람이 모든 것을 정해 버리는 것이 합의이다.
    answer: X
    explain: 합의는 서로 이야기를 나누어 모두가 받아들일 수 있는 결론을 찾는 거예요.
  - statement: 다름을 존중하려면 나와 생각이 같은 사람하고만 어울리는 것이 좋다.
    answer: X
    explain: 다름을 존중한다는 것은 생각이 다른 사람과도 함께 지내며 서로를 인정하는 거예요.
