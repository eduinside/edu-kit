id: mo6121
title: 2. 다름을 존중하는 우리
grade: 6
sem: 1학기
subject: 도덕
unit: 2단원
unit_no: 2
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 우리 둘레에는 생각, 문화, 모습이 서로 다른 사람들이 함께 살아요. 다름은 틀림이 아니라는 것을 알고 편견 없이 존중하며, 의견이 갈릴 때는 서로 힘써 합의하는 태도가 필요해요.
  core_question: 나와 다른 사람을 존중하며 함께 살아가려면 어떤 마음과 행동이 필요할까?
  concepts:
    - term: 다름
      def: 생각, 문화, 모습 같은 것이 서로 같지 않은 것이에요. 다름은 옳고 그름의 문제가 아니라서 틀린 것과는 달라요.
    - term: 존중
      def: 나와 생각이나 느낌이 다른 친구의 마음도 소중하게 여기고 함부로 대하지 않는 태도예요. 같은 장소를 보고 다르게 느껴도 그 마음을 인정해 주는 거예요.
    - term: 편견
      def: 어떤 사람이나 집단을 잘 알지 못한 채 미리 정해 두고 보는 생각이에요. 편견이 있으면 그 사람을 있는 그대로 보기 어려워요.
    - term: 고정관념
      def: 성별이나 나이, 직업 같은 것에 대해 이래야 한다고 굳게 믿어 버린 생각이에요. 고정관념은 편견으로 이어지기 쉬워요.
    - term: 문화 다양성
      def: 한 사회 안에 여러 나라와 지역의 언어, 음식, 옷, 생활 방식 같은 문화가 함께 있는 것이에요.
    - term: 합의
      def: 서로 다른 생각을 가진 사람들이 이야기를 나누어 모두가 받아들일 수 있는 결론에 이르는 것이에요.
  standards:
    - code: "[6도02-02]"
      text: 편견이 발생하는 이유를 탐색하여 해결 방안을 살펴보고, 다양성 존중을 바탕으로 다른 사람과 올바른 관계를 맺기 위한 실천 방안을 탐구한다.
stages:
  - name: 생각열기
    question: 우리 이웃은 어떤 점이 서로 다르고, 함께 살면 무엇이 좋을까?
  - name: 탐구하기
    question: 같은 것도 다르게 보는 까닭은 무엇이고, 우리 안의 편견은 무엇일까?
  - name: 확장하기
    question: 다름을 존중하고 의견이 갈릴 때 합의하려면 어떻게 해야 할까?
