id: sc3231
title: 3. 소리의 성질
grade: 3
sem: 2학기
subject: 과학
unit: 소리의 성질
unit_no: 3
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 일상에서 자주 접하는 소리에 대한 흥미와 관심을 바탕으로 소리의 성질을 이해할 수 있도록 하는 단원입니다. 다양한 물체에서 나는 소리를 관찰하고, 소리의 발생 원리를 알아보며, 소리의 세기와 높낮이를 구별하고, 소리가 어떻게 전달되는지 살펴봅니다. 더 나아가 주변의 소음을 인식하고 이를 줄이기 위한 방법을 찾아 실천함으로써, 건강하고 쾌적한 생활 환경을 만들기 위한 태도와 실천력을 함양하도록 합니다.
  core_question: 소리는 어떻게 만들어지고 전달되며, 우리는 소음 문제를 어떻게 해결할 수 있을까?
  concepts:
    - term: 소리
      def: 물체가 떨리면서 생기는 것으로, 우리 귀로 들을 수 있어요. 북을 치거나 목소리를 낼 때처럼 떨림이 있어야 소리가 나요.
    - term: 소리의 전달
      def: 소리가 공기, 물, 쇠 같은 물질을 통해 멀리 퍼져 나가 우리 귀까지 닿는 것이에요. 소리는 이런 물질이 없으면 전달되지 못해요.
    - term: 소리의 세기
      def: 소리가 크고 작은 정도를 말해요. 물체를 세게 떨리게 하면 큰 소리가 나고, 약하게 떨리게 하면 작은 소리가 나요.
    - term: 소음
      def: 사람을 시끄럽고 불편하게 만드는 듣기 싫은 소리예요. 공사장 소리나 층간 소음처럼 우리 생활을 방해하는 소리를 줄이려고 노력해야 해요.
  standards:
    - code: "[4과07-01]"
      text: 여러 가지 물체를 이용하여 소리를 내보고, 소리가 나는 물체는 떨림이 있음을 설명할 수 있다.
    - code: "[4과07-02]"
      text: 큰 소리와 작은 소리, 높은 소리와 낮은 소리를 구분하고, 세기와 높낮이가 다른 소리를 낼 수 있다.
    - code: "[4과07-03]"
      text: 여러 가지 물질을 통하여 소리가 전달되는 것을 관찰하고, 소음을 줄이는 방법을 찾아 일상생활에서 실천할 수 있다.
stages:
  - 소리
  - 소리의 전달
  - 소리의 세기
  - 소음
