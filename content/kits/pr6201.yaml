quiz:
  - statement: 식품 포장의 영양 표시를 읽으면 나에게 맞는 식품을 고르는 데 도움이 된다.
    answer: O
    explain: 영양 표시에는 영양성분이 적혀 있어서 먹는 양과 영양을 생각해 식품을 고를 수 있어요.
  - statement: 소비기한은 가게에서 식품을 팔 수 있는 마지막 날을 뜻한다.
    answer: X
    explain: 소비기한은 식품을 안전하게 먹을 수 있는 기간이에요. 포장에서 꼭 확인해야 해요.
  - statement: 제철 식재료는 알맞은 계절에 자라서 맛과 영양이 풍부한 편이다.
    answer: O
    explain: 제철에는 식재료가 가장 잘 자라서 맛과 영양이 좋고 값도 알맞은 경우가 많아요.
  - statement: 푸드마일리지가 클수록 환경에 더 좋은 식재료이다.
    answer: X
    explain: 푸드마일리지는 식재료가 이동한 거리예요. 가까운 곳에서 난 식재료는 이동 거리가 짧아 환경에 도움이 돼요.
  - statement: 칼로 재료를 자를 때는 재료를 쥔 손끝을 안으로 말아야 다치지 않는다.
    answer: O
    explain: 손끝을 안으로 말면 칼날에 손가락이 닿지 않아 안전해요.
  - statement: 맛은 혀로만 느끼고 눈으로 본 색깔이나 코로 맡은 냄새는 맛과 관계없다.
    answer: X
    explain: 맛은 혀뿐 아니라 눈, 코 같은 여러 감각이 함께 만들어요.
  - statement: 한식 밥상은 밥을 중심으로 국과 반찬을 차리고, 여러 식품군의 반찬을 담으면 영양 균형을 맞추기 쉽다.
    answer: O
    explain: 밥과 국, 반찬을 고루 갖추고 곡류, 채소류, 고기류 같은 식품군을 섞어 담으면 균형이 좋아져요.
  - statement: 식사 예절은 어른만 지키면 되고 어린이는 지키지 않아도 된다.
    answer: X
    explain: 식사 예절은 함께 먹는 모든 사람이 서로를 배려하려고 지키는 약속이에요.
