id: pr6201
title: 식재료·밥상차림·식사 예절
grade: 6
sem: 1학기
subject: 실과
unit: 생활환경과 지속가능한 선택
unit_no: 2
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 식재료가 어떻게 만들어지고 어떻게 고르는지 알고, 제철·지역 식재료와 여러 맛을 오감으로 경험하면 내 식사에 적용할 수 있어요. 우리나라 밥상차림의 기본을 이해하고 식사 예절을 지키며 함께 식사하면 먹는 즐거움이 더 커져요.
  core_question: 식재료를 어떻게 고르고 맛보며, 우리 밥상을 어떻게 차려 예절 있게 함께 먹을 수 있을까?
  concepts:
    - term: 식품 표시와 인증
      def: 식품 포장에 적힌 영양성분, 소비기한 같은 정보와 안전하고 좋은 식품임을 확인해 주는 인증 마크예요. 이것을 읽으면 식품을 똑똑하게 고를 수 있어요.
    - term: 제철 식재료
      def: 알맞은 계절에 가장 잘 자라서 맛과 영양이 풍부한 식재료예요. 가까운 지역에서 난 식재료는 이동 거리가 짧아 신선하고 환경에도 도움이 돼요.
    - term: 식품군
      def: 들어 있는 영양소가 비슷한 식품끼리 묶은 무리예요. 곡류, 고기·생선·달걀·콩류, 채소류, 과일류, 우유·유제품류로 나누고 골고루 먹으면 균형 잡힌 식사가 돼요.
    - term: 다섯 가지 맛
      def: 단맛, 짠맛, 신맛, 쓴맛, 감칠맛이에요. 혀뿐 아니라 눈, 코 같은 오감을 함께 쓰면 식재료의 맛을 더 잘 느낄 수 있어요.
    - term: 밥상차림
      def: 밥을 중심으로 국, 반찬, 김치를 함께 차리는 우리나라의 상차림이에요. 주식인 밥과 부식인 반찬을 고루 갖추는 것이 기본이에요.
    - term: 식사 예절
      def: 여럿이 함께 식사할 때 서로를 배려하며 지키는 약속이에요. 음식을 만든 사람에게 고마워하고 입에 음식을 넣은 채 말하지 않으며 다 먹은 뒤 정리하는 것이 있어요.
    - term: 조리 안전
      def: 음식을 만들 때 칼, 불, 뜨거운 물에 다치지 않고 손을 씻어 위생을 지키는 일이에요. 칼질할 때는 재료를 쥔 손끝을 안으로 말고 불을 쓸 때는 환기를 해요.
  standards:
    - code: "[6실02-04]"
      text: 식재료 생산과 선택의 중요성을 인식하고 여러 식재료의 고유하고 다양한 맛을 경험하여 자신의 식사에 적용한다.
    - code: "[6실02-06]"
      text: 우리나라 밥상차림을 이해하고, 함께 식사하는 즐거움을 경험하면서 이 과정에서 식사 예절을 실천한다.
