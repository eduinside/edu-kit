quiz:
  - statement: 동식물은 먹을거리뿐 아니라 옷감이나 약의 재료로도 쓰인다.
    answer: O
    explain: 동식물은 먹을거리, 옷감, 약, 친구 등 여러 가지로 우리 생활에 도움을 줘요.
  - statement: 한 가지 동식물은 쓰임이 한 가지뿐이다.
    answer: X
    explain: 같은 동식물도 먹을거리, 재료, 관상용처럼 여러 가지로 쓰일 수 있어요.
  - statement: 식물이 잘 자라려면 알맞은 빛, 물, 온도 같은 조건이 필요하다.
    answer: O
    explain: 식물마다 자라기 좋은 조건이 있어서 그에 맞게 돌봐야 해요.
  - statement: 모종삽처럼 끝이 뾰족한 도구는 날 쪽을 몸에서 멀리 두고 쓴다.
    answer: O
    explain: 뾰족한 도구는 날 쪽을 몸에서 멀리 두고 장갑을 끼고 써야 다치지 않아요.
  - statement: 생명 기술은 식물에만 쓰이고 동물에는 쓰이지 않는다.
    answer: X
    explain: 생명 기술은 식물과 동물 모두에 쓰여요. 꺾꽂이는 식물에, 새 품종을 기르는 일은 동물에도 쓰여요.
  - statement: 동물은 종류가 달라도 기르는 방법이 모두 같다.
    answer: X
    explain: 동물마다 필요한 먹이와 살 곳, 돌보는 방법이 달라서 기를 동물의 특성을 먼저 알아봐야 해요.
  - statement: 동식물의 생김새를 본떠 새로운 물건을 만드는 것을 생체 모방이라고 한다.
    answer: O
    explain: 생체 모방은 동식물의 모양과 기능을 본떠 물건이나 기술을 만드는 것이에요.
  - statement: 동물은 귀여울 때만 돌보면 되고 자란 뒤에는 돌보지 않아도 된다.
    answer: X
    explain: 동물은 먹이를 챙기고 깨끗하게 해 주고 건강을 살피며 끝까지 책임지고 돌봐야 해요.
