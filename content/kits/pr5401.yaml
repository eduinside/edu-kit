id: pr5401
title: 동식물 자원·기르기
grade: 5
sem: 1학기
subject: 실과
unit: 지속가능한 기술과 융합
unit_no: 4
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 동식물은 먹을거리, 옷감, 약, 친구가 되어 주는 일 등 여러 가지로 우리 생활에 도움을 줘요. 식물은 자라는 조건과 가꾸는 순서를 알고, 동물은 특성에 맞게 살 곳과 먹이를 갖추어 책임감 있게 돌보면 건강하게 자랄 수 있어요.
  core_question: 동식물은 우리 생활에 어떤 도움을 주고, 식물을 가꾸고 동물을 기를 때는 어떤 순서와 마음가짐이 필요할까?
  concepts:
    - term: 동식물 자원
      def: 사람이 먹거나 입거나 약으로 쓰는 것처럼 생활에 이용하는 동물과 식물이에요. 쓰임에 따라 식용, 약용, 관상용, 반려용 등으로 나눌 수 있어요.
    - term: 생명 기술
      def: 동물이나 식물 같은 생명체의 특성을 이용해 사람에게 도움이 되는 것을 만드는 기술이에요. 꺾꽂이처럼 간단한 것도 있고 새 품종을 만드는 것처럼 어려운 것도 있어요.
    - term: 생체 모방
      def: 동물이나 식물의 생김새와 기능을 본떠서 새로운 물건이나 기술을 만드는 것이에요. 연꽃잎이 물을 튕겨 내는 모습을 본뜬 소재가 한 예예요.
    - term: 재배
      def: 식물의 씨앗이나 모종을 심고 물과 거름을 주며 가꾸어 기르는 것이에요.
    - term: 사육
      def: 동물에게 먹이를 주고 살 곳을 마련해 주며 돌보아 기르는 것이에요.
  standards:
    - code: "[6실04-07]"
      text: 생활 속 동식물 자원을 활용 목적에 따라 분류하고 이와 관련된 다양한 생명기술을 탐색한다.
    - code: "[6실04-08]"
      text: 생활 속 동식물을 기르고 가꾸는 방법을 알고, 동식물을 기르고 가꾸는 체험을 통해 생태 존중감을 가진다.
stages:
  - name: 생각열기
    question: 동식물은 우리 생활에 어떤 도움을 줄까?
  - name: 탐구하기
    question: 식물을 가꾸고 동물을 기를 때는 어떤 순서와 방법으로 돌볼까?
  - name: 확장하기
    question: 동식물의 특징을 본뜬 기술과 생명 기술에는 어떤 것이 있을까?
