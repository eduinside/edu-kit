id: so4231
title: 3-1. 여러 지역의 다양한 환경
grade: 4
sem: 2학기
subject: 사회
unit: 3단원
unit_no: 3
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 여러 지역을 둘러싼 환경의 특징을 알아보고, 환경의 이용과 개발로 나타난 변화를 탐구하는 단원입니다.
  core_question: 지역마다 다른 환경은 사람들의 삶에 어떤 영향을 주며, 도시에서의 생활 모습은 어떻게 나타날까?
  concepts:
    - term: 자연환경
      def: 산, 들, 강, 바다처럼 사람이 만들지 않고 자연으로 이루어진 환경입니다. 날씨와 땅의 생김새도 자연환경에 들어갑니다.
    - term: 인문환경
      def: 사람이 살아가면서 만든 환경입니다. 도로, 건물, 공원, 다리처럼 우리가 생활에 필요해서 만든 것들을 말합니다.
    - term: 환경
      def: 우리를 둘러싸고 있는 모든 것을 뜻합니다. 자연환경과 인문환경을 모두 포함하며, 지역마다 환경의 모습이 다릅니다.
    - term: 이용
      def: 환경을 우리 생활에 쓸모 있게 쓰는 것입니다. 예를 들어 강을 따라 산책로를 만들거나 평야에서 농사를 짓는 것이 환경을 이용하는 것입니다.
    - term: 개발
      def: 사람들이 더 편리하게 살기 위해 환경을 바꾸고 새롭게 꾸미는 것입니다. 길을 넓히거나 건물을 짓는 일이 개발에 해당합니다.
    - term: 변화
      def: 시간이 지나면서 모습이 달라지는 것입니다. 환경을 이용하고 개발하면 우리 지역의 모습도 변화합니다.
  standards:
    - code: "[4사10-01]"
      text: 여러 지역의 자연환경과 인문환경의 특징을 살펴보고, 환경의 이용과 개발에 따른 변화를 탐구한다.
stages:
  - 자연환경
  - 인문환경
  - 환경
  - 개발
  - 변화
  - 이용·개발·변화
