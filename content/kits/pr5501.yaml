quiz:
  - statement: 알고리즘은 컴퓨터에서만 쓰는 말이고 생활 속 일에는 쓰지 않는다.
    answer: X
    explain: 라면 끓이기나 길 찾기처럼 생활 속 일을 순서대로 정리한 것도 알고리즘이에요.
  - statement: 순서도는 알고리즘을 정해진 기호와 화살표로 나타낸 그림이다.
    answer: O
    explain: 순서도를 보면 일의 순서와 갈림길을 한눈에 알 수 있어요.
  - statement: 프로그래밍은 알고리즘을 컴퓨터가 알아들을 수 있는 명령으로 바꾸어 프로그램을 만드는 일이다.
    answer: O
    explain: 알고리즘을 먼저 짜고 그것을 컴퓨터의 명령으로 옮기는 것이 프로그래밍이에요.
  - statement: 프로그램에서 값을 받는 단계는 처리이고 결과를 보여 주는 단계는 입력이다.
    answer: X
    explain: 값을 받는 단계는 입력이고 결과를 보여 주는 단계는 출력이에요. 처리는 그 사이에서 계산하거나 바꾸는 단계예요.
  - statement: 변수는 값을 담아 두고 필요할 때 바꾸어 쓸 수 있는 이름 붙은 상자와 같다.
    answer: O
    explain: 변수에 담은 값은 바꾸거나 계산에 쓸 수 있어요.
  - statement: 신호등 색에 따라 건너기와 멈추기를 다르게 하는 프로그램에는 선택 구조를 쓸 수 있다.
    answer: O
    explain: 조건에 따라 다른 명령을 실행하게 하는 구조가 선택 구조예요.
  - statement: 같은 명령을 여러 번 되풀이해 실행하고 싶을 때는 선택 구조를 쓴다.
    answer: X
    explain: 같은 명령을 되풀이할 때는 반복 구조를 써요. 선택 구조는 조건에 따라 다른 명령을 실행해요.
  - statement: 순차 구조에서는 컴퓨터가 명령의 순서를 마음대로 바꾸어 실행한다.
    answer: X
    explain: 순차 구조에서는 명령이 쓰인 순서대로 하나씩 실행돼요.
