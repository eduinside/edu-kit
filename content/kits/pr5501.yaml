id: pr5501
title: 알고리즘·프로그래밍
grade: 5
sem: 2학기
subject: 실과
unit: 디지털 사회와 인공지능
unit_no: 5
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 컴퓨터로 문제를 풀려면 먼저 해결 순서인 알고리즘을 짜고 순서도로 나타낸 뒤, 프로그래밍으로 컴퓨터가 알아듣는 명령으로 옮겨요. 프로그램은 입력·처리·출력과 변수를 쓰고 순차·선택·반복 구조를 짜 맞추어 만들어요.
  core_question: 생활 속 문제를 컴퓨터로 풀려면 해결 순서를 어떻게 짜고, 어떤 구조로 프로그램을 만들까?
  concepts:
    - term: 알고리즘
      def: 문제를 해결하는 방법을 순서대로 차근차근 적은 것이에요. 컴퓨터뿐 아니라 라면 끓이기처럼 생활 속 일에도 알고리즘이 있어요.
    - term: 순서도
      def: 알고리즘을 정해진 기호와 화살표로 나타낸 그림이에요. 일의 순서와 갈림길을 한눈에 볼 수 있어요.
    - term: 프로그래밍
      def: 알고리즘을 컴퓨터가 알아들을 수 있는 명령으로 바꾸어 프로그램을 만드는 일이에요. 블록을 쌓아 만드는 방법도 있어요.
    - term: 입력·처리·출력
      def: 프로그램이 값을 받고(입력), 계산하거나 바꾸고(처리), 결과를 보여 주는(출력) 세 단계예요.
    - term: 변수
      def: 값을 담아 두는 이름 붙은 상자예요. 담긴 값을 바꾸거나 계산에 쓸 수 있어요.
    - term: 순차 구조
      def: 명령을 쓰인 순서대로 위에서 아래로 하나씩 실행하는 구조예요.
    - term: 선택 구조
      def: 조건이 맞는지 따져서 맞으면 한쪽을, 맞지 않으면 다른 쪽을 실행하는 구조예요.
    - term: 반복 구조
      def: 같은 명령을 정해진 횟수만큼, 또는 조건이 될 때까지 되풀이해서 실행하는 구조예요.
  standards:
    - code: "[6실05-01]"
      text: 컴퓨터를 활용한 생활 속 문제해결 사례를 탐색하고 일상생활 속 문제를 해결하기 위한 알고리즘을 다양한 방법으로 표현한다.
    - code: "[6실05-02]"
      text: 컴퓨터에게 명령하는 방법을 체험하고, 주어진 문제를 해결하는 프로그램을 작성한다.
    - code: "[6실05-03]"
      text: 실생활의 문제를 해결하는 프로그램을 협력하여 작성하고, 산출물을 타인과 공유한다.
stages:
  - 알고리즘
  - 순서도
  - 프로그래밍
  - 변수
  - 순차 구조
  - 선택 구조
  - 반복 구조
