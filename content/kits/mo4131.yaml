quiz:
  - statement: 배려는 상대가 필요로 하는 것이 무엇인지 생각해서 하는 것이다.
    answer: O
    explain: 배려는 내가 좋은 것보다 상대가 필요로 하는 것이 기준이에요.
  - statement: 내가 좋다고 생각하는 것을 해 주면 언제나 상대에게 배려가 된다.
    answer: X
    explain: 상대가 필요로 하는 것이 기준이라서 내 생각대로 해 주면 배려가 되지 않을 수 있어요.
  - statement: 배려는 가까운 친구뿐 아니라 집, 학교, 동네의 여러 사람에게 실천할 수 있다.
    answer: O
    explain: 집과 학교, 동네의 누구에게나 배려를 이어 갈 수 있어요.
  - statement: 배려는 하는 사람이 일방적으로 베푸는 것이라서 받는 사람의 반응은 중요하지 않다.
    answer: X
    explain: 배려는 받는 사람의 반응과 고마움 표현이 이어질 때 서로 완성돼요.
  - statement: 버스나 지하철에서 임산부와 어르신 같은 교통약자에게 자리를 양보하는 것은 배려이다.
    answer: O
    explain: 이동에 도움이 필요한 사람에게 자리를 내어 주는 것은 배려하는 행동이에요.
  - statement: 상대가 도움을 거절해도 무조건 도와주어야 참된 배려이다.
    answer: X
    explain: 상대가 원하지 않거나 안전에 문제가 될 때는 도움을 강요하지 않는 것도 배려예요.
  - statement: 비밀 친구 활동처럼 친구가 필요로 하는 것을 찾아 남몰래 도와주는 것도 배려이다.
    answer: O
    explain: 친구가 필요한 것을 헤아려 조용히 도와주는 것도 배려의 한 모습이에요.
  - statement: 배려는 몸이 불편한 사람에게만 필요하고 친구 사이에는 필요하지 않다.
    answer: X
    explain: 친구 사이에서도 서로의 마음을 헤아리는 배려가 필요해요.
