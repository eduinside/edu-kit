id: mo4131
title: 3. 배려하는 우리
grade: 4
sem: 1학기
subject: 도덕
unit: 3단원
unit_no: 3
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 배려는 상대가 필요로 하는 것이 무엇인지 헤아려 따뜻하게 도와주고 살펴 주는 마음과 행동이에요. 가까운 친구뿐 아니라 집, 학교, 동네의 여러 사람에게 배려를 이어 가면 모두가 더 행복해져요.
  core_question: 내 주변 사람들이 필요로 하는 배려를 찾아 어떻게 실천할 수 있을까?
  concepts:
    - term: 배려
      def: 다른 사람의 처지와 마음을 헤아려 도움이 되도록 마음을 쓰는 것이에요. 상대가 필요로 하는 것이 무엇인지 먼저 생각해야 해요.
    - term: 양보
      def: 내 자리나 차례, 물건을 다른 사람에게 먼저 내어 주는 것이에요. 상대가 필요로 할 때 하면 배려가 돼요.
    - term: 공감
      def: 다른 사람의 처지와 마음을 헤아리고, 그 사람이 느끼는 것을 함께 느껴 보려는 마음이에요.
    - term: 존중
      def: 나와 생각이나 느낌이 다른 친구의 마음도 소중하게 여기고 함부로 대하지 않는 태도예요. 다른 사람의 이야기를 끝까지 들어 주는 것도 존중이에요.
    - term: 교통약자
      def: 버스나 지하철 같은 대중교통을 이용할 때 이동에 도움이 필요한 사람이에요. 어르신, 임산부, 몸이 불편한 사람, 어린아이와 함께 다니는 사람이 있어요.
  standards:
    - code: "[4도02-02]"
      text: 친구 사이의 배려에 대한 올바른 이해를 바탕으로 일상생활에서 배려에 기반한 도덕적 관계를 맺을 수 있는 방안을 탐색한다.
stages:
  - name: 생각열기
    question: 친구 사이에 배려는 왜 필요할까?
  - name: 탐구하기
    question: 집·학교·동네에서 누구에게 어떤 배려를 어떻게 실천할까?
  - name: 확장하기
    question: 배려하는 마음을 어떻게 가꾸고 앞으로 이어 갈까?
