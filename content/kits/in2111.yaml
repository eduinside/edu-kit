quiz:
  - statement: 밥을 먹기 전에는 손을 씻어요.
    answer: O
    explain: 손을 씻으면 세균이 줄어요.
  - statement: 사람은 자라면서 키가 커져요.
    answer: O
    explain: 몸은 어릴 때 많이 자라요.
  - statement: 화가 날 때는 친구를 때려도 돼요.
    answer: X
    explain: 숨을 크게 쉬고 말로 마음을 이야기해요.
  - statement: 나는 소중한 사람이에요.
    answer: O
    explain: 나도 친구도 모두 소중해요.
  - statement: 내 마음은 알아차리지 않고 숨기기만 하면 돼요.
    answer: X
    explain: 마음을 알아차리고 알맞게 말해요.
  - statement: 이를 닦지 않아도 괜찮아요.
    answer: X
    explain: 이를 닦아야 충치를 막고 건강해져요.
