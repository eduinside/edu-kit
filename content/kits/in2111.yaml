intro:
  core_idea: 나는 소중하고 특별한 사람이에요. 몸과 마음을 건강하게 돌보고 좋은 습관을 가지면 멋지게 자랄 수 있어요.
  core_question: 나는 어떤 사람이고 어떻게 자라고 있을까?
  concepts:
    - term: 나
      def: 세상에서 하나뿐인 소중한 사람이에요.
    - term: 위생
      def: 깨끗하게 해서 병에 걸리지 않게 하는 것이에요.
    - term: 성장
      def: 몸과 마음이 자라는 것이에요.
    - term: 감정
      def: 기쁨, 슬픔, 화남 같은 마음의 느낌이에요.
    - term: 습관
      def: 여러 번 되풀이해서 몸에 밴 행동이에요.
  standards:
    - code: "[2바01-02]"
      text: 나를 이해하고 존중하며 생활한다.
    - code: "[2슬01-02]"
      text: 나를 탐색하여 나에 대해 설명한다.
    - code: "[2즐01-02]"
      text: 놀이하며 내 몸의 움직임이나 감각을 느낀다.
stages:
  - name: 생각열기
    question: 나는 어떤 사람일까?
  - name: 탐구하기
    question: 건강하고 멋진 나로 자라려면?
  - name: 확장하기
    question: 나의 꿈과 자랑을 어떻게 나눌까?
