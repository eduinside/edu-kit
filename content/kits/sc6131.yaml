id: sc6131
title: 3. 식물의 구조와 기능
grade: 6
sem: 1학기
subject: 과학
unit: 식물의 구조와 기능
unit_no: 3
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 식물이 세포로 이루어진 다세포 생물임을 이해하고, 세포·조직·기관의 구조와 기능을 관찰합니다. 식물의 생태적 가치와 생명 존중의 태도를 기를 수 있도록 탐구합니다.
  core_question: 식물은 어떤 구조로 이루어져 있으며, 각 기관은 어떤 기능을 할까?
  concepts:
    - term: 세포
      def: 세포는 모든 생물의 몸을 이루는 가장 작은 기본 단위예요. 식물도 수많은 세포가 모여서 만들어진 다세포 생물이에요.
    - term: 현미경
      def: 현미경은 맨눈으로 볼 수 없는 아주 작은 것을 크게 확대해서 보여 주는 도구예요. 작은 세포를 관찰할 때 사용해요.
    - term: 뿌리
      def: 뿌리는 식물을 땅에 단단히 고정하고, 흙 속의 물과 양분을 빨아들이는 일을 해요. 빨아들인 물은 줄기를 통해 위로 올라가요.
    - term: 줄기
      def: 줄기는 식물의 몸을 받쳐 주고, 뿌리에서 빨아들인 물과 잎에서 만든 양분이 이동하는 통로 역할을 해요.
    - term: 잎
      def: 잎은 빛을 받아 식물이 살아가는 데 필요한 양분을 스스로 만들어요. 또 잎에서는 물이 수증기로 빠져나가기도 해요.
    - term: 꽃
      def: 꽃은 씨를 만들어 자손을 남기는 일을 하는 기관이에요. 꽃가루받이가 이루어지면 열매와 씨가 생겨요.
    - term: 씨
      def: 씨는 새로운 식물로 자라날 수 있는 어린 식물이 들어 있는 부분이에요. 알맞은 환경을 만나면 싹이 터서 자라요.
    - term: 여러가지 식물
      def: 식물마다 사는 곳과 생김새, 살아남는 방법이 서로 달라요. 다양한 식물의 특징을 비교하며 식물의 여러 모습을 알 수 있어요.
  standards:
    - code: "[6과11-01]"
      text: 생물을 이루고 있는 기본 단위인 세포를 현미경으로 관찰할 수 있다.
    - code: "[6과11-02]"
      text: 식물의 각 기관의 구조를 관찰하고, 기능을 알아보는 실험을 수행하여 식물 각 기관의 구조와 기능을 설명할 수 있다.
    - code: "[6과11-03]"
      text: 여러 가지 식물의 특징을 설명하는 자료를 만들어 공유할 수 있다.
