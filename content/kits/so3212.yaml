id: so3212
title: 1-2. 다양한 문화에 대한 이해와 존중
grade: 3
sem: 2학기
subject: 사회
unit: 1단원
unit_no: 1
flow: flow
sort_order: 2
published: true
intro:
  core_idea: 최근 우리 사회에서 증가하는 여러 현상들의 긍정적 효과와 사회문제를 알아보고, 나와 다른 사람의 삶의 방식이나 문화를 존중하는 태도를 기를 수 있도록 구성된 단원입니다.
  core_question: 사회 변화는 우리의 생활 모습과 문화를 어떻게 바꾸며, 우리는 서로 다른 문화를 어떻게 대해야 할까?
  concepts:
    - term: 문화
      def: 문화는 사람들이 함께 살아가며 만들어 온 옷, 음식, 집, 인사하는 방법처럼 생활하는 모습을 말해요. 지역이나 나라마다 문화가 다를 수 있어요.
    - term: 다문화
      def: 다문화는 한 사회 안에 서로 다른 여러 나라와 민족의 문화가 함께 어우러져 있는 것을 말해요. 우리나라에도 다른 나라에서 온 사람들이 늘면서 다문화 사회가 되고 있어요.
    - term: 1인가구
      def: 1인가구는 가족과 함께 살지 않고 혼자서 생활하는 한 사람으로 이루어진 집을 말해요. 요즘 우리 사회에서 1인가구가 점점 늘어나고 있어요.
    - term: 반려동물
      def: 반려동물은 가족처럼 함께 지내며 정을 나누는 강아지, 고양이 같은 동물을 말해요. 반려동물을 기르는 사람이 많아지면서 관련된 용품과 서비스도 늘고 있어요.
    - term: 문화다양성
      def: 문화다양성은 세상에 여러 가지 서로 다른 문화가 함께 있는 것을 말해요. 나와 다른 문화를 이상하게 여기지 않고 소중하게 여기며 존중하는 마음이 필요해요.
  standards:
    - code: "[4사03-02]"
      text: 우리 사회에 다양한 문화가 확산되면서 나타나는 긍정적 효과와 문제를 분석하고, 나와 다른 사람이나 집단의 문화를 존중하는 태도를 기른다.
stages:
  - 문화
  - 다문화
  - 1인가구
  - 반려동물
  - 문화다양성
