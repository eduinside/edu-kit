id: mo3131
title: 3. 함께하는 우리 가족
grade: 3
sem: 1학기
subject: 도덕
unit: 3단원
unit_no: 3
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 가족은 서로 아끼고 돌보며 함께 사는 사람들이고, 가족마다 모습과 행복이 달라요. 부모님께 감사하는 효, 형제자매와 사이좋게 지내는 우애, 가족을 사랑하는 마음을 작은 행동으로 날마다 실천하면 우리 가족 모두가 행복해져요.
  core_question: 우리 가족이 모두 행복하려면 나는 어떤 마음과 행동, 말을 실천할 수 있을까?
  concepts:
    - term: 가족
      def: 서로 아끼고 돌보며 함께 생활하는 사람들이에요. 함께 사는 사람의 수나 모습은 집마다 달라도 모두 가족이에요.
    - term: 효
      def: 부모님과 어른께 감사하는 마음으로 정성껏 대하는 것이에요. 마음에서 우러나는 사랑과 존경이 바탕이 돼요.
    - term: 우애
      def: 형제자매가 서로 아끼고 사랑하며 사이좋게 지내는 마음이에요.
    - term: 가훈
      def: 한 집안의 가족이 함께 지키고 싶은 가르침을 짧은 말로 담은 것이에요.
    - term: 감사
      def: 나에게 도움이나 사랑을 준 사람에게 고마운 마음을 갖고 그 마음을 표현하는 것이에요.
  standards:
    - code: "[4도02-01]"
      text: 효, 우애의 의미와 필요성을 명료하게 이해하고 가족의 행복을 위해 할 수 있는 일을 탐색하여 실천 계획을 세운다.
stages:
  - name: 생각열기
    question: 가족의 모습과 행복은 집마다 어떻게 다를까?
  - name: 탐구하기
    question: 효와 우애는 어떤 마음과 행동일까?
  - name: 확장하기
    question: 가족을 사랑하는 마음을 어떻게 전하고 이어 갈까?
