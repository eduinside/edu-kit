quiz:
  - statement: 가족의 모습과 행복의 모양은 집마다 다를 수 있다.
    answer: O
    explain: 함께 사는 사람이나 행복을 느끼는 때가 집마다 달라도 모두 소중한 가족이에요.
  - statement: 내가 행복한 일은 언제나 가족 모두가 행복한 일이다.
    answer: X
    explain: 가족마다 바라는 것이 달라요. 서로의 마음을 헤아려 모두가 행복한 방법을 찾아야 해요.
  - statement: 효는 부모님께 감사하는 마음에서 우러나오는 사랑과 존경이다.
    answer: O
    explain: 효는 부모님의 사랑에 고마워하며 마음을 담아 정성껏 대하는 것이에요.
  - statement: 효는 부모님 말씀에 무조건 따르는 것을 뜻한다.
    answer: X
    explain: 효는 시키는 대로만 하는 것이 아니에요. 부모님의 마음을 헤아려 필요한 일을 찾아 돕는 것도 효예요.
  - statement: 형제자매와 다툼이 생겼을 때는 상대의 마음을 들어 주는 대화가 도움이 된다.
    answer: O
    explain: 서로 말을 끝까지 듣고 마음을 말하면 오해가 풀리고 우애를 지킬 수 있어요.
  - statement: 효는 비싼 선물을 드리기만 하면 충분히 실천한 것이다.
    answer: X
    explain: 고마운 마음을 담은 말과 작은 행동으로도 효를 실천할 수 있어요.
  - statement: 가훈은 한 가족이 함께 지키고 싶은 가르침을 담은 말이다.
    answer: O
    explain: 가훈을 정하고 가족이 함께 지키면 가족 사랑을 더 단단하게 가꿀 수 있어요.
  - statement: 가족의 행복을 위해서는 한 사람이 늘 참고 희생하는 것이 당연하다.
    answer: X
    explain: 가족 모두가 서로 배려하고 각자 할 일을 나눠 해야 모두가 행복해져요.
