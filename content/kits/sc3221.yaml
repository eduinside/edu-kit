id: sc3221
title: 2. 지구와 바다
grade: 3
sem: 2학기
subject: 과학
unit: 지구와 바다
unit_no: 2
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 우리가 살아가는 지구와 바다의 모습을 이해하고, 그 중요성과 특성을 알아보는 단원입니다. 지구를 둘러싸고 있는 대기, 육지와 바다의 크기, 바닷물의 특성 및 바다에서 볼 수 있는 다양한 지형들, 밀물과 썰물의 차이, 갯벌의 가치와 보전의 필요성 등을 탐구하며 지구 환경에 대한 관심과 이해를 높여 봅니다.
  core_question: 지구의 육지와 바다는 어떤 특징을 지니며, 우리는 그 가치를 어떻게 지켜 가야 할까?
  concepts:
    - term: 지구
      def: 우리가 살고 있는 둥근 모양의 행성이에요. 육지와 바다로 이루어져 있고, 공기인 대기가 둘러싸고 있어요.
    - term: 육지
      def: 바다가 아닌, 물에 잠기지 않은 땅이에요. 우리가 발을 딛고 살아가는 흙과 돌로 된 부분이에요.
    - term: 대기
      def: 지구를 둘러싸고 있는 공기의 층이에요. 우리가 숨 쉬는 데 필요한 산소가 이 대기 속에 들어 있어요.
    - term: 바다
      def: 짠물이 넓고 깊게 모여 있는 곳이에요. 지구 표면에서 육지보다 더 넓은 부분을 차지하고 있어요.
    - term: 바닷물
      def: 바다를 채우고 있는 물이에요. 소금이 녹아 있어서 짠맛이 나고, 강이나 호수의 물과 다르게 짭니다.
    - term: 밀물과 썰물
      def: 바닷물이 하루에 두 번 정도 들어왔다 나갔다 하는 현상이에요. 바닷물이 밀려와 높아지는 것을 밀물, 빠져나가 낮아지는 것을 썰물이라고 해요.
    - term: 갯벌
      def: 바닷가에서 썰물 때 바닷물이 빠지면 드러나는 넓고 평평한 진흙 땅이에요. 여러 생물이 살아가는 소중한 곳이라 잘 지켜야 해요.
  standards:
    - code: "[4과06-01]"
      text: 지구가 대기로 둘러싸여 있음을 알고, 지구 표면을 구성하는 육지와 바다의 특징을 비교할 수 있다.
    - code: "[4과06-02]"
      text: 바닷물의 특징을 육지의 물과 비교하고, 바닷가에서 볼 수 있는 다양한 지형을 조사할 수 있다.
    - code: "[4과06-03]"
      text: 밀물과 썰물의 차이를 알고, 갯벌의 가치와 보전의 필요성을 설득⋅홍보할 수 있다.
stages:
  - 지구
  - 육지
  - 대기
  - 바다
  - 바닷물
  - 밀물과 썰물
  - 갯벌
