quiz:
  - statement: 친환경 농업은 화학 비료와 농약을 줄이고 자연의 순환을 이용해 농사짓는 방법이다.
    answer: O
    explain: 친환경 농업은 땅과 물, 생물을 지키면서 먹거리를 얻는 방법이에요.
  - statement: 오리 농법은 논에 농약을 많이 뿌려서 벌레를 없애는 방법이다.
    answer: X
    explain: 오리가 논에서 벌레와 잡초를 먹게 해서 농약을 줄이는 친환경 농법이에요.
  - statement: 유기농과 무농약은 친환경 농산물 인증에 들어간다.
    answer: O
    explain: 나라가 정한 기준에 맞게 기른 농산물에 유기농, 무농약 같은 인증 마크를 줘요.
  - statement: 스마트팜은 자동으로 관리하기 때문에 일손이 훨씬 더 많이 든다.
    answer: X
    explain: 스마트팜은 센서와 자동화로 관리해서 사람의 일손이 덜 들어요.
  - statement: 스마트팜에서는 센서가 알려 준 온도와 습도에 맞춰 환경을 자동으로 조절할 수 있다.
    answer: O
    explain: 센서와 정보 통신 기술을 쓰면 작물이 자라기 좋은 환경을 자동으로 맞출 수 있어요.
  - statement: 농업과 농촌은 먹거리를 만드는 일만 한다.
    answer: X
    explain: 농업과 농촌은 환경 보전, 지역 공동체, 전통문화 유지 같은 여러 일도 해요.
  - statement: 식량 자급률은 우리나라에서 필요한 식량 가운데 우리나라에서 생산한 비율이다.
    answer: O
    explain: 식량 자급률이 낮으면 먹거리를 다른 나라에 많이 기대게 되어서 식량안보가 중요해져요.
  - statement: 친환경 농업에서 쓰는 비료는 값이 싸고 양분이 바로 나와서 단점이 없다.
    answer: X
    explain: 친환경 비료는 값이 비싸거나 양분이 천천히 나올 수 있어서 쓰는 시기를 잘 맞춰야 해요.
