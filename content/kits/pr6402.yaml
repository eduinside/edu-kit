id: pr6402
title: 친환경 농업·미래 농업
grade: 6
sem: 2학기
subject: 실과
unit: 지속가능한 기술과 융합
unit_no: 4
flow: flow
sort_order: 2
published: true
intro:
  core_idea: 친환경 농업은 화학 비료와 농약을 줄이고 자연의 순환을 살려 환경을 지키면서 먹거리를 얻는 농사 방법이에요. 스마트팜 같은 첨단 기술과 농업·농촌이 하는 여러 가지 일, 미래 농업과 이어진 직업까지 알아보며 지속 가능한 농업의 미래를 생각해요.
  core_question: 환경을 지키면서 먹거리를 얻는 농업은 어떻게 이루어지고, 앞으로의 농업은 어떻게 달라질까?
  concepts:
    - term: 지속 가능한 농업
      def: 지금 먹거리를 얻으면서도 환경을 지켜 다음 세대도 계속 농사지을 수 있게 하는 농업이에요. 생산하고 이용하고 버려지는 것이 자연 속에서 다시 순환해요.
    - term: 친환경 농업
      def: 화학 비료와 농약을 줄이고 자연의 힘과 순환을 이용해 환경을 지키며 농사짓는 방법이에요. 오리 농법이나 우렁이 농법이 그 예예요.
    - term: 친환경 인증
      def: 친환경 농산물이 정해진 기준에 맞게 길러졌다고 나라가 확인해서 주는 표시예요. 유기농이나 무농약 같은 마크로 알아볼 수 있어요.
    - term: 스마트팜
      def: 센서와 정보 통신 기술로 온도, 습도, 물 같은 환경을 자동으로 관리하며 작물을 키우는 농장이에요. 멀리서 스마트폰으로도 살펴볼 수 있어요.
    - term: 농업·농촌의 가치
      def: 농업과 농촌은 먹거리를 만드는 일 말고도 환경을 지키고 지역 공동체와 전통문화를 이어 가는 여러 가지 일을 해요.
    - term: 미래 농업 직업
      def: 스마트농업 전문가나 농촌교육농장 플래너처럼 농업이 변하면서 새로 생기거나 달라지는 직업이에요.
  standards:
    - code: "[6실04-09]"
      text: 동식물 자원의 친환경 농업 사례를 통해 지속가능한 농업이 순환되고 있음을 인식하고 농업의 미래가치를 인식한다.
    - code: "[6실04-10]"
      text: 생활 속에서 농업활동과 관련된 모습을 분석하고 이에 따른 농업활동을 체험하여 농업에 대한 관심을 두고 이를 생활 속에서 실천한다.
    - code: "[6실04-11]"
      text: 농업과 농촌의 다원적인 역할과 가치를 이해하고 미래 농업과 관련된 다양한 직업 세계를 탐색한다.
stages:
  - 지속 가능한 농업
  - 친환경 농업
  - 친환경 인증
  - 스마트팜
  - 농업·농촌의 가치
  - 미래 농업 직업
