quiz:
  - statement: 우리 몸에 필요한 영양소는 탄수화물, 단백질, 지방, 무기질, 비타민, 물로 나눌 수 있다.
    answer: O
    explain: 이 여섯 가지를 여섯 영양소라고 해요.
  - statement: 물은 에너지를 내는 영양소이다.
    answer: X
    explain: 물은 몸에 꼭 필요한 영양소이지만 에너지를 내지는 못해요.
  - statement: 한 식품에는 한 가지 영양소만 있는 것이 아니라 여러 영양소가 함께 들어 있다.
    answer: O
    explain: 교과서에 나온 영양소별 식품은 그 영양소가 많이 든 예일 뿐이에요.
  - statement: 균형 잡힌 식사는 한 끼만 잘 먹으면 충분하다.
    answer: X
    explain: 균형은 한 끼가 아니라 하루 전체로 따져 봐야 해요.
  - statement: 식품 구성 자전거는 식품군을 골고루 먹는 방법을 보여 준다.
    answer: O
    explain: 자전거 그림으로 식품군별로 얼마나 먹으면 좋은지 알 수 있어요.
  - statement: 삶기와 찌기가 아닌 조리법은 모두 건강에 나쁘다.
    answer: X
    explain: 음식마다 어울리는 조리법이 있고, 같은 재료도 어떻게 조리하느냐에 따라 건강에 좋을 수도 있고 나쁠 수도 있어요.
  - statement: 자라는 어린이에게는 끼니에서 모자란 영양소를 채우는 간식이 필요할 수 있다.
    answer: O
    explain: 간식을 줄이거나 끊기보다 건강한 간식을 고르는 것이 중요해요.
  - statement: 가스레인지로 조리할 때는 환기를 하지 않아도 된다.
    answer: X
    explain: 불을 쓰기 전후에는 창문을 열어 환기하고 불꽃 색도 살펴야 해요.
