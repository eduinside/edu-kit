id: pr5102
title: 균형 잡힌 식사·조리
grade: 5
sem: 1학기
subject: 실과
unit: 인간 발달과 주도적 삶
unit_no: 1
flow: flow
sort_order: 2
published: true
intro:
  core_idea: 우리 몸에 필요한 영양소를 여러 식품군에서 골고루 얻어야 균형 잡힌 식사가 돼요. 찌기나 삶기 같은 건강한 조리법으로 위생과 안전을 지키며 간식이나 식사를 스스로 만들어 볼 수 있어요.
  core_question: 균형 잡힌 식사를 위해 어떤 식품을 고르고, 어떻게 안전하게 조리할 수 있을까?
  concepts:
    - term: 영양소
      def: 음식에 들어 있어 우리 몸이 자라고 움직이는 데 쓰이는 성분이에요. 탄수화물, 단백질, 지방, 무기질, 비타민, 물을 여섯 영양소라고 해요.
    - term: 식품군
      def: 들어 있는 영양소가 비슷한 식품끼리 묶은 무리예요. 식품 구성 자전거는 곡류, 고기·생선·달걀·콩류, 채소류, 과일류, 우유·유제품류 같은 식품군을 보여 줘요.
    - term: 균형 잡힌 식사
      def: 여러 식품군의 식품을 알맞은 양으로 골고루 먹는 식사예요. 한 끼가 아니라 하루 전체로 따져 봐요.
    - term: 간식
      def: 끼니와 끼니 사이에 먹는 음식이에요. 자라는 어린이에게는 끼니에서 모자란 영양소를 채워 주는 건강한 간식이 필요해요.
    - term: 조리
      def: 식재료를 씻고 썰고 익혀서 먹을 수 있는 음식으로 만드는 일이에요. 찌기, 삶기, 볶기, 부치기 같은 방법이 있어요.
    - term: 위생과 안전
      def: 손을 씻고 도구를 깨끗이 하며 불과 칼을 조심해서 쓰는 것이에요. 조리할 때 식중독이 생기거나 다치는 일을 막아 줘요.
  standards:
    - code: "[6실01-04]"
      text: 균형 잡힌 식사의 중요성과 조건을 탐색하여 자신의 식습관을 검토해 보고 건강한 식습관 형성에 적용한다.
    - code: "[6실02-05]"
      text: 음식의 조리과정을 체험하여 자기 간식이나 식사를 스스로 마련하는 식생활을 실천한다.
stages:
