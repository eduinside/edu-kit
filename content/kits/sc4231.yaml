id: sc4231
title: 3. 여러 가지 기체
grade: 4
sem: 2학기
subject: 과학
unit: 여러 가지 기체
unit_no: 3
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 기체가 무게가 있다는 것과 온도나 압력에 따라 기체의 부피가 달라지는 현상을 실험을 통해 알아보고, 일상생활에서 이용되는 기체의 종류와 성질을 조사합니다. 기체의 성질에 대한 탐구를 통해 기체의 성질을 이용하여 작동시킬 수 있는 장치를 설계하고 만들어 보도록 구성되어 있습니다.
  core_question: 기체는 어떤 성질을 지니며, 우리는 그 성질을 생활에서 어떻게 이용할까?
  concepts:
    - term: 온도와 기체 부피
      def: 기체는 온도가 높아지면 부피가 커지고, 온도가 낮아지면 부피가 작아집니다. 그래서 따뜻한 곳에 둔 풍선은 부풀고, 차가운 곳에 둔 풍선은 쪼그라듭니다.
    - term: 압력과 기체 부피
      def: 기체에 누르는 힘(압력)을 더 세게 주면 부피가 작아지고, 누르는 힘을 약하게 하면 부피가 커집니다. 주사기 입구를 막고 밀대를 누르면 안의 공기가 줄어드는 것이 그 예입니다.
    - term: 기압
      def: 우리 주변을 둘러싼 공기가 누르는 힘을 기압이라고 합니다. 공기에도 무게가 있어서 우리 몸과 물체를 사방에서 누르고 있습니다.
    - term: 산소
      def: 우리가 숨을 쉴 때 꼭 필요한 기체로, 다른 물질이 타는 것을 돕는 성질이 있습니다. 색깔과 냄새가 없습니다.
    - term: 이산화탄소
      def: 우리가 숨을 내쉴 때 나오고, 물질이 탈 때 생기는 기체입니다. 불을 끄는 성질이 있어 소화기에 이용됩니다.
    - term: 질소
      def: 공기 중에 가장 많이 들어 있는 기체로, 색깔과 냄새가 없고 다른 물질과 잘 반응하지 않습니다. 그래서 과자 봉지를 채워 과자가 부서지거나 상하지 않도록 하는 데 쓰입니다.
    - term: 공기
      def: 우리 주변을 둘러싸고 있으며 산소, 질소, 이산화탄소 같은 여러 기체가 섞여 있습니다. 눈에 보이지 않지만 무게가 있고 자리(공간)를 차지합니다.
  standards:
    - code: "[4과15-01]"
      text: 실험을 통해 기체가 무게가 있음을 설명할 수 있다.
    - code: "[4과15-02]"
      text: 온도나 압력에 따라 기체의 부피가 달라지는 현상을 관찰하고, 우리 주변에서 예를 찾을 수 있다.
    - code: "[4과15-03]"
      text: 일상생활에서 이용되는 기체의 종류와 성질을 조사하고, 여러 가지 기체에 대해 흥미를 느낄 수 있다.
    - code: "[4과15-04]"
      text: 기체의 성질을 이용하여 작동시킬 수 있는 장치를 설계하고 만들 수 있다.
stages:
  - 온도와 기체 부피
  - 압력과 기체 부피
  - 기압
  - 산소
  - 이산화탄소
  - 질소
  - 공기
