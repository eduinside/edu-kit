id: sc5131
title: 3. 용해와 용액
grade: 5
sem: 1학기
subject: 과학
unit: 용해와 용액
unit_no: 3
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 물질이 물에 녹는 용해 현상의 의미를 정확히 이해하고, 용질, 용매, 용액의 개념을 학습합니다. 용질의 종류나 물의 온도에 따라 용해되는 양이 달라지는 것을 비교하고, 용질의 양에 따른 용액의 진하기 변화를 관찰하며 상대적인 진하기를 비교합니다. 또한, 일상생활 속에서 용액이 쓰이는 다양한 사례를 찾아보고 그 중요성을 인식하도록 구성되었습니다.
  core_question: 물질은 물에 어떻게 녹으며, 용액의 진하기는 무엇에 따라 달라질까?
  concepts:
    - term: 용질
      def: 물 같은 액체에 녹는 물질이에요. 예를 들어 소금물에서는 소금이 용질이에요.
    - term: 용액의 진하기
      def: 같은 양의 용매에 녹아 있는 용질의 양이 많고 적은 정도예요. 용질이 많이 녹아 있을수록 용액이 더 진해요.
    - term: 용액
      def: 용질이 용매에 골고루 섞여 녹아 있는 물질이에요. 소금이 물에 녹은 소금물이 바로 용액이에요.
    - term: 용매
      def: 용질을 녹이는 액체예요. 소금을 녹이는 물이 용매예요.
    - term: 동화
      def: 겉모습이나 성질이 서로 비슷해지면서 하나처럼 변하는 것을 말해요. 용질이 용매에 녹아 한 가지 액체처럼 보이는 모습과도 통해요.
    - term: 용해
      def: 용질이 용매에 골고루 섞여 녹아 들어가는 현상이에요. 설탕이 물에 녹아 보이지 않게 되는 것이 용해예요.
  standards:
    - code: "[6과03-01]"
      text: 용해 현상의 의미를 알고, 용질의 종류와 물의 온도에 따라 물에 녹는 용질의 양이 달라짐을 비교할 수 있다.
    - code: "[6과03-02]"
      text: 용질이나 용매의 양에 따라 용액의 진하기가 달라짐을 관찰하고, 용액의 상대적인 진하기를 비교할 수 있다.
    - code: "[6과03-03]"
      text: 일상생활에서 용액이 쓰이는 사례를 조사하여 용액의 필요성을 알리는 자료를 만들고 공유할 수 있다.
stages:
  - 용액
  - 용질
  - 용액의 진하기
  - 녹는 양
