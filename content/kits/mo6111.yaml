quiz:
  - statement: 흥미는 어떤 일이나 활동에 마음이 끌리고 재미를 느끼는 것이다.
    answer: O
    explain: 좋아하는 활동을 살펴보면 나에게 맞는 직업의 힌트를 얻을 수 있어요.
  - statement: 적성은 노력해도 키울 수 없는 타고난 능력이다.
    answer: X
    explain: 적성은 어떤 일을 잘해 낼 수 있는 소질이나 능력이고, 노력하면 키울 수도 있어요.
  - statement: 직업마다 도덕적인 직업과 그렇지 않은 직업이 이미 정해져 있다.
    answer: X
    explain: 어떤 직업이든 일하는 사람의 태도가 그 일을 값지게 만들어요.
  - statement: 직업은 돈을 버는 일이면서 보람을 느끼고 사회에 보탬이 되는 일이기도 하다.
    answer: O
    explain: 직업은 생활에 필요한 돈을 벌게 해 주고, 다른 사람과 사회에 도움을 준다는 뜻도 있어요.
  - statement: 재능 나눔은 전문가만 할 수 있어서 어린이는 할 수 없다.
    answer: X
    explain: 노래, 운동, 그림처럼 내가 잘하는 것은 무엇이든 나눌 수 있는 재능이에요.
  - statement: 노벨은 다이너마이트로 모은 재산으로 사람들에게 이로운 일을 한 이에게 주는 노벨상을 만들게 했다.
    answer: O
    explain: 노벨은 자신의 재산을 남겨 인류에 이바지한 사람을 기리는 상을 만들도록 했어요.
  - statement: 직업을 고를 때는 흥미와 적성만 보고 그 일이 다른 사람에게 어떤 영향을 주는지는 생각하지 않아도 된다.
    answer: X
    explain: 직업은 흥미와 적성뿐 아니라 사회에 어떤 도움을 주는지도 함께 생각해서 정해요.
  - statement: 진로는 앞으로 선택하고 발전시켜 갈 삶과 일의 방향을 뜻한다.
    answer: O
    explain: 진로는 자신의 흥미와 능력, 가치에 따라 정해 가는 삶과 일의 방향이에요.
