id: mo6111
title: 1. 나는 꿈 요리사
grade: 6
sem: 1학기
subject: 도덕
unit: 1단원
unit_no: 1
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 꿈은 내가 좋아하고 잘하는 것에 더해, 내 일이 다른 사람과 사회에 어떤 도움을 주는지 생각하며 세워 가는 거예요. 어떤 직업이든 일하는 사람의 태도가 그 일을 값지게 만들어요.
  core_question: 내 흥미와 재능을 도덕적 가치와 이어서 어떤 꿈을 키울 수 있을까?
  concepts:
    - term: 흥미
      def: 어떤 일이나 활동에 마음이 끌리고 재미를 느끼는 것이에요. 좋아하는 활동을 살펴보면 나에게 맞는 직업의 힌트를 얻을 수 있어요.
    - term: 적성
      def: 어떤 일을 잘해 낼 수 있는 소질이나 능력이에요. 적성은 노력하면 키울 수도 있어요.
    - term: 직업
      def: 일 가운데 대가를 받고 일정 기간 이어서 하는 일이에요. 직업은 생활에 필요한 돈을 벌게 해 주고 보람과 사회에 보탬이 된다는 뜻도 있어요.
    - term: 진로
      def: 자신의 흥미와 능력, 가치에 따라 앞으로 선택하고 발전시켜 갈 삶과 일의 방향이에요.
    - term: 재능 나눔
      def: 내가 가진 재능을 다른 사람을 돕는 데 대가 없이 나누어 쓰는 거예요. 노래, 운동, 그림처럼 잘하는 것은 무엇이든 나눌 수 있는 재능이에요.
    - term: 직업윤리
      def: 직업을 가진 사람이 일을 할 때 지켜야 할 바른 태도와 책임이에요. 어떤 직업이든 일하는 사람의 태도가 그 일을 값지게 만들어요.
  standards:
    - code: "[6도01-03]"
      text: 자기가 하고 싶은 일을 선택할 때 도덕적 고려의 필요성을 알고 자신의 특기와 적성을 탐색하여 진로계획을 수립한다.
stages:
  - name: 생각열기
    question: 내가 좋아하고 잘하는 일은 무엇이고, 어떤 직업과 이어질까?
  - name: 탐구하기
    question: 직업을 고를 때 도덕적인 가치도 함께 생각해야 하는 까닭은 무엇일까?
  - name: 확장하기
    question: 내 재능을 다른 사람과 어떻게 나누며 꿈을 키워 갈까?
