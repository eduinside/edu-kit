id: sc6221
title: 2. 물질의 연소
grade: 6
sem: 2학기
subject: 과학
unit: 2. 물질의 연소
unit_no: 2
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 물질의 상태 변화 및 화학 반응에는 에너지 출입이 수반되며, 이는 일상생활에 유용하게 활용된다.
  core_question: 물질이 연소할 때 일어나는 변화와 생성물은 우리 생활을 어떻게 변화시킬까?
  concepts:
    - term: 성질
      def: 물질이나 대상이 가진 고유한 특징이에요.
    - term: 상호 작용
      def: 둘 이상의 대상이 서로 영향을 주고받는 관계예요.
    - term: 물질
      def: 공간을 차지하고 질량을 가지며 물체를 이루는 재료예요.
    - term: 연소
      def: 물질이 산소와 빠르게 반응하며 빛과 열을 내는 현상이에요.
    - term: 소화
      def: 연소의 조건 가운데 하나 이상을 없애 불을 끄는 것이에요.
    - term: 조건
      def: 어떤 현상이 일어나기 위해 갖추어야 하는 요소나 상태예요.
    - term: 생성물
      def: 화학 변화가 일어난 뒤 새롭게 만들어진 물질이에요.
  standards:
    - code: "[6과14-01]"
      text: 물질의 성질이 달라지는 변화와 달라지지 않는 변화를 관찰하여 비교할 수 있다.
    - code: "[6과14-02]"
      text: 물질이 연소할 때 나타나는 공통적인 현상을 관찰하고, 연소의 조건을 찾을 수 있다.
    - code: "[6과14-03]"
      text: 연소 전과 후의 물질을 비교하여 연소 과정에서 물질의 성질이 달라짐을 설명할 수 있다.
    - code: "[6과14-04]"
      text: 연소 과정에서 생성되는 물질로 인한 생태계의 피해 사례를 수집하고 분석하여 해결책을 제안하고 공유할 수 있다.
stages:
  - name: 생각열기
    question: 불은 무엇일까?
  - name: 탐구하기1
