id: so4111
title: 1-1. 지도로 본 우리 지역
grade: 4
sem: 1학기
subject: 사회
unit: 1단원
unit_no: 1
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 우리 지역을 나타내는 다양한 지도를 살펴보며, 방향(방위), 기호와 범례, 축척, 땅의 높낮이 표현 방법 등 지도의 기본 요소를 이해하는 것을 목표로 합니다. 이를 통해 지도에 대한 이해를 높이고, 일상생활에서 지도를 활용하는 능력을 키울 수 있도록 합니다. 이를 위해 방향 익히기, 기호와 범례 읽기, 축척 막대자로 실제 거리 측정하기, 등고선 모형 만들기 등의 활동을 통해 지도의 기본 요소를 배웁니다. 또한, 지도 애플리케이션을 활용한 체험 학습 계획을 세우면서, 실제 생활에서 지도를 효과적으로 활용하는 방법을 익힙니다.
  core_question: 지도를 이용하면 우리 지역의 모습과 정보를 어떻게 파악할 수 있을까?
  concepts:
    - term: 지도
      def: 우리가 사는 땅의 모습을 위에서 내려다본 것처럼 작게 줄여서 약속된 기호로 그린 그림이에요. 지도를 보면 우리 지역의 모습과 정보를 한눈에 알 수 있어요.
    - term: 방위
      def: 동, 서, 남, 북처럼 방향을 나타내는 것이에요. 지도에서 방위표를 보면 어느 쪽이 동쪽인지, 북쪽인지 알 수 있어요.
    - term: 기호
      def: 학교, 우체국, 병원처럼 땅에 있는 것을 지도에 간단하게 나타낸 약속된 그림이나 표시예요. 기호를 쓰면 복잡한 것을 쉽게 그릴 수 있어요.
    - term: 범례
      def: 지도에 쓰인 기호가 무엇을 뜻하는지 설명해 놓은 표예요. 범례를 보면 지도의 기호가 어떤 장소나 시설을 나타내는지 알 수 있어요.
    - term: 축척
      def: 실제 땅의 거리를 지도에서 얼마나 줄였는지 나타낸 것이에요. 축척을 이용하면 지도 위의 거리로 실제 거리를 알아낼 수 있어요.
    - term: 등고선
      def: 땅의 높이가 같은 곳을 이어서 그린 선이에요. 등고선을 보면 어디가 높고 낮은지, 땅의 높낮이를 알 수 있어요.
  standards:
    - code: "[4사05-01]"
      text: 우리 지역을 표현한 다양한 종류의 지도를 찾아보고, 지도의 요소를 이해한다.
stages:
  - 지도
  - 방위
  - 기호
  - 범례
  - 축척
  - 등고선
