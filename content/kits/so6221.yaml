id: so6221
title: 2-1. 경제 주체의 역할과 바람직한 경제활동
grade: 6
sem: 2학기
subject: 사회
unit: 2. 시장경제와 국가 간 거래
unit_no: 2
flow: activity
sort_order: 1
published: true
intro:
  core_idea: 시장경제에서 가계와 기업은 권리와 책임을 바탕으로 상호 작용한다.
  core_question: 시장경제에서 가계와 기업은 어떤 관계를 맺는가?
  concepts:
    - term: 상호 작용
      def: 둘 이상의 대상이 서로 영향을 주고받는 관계예요.
    - term: 체제
      def: 사회가 일정한 원리와 질서에 따라 운영되는 전체적인 구조예요.
    - term: 경제활동
      def: 사람들이 필요한 재화와 서비스를 생산하고 나누며 소비하는 활동이에요.
    - term: 상호의존
      def: 서로 필요한 것을 주고받으며 도움을 주고받는 관계예요.
  standards:
    - code: "[6사11-01]"
      text: 시장경제에서 가계와 기업의 역할을 이해하고, 근로자의 권리와 기업의 자유 및 사회적 책임을 탐색한다.
stages:
  - name: 생각열기
    question: 생산, 소득, 소비는 어떻게 연결될까?
