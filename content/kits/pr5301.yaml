quiz:
  - statement: 수송 수단은 사람들의 불편을 풀려는 발명과 개선이 쌓여 발달해 왔다.
    answer: O
    explain: 하루아침에 생긴 것이 아니라 오랜 시간 고치고 발전시켜 왔어요.
  - statement: 수송 수단은 땅 위에서 움직이는 것만을 뜻한다.
    answer: X
    explain: 땅뿐 아니라 물과 하늘에서 움직이는 배와 비행기도 수송 수단이에요.
  - statement: 자전거에서 방향을 바꾸는 일을 하는 장치는 핸들이다.
    answer: O
    explain: 방향을 바꾸는 장치를 조향 장치라고 해요.
  - statement: 브레이크는 수송 수단을 움직이게 하는 구동 장치이다.
    answer: X
    explain: 브레이크는 속도를 줄이거나 멈추게 하는 제동 장치예요.
  - statement: 구동 장치, 조향 장치, 제동 장치는 서로 맞물려 일하므로 하나가 고장 나면 문제가 생긴다.
    answer: O
    explain: 움직이고 방향을 바꾸고 멈추는 일이 모두 제대로 되어야 안전해요.
  - statement: 친환경 수송 수단은 모두 휘발유로 달린다.
    answer: X
    explain: 전기, 수소, 태양광 같은 환경을 덜 오염시키는 에너지를 써요.
  - statement: 전기자동차는 엔진 대신 모터로 움직인다.
    answer: O
    explain: 전기로 모터를 돌려 바퀴를 굴려요.
  - statement: 수송 수단이 발달하는 목적은 더 빨리 가는 것 하나뿐이다.
    answer: X
    explain: 빠르기뿐 아니라 안전, 편리, 환경까지 함께 생각하며 발달해요.
