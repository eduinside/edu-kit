id: pr5301
title: 수송 수단·친환경 수송
grade: 5
sem: 2학기
subject: 실과
unit: 기술적 문제해결과 혁신
unit_no: 3
flow: flow
sort_order: 1
published: true
intro:
  core_idea: 수송은 사람과 물건을 한 곳에서 다른 곳으로 옮기는 일이고, 땅과 물과 하늘의 수송 수단은 사람들의 불편을 풀려는 발명으로 발달해 왔어요. 수송 수단은 움직이게 하고, 방향을 바꾸고, 멈추게 하는 장치로 이루어져 있고, 오늘날에는 환경을 지키는 친환경 에너지를 쓰는 수송 수단이 늘고 있어요.
  core_question: 수송 수단은 어떻게 발달해 왔고, 어떤 장치로 움직이며, 환경을 지키려면 어떤 수송 수단을 만들어야 할까?
  concepts:
    - term: 수송 수단
      def: 사람이나 물건을 한 곳에서 다른 곳으로 옮기는 탈것이에요. 땅, 물, 하늘에서 움직이는 자동차, 기차, 배, 비행기가 있어요.
    - term: 구동 장치
      def: 수송 수단을 움직이게 하는 장치예요. 자전거의 페달과 체인, 자동차의 엔진이나 모터가 여기에 들어가요.
    - term: 조향 장치
      def: 수송 수단의 방향을 바꾸는 장치예요. 자전거와 자동차의 핸들이 대표적이에요.
    - term: 제동 장치
      def: 움직이는 수송 수단의 속도를 줄이거나 멈추게 하는 장치예요. 브레이크가 대표적이에요.
    - term: 친환경 수송 수단
      def: 환경을 덜 오염시키는 에너지로 움직이는 수송 수단이에요. 전기차, 수소전기차, 태양광 자동차가 있어요.
  standards:
    - code: "[6실03-04]"
      text: 수송의 의미와 수송 수단의 발달과정에 대한 이해를 바탕으로 생활 속 다양한 수송 수단을 탐색한다.
    - code: "[6실03-05]"
      text: 수송 수단의 구성 요소를 이해하고, 친환경 에너지를 적용한 다양한 수송 수단의 시제품을 만들어 수송기술의 가치를 인식한다.
